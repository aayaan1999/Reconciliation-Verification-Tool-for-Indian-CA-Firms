# Format profile (schema recon.profile/1, technical spec §B2.2). SYNTHETIC (SPEC-020): the
# opening balances of the bank account in the books and in the bank's statement, as a small
# JSON file. The period is written Mon-yyyy (Sep-2026).
#
# Editing rules: every text value is in double quotes. A changed format gets a NEW version
# folder (v2 ...) next to this one; a published profile is never edited in place.
# Test with: go run ./cmd/recon-dev profile-test

schema: "recon.profile/1"
profile_id: "generic.portal.bank_meta_json"
profile_version: "1"
source_system: "Bank reconciliation: opening balances as JSON (synthetic, SPEC-020)"
document_type: "bank_balances"
file_type: "json"
regime: "ITA2025"

detect:
  - json_exists: { path: "$.opening_balance_books" }
  - json_exists: { path: "$.opening_balance_bank" }
  - json_exists: { path: "$.period" }

context:
  period: { json_path: "$.period", format: "mon-yyyy" }
  tax_year: { from_period: true }

facts:
  - fact: "bkbal.opening_balance_books"
    json_path: "$.opening_balance_books"
    unit: "rupees"
    required: true

  - fact: "bkbal.opening_balance_statement"
    json_path: "$.opening_balance_bank"
    unit: "rupees"
    required: true
