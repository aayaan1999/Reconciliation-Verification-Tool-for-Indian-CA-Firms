# Format profile (schema recon.profile/1, technical spec §B2.2). SYNTHETIC: the e-invoice (IRN)
# register downloaded from the invoice registration portal as a CSV file, one row per invoice
# or note, columns found by header text (SPEC-018). The register holds no supplier GSTIN: a
# client's only GSTIN is used. It has no period column: the month of the first document date
# is the period.
#
# Editing rules: every text value is in double quotes. A changed format gets a NEW version
# folder (v2 ...) next to this one; a published profile is never edited in place.
# Test with: go run ./cmd/recon-dev profile-test

schema: "recon.profile/1"
profile_id: "generic.portal.einvoice_csv"
profile_version: "1"
source_system: "Invoice registration portal: e-invoice (IRN) register as CSV (synthetic, SPEC-018)"
document_type: "einvoice"
file_type: "csv"
regime: "CGST2017"

detect:
  - json_exists: { path: "$[0].irn" }
  - json_exists: { path: "$[0].irn_status" }
  - json_exists: { path: "$[0].doc_no" }

context:
  period: { json_path: "$[0].doc_date", format: "yyyy-mm-dd" }
  tax_year: { from_period: true }

records:
  - record_type: "einvoice_irn"
    rows: "$[*]"
    unit: "rupees"
    fields:
      - { name: "invoice_no", path: ".doc_no", required: true }
      - { name: "irn", path: ".irn" }
      - { name: "counterparty_gstin", path: ".buyer_gstin" }
      - { name: "invoice_date", path: ".doc_date", date_format: "yyyy-mm-dd" }
      - { name: "document_type", path: ".doc_type" }
      - { name: "irn_status", path: ".irn_status" }
    amounts:
      - { name: "taxable_value", path: ".taxable_value" }
      - { name: "igst", path: ".igst" }
      - { name: "cgst", path: ".cgst" }
      - { name: "sgst", path: ".sgst" }
      - { name: "cess", path: ".cess" }
      - { name: "invoice_value", path: ".total_value" }
