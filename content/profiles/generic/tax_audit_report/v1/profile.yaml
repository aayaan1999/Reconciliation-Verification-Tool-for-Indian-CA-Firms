# Format profile (schema recon.profile/1, technical spec §B2.2). SYNTHETIC: the generic
# formats stand in for real tax-suite output until samples arrive (IN-26); they are
# described field by field in docs/fixtures.md.
#
# Editing rules: every text value is in double quotes. A changed format gets a NEW version
# folder (v2, v3 ...) next to this one; a published profile is never edited in place.
# Test with: go run ./cmd/recon-dev profile-test

schema: "recon.profile/1"
profile_id: "generic.taxsuite.tax_audit_report"
profile_version: "1"
source_system: "Generic tax suite (synthetic, see docs/fixtures.md)"
document_type: "tax_audit_report"
file_type: "json"
regime: "ITA1961"

detect:
  - json_equals: { path: "$.meta.form", value: "TAX_AUDIT_REPORT" }
  - json_equals: { path: "$.meta.schema_version", value: "1.0" }

context:
  tax_year: { json_path: "$.meta.tax_year" }
  pan: { json_path: "$.assessee.pan" }
  period: { const: "FY" }

facts:
  - fact: "tar.depreciation_schedule.total"
    json_path: "$.clause_18.total_depreciation"
    unit: "rupees"
    required: true
