# Format profile (schema recon.profile/1, technical spec §B2.2). SYNTHETIC (SPEC-020): the TDS
# challans of the books as a sheet of an Excel workbook, columns found by header text. Each challan is read
# twice: by its CIN (to compare with the TDS Form 140 says was deposited with it) and by
# BSR code, deposit date and serial number (to compare with OLTAS).
#
# Editing rules: every text value is in double quotes. A changed format gets a NEW version
# folder (v2 ...) next to this one; a published profile is never edited in place.
# Test with: go run ./cmd/recon-dev profile-test

schema: "recon.profile/1"
profile_id: "generic.tally.tds_challan_xlsx"
profile_version: "1"
source_system: "Books: TDS challans as Excel (synthetic, SPEC-020)"
document_type: "tds_challan"
file_type: "xlsx"
regime: "ITA2025"

# The table may be on a sheet of any name; title rows above the header row and total rows below are left out.
sheets:
  - name: "TDS Challans"
    header: ["challan_cin", "bsr_code", "challan_serial", "amount"]
    any_name: true
    total_rows: ["Total", "Grand Total"]

detect:
  - json_exists: { path: "$['TDS Challans'][0].challan_cin" }
  - json_exists: { path: "$['TDS Challans'][0].bsr_code" }
  - json_exists: { path: "$['TDS Challans'][0].challan_serial" }
  - json_exists: { path: "$['TDS Challans'][0].amount" }

context:
  period: { const: "FY" }
  tax_year: { from_run: true }

records:
  - record_type: "tds_challan_books"
    rows: "$['TDS Challans'][*]"
    unit: "rupees"
    fields:
      - { name: "bsr_code", path: ".bsr_code", required: true }
      - { name: "deposit_date", path: ".deposit_date", date_format: "yyyy-mm-dd", required: true }
      - { name: "challan_serial", path: ".challan_serial", required: true }
      - { name: "challan_cin", path: ".challan_cin" }
    amounts:
      - { name: "amount", path: ".amount" }

  - record_type: "tds_challan_cin"
    rows: "$['TDS Challans'][*]"
    unit: "rupees"
    fields:
      - { name: "challan_cin", path: ".challan_cin", required: true }
      - { name: "deposit_date", path: ".deposit_date", date_format: "yyyy-mm-dd" }
    amounts:
      - { name: "tds_deposited", path: ".amount" }
