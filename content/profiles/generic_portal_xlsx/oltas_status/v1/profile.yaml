# Format profile (schema recon.profile/1, technical spec §B2.2). SYNTHETIC (SPEC-020): the
# challan status OLTAS (TRACES) reports, as a sheet of an Excel workbook, columns found by header text. The
# status is kept as written; the amount consumed and still available are read as amounts.
#
# Editing rules: every text value is in double quotes. A changed format gets a NEW version
# folder (v2 ...) next to this one; a published profile is never edited in place.
# Test with: go run ./cmd/recon-dev profile-test

schema: "recon.profile/1"
profile_id: "generic.portal.oltas_xlsx"
profile_version: "1"
source_system: "TRACES: OLTAS challan status as Excel (synthetic, SPEC-020)"
document_type: "oltas_status"
file_type: "xlsx"
regime: "ITA2025"

# The table may be on a sheet of any name; title rows above the header row and total rows below are left out.
sheets:
  - name: "OLTAS Status"
    header: ["bsr_code", "challan_serial", "status", "consumed"]
    any_name: true
    total_rows: ["Total", "Grand Total"]

detect:
  - json_exists: { path: "$['OLTAS Status'][0].bsr_code" }
  - json_exists: { path: "$['OLTAS Status'][0].challan_serial" }
  - json_exists: { path: "$['OLTAS Status'][0].status" }
  - json_exists: { path: "$['OLTAS Status'][0].consumed" }

context:
  period: { const: "FY" }
  tax_year: { from_run: true }

records:
  - record_type: "oltas_challan"
    rows: "$['OLTAS Status'][*]"
    unit: "rupees"
    fields:
      - { name: "bsr_code", path: ".bsr_code", required: true }
      - { name: "deposit_date", path: ".deposit_date", date_format: "yyyy-mm-dd", required: true }
      - { name: "challan_serial", path: ".challan_serial", required: true }
      - { name: "status", path: ".status" }
    amounts:
      - { name: "amount", path: ".amount" }
      - { name: "consumed", path: ".consumed" }
      - { name: "available", path: ".available" }
