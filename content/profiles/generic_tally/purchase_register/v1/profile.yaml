# Format profile (schema recon.profile/1, technical spec §B2.2). SYNTHETIC: the purchase
# register as a Tally export to CSV, with the column names of the sample pack (voucher_no,
# voucher_date, supplier_gstin, supplier_invoice_no, supplier_invoice_date, taxable_value,
# igst, cgst, sgst, cess), columns found by header text (SPEC-018). The file holds no client
# GSTIN: a client's only GSTIN is used. It has no period column: the month of the first
# voucher date is the period. The file has no invoice value, so a check on it is "cannot
# check", never zero.
#
# Editing rules: every text value is in double quotes. A changed format gets a NEW version
# folder (v2 ...) next to this one; a published profile is never edited in place.
# Test with: go run ./cmd/recon-dev profile-test

schema: "recon.profile/1"
profile_id: "generic.tally.purchase_register_csv"
profile_version: "1"
source_system: "Books: Tally purchase register export as CSV (synthetic, SPEC-018)"
document_type: "purchase_register"
file_type: "csv"
regime: "CGST2017"

detect:
  - json_exists: { path: "$[0].voucher_no" }
  - json_exists: { path: "$[0].supplier_gstin" }
  - json_exists: { path: "$[0].supplier_invoice_no" }

context:
  period: { json_path: "$[0].voucher_date", format: "yyyy-mm-dd" }
  tax_year: { from_period: true }

records:
  - record_type: "purchase_b2b_invoice"
    rows: "$[*]"
    unit: "rupees"
    fields:
      - { name: "supplier_gstin", path: ".supplier_gstin", required: true }
      - { name: "invoice_no", path: ".supplier_invoice_no", required: true }
      - { name: "invoice_date", path: ".supplier_invoice_date", date_format: "yyyy-mm-dd" }
    amounts:
      - { name: "taxable_value", path: ".taxable_value" }
      - { name: "igst", path: ".igst" }
      - { name: "cgst", path: ".cgst" }
      - { name: "sgst", path: ".sgst" }
      - { name: "cess", path: ".cess" }
