# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes. A new rule loads as "testing" until the CA approves it.
# Check with: go run ./cmd/recon-dev rule-lint
#
# SPEC-020: only what the tool computes is reported; it never says which document is right.
schema: "recon.rule/1"
id: "RECON-TDS-011"
version: "1"
source: "builtin"
module: "tds"
category: "R8"
title: "TDS challans of the books against OLTAS"
rule_text_en: "Compares every TDS challan in the books with the challan status OLTAS reports, by BSR code, deposit date and serial number: whether it is in both or one, and its amount."
notes: "Synthetic test data: testdata/tds_bank_sep2026 (fictitious parties and figures)."

law:
  - act: "Income-tax Act, 2025"
    section: "393"
    reference: "Rule-book rule RC-TDS-003 (R12)"

applies:
  tax_years: [ "2026-27" ]
  valid_from: "2026-04-01"
  valid_to: ""

inputs:
  a: { record_type: "tds_challan_books", label: "TDS challans (books)" }
  b: { record_type: "oltas_challan", label: "OLTAS challan status" }

check:
  type: "match_records"
  compare_amounts: [ "amount" ]

severity: "high"
review_document: "oltas_status"     # UI grouping only (FD-06); never appears in finding text
