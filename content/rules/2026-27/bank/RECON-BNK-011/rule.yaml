# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes. A new rule loads as "testing" until the CA approves it.
# Check with: go run ./cmd/recon-dev rule-lint
#
# SPEC-020: only what the tool computes is reported; it never says which document is right.
schema: "recon.rule/1"
id: "RECON-BNK-011"
version: "1"
source: "builtin"
module: "bank"
category: "R8"
title: "Opening bank balance in the books against the statement"
rule_text_en: "Compares the opening balance of the bank account in the books with the opening balance in the bank's statement for the month."
notes: "Synthetic test data: testdata/tds_bank_sep2026 (fictitious parties and figures)."

law:
  - act: "Internal control; audit evidence"
    section: "SA 505"
    reference: "Rule-book rule RC-BNK-001 (R18, opening balance)"

applies:
  tax_years: [ "2026-27" ]
  valid_from: "2026-04-01"
  valid_to: ""

inputs:
  a: { fact: "bkbal.opening_balance_books", label: "Opening balance in the books" }
  b: { fact: "bkbal.opening_balance_statement", label: "Opening balance in the statement" }

check:
  type: "equal"

severity: "medium"
review_document: "bank_balances"     # UI grouping only (FD-06); never appears in finding text
