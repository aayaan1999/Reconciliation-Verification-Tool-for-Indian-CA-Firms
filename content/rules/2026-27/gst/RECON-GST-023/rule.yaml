# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes. A new rule loads as "testing" until the CA approves it.
# Check with: go run ./cmd/recon-dev rule-lint
#
# SPEC-017: the rows of one return added up and compared with one row of another return of the
# same month. Only what the tool computes is reported; it never says which return is right.
schema: "recon.rule/1"
id: "RECON-GST-023"
version: "1"
source: "builtin"
module: "gst"
category: "GST"
title: "GSTR-2A invoices with ITC available against GSTR-3B Table 4(A)(5)"
rule_text_en: "Adds up the taxable value and each tax of the GSTR-2A invoices whose ITC availability is Available and compares each total with the same figure in row 4(A)(5) of GSTR-3B for the month. It states only whether the two differ; row 4(A)(5) is one of several ITC rows."
notes: "Synthetic test data: testdata/gst_returns_apr2026 (fictitious parties and figures)."

law:
  - act: "Central Goods and Services Tax Act, 2017"
    section: "39"
    reference: "GSTR-3B Table 4(A)(5)"

applies:
  tax_years: [ "2025-26", "2026-27" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  a: { record_type: "gstr2a_b2b_invoice", label: "GSTR-2A invoices with ITC available" }
  b: { record_type: "gstr3b_table_row", label: "GSTR-3B Table 4(A)(5)" }

check:
  type: "sum_equals"
  compare_amounts: [ "taxable_value", "igst", "cgst", "sgst", "cess" ]
  parts:
    - { input: "a", sign: "+", rows_where: [ { field: "itc_available", is: "equals", value: "Available" } ] }
  total: "b"
  total_key: "4(A)(5)"
  tolerance: { paise: 100 }

severity: "high"
review_document: "gstr3b"     # UI grouping only (FD-06); never appears in finding text
