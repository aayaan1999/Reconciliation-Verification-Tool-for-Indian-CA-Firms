# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes. A new rule loads as "testing" until the CA approves it.
# Check with: go run ./cmd/recon-dev rule-lint
#
# SPEC-015: rule-book rule RC-GST-011 made runnable. Only what the tool computes is reported; the rule
# book's result codes that need other data are listed as out of scope in the spec.
schema: "recon.rule/1"
id: "RECON-GST-011"
version: "1"
source: "builtin"
module: "gst"
category: "GST"
title: "HSN summary: sales register and GSTR-1 Table 12, by tab, HSN and rate"
rule_text_en: "Adds up the supplies in the sales register (credit notes deducted) by tab (B2B or B2C), HSN and rate and compares each total with the line of GSTR-1 Table 12 for the same tab, HSN and rate: whether it is in both, and its taxable value and each tax."
notes: "Synthetic test data: testdata/gst_pack_aug2026 (fictional company) with ANSWER_KEY.xlsx."

law:
  - act: "Central Goods and Services Tax Act, 2017"
    section: "37"
    reference: "Rule-book rule RC-GST-011"

applies:
  tax_years: [ "2025-26", "2026-27" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  a: { record_type: "sales_hsn_line", label: "Sales register" }
  b: { record_type: "gstr1_hsn_line", label: "GSTR-1 Table 12" }

check:
  type: "match_records"
  compare_amounts: [ "taxable_value", "igst", "cgst", "sgst", "cess" ]
  duplicates_in: [ "b" ]
  tolerance: { paise: 100 }

severity: "high"
review_document: "gstr1"     # UI grouping only (FD-06); never appears in finding text
