# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes. A new rule loads as "testing" until the CA approves it.
# Check with: go run ./cmd/recon-dev rule-lint
#
# Row by row: every B2B invoice in the books against the return (SPEC-004 part 8). Based on
# rule-book rule RC-GST-013.
schema: "recon.rule/1"
id: "RECON-GST-013"
version: "1"
source: "builtin"
module: "gst"
category: "GST"
title: "B2B invoices: purchase register and GSTR-2B"
rule_text_en: "Compares every forward-charge B2B purchase invoice in the purchase register with the invoices in GSTR-2B (b2b), keyed on supplier GSTIN and invoice number: whether it is in both, and its date, taxable value, tax and invoice value."
notes: "Synthetic test data: testdata/gst_pack_aug2026 (fictional company) with ANSWER_KEY.xlsx."

law:
  - act: "Central Goods and Services Tax Act, 2017"
    section: "16(2)(aa)"
    reference: "Rule-book rule RC-GST-013"

applies:
  tax_years: [ "2025-26", "2026-27" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  a: { record_type: "purchase_b2b_invoice", label: "Purchase register" }
  b: { record_type: "gstr2b_b2b_invoice", label: "GSTR-2B" }

check:
  type: "match_records"
  compare_amounts: [ "taxable_value", "igst", "cgst", "sgst", "cess", "invoice_value" ]
  compare_fields: [ "invoice_date" ]
  duplicates_in: [ "b" ]
  invoice_amounts: [ "invoice_value" ]   # the books repeat the invoice value on every line of the invoice
  pair_unmatched_on: [ "supplier_gstin", "invoice_date" ]
  tolerance: { paise: 100 }

severity: "high"
review_document: "gstr2b"     # UI grouping only (FD-06); never appears in finding text
