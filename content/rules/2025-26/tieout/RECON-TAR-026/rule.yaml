# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
# SPEC-006, Test Pack A F22. Loads as testing: the CA approves the wording first.
schema: "recon.rule/1"
id: "RECON-TAR-026"
version: "1"
source: "builtin"
module: "tieout"
category: "R2"
title: "Clause 26: TDS reported under section 43B(a)"
rule_text_en: "Each row of clause 26 is tested: a row under section 43B(a) whose nature is TDS is reported."
notes: "Test Pack A, F22: nil tax effect."

law:
  - act: "Income-tax Act, 1961"
    section: "43B"
    reference: "Form 3CD, clause 26"
  - act: "Income-tax Act, 1961"
    section: "40(a)(ia)"
    reference: ""

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  rows: { record_type: "tar_43b_item", label: "Clause 26, sum under section 43B" }

check:
  type: "present_together"
  when:
    - { input: "rows", field: "section", is: "equals", value: "43B(a)" }
    - { input: "rows", field: "nature", is: "equals", value: "TDS" }

severity: "low"
review_document: "tax_audit_report"     # UI grouping only (FD-06); never appears in finding text
