# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
schema: "recon.rule/1"
id: "RECON-MAT-001"
version: "1"
source: "builtin"
module: "tieout"
category: "R1"
title: "Book profit: Form 29B and the computation"
rule_text_en: "Book profit in Form 29B (serial 18) is compared with book profit in the computation's section 115JB working."
notes: "Test Pack A, F03: Form 29B adds back only the current tax provision. Compare RECON-MAT-002 (tax payable)."

law:
  - act: "Income-tax Act, 1961"
    section: "115JB"
    reference: ""

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  a: { fact: "mat.book_profit", label: "Form 29B, book profit (serial 18)" }
  b: { fact: "computation.mat.book_profit", label: "Computation, book profit under section 115JB" }

check:
  type: "equal"
  tolerance: { paise: 100 }

severity: "high"
review_document: "mat_report"     # UI grouping only (FD-06); never appears in finding text
