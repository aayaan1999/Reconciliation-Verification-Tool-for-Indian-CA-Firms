# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
# SPEC-006, Test Pack A F04. Loads as testing: the CA approves the wording first.
schema: "recon.rule/1"
id: "RECON-MAT-003"
version: "1"
source: "builtin"
module: "tieout"
category: "R2"
title: "Form 29B: serial 19 and fifteen per cent of serial 18"
rule_text_en: "Fifteen per cent of book profit (serial 18), to the rupee, is compared with the figure in serial 19."
notes: "Test Pack A, F04: serial 19 carries the figure with surcharge and cess; serial 20 and paragraph 2 carry that figure too."

law:
  - act: "Income-tax Act, 1961"
    section: "115JB"
    reference: ""

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  base: { fact: "mat.book_profit", label: "Form 29B, book profit (serial 18)" }
  value: { fact: "mat.fifteen_percent", label: "Form 29B, fifteen per cent of book profit (serial 19)" }

check:
  type: "percent_of"
  base: "base"
  rate: "15.00"
  value: "value"
  tolerance: { paise: 100 }

severity: "low"
review_document: "mat_report"     # UI grouping only (FD-06); never appears in finding text
