# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
# SPEC-007, Test Pack A negative control N10. Loads as testing: the CA approves the wording first.
schema: "recon.rule/1"
id: "RECON-TDS-003"
version: "1"
source: "builtin"
module: "tieout"
category: "R4"
title: "Clause 34(a) section 192 payments against the directors' remuneration in clause 23"
rule_text_en: "The total payments under section 192 in clause 34(a) are compared with the remuneration paid to directors in clause 23; the rule reports when the section 192 figure is the lower."
notes: "Test Pack A, N10 (negative control): 5400000 + 2100000 = 7500000, within the salary base of 11240000."

law:
  - act: "Income-tax Act, 1961"
    section: "192"
    reference: "Form 3CD, clauses 23 and 34(a)"

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  a: { fact: "tar.tds.payments_192", label: "Tax audit report, clause 34(a) payments under section 192" }
  b: { fact: "tar.related_party.director_remuneration", label: "Tax audit report, clause 23 remuneration paid to directors" }

check:
  type: "gte"

severity: "medium"
review_document: "tax_audit_report"     # UI grouping only (FD-06); never appears in finding text
