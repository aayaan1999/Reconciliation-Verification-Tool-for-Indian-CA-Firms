# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
# SPEC-006, Test Pack A F09. Loads as testing: the CA approves the wording first.
schema: "recon.rule/1"
id: "RECON-TAR-040"
version: "1"
source: "builtin"
module: "tieout"
category: "R4"
title: "Clause 40: gross profit lower than net profit"
rule_text_en: "Gross profit in clause 40 is compared with net profit in clause 40; the rule reports when gross profit is the lower."
notes: "Test Pack A, F09."

law:
  - act: "Income-tax Act, 1961"
    section: "44AB"
    reference: "Form 3CD, clause 40"

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  a: { fact: "tar.ratios.gross_profit", label: "Tax audit report, clause 40 gross profit" }
  b: { fact: "tar.ratios.net_profit", label: "Tax audit report, clause 40 net profit" }

check:
  type: "gte"

severity: "high"
review_document: "tax_audit_report"     # UI grouping only (FD-06); never appears in finding text
