# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
# SPEC-006, Test Pack A F13. Loads as testing: the CA approves the wording first.
schema: "recon.rule/1"
id: "RECON-TAR-044"
version: "1"
source: "builtin"
module: "tieout"
category: "R1"
title: "Clause 44 expenditure with other registered entities lower than clause 34(a) payments under section 194J"
rule_text_en: "Expenditure relating to other registered entities in clause 44 is compared with the payments under section 194J in clause 34(a); the rule reports when the clause 44 figure is the lower."
notes: "Test Pack A, F13. It agrees only if part of the 194J payments went to unregistered persons."

law:
  - act: "Income-tax Act, 1961"
    section: "44AB"
    reference: "Form 3CD, clauses 34(a) and 44"

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  a: { fact: "tar.gst_expenditure.other_registered", label: "Tax audit report, clause 44 other registered entities" }
  b: { fact: "tar.tds.payments_194j", label: "Tax audit report, clause 34(a) payments under section 194J" }

check:
  type: "gte"

severity: "medium"
review_document: "tax_audit_report"     # UI grouping only (FD-06); never appears in finding text
