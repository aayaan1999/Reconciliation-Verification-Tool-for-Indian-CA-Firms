# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
# SPEC-007, Test Pack A negative control N05. Loads as testing: the CA approves the wording first.
schema: "recon.rule/1"
id: "RECON-TAX-001"
version: "1"
source: "builtin"
module: "tieout"
category: "R2"
title: "Tax under the normal provisions: 25 per cent of total income"
rule_text_en: "Tax on total income in the computation, before surcharge and cess, is compared with 25 per cent of total income, to the rupee."
notes: "Test Pack A, N05 (negative control): 3147200 x 25% = 786800. The 25 per cent rate is the Finance Act's rate for a domestic company whose turnover is within its limit; a company taxed at another rate gives a finding the CA dismisses."

law:
  - act: "Income-tax Act, 1961"
    section: "4"
    reference: "Rate in force under the Finance Act for a domestic company: 25 per cent"

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  income: { fact: "computation.total_income", label: "Computation, total income" }
  tax: { fact: "computation.normal_tax.tax", label: "Computation, tax on total income before surcharge and cess" }

check:
  type: "percent_of"
  base: "income"
  rate: "25.00"
  value: "tax"
  tolerance: { paise: 100 }

severity: "high"
review_document: "computation"     # UI grouping only (FD-06); never appears in finding text
