# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
# SPEC-006, Test Pack A F14. Loads as testing: the CA approves the wording first.
schema: "recon.rule/1"
id: "RECON-TAR-020"
version: "1"
source: "builtin"
module: "tieout"
category: "R6"
title: "Clause 20(b): PF and ESI due dates"
rule_text_en: "The due dates of employee contributions to PF and to ESI in clause 20(b) are matched; a due date in one list only is reported."
notes: "Test Pack A, F14: either no ESI-covered employee that month, or a row not disclosed."

law:
  - act: "Income-tax Act, 1961"
    section: "36(1)(va)"
    reference: "Form 3CD, clause 20(b)"

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  a: { record_type: "tar_pf_payment", label: "Clause 20(b), PF" }
  b: { record_type: "tar_esi_payment", label: "Clause 20(b), ESI" }

check:
  type: "match_records"

severity: "medium"
review_document: "tax_audit_report"     # UI grouping only (FD-06); never appears in finding text
