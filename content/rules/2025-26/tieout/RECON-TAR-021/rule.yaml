# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
# SPEC-006, Test Pack A F19. Loads as testing: the CA approves the wording first.
schema: "recon.rule/1"
id: "RECON-TAR-021"
version: "1"
source: "builtin"
module: "tieout"
category: "R5"
title: "Clause 21(a) amounts described as 'Personal expenditure' and assessee status 'Company', found together"
rule_text_en: "Clause 21(a) describes amounts as 'Personal expenditure', and the assessee's status is Company; the two are listed together."
notes: "Test Pack A, F19: the computation and Form 29B give the same amounts other descriptions. With no such entry the amount counts as nil."

law:
  - act: "Income-tax Act, 1961"
    section: "37"
    reference: "Form 3CD, clause 21(a)"

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  personal: { fact: "tar.inadmissible.personal_expenditure", label: "Tax audit report, clause 21(a) amounts described as 'Personal expenditure'", optional: true, default: "0.00" }
  status: { fact: "tar.assessee_status", label: "Assessee status" }

check:
  type: "present_together"
  when:
    - { input: "personal", is: "nonzero" }
    - { input: "status", is: "equals", value: "Company" }

severity: "medium"
review_document: "tax_audit_report"     # UI grouping only (FD-06); never appears in finding text
