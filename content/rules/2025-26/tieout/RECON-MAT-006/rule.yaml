# Rule file (schema recon.rule/1, technical spec §B4.2). Every text value is in double
# quotes: IDs, versions, tax years, dates and section numbers included.
# Lifecycle status (draft/active/disabled) and approvals are not in this file; they are kept
# by the tool (SPEC-027). Check with: go run ./cmd/recon-dev rule-lint
# SPEC-007, Test Pack A negative control N06. Loads as testing: the CA approves the wording first.
schema: "recon.rule/1"
id: "RECON-MAT-006"
version: "1"
source: "builtin"
module: "tieout"
category: "R2"
title: "Tax on book profit in the computation: 15 per cent of book profit"
rule_text_en: "Tax on book profit in the computation's section 115JB working, before surcharge and cess, is compared with 15 per cent of the book profit, to the rupee."
notes: "Test Pack A, N06 (negative control): 38092990 x 15% = 5713948.50, to the rupee 5713949. Compare RECON-MAT-003 (Form 29B)."

law:
  - act: "Income-tax Act, 1961"
    section: "115JB"
    reference: "Sub-section (1): fifteen per cent of book profit"

applies:
  tax_years: [ "2025-26" ]
  valid_from: "2025-04-01"
  valid_to: ""

inputs:
  book_profit: { fact: "computation.mat.book_profit", label: "Computation, book profit under section 115JB" }
  tax: { fact: "computation.mat.tax", label: "Computation, 115JB working, tax on book profit before surcharge and cess" }

check:
  type: "percent_of"
  base: "book_profit"
  rate: "15.00"
  value: "tax"
  tolerance: { paise: 100 }

severity: "high"
review_document: "computation"     # UI grouping only (FD-06); never appears in finding text
