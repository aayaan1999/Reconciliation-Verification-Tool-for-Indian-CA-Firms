# The categories a rule may be filed under (SPEC-010, the Rule Builder's list). The R-codes are
# the tie-out categories of requirement RC-01 (requirements v0.3); GST is the GST module's.
# The descriptions are the reviewer's wording for the list, to be confirmed by the CA.
# Every text value is in double quotes. Check with: go test ./internal/rules
schema: "recon.rule.categories/1"

categories:
  - code: "R1"
    name: "Same figure in two places"
    description: "The same figure appears in two documents and must agree."
  - code: "R2"
    name: "Recomputed figure"
    description: "A figure is worked out again from its parts, or from a rate and a base, and compared with the figure given."
  - code: "R3"
    name: "Dependency propagation"
    description: "A figure changed between drafts and a figure built from it did not."
  - code: "R4"
    name: "Internal consistency"
    description: "One figure is at least another figure."
  - code: "R5"
    name: "Cross-form conflict"
    description: "Coded entries in two forms that cannot both hold, shown as found."
  - code: "R6"
    name: "Sequence and completeness"
    description: "A period or an item expected in a series has no figure."
  - code: "R7"
    name: "Field value outside the allowed set"
    description: "A field holds a value that is not on the list allowed for it."
  - code: "R8"
    name: "Books against third-party data"
    description: "A figure in the client's books against the figure a third party reports."
  - code: "R9"
    name: "Mandatory field present elsewhere"
    description: "A field is blank here although it is filled in another document."
  - code: "R10"
    name: "Version regression"
    description: "A figure returns to an earlier value in a later draft."
  - code: "GST"
    name: "GST return against the books"
    description: "Invoices and totals in the GST returns against the client's books (RC-03)."
