# Record types: the controlled list of row kinds read from registers and portal files
# (vouchers, invoices, challans, ECR lines), technical spec §B3.
#
# Editing rules are the same as facts.yaml, and vocab_version must equal the one there.
# - name, amounts and fields: lower snake case.
# - match_key lists the fields that together identify one row; each must be in "fields".
# - amounts are money columns; fields are every other column. A name is in one list only.
#
# No record types yet: GST, TDS and payroll rows arrive with SPEC-031..033 and Tally rows
# with SPEC-020. Example of the format:
#
#   - name: "gst_invoice"
#     description: "One invoice line from GSTR-1, GSTR-2B or the books"
#     match_key: ["counterparty_gstin", "invoice_no", "invoice_date"]
#     amounts: ["taxable_value", "igst", "cgst", "sgst", "cess"]
#     fields: ["counterparty_gstin", "invoice_no", "invoice_date", "place_of_supply"]
#     since_vocab: 2

schema: "recon.vocab.records/1"
vocab_version: 12

record_types:
  - name: "sales_b2b_invoice"
    document_type: "sales_register"
    description: "One B2B tax invoice (or one line of it) in the sales register; lines of one invoice share its number"
    match_key: ["invoice_no"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess", "invoice_value"]
    fields: ["invoice_no", "counterparty_gstin", "invoice_date", "place_of_supply", "rate"]
    since_vocab: 4

  - name: "gstr1_b2b_invoice"
    document_type: "gstr1"
    description: "One B2B invoice reported in GSTR-1 Table 4 (b2b), with its item lines added together"
    match_key: ["invoice_no"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess", "invoice_value"]
    fields: ["invoice_no", "counterparty_gstin", "invoice_date", "place_of_supply", "rate"]
    since_vocab: 4

  - name: "purchase_b2b_invoice"
    document_type: "purchase_register"
    description: "One forward-charge B2B purchase invoice (or one line of it) in the purchase register"
    match_key: ["supplier_gstin", "invoice_no"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess", "invoice_value"]
    fields: ["supplier_gstin", "invoice_no", "invoice_date", "place_of_supply"]
    since_vocab: 4

  - name: "gstr2b_b2b_invoice"
    document_type: "gstr2b"
    description: "One B2B invoice in GSTR-2B (b2b), with its item lines added together"
    match_key: ["supplier_gstin", "invoice_no"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess", "invoice_value"]
    fields: ["supplier_gstin", "invoice_no", "invoice_date", "place_of_supply", "itc_available"]
    since_vocab: 4

  - name: "tar_pf_payment"
    document_type: "tax_audit_report"
    description: "Clause 20(b): one month's employee contribution to provident fund, with its due date"
    match_key: ["due_date"]
    amounts: ["amount"]
    fields: ["due_date", "paid_date"]
    since_vocab: 6

  - name: "tar_esi_payment"
    document_type: "tax_audit_report"
    description: "Clause 20(b): one month's employee contribution to ESI, with its due date"
    match_key: ["due_date"]
    amounts: ["amount"]
    fields: ["due_date", "paid_date"]
    since_vocab: 6

  - name: "tar_tds_statement_24q"
    document_type: "tax_audit_report"
    description: "Clause 34(b): one quarterly TDS statement in Form 24Q, by its due date"
    match_key: ["due_date"]
    amounts: []
    fields: ["form", "due_date", "furnished_date"]
    since_vocab: 6

  - name: "tar_tds_statement_26q"
    document_type: "tax_audit_report"
    description: "Clause 34(b): one quarterly TDS statement in Form 26Q, by its due date"
    match_key: ["due_date"]
    amounts: []
    fields: ["form", "due_date", "furnished_date"]
    since_vocab: 6

  - name: "tar_loan_taken"
    document_type: "tax_audit_report"
    description: "Clause 31(a): one loan or deposit taken or accepted, by the name of the person"
    match_key: ["name"]
    amounts: ["amount"]
    fields: ["name", "pan", "code_of_nature"]
    since_vocab: 6

  - name: "tar_loan_repaid"
    document_type: "tax_audit_report"
    description: "Clause 31(c): one repayment of a loan or deposit, by the name of the person"
    match_key: ["name"]
    amounts: ["amount"]
    fields: ["name", "pan", "code_of_nature"]
    since_vocab: 6

  - name: "tar_43b_item"
    document_type: "tax_audit_report"
    description: "Clause 26: one sum under section 43B, by its sub-section and nature"
    match_key: ["section", "nature"]
    amounts: ["amount"]
    fields: ["section", "nature"]
    since_vocab: 6

  - name: "ledger_month"
    document_type: "ledger"
    description: "One ledger head in one month: its group and the amount posted"
    match_key: ["ledger_head", "month"]
    amounts: ["amount"]
    fields: ["ledger_head", "group", "month"]
    since_vocab: 8

  - name: "tar_depreciation_block"
    document_type: "tax_audit_report"
    description: "Clause 18: one block of assets, with its written down values, additions, deductions and depreciation"
    match_key: ["block"]
    amounts: ["opening_wdv", "additions", "deductions", "depreciation", "closing_wdv"]
    fields: ["block"]
    since_vocab: 9

  # SPEC-015: B2C large invoices, B2C small summary and HSN summary of GSTR-1, and the same
  # supplies in the sales register (rule-book rules RC-GST-002, RC-GST-003, RC-GST-011).
  - name: "sales_b2cl_invoice"
    document_type: "sales_register"
    description: "One B2C large tax invoice (inter-state, unregistered buyer, above the threshold), or one line of it, in the sales register"
    match_key: ["invoice_no"]
    amounts: ["taxable_value", "igst", "cess", "invoice_value"]
    fields: ["invoice_no", "invoice_date", "place_of_supply", "rate"]
    since_vocab: 10

  - name: "gstr1_b2cl_invoice"
    document_type: "gstr1"
    description: "One B2C large invoice reported in GSTR-1 Table 5 (b2cl), with its item lines added together"
    match_key: ["invoice_no"]
    amounts: ["taxable_value", "igst", "cess", "invoice_value"]
    fields: ["invoice_no", "invoice_date", "place_of_supply", "rate"]
    since_vocab: 10

  - name: "sales_b2cs_line"
    document_type: "sales_register"
    description: "One B2C small supply line in the sales register; the lines of one place of supply and rate are added together"
    match_key: ["place_of_supply", "rate"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess"]
    fields: ["place_of_supply", "rate"]
    since_vocab: 10

  - name: "gstr1_b2cs_line"
    document_type: "gstr1"
    description: "One B2C small summary line of GSTR-1 Table 7 (b2cs), by place of supply and rate"
    match_key: ["place_of_supply", "rate"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess"]
    fields: ["place_of_supply", "rate"]
    since_vocab: 10

  - name: "sales_hsn_line"
    document_type: "sales_register"
    description: "One supply line of the sales register by tab (B2B or B2C), HSN and rate, credit notes negated; the lines of one tab, HSN and rate are added together"
    match_key: ["tab", "hsn", "rate"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess"]
    fields: ["tab", "hsn", "rate"]
    since_vocab: 10

  - name: "gstr1_hsn_line"
    document_type: "gstr1"
    description: "One line of the GSTR-1 Table 12 HSN summary (hsn_b2b or hsn_b2c), by tab, HSN and rate"
    match_key: ["tab", "hsn", "rate"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess"]
    fields: ["tab", "hsn", "rate"]
    since_vocab: 10

  # SPEC-017: GSTR-1 as a flat table, GSTR-2A and GSTR-3B, so the three returns of a month
  # can be compared with each other (rule-book rules RC-GST-007, RC-GST-004, RC-GST-016).
  - name: "gstr1_outward_line"
    document_type: "gstr1"
    description: "One row of a flat GSTR-1 table (one invoice line) with its category (B2B, B2CL, B2CS or EXP), so totals of several categories can be taken from one list"
    match_key: ["invoice_no"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess", "invoice_value"]
    fields: ["invoice_no", "category", "counterparty_gstin", "invoice_date", "place_of_supply", "rate", "hsn"]
    since_vocab: 11

  - name: "gstr2a_b2b_invoice"
    document_type: "gstr2a"
    description: "One B2B invoice in GSTR-2A, the live statement of suppliers' filings (it changes as suppliers file; GSTR-2B is the fixed one)"
    match_key: ["supplier_gstin", "invoice_no"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess", "invoice_value"]
    fields: ["supplier_gstin", "invoice_no", "invoice_date", "place_of_supply", "reverse_charge", "itc_available", "filing_period"]
    since_vocab: 11

  - name: "gstr3b_table_row"
    document_type: "gstr3b"
    description: "One row of GSTR-3B by table number (3.1(a), 3.1(b), 3.1(c), 3.1(d), 4(A)(5), 4(B)(2) and so on)"
    match_key: ["table"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess"]
    fields: ["table", "description"]
    since_vocab: 11

  # SPEC-018: the e-invoice register, the e-way bill register and the IMS actions of a month,
  # compared with the sales and purchase registers. GSTR-3B also arrives from the GST portal
  # JSON into gstr3b_table_row (no new record type).
  - name: "einvoice_irn"
    document_type: "einvoice"
    description: "One row of the e-invoice (IRN) register: the invoice number, its IRN and status, and the taxable value, taxes and total value reported to the IRP"
    match_key: ["invoice_no"]
    amounts: ["taxable_value", "igst", "cgst", "sgst", "cess", "invoice_value"]
    fields: ["invoice_no", "irn", "counterparty_gstin", "invoice_date", "document_type", "irn_status"]
    since_vocab: 12

  - name: "ewaybill_row"
    document_type: "ewaybill"
    description: "One row of the e-way bill register: the e-way bill number and status for a document, with the document's total value"
    match_key: ["invoice_no"]
    amounts: ["invoice_value"]
    fields: ["invoice_no", "ewb_no", "ewb_date", "invoice_date", "from_gstin", "to_gstin", "hsn", "document_type", "ewb_status"]
    since_vocab: 12

  - name: "ims_action"
    document_type: "ims"
    description: "One document in the Invoice Management System (IMS) with the action taken on it (Accepted, Rejected, Pending, or deemed accepted)"
    match_key: ["supplier_gstin", "invoice_no"]
    amounts: ["taxable_value"]
    fields: ["supplier_gstin", "invoice_no", "document_type", "invoice_date", "ims_action", "in_gstr2b"]
    since_vocab: 12
