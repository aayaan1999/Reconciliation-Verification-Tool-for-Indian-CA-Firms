  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "matrix sums = gross receivables"
  steps:
    - "Rows: (i) Undisputed – considered good, (ii) Undisputed – considered doubtful, (iii) Disputed – considered good, (iv) Disputed – considered doubtful [Division I per DPNC]; Division II adds 'which have significant increase in credit risk' and 'credit impaired' (to be confirmed by CA)."
    - "Buckets <6m, 6m–1y, 1–2y, 2–3y, >3y."
    - "Total = trade receivables before allowance; reconcile with allowance for doubtful debts."
parameters: []
outcomes:
  categories: []
  default_severity: "Medium"
  expected_output: "Ageing table"
  recommended_action: "Medium"
  common_discrepancies: ""
tests:
  worked_example: "Gross ₹1.2 cr: undisputed good <6m ₹90 lakh, 6m-1y ₹20 lakh, doubtful >3y ₹10 lakh; provision ₹10 lakh ✓."
  positive: "Sums tie"
  negative: "Credit balances netted inside receivables -> flag (reclass, TB-005)"
implementation:
  handler: ""
  pseudocode: "as FS-002"
