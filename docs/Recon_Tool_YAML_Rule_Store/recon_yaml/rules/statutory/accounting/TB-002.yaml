  prerequisites: "Ledger master with names/groups."
  input_validations: "Non-zero suspense at year end -> High; Difference in opening -> Critical"
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "flag if |closing_balance| > 0"
  steps:
    - "Identify ledgers by name/group regex: suspense, difference in opening, temp, clearing, misc. to be adjusted, unidentified receipts."
    - "If closing ≠ 0 -> flag; list contributing vouchers with age."
    - "Tally-specific: 'Difference in opening balances' row in TB -> Critical."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "Suspense report with ageing."
  recommended_action: "High"
  common_discrepancies: "Unidentified receipts parked; rounding differences accumulated."
tests:
  worked_example: "Suspense Cr ₹48,000 (unidentified NEFT receipt 12-Mar) -> High; likely relates to BRS D2 item."
  positive: "Suspense nil -> pass."
  negative: "Suspense ₹1 Cr balance -> flag"
implementation:
  handler: ""
  pseudocode: |-
    for l in tb:
      if re.search('suspense|difference in opening',l.name,re.I) and l.bal: flag(l)
