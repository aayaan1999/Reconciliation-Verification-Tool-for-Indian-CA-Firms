notes: "[VERIFICATION 13-10-2026] Additional dated items from official GST Council newsletters: N.17/2025-CT (GSTR-3B Sep-2025 / Jul-Sep 2025 due date extended to 25-10-2025); N.01/2026-CT dt 21-04-2026 (GSTR-3B Mar-2026 due date extended to 21-04-2026); N.01/2026-CT(Rate) dt 30-04-2026 (beverage rate realignment per FA 2026); 3-year bar enforcement from 01-12-2025 for Oct-2022 GSTR-3B. FA 2026 GST commencement still not verified. CORRECTION: Add switchboard rows: 25.10.2025 (N.17/2025-CT), 21.04.2026 (N.01/2026-CT), 30.04.2026 (N.01/2026-CT(Rate)). Commencement of FA 2026 s.15/34/54 changes after March 2026 not verified (search budget exhausted). 57th Council recommendations must be tracked for notifications in Oct-Dec 2026."
