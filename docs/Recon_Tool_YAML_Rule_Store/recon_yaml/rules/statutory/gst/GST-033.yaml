schema_version: "1.0"
rule:
  id: "GST-033"
  version: "1"
  type: "statutory"
  domain: "gst"
  category: "GST – Law changes tracker"
  name: "2025-26 / 2026-27 GST law-change effective-date switchboard"
  purpose: "Single configurable table of effective dates so that all rules apply the correct version by transaction/tax-period date."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "Various (see logic_steps)."
  period_basis: ""
legal:
  provisions: "56th GST Council (03.09.2025) rate notifications dt 17.09.2025; Finance Act 2025 GST provisions (N.16/2025-CT, 01.10.2025); N.15/2025-CT (annual return exemption); GSTN advisories (3B lock, IMS, ECRRS); 31.12.2025 notifications (tobacco, 01.02.2026); Finance Act 2026 (enacted 30.03.2026); 57th GST Council (08.10.2026) – recommendations only."
  applicability: "Engine-level configuration."
  exemptions_exceptions: "Not applicable"
  thresholds_rates: "Not applicable"
  rounding: "Not applicable"
  due_dates: "Not applicable"
inputs:
  documents: []
  fields:
    - "transaction_date"
    - "tax_period"
    - "fy"
  prerequisites: "None"
  input_validations: "Rule invoked with date where version unknown -> CONFIG_GAP (Medium)."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "version = SWITCHBOARD.lookup(rule, max(effective_from <= date))"
  steps:
    - "01.04.2025: ISD mandatory; 30-day e-invoice reporting for AATO >= Rs 10 crore."
    - "July 2025 tax period: 3B Table 3 locked."
    - "01.08.2025 onwards: 3-year return bar enforced."
    - "22.09.2025: GST 2.0 rates (5/18/40), most compensation cess Nil, service rate changes."
    - "01.10.2025: FA 2025 provisions (s.34(2) proviso, s.38 statement, s.39(1), s.107/112 pre-deposit on penalty-only orders, s.122B/148A track & trace, s.17(5)(d) 'plant and machinery' retrospective, Schedule III para 8(aa) retrospective)."
    - "October 2025 tax period: IMS credit note pending / reversal declaration."
    - "November 2025 tax period: 3B Table 3.2 non-editable."
    - "01.02.2026: tobacco/pan masala 40%, biris 18%, Schedule VII (28%) omitted, cess Nil, Rule 31D RSP valuation, Rule 86B restricted."
    - "30.03.2026: IGST s.13(8)(b) omitted (intermediary)."
    - "01.04.2026: s.101A(1A)."
    - "Pending notification (as last known): FA 2026 s.15(3)(b)/s.34(1) discount CN, s.54(6) provisional refund for IDS, s.54(14)."
    - "Recommendations of 57th Council (08.10.2026) – NOT effective; keep disabled."
parameters: []
outcomes:
  categories: []
  default_severity: "Medium"
  expected_output: "Effective version per rule per date."
  recommended_action: "Medium"
  common_discrepancies: "Using invoice date instead of time of supply; using tax period instead of transaction date for rate changes."
tests:
  worked_example: "Invoice dated 21.09.2025 -> old rate notification 1/2017; 22.09.2025 -> 9/2025."
  positive: "Tax period Aug 2025 -> 3B Table 3 locked = True."
  negative: "Tax period Jun 2025 -> locked = False."
implementation:
  handler: ""
  pseudocode: "SWITCHBOARD={'gst_rates':[('2017-07-01','N1_2017'),('2025-09-22','N9_2025'),('2026-02-01','N9_2025_amd19')], ...}"
