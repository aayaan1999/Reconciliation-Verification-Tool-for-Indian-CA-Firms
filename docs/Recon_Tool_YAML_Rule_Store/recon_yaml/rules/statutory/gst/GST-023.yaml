    ref: "secondary summary of caps"
    official: false
  - title: "57th GST Council Meeting 2026: key decisions (Startup Movers)"
    url: "https://www.startup-movers.com/57th-gst-council-meeting-2026-key-decisions"
    ref: "recommendations only"
    official: false
  - title: "CBIC – N.19/2021-CT"
    url: "https://cbic-gst.gov.in/pdf/central-tax/notfctn-19-central-tax-english-2021.pdf"
    ref: ""
    official: true
  - title: "CBIC – N.20/2021-CT"
    url: "https://cbic-gst.gov.in/pdf/central-tax/notfctn-20-central-tax-english-2021.pdf"
    ref: ""
    official: true
  - title: "CBIC – CGST s.47"
    url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter9/section47_v1.00.html"
    ref: ""
    official: true
notes: "[VERIFICATION 13-10-2026] CBIC PDFs (official): N.19/2021-CT (GSTR-3B) and N.20/2021-CT (GSTR-1), both dt 01-06-2021, from tax period June 2021: late fee above the cap is waived. CGST caps: nil Rs 250; AATO up to 1.5 cr Rs 1,000; 1.5-5 cr Rs 2,500. Same caps under SGST give totals of Rs 500 / 2,000 / 5,000, which match the rule. No cap is listed for AATO above Rs 5 crore, so the statutory s.47(1) maximum of Rs 5,000 per Act (Rs 10,000 total) applies – confirmed on the CBIC s.47 page (Rs 100/day, max Rs 5,000). Neither notification states a per-day rate, so the Rs 50/day (Rs 20 nil) reduction rests on other notifications not opened. GSTR-3B caps verified via secondary reproduction of N.19/2021; GSTR-1 N.20/2021 and the > Rs 5 crore Rs 10,000 cap taken from secondary calculator page and statutory s.47 cap – CA to confirm."
