    official: false
  - title: "Rule 37 – CBIC tax information portal"
    url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter5/rule37_v1.00.html"
    ref: "seen in search results"
    official: true
  - title: "Circular 170/02/2022-GST (gstcouncil.gov.in)"
    url: "https://www.gstcouncil.gov.in/sites/default/files/2024-06/cir-170-02-2022-cgst.pdf"
    ref: "GSTR-3B Table 4 & 3.2 reporting"
    official: true
  - title: "Rule 88B CGST Rules (Chhattisgarh GST copy)"
    url: "https://www.cggst.com/uploads/document/1754119329-rule-88b.pdf"
    ref: "Rule 88B(1)-(3) & Explanation"
    official: false
  - title: "CBIC – CGST Act s.16"
    url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter5/section16_v1.00.html"
    ref: "second proviso to s.16(2)"
    official: true
notes: "[VERIFICATION 13-10-2026] Rule 37 text confirmed on CBIC: reversal (wholly or partly, proportionate) in the GSTR-3B for the period immediately following 180 days from invoice date, with interest u/s 50; re-availment allowed on payment; s.16(4) time limit does not apply to re-availment. Sub-rule (1) substituted by N.19/2022-CT w.e.f. 01.10.2022, words inserted by N.26/2022-CT. 180-day condition also confirmed in s.16(2) second proviso. Interest rate 18% confirmed (see GST-022). The question of when interest starts (Rule 88B(3) 'wrongly availed and utilised') remains a CA judgement. Interest start date on Rule 37 reversals is debated: Rule 37 says interest u/s 50; Rule 88B(3) computes s.50(3) interest from utilisation where ITC 'wrongly availed and utilised'. Whether ITC validly availed but later reversible is 'wrongly availed' is a CA judgment call. 57th Council (08.10.2026) recommended s.16/37 alignment – watch for amendment."
