notes: "[VERIFICATION 13-10-2026] Official: Rule 80(3) – self-certified GSTR-9C where AATO exceeds Rs 5 crore (inserted by N.40/2021-CT; Rule 80(1) substituted by N.30/2021-CT). GSTN FAQ: GSTR-9 due date for FY 2024-25 was 31-12-2025. N.15/2025-CT (Rs 2 crore exemption) could not be opened on an official site. N.15/2025-CT verified via reproduction of the notification text (TaxHeal). Notification number for 9/9C format changes (13/2025-CT per GSTZen) unverified. GSTR-9 position for FY 2025-26 (due 31.12.2026) assumed same – no new notification checked."
