notes: "[VERIFICATION 13-10-2026] Not upgraded. An official GSTN FAQ page (tutorial.gst.gov.in GSTR3B.htm) still says 'as of now, the auto-populated values in GSTR-3B are kept editable', with warnings on edits. This conflicts with the secondary reports of a hard-lock of Table 3 from July 2025 (advisory 07-06-2025). The FAQ page may be stale. The GSTN advisory PDF (mahagst copy) was blocked by robots. Same FAQ: from the Oct-2025 tax period, advances data no longer flows into Table 3.2. Rule 88C thresholds not opened (robots). Hard-lock (Table 3 from July 2025; 3.2 from Nov 2025) verified via secondary reproductions of GSTN advisories. Rule 88C thresholds not verified. 57th Council (08.10.2026) recommended a liability correction mechanism proposed for April 2027 return – recommendation only, not law."
