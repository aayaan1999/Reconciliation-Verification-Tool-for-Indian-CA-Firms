notes: "[VERIFICATION 13-10-2026] Conflict resolved: the notified rate for s.50(3) is 18%, not 24%. Text of s.116 of the Finance Act 2022 says notification G.S.R. 661(E) dated 28-6-2017 (= Notification 13/2017-Central Tax) 'shall stand amended and shall be deemed to have been amended retrospectively' as per the Sixth Schedule. The Sixth Schedule says: in the Table, against Sl. No. 2 (the s.50(3) entry), in column (3), for '24' substitute '18', w.e.f. 1-7-2017. The Seventh Schedule makes the same 24->18 change in G.S.R. 698(E) (the companion IGST notification) w.e.f. 1-7-2017. The CBIC Act page (official) confirms s.50(3) was substituted by s.111 of Finance Act 2022 w.e.f. 1-7-2017 and now reads 'wrongly availed and utilised ... at such rate not exceeding twenty-four per cent' – 24% is only the statutory ceiling. The CBIC copy of N.13/2017 itself could not be fetched (fetch error), and the Finance Act 2022 schedule text was read on a reproduction site (taxmanagementindia), so the status is secondary-only, but the content is the statute text. Also confirmed on CBIC: s.50(1) ceiling 18% and the proviso (interest on cash-ledger portion only, except where return filed after s.73/74 proceedings start). A GSTN advisory (Mar-2026) confirms the portal auto-computes 3B interest and populates Table 5.1 of the next return, and gives the Rule 88B(1) minimum-cash-balance benefit. s.50(3) rate conflict resolved: Finance Act 2022 s.116 read with the Sixth Schedule substituted 18% for 24% at Sl.2 of N.13/2017-CT from 01.07.2017 (Schedule text read on a reproduction site; CBIC PDF did not load). Day-count convention (exclusive of due date, inclusive of payment date) is an implementation choice."
