schema_version: "1.0"
rule:
  id: "GST-001"
  version: "1"
  type: "statutory"
  domain: "gst"
  category: "GST – Master data / Identity"
  name: "GSTIN format and check-digit validation"
  purpose: "Reject or flag malformed/typo GSTINs of suppliers and customers before any matching, so that 2B matching, place-of-supply and B2B reporting run on clean keys."
governance:
  enabled: false
  verification_status: "verified_secondary"
  verification_label: "Verified – secondary source only"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "1 July 2017 (unchanged through FY 2025-26 and FY 2026-27)"
  period_basis: ""
legal:
  provisions: "CGST Rules, 2017 Rule 10 / FORM GST REG-06 (GSTIN issued on registration); state codes per Census-2011/GSTN state code list. Check-digit algorithm is a GSTN technical design (Luhn mod-36), not prescribed in the Act or Rules."
  applicability: "All GSTINs in sales register, purchase register, GSTR-1, GSTR-2B, e-invoice and e-way bill data. Does NOT apply to UIN holders/TDS/TCS/NRTP/OIDAR formats without separate patterns (see exceptions)."
  exemptions_exceptions: "UIN (UN bodies/embassies), TDS deductor (s.51), TCS (ECO s.52), NRTP and OIDAR GSTINs use different 13th/14th character conventions (e.g., 14th char 'D' for TDS, 'C' for TCS is commonly observed) – unverified from official source; route to 'special registration' validation rather than fail hard."
  thresholds_rates: "Not applicable"
  rounding: "Not applicable"
  due_dates: "Not applicable"
inputs:
  documents: []
  fields:
    - "gstin"
    - "party_name"
    - "party_state_code (from books)"
    - "pan (if captured)"
  prerequisites: "State code master (01-38 plus 97 Other Territory, 96 Foreign/OIDAR per GSTN usage – maintain as configurable master)."
  input_validations: "Length != 15 -> INVALID_LENGTH; regex fail -> INVALID_FORMAT; unknown state code -> INVALID_STATE; check digit mismatch -> INVALID_CHECKSUM; PAN mismatch with master -> PAN_MISMATCH; state code of GSTIN != state in party master address -> STATE_MISMATCH (warning)."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "Alphabet A='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'. For i=0..13 (left to right): v=index(c_i); f = 1 if i even else 2; p=v*f; sum += (p // 36) + (p % 36). check = A[(36 - sum % 36) % 36]."
  steps:
    - "Trim, remove spaces/hyphens, upper-case."
    - "Length must be 15."
    - "Regex ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ for normal taxpayers."
    - "First 2 digits must exist in state code master."
    - "Characters 3-12 = PAN; 4th char of PAN (position 6 in GSTIN) indicates holder type (P individual, C company, F firm/LLP, H HUF, A AOP, T trust, B BOI, L local authority, J artificial juridical person, G government)."
    - "Position 13 = entity number (1-9 then A-Z) for same PAN in the same state."
    - "Position 14 = 'Z' (default) for normal registrations."
    - "Compute Luhn mod-36 check digit over first 14 characters and compare with position 15."
    - "If PAN separately captured, compare with GSTIN[2:12]."
    - "Optionally call GST portal public search API for active/cancelled status (outside scope of offline validation)."
parameters: []
outcomes:
  categories: []
  default_severity: ""
  expected_output: "Per GSTIN: valid flag, error code, decoded state name, PAN, holder type, entity number."
  recommended_action: "Invalid checksum/format: Critical (block from 2B matching key; send to master-data cleanup). State mismatch: Medium."
  common_discrepancies: "O vs 0 and I vs 1 typos; lower-case entry; old Andhra Pradesh code 28 vs new 37 after bifurcation; Dadra & Nagar Haveli and Daman & Diu merged (code 26 used post-merger – verify); customer's GSTIN of another state of same PAN used on invoice."
tests:
  worked_example: "GSTIN 27AAPFU0939F1ZV. Values: 2,7,10,10,25,15,30,0,9,3,9,15,1,35. Factors 1,2,1,2,... Products: 2,14,10,20,25,30,30,0,9,6,9,30,1,70. Sum of (p//36 + p%36): 2+14+10+20+25+30+30+0+9+6+9+30+1+(1+34=35) = 221. 221 % 36 = 5. (36-5)%36 = 31 -> A[31] = 'V'. Matches 15th char -> valid. (Verified by running the algorithm; also 29AAGCB7383J1Z4 -> '4' valid.)"
  positive: "27AAPFU0939F1ZV -> VALID, state=Maharashtra, PAN=AAPFU0939F, holder type F (firm)."
  negative: "27AAPFU0939F1ZO -> INVALID_CHECKSUM; 27AAPFU0939F1Z -> INVALID_LENGTH; 99AAPFU0939F1ZV -> INVALID_STATE; 27AAPFU0939F0ZV -> INVALID_FORMAT (entity char 0)."
implementation:
  handler: ""
  pseudocode: |-
    A='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'
    import re
    def gstin_check(g):
        g=g.replace(' ','').replace('-','').upper()
        if len(g)!=15: return 'INVALID_LENGTH'
        if not re.match(r'^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$', g): return 'INVALID_FORMAT'
        if g[:2] not in STATE_CODES: return 'INVALID_STATE'
        s=0
        for i,c in enumerate(g[:14]):
            p=A.index(c)*(1 if i%2==0 else 2)
            s+=p//36+p%36
        return 'VALID' if A[(36-s%36)%36]==g[14] else 'INVALID_CHECKSUM'
sources:
  - title: "python-stdnum gstin.py (Luhn mod 36 check digit)"
    url: "https://arthurdejong.org/git/python-stdnum/plain/stdnum/in_/gstin.py"
    ref: "Code inspected from PyPI package python-stdnum 2.2"
    official: false
  - title: "GSTIN format explained (AI Accountant)"
    url: "https://www.aiaccountant.com/blog/gstin-format"
    ref: "structure positions 1-15"
    official: false
notes: "Check-digit algorithm verified by inspecting open-source python-stdnum (Luhn mod 36) and executing it against known valid GSTINs; GSTN has not published the algorithm on an official page I could open. State code list in python-stdnum stops at 37 and lacks 38 (Ladakh) and 97 (Other Territory) – maintain the master from GST portal. Not verified on official domain."
