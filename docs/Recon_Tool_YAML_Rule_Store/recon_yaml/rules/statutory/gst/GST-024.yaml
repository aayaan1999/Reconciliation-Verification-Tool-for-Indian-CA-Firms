notes: "[VERIFICATION 13-10-2026] Official: s.47(2) – Rs 100/day, capped at 0.25% of State turnover (CBIC). GSTN FAQ on GSTR-9/9C FY 2024-25 (15-10-2025) and Circular 246/03/2025-GST: late fee is levied u/s 47(2); for GSTR-9 it runs from the due date until GSTR-9 is filed; for GSTR-9C it runs from the later of GSTR-9 filing or the due date until 9C is filed; it is auto-computed and paid in new Table 17 of 9C. This resolves the conflict: 9C delay attracts its own s.47(2) late fee for the period after GSTR-9 is filed (subject to the same cap). N.7/2023 turnover bands not opened. CORRECTION: Add: GSTR-9C late fee = s.47(2) for days from max(GSTR-9 filing date, due date) to 9C filing, auto-calculated in 9C Table 17 (Circular 246/03/2025-GST); total of 9 and 9C fees subject to the N.7/2023 / s.47(2) caps. N.7/2023 bands verified via Lexplosion; > Rs 20 crore band from statute/secondary. Whether 9C delay extends GSTR-9 late fee (s.44 single annual return incl. 9C) is a CA interpretation; ClearTax mentions an auto-calculated Rs 100/day in Table 17 of 9C without cap – conflicting; needs review."
