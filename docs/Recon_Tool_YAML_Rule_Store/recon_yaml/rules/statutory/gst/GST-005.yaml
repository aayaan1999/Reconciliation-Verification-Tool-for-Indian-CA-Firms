notes: "[VERIFICATION 13-10-2026] Official CBIC copy of N.9/2025-Integrated Tax (Rate) dt 17-09-2025 (corrigendum 18-09-2025): Sch I 5%, II 18%, III 40%, IV 3%, V 0.25%, VI 1.5%, VII 28%; supersedes N.1/2017-IT(Rate). PIB (56th Council): goods and services changes from 22-09-2025; hotels up to Rs 7,500/unit/day 5%; individual life and health insurance exempt; gym/salon/yoga 5%. NEW: N.01/2026-CT(Rate) dt 30-04-2026 (GST Council newsletter) amends N.09/2025-CT(Rate) to match Finance Act 2026: fruit-juice/milk-based drinks (2202 99 21/29/31/39) in Sch I 5%; other non-alcoholic/caffeinated beverages (2202 99 90/91/99) in Sch III 40%; matching UTGST/IGST 01/2026. The HSN mapping must still be loaded from the schedules. CORRECTION: Add to rate master: N.01/2026-CT(Rate) / 01/2026-IT(Rate) / 01/2026-UT(Rate) dt 30.04.2026 – tariff 2202 99 21/29/31/39 -> Sch I (5%); 2202 99 90/91/99 -> Sch III (40%). Notification numbers 9/2025-CT(Rate), 9/2025-IT(Rate), 15/2025-CT(Rate), 19/2025-CT(Rate) & IT(Rate) verified via secondary reproductions of the notification text; official CBIC PDF not opened. The full HSN-to-schedule mapping is NOT reproduced here – load it from the notification schedules. Exemption notification number (10/2025-CT(Rate)?) and other rate notifications 11-17/2025-CT(Rate) reported inconsistently by GSTZen – unverified."
