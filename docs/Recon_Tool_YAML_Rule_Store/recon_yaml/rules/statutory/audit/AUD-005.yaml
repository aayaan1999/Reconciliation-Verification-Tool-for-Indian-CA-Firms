calculation:
  formula: "col6 = col3+col4+col5; check col2 == col6 + col7"
  steps:
    - "Population: total expenditure incl. capital, excluding non-cash items (depreciation, provisions) and non-supplies (salary, etc.)."
    - "Col 3: exempt/nil from registered; Col 4: composition; Col 5: other registered; Col 6 = 3+4+5; Col 7: unregistered."
    - "Check col6 + col7 = col2."
    - "Reconcile col2 to P&L + capex."
