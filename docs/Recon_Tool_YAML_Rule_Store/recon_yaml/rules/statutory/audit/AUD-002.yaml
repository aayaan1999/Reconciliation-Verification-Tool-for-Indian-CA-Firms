    ref: "CARO 2020 cl. 3(ii)(b), 3(viii)"
    official: false
notes: "Private company exemption thresholds and 3(vii) 6-month rule from professional knowledge – not re-verified. Note small company thresholds changed 01-12-2025 (MCA-004) which expands CARO exemption."
