notes: "[VERIFICATION 13-10-2026] Conflict resolved on where the 0.25/0.50/1% slabs come from. They are in the EPF Scheme 2026 itself (G.S.R. 525(E), 29-06-2026), para 23(1): damages are a percentage of the outstanding amount per month – default up to 2 months 0.25%; over 2 and up to 4 months 0.50%; over 4 months 1% – capped at the outstanding amount. Para 23(2) applies these same damages from 14-06-2024 to defaults under old para 32A of the EPF Scheme 1952. So the rule's flat '1% per month for all delay on/after 15-06-2024' is superseded. CAM was right; SCC/TaxGuru's attribution to VISHWAS only is wrong or incomplete. Para 13(7) makes interest and damages payable under ss.127-128 of the Code; the 12% interest rate is not stated in the Scheme. The EDLI Scheme 2026 (G.S.R. 526(E), official labour.gov.in copy) para 7 says EDLI damages are recovered as under the EPF Scheme 2026 and rounded to the nearest rupee. Caveats: (a) only the Hindi text of para 23 could be extracted, so the 14-06-2024 retro wording needs a CA reading of the English gazette; (b) whether the slabs mean the same rate for the whole default (the slab's rate per month times total months) or tiered rates per month is not clear from the table – CA to decide (the table wording points to a single rate based on the total period); (c) VISHWAS 2026 not opened. Corrected 13-10-2026: the earlier flat 1% per month position is superseded by EPF Scheme 2026 para 23. Only the Hindi text of para 23 could be extracted – CA to confirm against the English gazette."
