schema_version: "1.0"
rule:
  id: "PAY-009"
  version: "1"
  type: "statutory"
  domain: "payroll"
  category: "EPF – Damages"
  name: "Damages for delayed PF remittance (s.14B / para 32A; EPF Scheme 2026; VISHWAS 2026)"
  purpose: "Estimate damages exposure for delayed EPF/EPS/EDLI contributions."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "1% per month: 15.06.2024. VISHWAS 2026: notified 09.07.2026, open till 28.12.2026."
  period_basis: ""
legal:
  provisions: "EPF&MP Act s.14B (SS Code equivalent); EPF Scheme 2026 (G.S.R. 525(E) dt 29-06-2026) para 23(1)-(2); earlier EPF Scheme 1952 para 32A (5%/10%/15%/25% p.a. slabs) for defaults before 14-06-2024."
  applicability: "All covered establishments with delayed payment."
  exemptions_exceptions: "Damages are discretionary under s.14B (mens rea case law – not covered). Enrolment Campaign 2026 damages Rs 100 for 01.07.2009/01.04.2009–31.03.2026."
  thresholds_rates: "Per month of default, by total default period: up to 2 months 0.25%; more than 2 and up to 4 months 0.50%; more than 4 months 1% (EPF Scheme 2026 para 23(1)); applies to defaults on or after 14-06-2024 (para 23(2)). Damages cannot exceed arrears."
  rounding: "EPF Scheme 2026 para 18(5) rounds contributions to nearest rupee; rounding of damages not specified – implementation choice (nearest rupee)."
  due_dates: "Payable on demand/order."
inputs:
  documents: []
  fields:
    - "wage_month"
    - "arrears_amount (by scheme)"
    - "due_date"
    - "payment_date"
    - "vishwas_opt_in"
  prerequisites: "PAY-008 delay computation."
  input_validations: "Delay > 0 -> show exposure; delay > 120 days -> High."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "damages = min(arrears, arrears × r × delay_days × 12/365); r = 0.0025 if total default ≤ 2 months, 0.005 if ≤ 4 months, else 0.01"
  steps:
    - "months_late = delay_days × 12/365."
    - "Choose r by total default period: ≤ 2 months 0.25%; > 2 to ≤ 4 months 0.50%; > 4 months 1% per month."
    - "damages = min(arrears, arrears × r × months_late)."
    - "For defaults before 14-06-2024 use old para 32A slabs (5/10/15/25% p.a.)."
    - "Damages are levied by EPFO order – show as exposure, not as a liability."
    - "VISHWAS 2026 one-time settlement (open till 28-12-2026) is a separate optional scheme."
parameters: []
outcomes:
  categories: []
  default_severity: "Medium"
  expected_output: "Damages exposure per wage month (interest + damages total)"
  recommended_action: "Medium (exposure); High if > 4 months."
  common_discrepancies: "Applying old 5-25% slabs for post-June-2024 defaults; treating damages as fixed rather than order-based."
tests:
  worked_example: "Arrears ₹1,00,000 delayed 25 days: months = 25 × 12/365 = 0.8219; r = 0.25% -> damages = 1,00,000 × 0.0025 × 0.8219 = ₹205.48 -> ₹205. Interest u/s 7Q at 12% p.a. = 1,00,000 × 12% × 25/365 = ₹821.92 (separate)."
  positive: "delay 0 -> 0"
  negative: "delay period straddling 15.06.2024 -> split computation flagged for CA"
implementation:
  handler: ""
  pseudocode: "dmg = arrears*0.01*days*12/365 if delay_start>=date(2024,6,15) else old_slab(arrears, days)"
