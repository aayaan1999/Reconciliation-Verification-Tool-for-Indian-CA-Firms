  version: "1"
  type: "statutory"
  domain: "payroll"
  category: "Labour Welfare Fund"
  name: "Labour Welfare Fund state master table check"
  purpose: "Verify LWF deductions/contributions per state periodicity."
governance:
  enabled: false
  verification_status: "unverified"
  verification_label: "Unverified – needs CA review"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
