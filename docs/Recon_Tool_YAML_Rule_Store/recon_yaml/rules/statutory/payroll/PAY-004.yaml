notes: "[VERIFICATION 13-10-2026] EPF Scheme 2026 confirms: employer 12%, employee equal (para 18(2)), 10% for notified establishments; contributions and admin charges remitted within 15 days after the end of the month (para 28(3)); admin charges payable on contributions (para 28(2)) at a percentage the Central Govt fixes (para 29(1)) – the Scheme does not state 0.50% / Rs 500; NEW: para 29(2) late-filing fee of Rs 500 per day, capped at that month's admin charges; rounding to nearest rupee (para 18(5)). EDLI Scheme 2026 (G.S.R. 526(E)): the contribution rate is to be notified separately (para 5) and EDLI admin charges are payable with contributions (para 6). Inspection charges for exempted establishments: S.O. 2701(E) dt 29-05-2026 – EPF 0.35% (min Rs 8,750), EDLI 0.005% (min Rs 1,250). EPFO ContributionRate.pdf could not be fetched, so the 0.50% / Rs 500 / Rs 75 admin figures are still secondary. CORRECTION: Add a validation for the para 29(2) late-filing fee (Rs 500/day, capped at that month's admin charges). Rounding: nearest rupee per para 18(5). Add exempted-establishment inspection charges per S.O. 2701(E) (EPF 0.35% min 8,750; EDLI 0.005% min 1,250). EPFO official ContributionRate.pdf appeared in search but could not be fetched (proxy 403). Admin charge 0.50% / min Rs 500 / Rs 75 confirmed by secondary sources and EPFO FAQ (Sep 2026) reproduction. KPMG notes EPF Scheme 2026 says admin charges payable on mandatory and voluntary contributions but rate not stated – confirm admin charge notification under SS Code. Whether employer must contribute on actual wages when employee opts voluntary: employer has no obligation to match (KPMG on EPF Scheme 2026)."
