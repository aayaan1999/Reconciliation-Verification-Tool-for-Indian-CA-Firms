schema_version: "1.0"
rule:
  id: "PAY-003"
  version: "1"
  type: "statutory"
  domain: "payroll"
  category: "EPF – Applicability"
  name: "EPF establishment coverage and employee membership test"
  purpose: "Confirm that a covered establishment has enrolled all eligible employees and that non-covered establishments are flagged when headcount reaches the threshold."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "Ceiling Rs 15,000: 01.09.2014 to 16.09.2026; Rs 25,000: from 17.09.2026."
  period_basis: ""
legal:
  provisions: "Pre-Code: EPF&MP Act 1952 s.1(3), s.2(f), EPF Scheme 1952 para 26/26A. Code: SS Code s.1(4) read with First Schedule (20 or more employees), s.1(5) voluntary, s.1(8) continues once covered; Chapter III; wage ceiling under s.2(89): S.O. 2702(E) dt 29.05.2026 (Rs 15,000) superseded by S.O. 5109(E) dt 17.09.2026 (Rs 25,000); EPF Scheme 2026 (G.S.R. 525(E))."
  applicability: "Establishments employing 20 or more persons (any day); voluntary coverage below 20. Employee mandatory member if statutory wages <= ceiling at joining; above ceiling – voluntary (excluded employee) unless already a member."
  exemptions_exceptions: "Exempted establishments (own PF trust) – contributions to trust, not EPFO; excluded employees above ceiling; Employees' Enrolment Campaign 2026 (until 31.10.2026) allows enrolment of employees who joined 01.04.2009-31.03.2026 with employee share waived and damages Rs 100."
  thresholds_rates: "Threshold 20 employees; ceiling Rs 15,000 -> Rs 25,000 (17.09.2026)."
  rounding: "Not applicable"
  due_dates: "Enrol from date of joining; ECR monthly by 15th (PAY-008)."
inputs:
  documents: []
  fields:
    - "establishment_id"
    - "headcount_by_day"
    - "pf_registration_date"
    - "employee_id"
    - "uan"
    - "date_of_joining"
    - "statutory_wages"
    - "prior_pf_member_flag"
    - "is_international_worker"
  prerequisites: "Monthly headcount (including contract labour through contractors), employee statutory wages (PAY-002), prior PF membership (UAN) flag."
  input_validations: "Employee with wages <= ceiling and no UAN/ECR line -> Critical. Employee in ECR in one month and missing next with no exit date -> High."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "mandatory = prior_member or stat_wages_at_join <= ceiling(date)"
  steps:
    - "If max headcount in any month >= 20 and no PF code -> flag Critical 'registration required'."
    - "Once covered, keep covered even if headcount < 20."
    - "For each employee: ceiling = 15000 if month_end < 17.09.2026 else 25000 (Sept-2026 split per PAY-005)."
    - "If prior_pf_member_flag -> mandatory member regardless of wages."
    - "Else if statutory_wages at joining <= ceiling -> mandatory member."
    - "Else excluded employee (voluntary)."
    - "From 17.09.2026 existing excluded employees with wages <= 25,000 must be enrolled (EPFO FAQ)."
    - "International workers: covered irrespective of wages (separate rule; out of scope – flag)."
    - "Count contract workers toward principal employer liability."
parameters: []
outcomes:
  categories: []
  default_severity: "Critical"
  expected_output: "List of eligible-but-not-enrolled employees; establishment coverage status"
  recommended_action: "Critical for unregistered/unenrolled; High for missing ECR lines."
  common_discrepancies: "Not enrolling Rs 15k-25k band after 17.09.2026; excluding contract workers; treating gross instead of statutory wages for eligibility."
tests:
  worked_example: "Employee joined 01.08.2026, wages 22,000, no prior PF: Aug-2026 ceiling 15,000 -> excluded; from 17.09.2026 ceiling 25,000 -> must be enrolled (mandatory)."
  positive: "headcount 21, no PF code -> Critical flag"
  negative: "headcount 18, PF code exists from 2019 -> no flag (s.1(8) continuity)"
implementation:
  handler: ""
  pseudocode: |-
    def ceiling(d):
        return 25000 if d >= date(2026,9,17) else 15000
    mandatory = emp.prior_member or emp.wages_at_join <= ceiling(emp.doj)
