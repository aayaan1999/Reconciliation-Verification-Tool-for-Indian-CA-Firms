notes: "[VERIFICATION 13-10-2026] S.O. 5109(E) and the 17-09-2026 effective date are confirmed by PIB and the MoLE Cabinet note (Rs 15,000 to Rs 25,000; first change since Sept 2014; about 51 lakh more workers covered). The 20-employee establishment threshold was not re-checked on an official page. S.O. 5109(E) and S.O. 2702(E) texts not opened on egazette; numbers from Argus/SGCMS. PIB release (16.09.2026 Cabinet approval) did not itself state effective date; 17.09.2026 from ELP/EPFO FAQ reproductions."
