  period_basis: ""
legal:
  provisions: "West Bengal State Tax on Professions, Trades, Callings and Employments Act, 1979; Finance Dept Notification No. 1407-F.T. dt 18.08.2026 (Part A Sl.1 w.e.f. 01.10.2026)."
  applicability: "Salaried employees in West Bengal."
  exemptions_exceptions: "Per Act."
