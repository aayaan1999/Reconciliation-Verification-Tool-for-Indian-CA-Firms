matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "slab by effective date"
  steps:
    - "Up to Sep-2026: <=8,500 nil; 8,501-10,000 90; 10,001-15,000 110; 15,001-25,000 130; 25,001-40,000 150; >40,000 200."
    - "From Oct-2026: <=20,000 nil; 20,001-30,000 100; 30,001-50,000 140; 50,001-1,00,000 170; >1,00,000 208."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "Monthly PT"
  recommended_action: "High"
  common_discrepancies: "Not switching on 01.10.2026."
tests:
  worked_example: "Salary 18,000: Sep-2026 Rs 130; Oct-2026 nil. FY 2026-27 total = 6 x 130 + 6 x 0 = 780."
  positive: "Salary 1,20,000 Oct-2026 -> 208"
  negative: "Salary 1,20,000 Oct-2026 deducted 200 -> flag 8 short"
implementation:
  handler: ""
  pseudocode: |-
    NEW=[(20000,0),(30000,100),(50000,140),(100000,170),(inf,208)]
    OLD=[(8500,0),(10000,90),(15000,110),(25000,130),(40000,150),(inf,200)]
    tab = NEW if d>=date(2026,10,1) else OLD
    pt = next(a for lim,a in tab if sal<=lim)
