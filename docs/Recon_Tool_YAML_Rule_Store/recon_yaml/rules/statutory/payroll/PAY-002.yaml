notes: "[VERIFICATION 13-10-2026] MoLE Additional FAQs (16-03-2026) confirm: the revised wage definition applies from 21-11-2025; amounts over 50% of remuneration are added back to wages; overtime allowance is counted in the 50% calculation; only employer PF/pension contributions and statutory bonus count among the exclusions for the 50% test, not gratuity, ESI or other retirement benefits; annual performance incentives are not wages; one wage definition applies across the Codes. The 15% in-kind proviso was not confirmed. CORRECTION: logic_steps step 2: exclusions to include in T for the 50% test – per MoLE FAQ Q1(b), employer PF/pension contribution and statutory bonus are included; gratuity, ESI and other retirement benefits are NOT included in the 50% computation. Section text of s.2(y)/s.2(88) not opened on indiacode/egazette. In-kind 15% proviso and the full exclusion list must be mapped by CA from bare Act. Applicability of add-back to PF wages: EPFO FAQ states coverage is on s.2(88) wages (secondary reproduction). Whether ESI contributions under Code s.29 are operational is disputed (LKS) – see PAY-013."
