notes: "[VERIFICATION 13-10-2026] MoLE FAQs: gratuity is 15 days' wages per completed year after 5 years' continuous service, on last drawn s.2(88) wages for exits on/after 21-11-2025. The maximum is as notified by the Central Govt, currently Rs 20 lakh. 5 years is not needed on death or disablement, or for fixed-term employees (1 year). Compliance Handbook: payment due within 30 days (s.56). CORRECTION: Add due date: gratuity payable within 30 days of becoming payable (SS Code s.56). Ceiling under Code: LKS says 'to be notified' (Rs 20 lakh under PG Act notification of 29.03.2018 – not opened). 4-yrs-240-days principle from case law (not opened). Interest rate on delayed gratuity not verified."
