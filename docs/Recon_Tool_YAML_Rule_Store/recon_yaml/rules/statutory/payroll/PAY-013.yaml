notes: "[VERIFICATION 13-10-2026] ESIC official page: employee 0.75% (from 01-07-2019), employer 3.25%, daily average wage up to Rs 176 exempt from employee share; contributions due within 15 days of the end of the month; contribution periods Apr-Sep and Oct-Mar. MoLE FAQ Q12: until ESI rules are finalised, the existing Rs 21,000 ceiling continues, with the s.2(88) wage definition applied from 21-11-2025. MoLE Compliance Handbook: coverage at 10 or more employees; hazardous establishments even with 1 employee (PIB also says ESIC is voluntary below 10). Rs 25,000 PwD ceiling not re-checked. Disputed: LKS says Code s.29 contribution provisions operate only from date Chapter IV benefits are notified; ESIC letter (04.06.2026) directs coverage on s.2(88) wages. ESI ceiling notification under s.2(89) not located (LKS: awaited). Treat ESI Act regulations as continuing under s.164(2)(b) – LKS says for one year from 21.11.2025 (i.e., to 20.11.2026) – open question."
