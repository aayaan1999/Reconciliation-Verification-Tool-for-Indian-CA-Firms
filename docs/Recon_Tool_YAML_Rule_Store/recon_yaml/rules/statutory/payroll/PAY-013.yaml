schema_version: "1.0"
rule:
  id: "PAY-013"
  version: "1"
  type: "statutory"
  domain: "payroll"
  category: "ESI – Applicability"
  name: "ESI coverage: establishment threshold and employee wage ceiling"
  purpose: "Identify employees who must be covered under ESI using Code wages and the Rs 21,000 ceiling."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "Ceiling Rs 21,000 from 01.01.2017; continues under Code."
  period_basis: ""
legal:
  provisions: "ESI Act 1948 s.2(9), s.2(12), ESI (Central) Rules r.50 (ceiling) / SS Code s.2(26), s.2(89), Chapter IV; S.O. 2351(E) dt 08.05.2026 (continuation proviso); ESIC letter P-11012/4/2026-INSPECTION dt 04.06.2026 (ceiling Rs 21,000; PwD Rs 25,000; s.2(88) wages since 21.11.2025); savings s.164(2)(b)."
  applicability: "Establishments with 10 or more employees in implemented areas (factories and notified establishments); employees with wages <= Rs 21,000 (Rs 25,000 for persons with disability)."
  exemptions_exceptions: "Overtime excluded for coverage determination (pre-Code ESIC practice – not verified under Code)."
  thresholds_rates: "10 employees; Rs 21,000 / Rs 25,000 (PwD)."
  rounding: "Not applicable"
  due_dates: "Registration within prescribed time of applicability (not verified)."
inputs:
  documents: []
  fields:
    - "establishment_id"
    - "headcount"
    - "implemented_area_flag"
    - "employee_id"
    - "ip_number"
    - "statutory_wages"
    - "disability_flag"
    - "contribution_period_start_wages"
  prerequisites: "PAY-002 wages; implemented-area flag; disability flag."
  input_validations: "Employee with Code wages <= 21,000 but gross > 21,000 and not covered -> High (post 21.11.2025)."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "covered = est_covered and wages <= (25000 if pwd else 21000)"
  steps:
    - "Establishment covered if headcount >= 10 and in implemented area (hazardous: 1+ under Code – not verified)."
    - "ceiling = 25000 if disability_flag else 21000."
    - "At start of contribution period (01 Apr / 01 Oct), employee covered if statutory_wages <= ceiling (use Code s.2(88) wages from 21.11.2025 per ESIC letter)."
    - "New joiner mid-period: covered if wages <= ceiling at joining."
    - "Continuation per PAY-015."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "Covered employee list; missing IP numbers"
  recommended_action: "High"
  common_discrepancies: "Using gross instead of Code wages; ignoring PwD Rs 25,000 limit."
tests:
  worked_example: "Gross 42,000; basic+DA 15,000; exclusions 27,000 -> add-back 27,000-21,000 = 6,000 -> wages 21,000 -> covered (ESIC letter example logic)."
  positive: "Wages 20,000 -> covered"
  negative: "Wages 21,001, no disability -> not covered at period start"
implementation:
  handler: ""
  pseudocode: |-
    ceil = 25000 if e.pwd else 21000
    covered = est.covered and e.stat_wages <= ceil
