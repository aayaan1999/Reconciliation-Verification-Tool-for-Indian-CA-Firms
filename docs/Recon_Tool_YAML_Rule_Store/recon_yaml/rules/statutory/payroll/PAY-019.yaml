implementation:
  handler: ""
  pseudocode: |-
    def pt_mh(sal, gender, m):
        if gender=='F':
            return 0 if sal<=25000 else (300 if m==2 else 200)
        if sal<=7500: return 0
        if sal<=10000: return 175
        return 300 if m==2 else 200
