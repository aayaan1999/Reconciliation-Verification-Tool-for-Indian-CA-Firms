notes: "[VERIFICATION 13-10-2026] PIB (21-11-2025) says gratuity eligibility for fixed-term employees is after one year instead of five; MoLE FAQs Q14/Q19 say fixed-term employees qualify after one year of service under the contract; the Handbook cites s.53. CORRECTION: legal_provision: cite SS Code s.53 (per MoLE Compliance Handbook); sub-section numbering still to be read from the bare Act. Sub-section reference differs across sources (s.53(1) proviso vs s.53(2))."
