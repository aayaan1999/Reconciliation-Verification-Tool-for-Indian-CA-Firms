schema_version: "1.0"
rule:
  id: "PAY-027"
  version: "1"
  type: "statutory"
  domain: "payroll"
  category: "Gratuity – Fixed-term employees"
  name: "Gratuity for fixed-term employees (1 year)"
  purpose: "Compute pro-rata gratuity for fixed-term employees under the Code."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "21.11.2025"
  period_basis: ""
legal:
  provisions: "SS Code s.53(1) proviso / s.53(2) (fixed term employment – 1 year); Social Security (Central) Rules 2026."
  applicability: "Fixed-term employees (as defined under IR Code s.2(o)) ceasing on/after 21.11.2025."
  exemptions_exceptions: "< 1 year – no gratuity."
  thresholds_rates: "1 year minimum; 15 days per year."
  rounding: "Implementation choice."
  due_dates: "30 days."
inputs:
  documents: []
  fields:
    - "employee_id"
    - "employment_type"
    - "contract_start"
    - "contract_end"
    - "last_drawn_wages"
  prerequisites: "Employment type flag, contract dates."
  input_validations: "FTE with >=1 yr and no gratuity in F&F -> High."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "G = W*15/26*years (years>=1)"
  steps:
    - "If service >= 1 year -> eligible pro-rata."
    - "years = completed years; residual > 6 months -> +1 (KPMG on final rules)."
    - "G = W x 15/26 x years."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "Gratuity payable"
  recommended_action: "High"
  common_discrepancies: "Applying 5-year rule to FTEs."
tests:
  worked_example: "FTE 1 year 8 months, wages 40,000: years = 2; G = 40,000 x 15/26 x 2 = 46,153.85 -> 46,154."
  positive: "1 year 0 months -> G = W x 15/26"
  negative: "11 months -> nil"
implementation:
  handler: ""
  pseudocode: |-
    yrs = svc.years + (1 if svc.months>6 else 0)
    G = round(W*15/26*yrs) if svc_total_years>=1 else 0
