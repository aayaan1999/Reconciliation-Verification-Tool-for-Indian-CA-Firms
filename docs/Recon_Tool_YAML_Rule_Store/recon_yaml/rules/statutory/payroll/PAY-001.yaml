notes: "[VERIFICATION 13-10-2026] Official: PIB (21-11-2025) – all four Labour Codes effective 21-11-2025; pending new rules, the existing Acts' rules and notifications continue (MoLE FAQ: under s.6 of the General Clauses Act, to the extent consistent). S.O. 5322(E) dt 21-11-2025 (Code on Wages, labour.gov.in PDF) brings ss.1-41, 42(4)-(9), 43-66, 67 (most), 68 and 69 into force from 21-11-2025. S.O. 5319(E) dt 21-11-2025 (SS Code) is confirmed via its corrigendum S.O. 5936(E) dt 19-12-2025, which excludes provisions already in force under S.O. 2060(E) dt 03-05-2023. NEW: Industrial Relations Code (Amendment) Act 2026 (No. 1 of 2026, gazette 16-02-2026), deemed in force from 21-11-2025; repeal of TU Act, IESO Act and ID Act from a notified date; s.104(1A) continuity of tribunals. EDLI Scheme 2026 = G.S.R. 526(E) dt 29-06-2026, in force on publication; EPF Scheme 2026 = G.S.R. 525(E) dt 29-06-2026 (gazette No. 473). Not confirmed officially: the Central Rules date (08-05-2026) and the S.O. numbers 5320/5321(E). CORRECTION: Add: IR Code (Amendment) Act 2026 (No.1 of 2026) deemed from 21-11-2025; corrigendum S.O. 5936(E) dt 19-12-2025 to S.O. 5319(E). Scheme publication date: 29-06-2026 for both G.S.R. 525(E) and 526(E) (gazette dated 29-06-2026) – resolves the 29.06 vs 30.06/01.07 conflict in favour of 29-06-2026 for the notification date (commencement = date of publication). Gazette PDFs on egazette.gov.in were not opened (fetch of epfindia/egazette blocked); S.O./G.S.R. numbers taken from EY, KPMG, Taxmann, TaxHeal reproductions. Conflict: Central Rules effective date (08.05.2026 per KPMG/Taxmann/ESIC letter vs 31.12.2025 per iPleaders FAQ) – adopt 08.05.2026. Scheme publication dates conflict (29.06 vs 30.06/01.07.2026). State rules status as of Oct 2026 not verified (iPleaders May 2026: MH, GJ, KA, MP, Delhi all four; AP, TS, UP, TN partial; WB pending)."
