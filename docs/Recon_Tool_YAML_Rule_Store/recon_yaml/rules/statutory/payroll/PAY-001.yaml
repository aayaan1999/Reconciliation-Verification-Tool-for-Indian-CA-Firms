schema_version: "1.0"
rule:
  id: "PAY-001"
  version: "1"
  type: "statutory"
  domain: "payroll"
  category: "Labour Codes – Status"
  name: "Labour Codes commencement & legal-regime selector"
  purpose: "Select the correct legal regime (pre-Code Acts vs four Labour Codes and their rules/schemes) for each payroll period so every downstream check applies the right definitions, rates and section references."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "Codes: 21.11.2025. Central Rules: 08.05.2026 (per KPMG/Taxmann; iPleaders FAQ suggests 31.12.2025 for some – conflicting). EPF/EPS/EDLI Schemes 2026: 29.06.2026 (CAM says EPS/EDLI 30.06.2026, EPF 01.07.2026 – publication-date conflict)."
  period_basis: ""
legal:
  provisions: "Code on Wages, 2019 (S.O. 5322(E)); Industrial Relations Code, 2020 (S.O. 5320(E)); Code on Social Security, 2020 (S.O. 5319(E)); OSH Code, 2020 (S.O. 5321(E)) – all dated 21.11.2025. Earlier part-commencement of SS Code EPS provisions by S.O. 2060(E) dt 03.05.2023 (clarified by corrigendum dt 19.12.2025). Final Central Rules notified 08.05.2026: Wages (Central) Rules, 2026 G.S.R. 343(E); Social Security (Central) Rules, 2026 G.S.R. 344(E); OSH and IR (Central) Rules, 2026 (G.S.R. numbers not verified). EPF Scheme 2026 G.S.R. 525(E), EDLI Scheme 2026 G.S.R. 526(E), EPS 2026 G.S.R. 527(E) (29.06.2026). Savings: SS Code s.164."
  applicability: "All employers/establishments processed by the tool; every payroll month."
  exemptions_exceptions: "Code on Wages s.42(1)-(3) and s.67(2)(s),(t) not notified on 21.11.2025; SS Code s.142 (Aadhaar) not in S.O. 5319(E) list per secondary source. State-sphere operability depends on State rules (several States pending as of May 2026)."
  thresholds_rates: "N/A (selector)"
  rounding: "Not applicable"
  due_dates: "N/A"
inputs:
  documents: []
  fields:
    - "payroll_month"
    - "establishment_state"
    - "appropriate_government"
    - "establishment_type"
  prerequisites: "Payroll period (month/year), state of establishment, appropriate government (Central/State) for the establishment."
  input_validations: "Period dated before 21.11.2025 but computed with Code wages -> flag; period after 21.11.2025 using old 'basic only' PF wage without 50% test -> flag High."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "regime = CODE if date >= 2025-11-21 else PRE_CODE"
  steps:
    - "If payroll_month end < 21.11.2025 -> regime = 'PRE_CODE' (EPF&MP Act 1952, ESI Act 1948, Payment of Wages/Minimum Wages/Bonus/Gratuity Acts)."
    - "If period spans 21.11.2025 -> split: days 1-20 PRE_CODE, 21-30 CODE (flag Medium: CA to decide whether to apply split or full-month for definition of wages)."
    - "For CODE regime: wages definition = Code (PAY-002); EPF scheme = EPF Scheme 1952 until 28.06.2026, EPF Scheme 2026 from 29.06.2026 (verify gazette date); EPF wage ceiling = Rs 15,000 to 16.09.2026, Rs 25,000 from 17.09.2026 (PAY-005)."
    - "State-sphere items (minimum wages, PT, LWF, state rules under Codes): look up state master table field 'code_rules_notified' – if not notified, continue old state rules/notifications under savings and flag Low."
    - "Store regime tag on every computed row for audit."
parameters: []
outcomes:
  categories: []
  default_severity: ""
  expected_output: "regime tag per employee-month; list of applicable sub-rules (scheme names, ceilings) with effective date"
  recommended_action: "Info/Medium: show regime banner; High if Code-period payroll computed without Code wage definition."
  common_discrepancies: "Payroll vendors still on 'basic = PF wage' after Nov 2025; State rules assumed in force when not notified; citing old section numbers (s.7Q/14B) for Code-period demands."
tests:
  worked_example: "Payroll Nov-2025: 30 days; days 1-20 pre-Code, 21-30 Code. Tool tags 'MIXED' and applies Code wages definition from 21.11.2025 if CA config 'split_nov_2025'=True, else full-month Code."
  positive: "payroll_month=2026-04 -> regime CODE, EPF scheme 1952 (as saved), ceiling 15000"
  negative: "payroll_month=2025-10 -> regime PRE_CODE; any reference to Code wages definition flagged as error"
implementation:
  handler: ""
  pseudocode: |-
    def regime(d):
        if d < date(2025,11,21): return 'PRE_CODE'
        return 'CODE'
    scheme = 'EPF_1952' if d < date(2026,6,29) else 'EPF_2026'
