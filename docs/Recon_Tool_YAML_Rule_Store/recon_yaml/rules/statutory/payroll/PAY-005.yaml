schema_version: "1.0"
rule:
  id: "PAY-005"
  version: "1"
  type: "statutory"
  domain: "payroll"
  category: "EPF – Contribution computation"
  name: "EPF computation with Rs 25,000 ceiling (from 17.09.2026) incl. September 2026 split"
  purpose: "Apply the revised wage ceiling and the EPFO-prescribed day-wise apportionment for September 2026."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "17.09.2026"
  period_basis: ""
legal:
  provisions: "SS Code s.2(89); S.O. 5109(E) dt 17.09.2026 (supersedes S.O. 2702(E) dt 29.05.2026); EPF Scheme 2026 para 18(4); EPFO FAQs on wage ceiling (Sep 2026)."
  applicability: "All covered establishments; wage months from September 2026."
  exemptions_exceptions: "Govt EPS subsidy for PMRPY-like schemes not changed; govt 1.16% EPS share remains on Rs 15,000 (EPFO FAQ Q37 per SGCMS). EDLI maximum assurance stays Rs 7 lakh."
  thresholds_rates: "Ceiling Rs 25,000; EE 12% = 3,000; EPS 8.33% = 2,082.50 -> 2,083; ER EPF 917; EDLI 125; admin 125 at ceiling."
  rounding: "EPF Scheme 2026 para 18(5): each contribution rounded to the nearest rupee (50 paise or more = next higher rupee; less than 50 paise ignored). Show split-month (Sep-2026) amounts rounded per head for ECR, e.g. 1,638.23 -> 1,638; 721.77 -> 722."
  due_dates: "Sep-2026 ECR: 15.10.2026 per EPFO FAQ. A news headline of 13.10.2026 suggested extension to 31.10.2026 – UNVERIFIED."
inputs:
  documents: []
  fields:
    - "employee_id"
    - "pf_wages_month"
    - "days_in_month (30 for Sep)"
    - "member_status_before (FULL/EPF_ONLY/EXCLUDED)"
    - "contribute_on_actual_flag"
  prerequisites: "PAY-002 wages, member status, days in month, EPS enrolment status change on 17.09.2026."
  input_validations: "Oct-2026+ EPS > 2083 -> High; Rs 15k-25k band without EPS from 17.09.2026 -> High; Sep-2026 base equals full-month 25,000 cap -> Medium (method differs from EPFO FAQ; Argus prefers full 25,000 – CA choice)."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "Sep-2026 base = min(W*16/30, 8000)*[member_pre] + min(W*14/30, 11666.67)"
  steps:
    - "For months >= Oct-2026: ceiling 25,000; compute as PAY-004 with ceil=25000 (EPS max 2,083; EDLI max 125)."
    - "For Sep-2026: W1 = W*16/30, C1 = 15000*16/30 = 8,000; W2 = W*14/30, C2 = 25000*14/30 = 11,666.67."
    - "Base1 = min(W1, C1) if member before 17.09 else 0 (excluded employee had no liability for 1-16)."
    - "Base2 = min(W2, C2)."
    - "EPS base: period1 only if EPS member before; period2 if EPS-eligible from 17.09.2026 (EPF-only members with wages <= 25,000 are enrolled in EPS from 17.09.2026)."
    - "Contributions = rates x (Base1 + Base2)."
    - "Single ECR for September due 15.10.2026; employee share may be recovered in October payroll without approval but must be remitted on time."
    - "Members already contributing above 25,000 need not reduce."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "Revised contribution per employee; Sep-2026 split working; list of employees newly enrolled in EPF/EPS"
  recommended_action: "High for ceiling misapplication; Medium for Sep-2026 method deviations."
  common_discrepancies: "Applying Rs 25,000 for whole September without documented CA decision; not enrolling EPF-only members into EPS; failing to recover arrears consistently."
tests:
  worked_example: "(a) Basic+DA 25,000, Oct-2026, full member: EE 3,000; EPS 2,083; ER EPF 917; EDLI 125; admin 125. (b) Same employee Sep-2026, existing full member: Base1 = min(13,333.33, 8,000) = 8,000; Base2 = min(11,666.67, 11,666.67) = 11,666.67; base = 19,666.67; EE = 2,360.00; EPS = 1,638.23; ER EPF = 721.77; EDLI 98.33; admin 98.33. (c) EPFO FAQ check: Rs 20,000 existing full member -> base 8,000 + 9,333.33 = 17,333.33; total incl. EDLI+admin @25% = 4,333.33 (FAQ 4,333.34); EPS = 1,443.87 (matches EPFO example). Newly covered at Rs 20,000 from 17.09: base 9,333.33 -> total 2,333.33; EPS 777.47."
  positive: "W=20000 Sep-2026 existing EPF_ONLY member newly in EPS -> EPS = 8.33% x 9,333.33 = 777.47"
  negative: "W=30000 Oct-2026 new joiner (not prior member) -> not mandatory; if ECR shows EPS -> flag"
implementation:
  handler: ""
  pseudocode: |-
    if month == (2026,9):
        b1 = min(W*16/30, 8000) if member_pre else 0
        b2 = min(W*14/30, 25000*14/30)
        base = b1 + b2
    else:
        base = min(W, ceiling(month_end))
