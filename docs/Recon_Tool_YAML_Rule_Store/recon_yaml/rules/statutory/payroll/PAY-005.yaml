notes: "[VERIFICATION 13-10-2026] PIB (EPFO release, 23-09-2026) confirms Gazette S.O. 5109(E): the ceiling rises from Rs 15,000 to Rs 25,000 per month w.e.f. 17-09-2026, and the maximum employer EPS share at 8.33% rises from Rs 1,250 to Rs 2,083. MoLE's Cabinet note (labour.gov.in) confirms the 17-09-2026 date and the 16-09-2026 Cabinet approval. EPF Scheme 2026 (G.S.R. 525(E), 29-06-2026) para 18(3) caps contributions at the notified ceiling; para 9(4) allows a joint option to contribute above it; para 19 allows voluntary higher contributions with no employer matching duty but with admin charges payable. Para 18(5) requires each contribution to be rounded to the nearest rupee (50 paise and above up). NOT confirmed on an official page: the September-2026 16/14-day split method and the ECR due date. The EPFO FAQ PDF is not reachable (epfindia fetch blocked). The rumoured extension to 31-10-2026 is still unverified. CORRECTION: rounding: replace 'implementation choice' with 'EPF Scheme 2026 para 18(5): each contribution rounded to nearest rupee, 50 paise or more counted as next higher rupee, less than 50 paise ignored'. Sep-2026 sample figures (e.g., 1,638.23, 777.47) should be shown rounded per head to rupees (e.g., 1,638 / 777) for ECR. EPFO FAQ itself (epfindia.gov.in) not opened; reproduced via SGCMS and KPMG. Argus (law firm) prefers full-month Rs 25,000 for September; EPFO FAQ uses split – default to EPFO method. Possible ECR due date extension to 31.10.2026 unverified."
