  valid_from: ""
  valid_to: ""
  effective_text: ""
  period_basis: ""
legal:
  provisions: "IT Act 1961 s.271H; IT Act 2025 s.461."
  applicability: "Non-filing or incorrect statements."
  exemptions_exceptions: "Reasonable cause."
  thresholds_rates: "₹10,000 – ₹1,00,000."
  rounding: "Not specified in law – implementation choice. Recommended: compute TDS to paise and round to nearest rupee (≥0.50 up) per deductee line; s.288B (1961) rounds 'amount payable' to nearest ₹10 but CBDT/TRACES practice does not apply ₹10 rounding to individual TDS lines – see TDS-046."
  due_dates: ""
inputs:
  documents: []
  fields:
    - "due_date"
    - "filing_date"
    - "tax_paid_flag"
    - "fee_interest_paid_flag"
  prerequisites: ""
  input_validations: ""
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "exposure = (10000, 100000) if late > grace or incorrect"
  steps:
    - "If filed after due date: penalty protection if tax + fee + interest paid and statement filed within one month of due date (s.461(2); 271H(3) as amended – one month per secondary source from 1-4-2025; official 1961 page still shows one year)."
    - "Else exposure ₹10,000–₹1,00,000."
    - "Incorrect information also attracts."
parameters: []
outcomes:
  categories: []
  default_severity: "Medium"
  expected_output: "Penalty risk flag."
  recommended_action: "Medium (advisory)"
  common_discrepancies: ""
tests:
  worked_example: "Q2 26Q due 31-10-2025 filed 20-11-2025 with fee/interest paid -> within one month -> no penalty."
  positive: "filed 10 days late, all paid -> no penalty"
  negative: "filed 45 days late -> penalty exposure"
implementation:
  handler: ""
  pseudocode: "risk = not(all_paid and filed <= add_months(due,1))"
