  valid_from: ""
  valid_to: ""
  effective_text: "1 April 2025"
  period_basis: ""
legal:
  provisions: "IT Act 1961 s.194BB; IT Act 2025 s.393(3) Table Sl.3."
  applicability: "Bookmaker or person holding licence for horse racing/wagering."
  exemptions_exceptions: ""
  thresholds_rates: "₹10,000 per single transaction; 30%."
  rounding: "Not specified in law – implementation choice. Recommended: compute TDS to paise and round to nearest rupee (≥0.50 up) per deductee line; s.288B (1961) rounds 'amount payable' to nearest ₹10 but CBDT/TRACES practice does not apply ₹10 rounding to individual TDS lines – see TDS-046."
  due_dates: "Deposit: 7th of following month (March: 30 April) – Rule 30 (1962) / Rule 218(2) (2026). Statement: 26Q/Form 140 – 31 Jul, 31 Oct, 31 Jan, 31 May. Certificate: 16A/Form 131 within 15 days of statement due date."
inputs:
  documents: []
  fields:
    - "payee_pan"
    - "winning_amount"
    - "txn_date"
  prerequisites: ""
  input_validations: "As TDS-008."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "TDS = 30% × winning"
  steps:
    - "1. Per single transaction > ₹10,000 -> TDS at rates in force (30%)."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "Per-transaction expected TDS."
  recommended_action: "High"
  common_discrepancies: ""
tests:
  worked_example: "Winning ₹20,000 -> 6,000."
  positive: "20,000 -> 6,000"
  negative: "10,000 -> 0"
implementation:
  handler: ""
  pseudocode: "tds = round(0.30*w) if w > 10000 else 0"
