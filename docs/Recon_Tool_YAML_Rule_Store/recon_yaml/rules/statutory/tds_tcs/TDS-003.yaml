    ref: ""
    official: false
notes: "Average-rate method and s.392 structure verified (official). Slab rates/rebate for FY 2025-26 taken from known Finance Act 2025 position but not re-opened in this research – CA to confirm, and confirm Tax Year 2026-27 slabs (Finance Act 2026). Replacement form for 12BA (perquisite statement) not verified."
