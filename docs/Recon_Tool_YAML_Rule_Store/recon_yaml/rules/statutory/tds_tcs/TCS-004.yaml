notes: "[VERIFICATION 13-10-2026] ITD s.394(1): LRS above Rs 10 lakh – education or medical 2% (substituted by Act 4 of 2026 w.e.f. 01-04-2026; earlier 5%); other purposes 20%. The 2025 rates (5%/20%, Rs 10 lakh threshold) are consistent with the FY 2025-26 position. The official summary still does not settle whether TCS applies to the excess over Rs 10 lakh or to the whole amount, so the excess-only base remains a CA point. 'Excess over ₹10 lakh' base is the 1961 proviso position; s.394 official summary does not say whether rate applies to excess only – CA review."
