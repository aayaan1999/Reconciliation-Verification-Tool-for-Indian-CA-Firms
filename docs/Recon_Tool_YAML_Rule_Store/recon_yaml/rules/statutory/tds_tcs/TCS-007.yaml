schema_version: "1.0"
rule:
  id: "TCS-007"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TCS – PAN"
  name: "Higher TCS where PAN not furnished (s.206CC / s.397(2)(c))"
  purpose: "Recompute TCS at higher rate for missing PAN."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
