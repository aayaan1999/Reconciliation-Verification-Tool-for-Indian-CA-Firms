  valid_from: ""
  valid_to: ""
  effective_text: ""
  period_basis: ""
legal:
  provisions: "IT Act 1961 s.206CC; IT Act 2025 s.397(2) (TCS: higher of twice rate or 5%, not exceeding 20%)."
  applicability: "Collectees without valid PAN, except NR without PE in India."
  exemptions_exceptions: "NR without PE."
  thresholds_rates: "Twice rate / 5%; cap 20% (2025 Act)."
  rounding: "Not specified in law – implementation choice. Recommended: compute TDS to paise and round to nearest rupee (≥0.50 up) per deductee line; s.288B (1961) rounds 'amount payable' to nearest ₹10 but CBDT/TRACES practice does not apply ₹10 rounding to individual TDS lines – see TDS-046."
  due_dates: ""
inputs:
  documents: []
  fields:
