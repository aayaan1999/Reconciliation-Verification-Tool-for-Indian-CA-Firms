  input_validations: ""
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "rate = min(0.20, max(2*r, 0.05))"
  steps:
    - "rate = min(20%, max(2×normal_rate, 5%))."
    - "Exempt: NR without PE."
