  formula: ""
  steps:
    - "Receipts on/after 1-4-2025 -> no 206C(1H) TCS; flag any collected as excess."
    - "Receipts up to 31-3-2025 -> old rule (0.1% on receipts > ₹50 lakh, 1% no PAN)."
