notes: "[VERIFICATION 13-10-2026] Budget 2025 Memorandum (official): s.206C(1H) (0.1% TCS on sale of goods above Rs 50 lakh) to stop applying from 01-04-2025 because it overlaps with s.194Q. The s.394 table has no sale-of-goods entry. Omission from RSM/India Briefing; s.394 table (official) contains no sale-of-goods entry – consistent."
