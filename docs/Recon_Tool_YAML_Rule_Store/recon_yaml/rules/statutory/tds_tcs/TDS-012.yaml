notes: "[VERIFICATION 13-10-2026] Conflict resolved in favour of 2%. The official Budget July-2024 Memorandum (Finance (No.2) Bill 2024) lists s.194D (insurance commission to a person other than a company) as reduced from 5% to 2% w.e.f. 1-4-2025. The Budget 2025 Memorandum separately raises the s.194D threshold from Rs 15,000 to Rs 20,000 w.e.f. 1-4-2025. The incometaxindia 'TDS rates' chart (labelled AY 2026-27, 'as amended by Finance Act 2026') still shows 5% for non-company and 10% for company – this row is stale and should not be relied on. Under the 2025 Act, s.393(1) Sl.1(i) says only 'Rates in force' with threshold Rs 20,000; the Finance Act 2026 says s.393 rates are those in Part II of its First Schedule, which I could not read in the extracted text, and the Finance Bill 2026 Memorandum excerpt read shows no proposal to change the s.194D rate. So 2% (non-company) / 10% (company) continues for Tax Year 2026-27 – CA to glance at FA 2026 First Schedule Part II to close the last gap."
