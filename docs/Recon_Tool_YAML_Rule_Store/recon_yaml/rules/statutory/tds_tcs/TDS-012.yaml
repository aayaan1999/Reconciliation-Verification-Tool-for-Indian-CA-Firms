validity:
  valid_from: ""
  valid_to: ""
  effective_text: "1 April 2025"
  period_basis: ""
legal:
  provisions: "IT Act 1961 s.194D (threshold ₹20,000 from 1-4-2025); IT Act 2025 s.393(1) Table Sl.1(i) – rate 'rates in force'."
  applicability: "Any person paying insurance commission to resident."
  exemptions_exceptions: "Form 121/15G/15H allowed (s.393(6))."
  thresholds_rates: "₹20,000 aggregate in FY; person other than company 2% (w.e.f. 1-4-2025, Finance (No.2) Act 2024; 5% applies only to payments/credits up to 31-3-2025); domestic company 10%; no PAN 20%."
  rounding: "Not specified in law – implementation choice. Recommended: compute TDS to paise and round to nearest rupee (≥0.50 up) per deductee line; s.288B (1961) rounds 'amount payable' to nearest ₹10 but CBDT/TRACES practice does not apply ₹10 rounding to individual TDS lines – see TDS-046."
  due_dates: "Deposit: 7th of following month (March: 30 April) – Rule 30 (1962) / Rule 218(2) (2026). Statement: 26Q/Form 140 – 31 Jul, 31 Oct, 31 Jan, 31 May. Certificate: 16A/Form 131 within 15 days of statement due date."
inputs:
  documents: []
  fields:
    - "agent_pan"
    - "agent_type"
    - "commission_amount_fy"
  prerequisites: "Agent PAN and status."
  input_validations: "Non-company payee, credit/payment on or after 1-4-2025, rate ≠ 2% -> RATE_MISMATCH (High). Aggregate > ₹20,000 and TDS = 0 -> NOT_DEDUCTED (High)."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "TDS = rate × commission"
  steps:
    - "If aggregate commission in FY ≤ ₹20,000 -> nil."
    - "Rate by payment/credit date: on or after 1-4-2025 – person other than company 2%, domestic company 10%; up to 31-3-2025 – non-company 5%."
    - "No PAN -> 20%."
parameters: []
outcomes:
  categories: []
  default_severity: "Medium"
  expected_output: "Expected TDS."
  recommended_action: "Medium – rate under CA review"
  common_discrepancies: "Old 5% rate retained by insurers."
tests:
  worked_example: "Agent (individual) commission ₹1,00,000 credited 15-6-2025: TDS = 1,00,000 × 2% = ₹2,000."
  positive: "1,00,000 individual -> 2,000 (configured 2%)"
  negative: "18,000 -> 0"
implementation:
  handler: ""
  pseudocode: "rate = CFG['194D_noncompany']  # 0.02 default"
