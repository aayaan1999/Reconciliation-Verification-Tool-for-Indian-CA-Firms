  id: "TDS-012"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TDS – Commission"
  name: "Insurance commission (s.194D / s.393(1) Sl.1(i))"
  purpose: "Verify TDS on insurance commission."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
