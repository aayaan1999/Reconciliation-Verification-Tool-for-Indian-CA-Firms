schema_version: "1.0"
rule:
  id: "TDS-037"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TDS – Interest"
  name: "Interest for late deduction / late payment (s.201(1A) / s.398(3); TCS s.206C(7))"
  purpose: "Compute statutory interest exactly as TRACES would."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: ""
  period_basis: ""
legal:
  provisions: "IT Act 1961 s.201(1A)(i) 1%, (ii) 1.5% per month or part; s.206C(7) TCS; IT Act 2025 s.398(3)(a)(i)/(ii) (covers TDS and TCS)."
  applicability: "All deductors/collectors."
  exemptions_exceptions: "If paid on or before due date -> nil interest even though deduction date earlier."
  thresholds_rates: "1% / 1.5% per month or part."
  rounding: "Interest computed in rupees; TRACES demand rounding behaviour not verified (s.288B/new-Act equivalent rounds 'amount payable' to ₹10 – applicability to TRACES interest not verified)."
  due_dates: "Pay with/before statement."
inputs:
  documents: []
  fields:
    - "tax_amount"
    - "date_deductible"
    - "date_deducted"
    - "date_paid"
  prerequisites: "Dates: deductible (credit/payment), actual deduction, actual payment."
  input_validations: "paid > due -> compute interest; deducted > deductible -> compute 1% interest."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "months_cal(d1,d2) = (d2.year-d1.year)*12 + d2.month-d1.month + 1; interest = tax × rate × months"
  steps:
    - "Late deduction: interest 1% per month or part from date deductible to date deducted."
    - "Late payment: 1.5% per month or part from date deducted to date paid (NOT from due date)."
    - "Month counting: TRACES practice – calendar months, part of month = full month (TDSMAN); alternative statutory reading – periods of a month from start date. Make configurable; default calendar-month."
    - "Interest must be paid before filing statement."
    - "If payee filed return and paid tax (accountant certificate), 1% interest runs to date of payee's return."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "interest_late_deduction, interest_late_payment, months used."
  recommended_action: "High"
  common_discrepancies: "Counting from due date instead of deduction date; counting days/30."
tests:
  worked_example: "TDS ₹10,000. Deductible 15-05-2025 (credit), deducted 20-06-2025, paid 10-08-2025 (due 07-07-2025). Late deduction: calendar months May, June = 2 -> 10,000×1%×2 = ₹200. Late payment: June, July, Aug = 3 -> 10,000×1.5%×3 = ₹450. Total ₹650. Alternative period method: 20-06 to 10-08 = 1 month 21 days = 2 months -> ₹300 (difference flagged). TDSMAN example: deducted 26 June, paid 9 July -> 2 months -> 3%."
  positive: "ded 2025-06-26 paid 2025-07-09 tax 10,000 -> 300"
  negative: "ded 2025-06-26 paid 2025-07-07 -> 0 (on time)"
implementation:
  handler: ""
  pseudocode: |-
    def months(a,b): return (b.year-a.year)*12 + b.month - a.month + 1
    int_pay = tax*0.015*months(ded, paid) if paid > due else 0
