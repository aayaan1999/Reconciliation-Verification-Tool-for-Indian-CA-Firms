notes: "[VERIFICATION 13-10-2026] The TCS limb conflict is resolved: the official Budget July-2024 Memorandum confirms s.206C(7) collected-but-not-paid interest is 1.5% per month or part w.e.f. 01-04-2025. TDS limb (1%/1.5%) and s.398 were already official. CORRECTION: Replace the s.206C(7) conflict note with: '1.5% p.m. for collected-not-paid from 01-04-2025 (Finance (No.2) Act 2024).' Rates and 'month or part of a month' verified (official). Calendar-month counting is practice per secondary source (a commenter noted TRACES showing one month less in a case) – CA review. s.206C(7) TCS late-payment rate: official 1961 page shows 1%; secondary sources say raised to 1.5% from 1-4-2025 – conflict; s.398 (TY 2026-27) clearly 1%/1.5% for both. TCS s.206C(7): 1.5% per month for collected-not-paid from 01-04-2025 (Finance (No.2) Act 2024)."
