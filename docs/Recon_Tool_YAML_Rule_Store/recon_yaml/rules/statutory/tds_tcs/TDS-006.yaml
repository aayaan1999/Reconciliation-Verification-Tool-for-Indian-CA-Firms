schema_version: "1.0"
rule:
  id: "TDS-006"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TDS – Dividend"
  name: "Dividend (s.194 / s.393(1) Sl.7)"
  purpose: "Verify TDS on dividends by domestic company."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "1 April 2025 / 1 April 2026"
  period_basis: ""
legal:
  provisions: "IT Act 1961 s.194 (threshold ₹10,000 for individual, cash-other-than mode, from 1-4-2025); IT Act 2025 s.393(1) Table Sl.7 read with s.393(4) Sl.10."
  applicability: "Domestic company declaring dividend to resident shareholders."
  exemptions_exceptions: "s.393(4) Sl.10; Form 121/15G/15H."
  thresholds_rates: "₹10,000 (individual, non-cash); 10%."
  rounding: "Not specified in law – implementation choice. Recommended: compute TDS to paise and round to nearest rupee (≥0.50 up) per deductee line; s.288B (1961) rounds 'amount payable' to nearest ₹10 but CBDT/TRACES practice does not apply ₹10 rounding to individual TDS lines – see TDS-046."
  due_dates: "Deposit: 7th of following month (March: 30 April) – Rule 30 (1962) / Rule 218(2) (2026). Statement: 26Q/Form 140 – 31 Jul, 31 Oct, 31 Jan, 31 May. Certificate: 16A/Form 131 within 15 days of statement due date."
inputs:
  documents: []
  fields:
    - "shareholder_pan"
    - "shareholder_type"
    - "dividend_amount_fy"
    - "payment_mode"
    - "declaration_flag"
  prerequisites: "Shareholder register with PAN, category."
  input_validations: "Dividend > 10,000 to individual with TDS 0 -> flag."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "TDS = 10% × dividend"
  steps:
    - "If payee is LIC/GIC/insurer/notified -> no TDS."
    - "If individual and dividend paid other than in cash and aggregate in FY ≤ ₹10,000 -> no TDS."
    - "Else TDS 10% before distribution/payment."
    - "No PAN -> 20%."
parameters: []
outcomes:
  categories: []
  default_severity: "Medium"
  expected_output: "Expected TDS per shareholder."
  recommended_action: "Medium"
  common_discrepancies: "Old ₹5,000 threshold applied."
tests:
  worked_example: "Dividend ₹25,000 to resident individual: TDS = 25,000 × 10% = ₹2,500."
  positive: "25,000 -> 2,500"
  negative: "10,000 (aggregate, non-cash) -> 0"
implementation:
  handler: ""
  pseudocode: "tds = 0 if (indiv and noncash and agg <= 10000) else round(0.10*amt)"
