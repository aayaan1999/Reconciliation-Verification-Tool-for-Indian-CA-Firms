schema_version: "1.0"
rule:
  id: "TCS-001"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TCS – Goods"
  name: "TCS on specified goods: liquor, tendu, timber/forest produce, scrap, minerals (s.206C(1) / s.394(1) Sl.1-5)"
  purpose: "Verify TCS on sale of specified goods at correct rate for the period."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "1 April 2025 / 1 April 2026"
  period_basis: ""
legal:
  provisions: "IT Act 1961 s.206C(1) (timber/forest produce reduced 2.5%->2% by Finance Act 2025 per secondary sources); IT Act 2025 s.394(1) Table Sl.1-5 (rates amended by Finance Act 2026, Act No. 4 of 2026, w.e.f. 1-4-2026)."
  applicability: "Sellers (as defined) selling to buyers (other than for manufacturing etc. with declaration)."
  exemptions_exceptions: "Resident buyer declaration (Form 27C; new-Act form not verified) for manufacturing/processing/power generation."
  thresholds_rates: "As listed; no threshold."
  rounding: "Not specified in law – implementation choice. Recommended: compute TDS to paise and round to nearest rupee (≥0.50 up) per deductee line; s.288B (1961) rounds 'amount payable' to nearest ₹10 but CBDT/TRACES practice does not apply ₹10 rounding to individual TDS lines – see TDS-046."
  due_dates: "Deposit: 7th of next month (March: 30 April) – Rule 37CA (1962) / Rule 218 (2026). Statement: 27EQ – 15 Jul/15 Oct/15 Jan/15 May (FY 2025-26); Form 143 – 31 Jul/31 Oct/31 Jan/31 May (TY 2026-27). Certificate 27D / Form 133."
inputs:
  documents: []
  fields:
    - "buyer_pan"
    - "goods_category"
    - "sale_amount"
    - "debit_date"
    - "receipt_date"
    - "declaration_flag"
  prerequisites: "Item classification, buyer declaration."
  input_validations: "Old 1% rate on scrap after 1-4-2026 -> SHORT COLLECTION."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "TCS = rate(period, item) × amount"
  steps:
    - "Trigger: earlier of debit to buyer and receipt."
    - "Rate by period: FY 2025-26 – liquor 1%, tendu 5%, timber/forest produce 2%, scrap 1%, coal/lignite/iron ore 1%. TY 2026-27 – liquor 2%, tendu 2%, timber/forest 2%, scrap 2%, coal/lignite/iron ore 2%."
    - "No threshold."
    - "Declaration for manufacturing use (Sl.1-5) -> nil; copy to authority by 7th of next month."
    - "No PAN -> higher of twice rate or 5% (cap 20% under 2025 Act)."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: ""
  recommended_action: "High"
  common_discrepancies: "Rate tables not updated for 1-4-2026."
tests:
  worked_example: "Scrap sale ₹5,00,000 on 10-03-2026 -> 1% = 5,000; on 10-04-2026 -> 2% = 10,000."
  positive: "scrap 2026-04-10 5L -> 10,000"
  negative: "scrap with valid manufacturing declaration -> 0"
implementation:
  handler: ""
  pseudocode: "rate = RATES[regime][item]"
