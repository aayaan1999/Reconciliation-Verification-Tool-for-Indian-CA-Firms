notes: "[VERIFICATION 13-10-2026] The ITD s.394 page (official) shows the s.394(1) rates and footnotes 86-89: 'substituted by Act No. 4 of 2026' w.e.f. 01-04-2026. Liquor 2% (was 1%), tendu leaves 2% (was 5%), scrap 2% (was 1%), coal/lignite/iron ore 2% (was 1%), timber/forest produce 2% (no FA 2026 footnote). The Budget 2025 Memorandum confirms timber/forest produce cut from 2.5% to 2% w.e.f. 01-04-2025. This resolves the note that the official 1961 s.206C page still showing 2.5% is stale. Timber 2% from 1-4-2025 per RSM/TDSMAN; official 1961 s.206C page still shows 2.5% (likely not updated)."
