  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "interest = tcs × rate × months"
  steps:
    - "Deposit by 7th of next month (30 April for March)."
    - "Statement: 27EQ by 15th after quarter (FY 2025-26) / Form 143 by 31st after quarter (tax year 2026-27)."
    - "Interest: 1% per month or part from date collectible to date collected; 1.5% per month or part from date collected to date paid."
    - "Late fee ₹200/day capped at TCS (s.234E / s.427)."
