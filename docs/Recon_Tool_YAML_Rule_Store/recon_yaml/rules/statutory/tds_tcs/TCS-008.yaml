notes: "[VERIFICATION 13-10-2026] Conflict resolved: the Budget July-2024 Memorandum (official) raises s.206C(7) interest for collected-but-not-paid TCS from 1% to 1.5% per month or part, w.e.f. 01-04-2025, in line with s.201(1A). So 1.5% applies for FY 2025-26; the 1% on the official 1961 s.206C page is stale. Late collection stays 1%. Statement and certificate dates not re-checked. Rate conflict resolved: 1.5% for collected-not-paid from 01-04-2025 (Budget 2024 Memorandum); official page showing 1% is out of date."
