schema_version: "1.0"
rule:
  id: "TDS-036"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TDS – Process"
  name: "Quarterly TDS/TCS statement due dates and forms (Rule 31A/31AA / Rule 219)"
  purpose: "Flag late filing and drive s.234E/427 late fee."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
