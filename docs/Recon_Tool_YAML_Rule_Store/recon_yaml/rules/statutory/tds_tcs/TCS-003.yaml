  - title: "Income-tax Act, 1961 – Section 206C (incometaxindia.gov.in)"
    url: "https://www.incometaxindia.gov.in/w/section-206c-37"
    ref: ""
    official: true
  - title: "BDO India – CBDT notifies luxury goods for TCS u/s 206C(1F)"
    url: "https://www.bdo.in/en-gb/insights/alerts-updates/direct-tax-alert-cbdt-notifies-luxury-goods-for-levy-of-tcs-under-section-206c(1f)-of-the-it-act"
    ref: ""
    official: false
  - title: "Memorandum explaining provisions of Finance (No.2) Bill 2024 (indiabudget.gov.in)"
    url: "https://www.indiabudget.gov.in/budget2024-25/doc/memo.pdf"
    ref: ""
    official: true
notes: "[VERIFICATION 13-10-2026] Budget July-2024 Memorandum (official) confirms s.206C(1F) was extended to other notified luxury goods above Rs 10 lakh at 1%, w.e.f. 01-01-2025. The ITD s.394 page shows Sl.6 at 1% for motor vehicles or other notified goods above Rs 10 lakh. The list of notified luxury goods was still not opened. Luxury goods list from BDO (secondary); notification text not opened. Continuation of notification under s.394 Sl.6(b) not verified."
