    url: "https://www.india-briefing.com/news/a-guide-to-indias-tds-rates-for-fy-2025-26-36999.html/"
    ref: ""
    official: false
  - title: "TDSMAN – Key TDS/TCS proposed changes Budget 2026-27"
    url: "https://blog.tdsman.com/2026/02/key-tds-tcs-proposed-changes-in-budget-2026-27/"
    ref: ""
    official: false
  - title: "ClearTax – TDS and TCS changes from April 2026"
    url: "https://cleartax.in/s/tds-and-tcs-changes-from-april-2026"
    ref: ""
    official: false
  - title: "TaxGuru – CBDT Circular 23/2017: no TDS on GST component"
    url: "https://taxguru.in/income-tax/tds-deductible-gst-component-cbdt.html"
    ref: ""
    official: false
notes: "Manpower-supply clarification is from Finance Act 2026 per secondary sources; enacted text not opened."
