  domain: "tds_tcs"
  category: "TDS – Contractors"
  name: "Payments by individuals/HUF to contractors/professionals (s.194M / s.393(1) Sl.6(ii))"
  purpose: "Verify 2% TDS by non-audit individuals/HUF when aggregate > ₹50 lakh."
