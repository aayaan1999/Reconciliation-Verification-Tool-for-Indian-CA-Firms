schema_version: "1.0"
rule:
  id: "TDS-007"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TDS – Interest"
  name: "Interest other than on securities (s.194A / s.393(1) Sl.5(ii)-(iii))"
  purpose: "Verify interest TDS with differing thresholds for bank/co-op/post office vs others and senior citizens."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "1 April 2025 / 1 April 2026"
  period_basis: ""
legal:
  provisions: "IT Act 1961 s.194A (thresholds amended by Finance Act 2025 w.e.f. 1-4-2025); IT Act 2025 s.393(1) Table Sl.5(ii), 5(iii), Notes 1-2."
  applicability: "Any person (other than individual/HUF not covered) paying interest other than on securities to a resident."
  exemptions_exceptions: "Interest paid to banks/insurers; MACT interest to individuals fully exempt from TDS from 1-4-2026 (Finance Act 2026 substituted s.393(4) Sl.7(c)(iv)); Form 121/15G/15H."
  thresholds_rates: "Bank/co-op/PO: ₹1,00,000 (senior) / ₹50,000 (others); others: ₹10,000; rate 10%; no PAN 20%."
  rounding: "Not specified in law – implementation choice. Recommended: compute TDS to paise and round to nearest rupee (≥0.50 up) per deductee line; s.288B (1961) rounds 'amount payable' to nearest ₹10 but CBDT/TRACES practice does not apply ₹10 rounding to individual TDS lines – see TDS-046."
  due_dates: "Deposit: 7th of following month (March: 30 April) – Rule 30 (1962) / Rule 218(2) (2026). Statement: 26Q/Form 140 – 31 Jul, 31 Oct, 31 Jan, 31 May. Certificate: 16A/Form 131 within 15 days of statement due date."
inputs:
  documents: []
  fields:
    - "payer_type"
    - "payee_pan"
    - "payee_dob"
    - "interest_amount_fy"
    - "branch_code"
    - "cbs_flag"
    - "declaration_flag"
  prerequisites: "Payee DOB (for senior citizen ≥60), payer type, branch/CBS flag."
  input_validations: "Aggregate > threshold and TDS 0 -> flag; senior threshold applied to non-senior -> flag."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "TDS = 10% × interest if aggregate_interest > threshold"
  steps:
    - "Identify payer: bank/co-op bank/post office (Sl.5(ii)) vs other specified person (Sl.5(iii))."
    - "Threshold: Sl.5(ii) – ₹1,00,000 if payee is senior citizen, else ₹50,000; Sl.5(iii) – ₹10,000."
    - "Aggregate interest per payee per FY (per branch only if non-CBS)."
    - "If aggregate exceeds threshold -> TDS 10% on whole interest credited/paid."
    - "Exemptions per s.393(4) Sl.7 (interest to banks, insurers, firm to partner – now covered by 194T, etc.)."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "Expected TDS per payee, threshold used."
  recommended_action: "High"
  common_discrepancies: "Old ₹40,000/₹5,000 thresholds; senior status not captured; per-branch aggregation in CBS banks."
tests:
  worked_example: "Bank FD interest ₹72,000 to non-senior: > 50,000 -> TDS 7,200. Same to senior (age 64): ≤ 1,00,000 -> TDS 0. Company paying ₹12,000 ICD interest to resident: > 10,000 -> TDS 1,200."
  positive: "bank, non-senior, 72,000 -> 7,200"
  negative: "bank, senior, 95,000 -> 0"
implementation:
  handler: ""
  pseudocode: |-
    th = (100000 if senior else 50000) if payer in BANKS else 10000
    tds = round(0.10*agg) if agg > th and not exempt else 0
