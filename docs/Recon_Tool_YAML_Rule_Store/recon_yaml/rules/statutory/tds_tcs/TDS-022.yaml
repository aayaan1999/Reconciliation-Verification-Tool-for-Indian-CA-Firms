rule:
  id: "TDS-022"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TDS – Property"
  name: "Compensation on compulsory acquisition (s.194LA / s.393(1) Sl.3(iii))"
  purpose: "Verify 10% TDS on compensation > ₹5 lakh."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
