  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "TDS = 10% × compensation"
  steps:
    - "Exempt if under s.96 RFCTLARR Act 2013."
    - "If > ₹5,00,000 -> 10%."
parameters: []
outcomes:
  categories: []
