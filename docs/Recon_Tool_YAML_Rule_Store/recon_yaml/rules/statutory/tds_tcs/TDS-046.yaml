  tolerance: ""
calculation:
  formula: "tds = floor(x + 0.5)"
  steps:
    - "Compute TDS to paise."
    - "Round to nearest rupee (implementation default)."
    - "Allow tolerance ₹1 per line / ₹10 per challan in matching."
    - "Do not round each line to ₹10."
parameters: []
outcomes:
  categories: []
  default_severity: "Low"
  expected_output: ""
  recommended_action: "Low"
  common_discrepancies: "ERP rounds up always."
tests:
  worked_example: "2% × 12,345 = 246.90 -> ₹247."
  positive: "246.90 -> 247"
  negative: "difference ₹1 not flagged"
implementation:
  handler: ""
  pseudocode: "tds = int(Decimal(x).quantize(Decimal('1'), ROUND_HALF_UP))"
