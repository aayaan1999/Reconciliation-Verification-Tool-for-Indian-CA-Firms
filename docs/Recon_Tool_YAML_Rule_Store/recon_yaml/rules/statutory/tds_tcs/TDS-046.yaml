legal:
  provisions: "IT Act 1961 s.288B (amount payable/refund to nearest ₹10); 2025 Act equivalent reportedly clause 516 of Bill – final section not verified. No specific TDS rounding rule verified."
  applicability: "All TDS computations."
  exemptions_exceptions: ""
  thresholds_rates: ""
  rounding: "s.288B rounds 'amount payable' to ₹10 – applicability to TDS lines not established; old Rule 26B/CBDT rupee-rounding instruction NOT verified. Not specified in law – implementation choice."
