schema_version: "1.0"
rule:
  id: "TDS-005"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TDS – Interest"
  name: "Interest on securities (s.193 / s.393(1) Sl.5(i))"
  purpose: "Verify TDS on interest on debentures/securities with ₹10,000 threshold."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "1 April 2025 (threshold); 1 April 2026 (new Act)."
  period_basis: ""
legal:
  provisions: "IT Act 1961 s.193 (threshold raised to ₹10,000 by Finance Act 2025 w.e.f. 1-4-2025 per secondary sources); IT Act 2025 s.393(1) Table Sl.5(i)."
  applicability: "Any person paying interest on securities to a resident."
  exemptions_exceptions: "s.393(4) Sl.6; declaration Form 15G/15H/121."
  thresholds_rates: "₹10,000; 10% (rates in force)."
  rounding: "Not specified in law – implementation choice. Recommended: compute TDS to paise and round to nearest rupee (≥0.50 up) per deductee line; s.288B (1961) rounds 'amount payable' to nearest ₹10 but CBDT/TRACES practice does not apply ₹10 rounding to individual TDS lines – see TDS-046."
  due_dates: "Deposit: 7th of following month (March: 30 April) – Rule 30 (1962) / Rule 218(2) (2026). Statement: 26Q/Form 140 – 31 Jul, 31 Oct, 31 Jan, 31 May. Certificate: 16A/Form 131 within 15 days of statement due date."
inputs:
  documents: []
  fields:
    - "payee_pan"
    - "payee_type"
    - "interest_amount"
    - "security_type"
    - "listed_flag"
    - "declaration_flag"
  prerequisites: "Security holder master, PAN, exemption status."
  input_validations: "Interest > 10,000 and TDS = 0 without exemption -> flag."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "TDS = 10% × interest"
  steps:
    - "Exclude exempt securities (s.393(4) Sl.6 – e.g., interest paid to LIC/GIC/insurers; notified bonds)."
    - "If interest ≤ ₹10,000 in the year -> no TDS (check exact wording 'exceeds')."
    - "Else TDS at rates in force (10% for residents per Finance Act Part II)."
    - "No PAN -> 20%."
parameters: []
outcomes:
  categories: []
  default_severity: "Medium"
  expected_output: "Expected vs actual TDS."
  recommended_action: "Medium"
  common_discrepancies: "Threshold mis-applied from old ₹5,000."
tests:
  worked_example: "Debenture interest ₹45,000 to resident individual with PAN: TDS = 45,000 × 10% = ₹4,500."
  positive: "45,000 -> 4,500"
  negative: "9,000 -> 0"
implementation:
  handler: ""
  pseudocode: "tds = round(0.10*amt) if amt > 10000 and not exempt else 0"
sources:
  - title: "Income-tax Act, 2025 – Section 393 (incometaxindia.gov.in)"
    url: "https://www.incometaxindia.gov.in/w/section-393-6"
    ref: ""
    official: true
  - title: "RSM India Newsflash – Changes in TDS/TCS w.e.f. 1 April 2025"
    url: "https://www.rsm.global/india/sites/default/files/media/publications/2025/RSM%20India%20Newsflash%20-%20Overview%20of%20Changes%20in%20TDS%20and%20TCS%20provisions%20w.e.f.%201st%20April%202025.pdf"
    ref: ""
    official: false
  - title: "TDSMAN – TDS/TCS changes w.e.f. 1 April 2025"
    url: "https://blog.tdsman.com/2025/03/tds-tcs-changes-w-e-f-1st-april-2025/"
    ref: ""
    official: false
notes: "Rate 10% from 'rates in force' (Finance Act Part II) – not opened directly. Some sources quote ₹5,000 for physical debentures; s.393 official text shows single ₹10,000 threshold."
