  tolerance: ""
calculation:
  formula: ""
  steps:
    - "TY 2026-27 onward: correction allowed up to 2 years from end of tax year in which statement was due."
    - "Earlier: per 1961 proviso (secondary: six years from end of FY of statement, from 1-4-2025)."
    - "Default order: 1961 – 7 years from end of FY of payment; 2025 – 6 years from end of tax year."
