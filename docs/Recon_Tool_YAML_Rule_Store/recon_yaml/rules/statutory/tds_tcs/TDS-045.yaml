schema_version: "1.0"
rule:
  id: "TDS-045"
  version: "1"
  type: "statutory"
  domain: "tds_tcs"
  category: "TDS – Reconciliation"
  name: "Default computation as in TRACES justification report"
  purpose: "Replicate TRACES default categories: short deduction, short payment, interest on late deduction, interest on late payment, late filing fee."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: ""
  period_basis: ""
legal:
  provisions: "ss.201(1), 201(1A), 234E, 206AA (1961); ss.398, 427, 397(2) (2025)."
  applicability: "Processed statements."
  exemptions_exceptions: ""
  thresholds_rates: ""
  rounding: "Not specified in law – implementation choice. Recommended: compute TDS to paise and round to nearest rupee (≥0.50 up) per deductee line; s.288B (1961) rounds 'amount payable' to nearest ₹10 but CBDT/TRACES practice does not apply ₹10 rounding to individual TDS lines – see TDS-046."
  due_dates: ""
inputs:
  documents: []
  fields:
    - "row(pan"
    - "section"
    - "amount"
    - "date_credit"
    - "date_deducted"
    - "tds_deducted"
    - "rate_applied"
    - "flag_lower)"
    - "challan(date"
    - "amount)"
  prerequisites: "Statement rows, challans, PAN status, certificate master."
  input_validations: ""
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "default = SD + SP + I_ld + I_lp + fee – paid"
  steps:
    - "Short deduction = expected TDS (section rate, 20% if PAN invalid, cert rate if valid) – deducted."
    - "Short payment = deducted – consumed challan amount."
    - "Interest late deduction (1%) and late payment (1.5%) per TDS-037."
    - "Interest on short payment = 1.5% months from deduction to date of computation."
    - "Late fee 234E/427 per TDS-038."
    - "Net payable = sum – interest/fee already paid."
parameters: []
outcomes:
  categories: []
  default_severity: "Critical"
  expected_output: "Default summary per statement mirroring TRACES categories."
  recommended_action: "Critical for SD/SP"
  common_discrepancies: "TRACES uses its own month-count logic."
tests:
  worked_example: "Row: 194J fee ₹1,00,000, PAN invalid, deducted 10% = 10,000 on 15-04-2025, paid 07-05-2025. SD = 20,000 – 10,000 = 10,000. Interest on SD (1% from 15-04-2025 to computation 31-07-2025: Apr–Jul = 4 months) = 400. Total default ₹10,400."
  positive: ""
  negative: ""
implementation:
  handler: ""
  pseudocode: ""
