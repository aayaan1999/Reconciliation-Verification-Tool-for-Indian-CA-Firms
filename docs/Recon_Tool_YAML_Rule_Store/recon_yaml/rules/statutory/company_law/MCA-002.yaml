notes: "[VERIFICATION 13-10-2026] DIR-3 KYC limb confirmed officially (PIB): Rule 12A amended by G.S.R. 943(E) dt 31-12-2025, effective 31-03-2026. Annual KYC is replaced by a KYC intimation once every three years. Directors who already completed KYC next file by 30 June 2028. The same form is used to update mobile, email or address (DSC + professional certification needed only for those updates). This resolves the cycle-anchor question for existing directors. Late fee, ADT-1 and DPT-3 not re-checked. CORRECTION: legal_provision: add 'G.S.R. 943(E) dt 31.12.2025'. due_dates: 'DIR-3 KYC (triennial) – next due by 30.06.2028 for directors who completed KYC; thereafter every three years; event-based updates via same form'. G.S.R. number of DIR KYC amendment not found. Exact cycle anchor year for new directors unclear – open question. Late fee amount under new regime not verified."
