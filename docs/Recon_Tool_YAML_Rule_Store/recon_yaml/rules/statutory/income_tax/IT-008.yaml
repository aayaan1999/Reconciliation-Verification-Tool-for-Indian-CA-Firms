calculation:
  formula: "rebate = min(tax, 12500) if TI <= 500000 else 0"
  steps:
    - "If resident individual and TI <= 5,00,000: rebate = min(tax, 12,500)."
    - "Else 0 - no marginal relief in old regime."
    - "Exclude 112A LTCG tax from rebate base (s.112A(6))."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "rebate_amount."
  recommended_action: "High."
