tests:
  worked_example: "TI 5,00,000 (<60): tax 12,500 -> rebate 12,500 -> nil. TI 5,00,010: tax = 12,500 + 20% x 10 = 12,502; rebate 0; cess 500.08; total 13,002.08 -> rounded 13,000 (s.288B)."
  positive: "TI 4,80,000 (<60): tax 11,500 -> rebate 11,500 -> nil."
  negative: "TI 5,00,010 -> rebate 0 (no marginal relief)."
implementation:
  handler: ""
  pseudocode: "rebate_old = min(tax, 12500) if resident and indiv and ti <= 500000 else 0"
