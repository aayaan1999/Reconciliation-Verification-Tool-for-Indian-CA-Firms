schema_version: "1.0"
rule:
  id: "ADV-003"
  version: "1"
  type: "statutory"
  domain: "income_tax"
  category: "ADV - Instalments"
  name: "Presumptive (44AD / 44ADA / s.58 Sl.1 or 3) - single advance tax instalment by 15 March"
  purpose: "Apply single-instalment rule and 234C(1)(b) / s.425(3) interest."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "Continuing."
  period_basis: ""
legal:
  provisions: "Income-tax Act 1961 s.211(1)(b), s.234C(1)(b) -> Income-tax Act 2025 s.408(2), s.425(3)."
  applicability: "Assessees declaring profits under 44AD(1)/44ADA(1) / s.58(2) Table Sl. 1 or 3."
  exemptions_exceptions: "If presumptive income also includes other incomes (salary, capital gains) - whole tax due follows single instalment (CA review)."
  thresholds_rates: "100% by 15 March; 1%."
  rounding: "Rule 119A(c) / Rule 269 base to lower Rs 100; interest per s.288B/s.516."
  due_dates: "15 March of FY."
inputs:
  documents: []
  fields:
    - "tax_due_on_returned_income"
    - "challans"
  prerequisites: "Presumptive status confirmed (IT-014/015)."
  input_validations: "Quarterly 234C charged on presumptive assessee -> High."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "int_234C = 0.01 * floor100(max(0, tax_due - paid_by_15Mar))"
  steps:
    - "Required 100% by 15 March."
    - "Shortfall = tax_due - paid by 15 March."
    - "234C/425(3) interest = 1% x shortfall (one month)."
    - "234B/424 still applies if paid < 90% of assessed tax by 31 March."
parameters: []
outcomes:
  categories: []
  default_severity: "Medium"
  expected_output: "shortfall, 234C interest."
  recommended_action: "Medium."
  common_discrepancies: "Charging June/Sep/Dec interest to presumptive assessee."
tests:
  worked_example: "Tax due 85,450; paid 15-03-2026: 60,000. Shortfall 25,450 -> 25,400 -> 1% = 254 -> 250 (s.288B)."
  positive: "Paid full 85,450 on 14-03-2026 -> no 234C."
  negative: "Paid 85,450 on 20-03-2026 -> 234C 1% on 85,400 = 854 -> 850; no 234B (paid before 31 March, >= 90%)."
implementation:
  handler: ""
  pseudocode: |-
    sf = max(0, tax_due - paid(date(y+1,3,15)))
    int234c = round10(0.01 * (sf//100*100))
sources:
  - title: "Income-tax Act, 2025 - Section 408 Instalments of advance tax and due dates"
    url: "https://www.incometaxindia.gov.in/w/section-408-5"
    ref: "s.408(1) 15/45/75/100%; s.408(2) presumptive 15 March; s.408(3) 31 March"
    official: true
  - title: "Income-tax Act, 2025 - Section 425 Interest for deferment of advance tax"
    url: "https://www.incometaxindia.gov.in/w/section-425-5"
    ref: "s.425(1) table; (2) 12%/36%; (3) presumptive; (4) exceptions; (5) tax due on returned income"
    official: true
  - title: "Income-tax Act, 1961 - Section 234C"
    url: "https://www.incometaxindia.gov.in/w/section-234c-37"
    ref: "234C(1)(a),(b), provisos, Explanation 1"
    official: true
notes: ""
