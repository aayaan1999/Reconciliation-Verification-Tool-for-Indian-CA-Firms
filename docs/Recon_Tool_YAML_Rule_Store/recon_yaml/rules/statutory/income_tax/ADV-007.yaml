calculation:
  formula: "base = floor(amount/100)*100"
  steps:
    - "Base amount rounded to nearest multiple of Rs 100 ignoring fraction (i.e. truncate to lower 100)."
    - "Monthly-rate interest: part of month = full month."
    - "Annual-rate interest: period in whole months, fraction ignored."
    - "Final interest amount rounded per s.288B / s.516 (Rs 10)."
