  type: "statutory"
  domain: "income_tax"
  category: "ITR - Due dates"
  name: "Return due dates for Tax Year 2026-27 under Income-tax Act 2025 s.263(1) (as amended by Finance Act 2026)"
  purpose: "Due-date engine for 2025-Act years."
