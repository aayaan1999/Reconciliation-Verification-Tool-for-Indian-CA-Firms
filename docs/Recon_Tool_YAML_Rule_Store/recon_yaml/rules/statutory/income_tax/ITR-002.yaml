    official: false
  - title: "Income-tax Act, 2025 - Section 63 Tax audit"
    url: "https://www.incometaxindia.gov.in/w/section-63-134"
    ref: "s.63(1) Table; s.63(2); s.63(5)(a) specified date; s.63(5)(b) non-a/c-payee cheque = cash"
    official: true
  - title: "Memorandum explaining provisions of Finance Bill 2026 (indiabudget.gov.in)"
    url: "https://www.indiabudget.gov.in/doc/memo.pdf"
    ref: ""
    official: true
notes: "[VERIFICATION 13-10-2026] Finance Bill 2026 Memorandum (official) proposes, for the 2025 Act w.e.f. 01-04-2026 (tax year 2026-27): due date raised from 31 July to 31 August for business/profession assessees not requiring audit and their non-audited partners (ITR-1/ITR-2 filers stay at 31 July), and revised return to 12 months from end of tax year with fee u/s 428(b). The ITD portal s.263 page still shows the pre-amendment table (no 31-Aug row; 9 months for s.263(4)/(5)). The enacted FA 2026 amendments to the 2025 Act were not in the extracted text. Status unchanged. The ITD portal text of s.263 opened this session does NOT yet show the 31 August row (appears pre-amendment). The amendment is evidenced by Notes on Clauses to Finance Bill 2026 (cl.57) and secondary sources; enacted Finance Act 2026 text not opened - CA to confirm."
