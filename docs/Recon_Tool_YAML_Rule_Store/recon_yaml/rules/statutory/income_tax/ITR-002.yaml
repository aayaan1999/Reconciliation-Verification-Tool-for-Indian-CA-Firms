  valid_from: ""
  valid_to: ""
  effective_text: "Tax Year 2026-27 onwards."
  period_basis: ""
legal:
  provisions: "Income-tax Act 2025 s.263(1) as amended by Finance Act 2026 cl.57 (w.e.f. 01-04-2026); s.63(5)(a) specified date for audit report; s.172 (TP report)."
  applicability: "All assessees from Tax Year 2026-27."
  exemptions_exceptions: "CBDT extensions to be layered as override table."
  thresholds_rates: "Not applicable."
  rounding: "Not applicable."
