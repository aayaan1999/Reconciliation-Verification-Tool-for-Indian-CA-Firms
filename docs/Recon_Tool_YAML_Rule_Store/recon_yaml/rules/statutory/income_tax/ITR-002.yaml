  categories: []
  default_severity: "High"
  expected_output: "due_date."
  recommended_action: "High."
  common_discrepancies: "Using unamended portal text of s.263 (which still shows only 31 Oct / 31 Jul / 30 Nov)."
tests:
  worked_example: "Proprietor without audit, Tax Year 2026-27 -> 31-08-2027."
  positive: "LLP with audit -> 31-10-2027."
  negative: "Salaried -> 31-07-2027 (not 31-08-2027)."
implementation:
  handler: ""
  pseudocode: "as ITR-001 with year+1 and override table"
sources:
  - title: "Notes on Clauses - Finance Bill 2026"
    url: "https://incometaxindia.gov.in/Budgets%20and%20Bills/2026/Notes-on-clauses-2026.pdf"
    ref: "Cl. 5 (s.139), 6 (s.140B), 12 (s.234-I), 47 (s.202), 57 (s.263), 81-83 (ss.424, 425, 428)"
