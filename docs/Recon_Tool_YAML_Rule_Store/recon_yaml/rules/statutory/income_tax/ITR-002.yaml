inputs:
  documents: []
  fields:
    - "assessee_type"
    - "audit_required"
    - "s172_applies"
    - "has_business_income"
  prerequisites: "As ITR-001."
  input_validations: "Same as ITR-001."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "due = lookup(category, year=tax_year_end+... )"
  steps:
    - "s.172 applies -> 30 Nov 2027."
    - "Company / audited / partner of audited firm -> 31 Oct 2027."
    - "Non-audit business/profession (incl. partners of non-audited firms) -> 31 Aug 2027."
    - "Others -> 31 Jul 2027."
    - "Audit report: one month before return due date -> 30 Sep 2027."
parameters: []
