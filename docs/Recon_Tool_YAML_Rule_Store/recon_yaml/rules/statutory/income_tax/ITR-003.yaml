schema_version: "1.0"
rule:
  id: "ITR-003"
  version: "1"
  type: "statutory"
  domain: "income_tax"
  category: "ITR - Belated and revised returns"
  name: "Belated return (s.139(4) / s.263(4)) and revised return (s.139(5) / s.263(5)) time limits and revision fee (s.234-I / s.428)"
  purpose: "Validate whether a belated or revised return is within time and whether the new revision fee applies."
governance:
  enabled: false
  verification_status: "conflicting"
  verification_label: "Ambiguous / conflicting – needs CA review"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "AY 2026-27 onwards (1961 changes w.e.f. 01-03-2026); Tax Year 2026-27 onwards (2025 Act)."
  period_basis: ""
legal:
  provisions: "Income-tax Act 1961 s.139(4) (3 months before end of AY), s.139(5) as amended by Finance Act 2026 (before end of AY or completion of assessment, subject to new s.234-I; w.e.f. 01-03-2026 per Notes on Clauses), s.234F, s.234-I -> Income-tax Act 2025 s.263(4) (9 months from end of tax year), s.263(5) (12 months, Finance Act 2026), s.428 fee."
  applicability: "All assessees."
  exemptions_exceptions: "Updated return (ITR-U) separate (ITR-004)."
  thresholds_rates: "Fee Rs 1,000 / Rs 5,000 (income cut-off Rs 5 lakh)."
  rounding: "Not applicable."
  due_dates: "AY 2026-27: belated 31-12-2026; revised 31-03-2027 (fee if after 31-12-2026). Tax Year 2026-27: belated 31-12-2027; revised 31-03-2028 (fee if after 31-12-2027)."
inputs:
  documents: []
  fields:
    - "original_filed_date"
    - "revised_filed_date"
    - "belated_filed_date"
    - "assessment_completed_date"
    - "total_income"
  prerequisites: "Original return date; assessment status."
  input_validations: "Revised after deadline -> Critical (invalid). Revision fee missing -> Medium."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "rev_ok = rev_date <= min(end_of_AY, assessment_date); fee = (1000 if TI<=5e5 else 5000) if rev_date > date(PYend+9m) else 0"
  steps:
    - "Belated AY 2026-27: allowed until 31-12-2026 (or before assessment completion if earlier); 234F fee + 234A interest."
    - "Revised AY 2026-27: allowed until 31-03-2027 (or before assessment completion)."
    - "If revised after 31-12-2026 (9 months from end of PY) -> fee s.234-I: 1,000 if TI <= 5 lakh else 5,000."
    - "Tax Year 2026-27: belated until 31-12-2027; revised until 31-03-2028; fee u/s 428 if revised after 31-12-2027."
    - "Belated return -> no carry-forward of business/capital losses (s.80 / s.139(3)) - flag."
parameters: []
outcomes:
  categories: []
  default_severity: "Critical"
  expected_output: "validity, fee."
  recommended_action: "Critical/Medium."
  common_discrepancies: "Assuming revised deadline still 31 December."
tests:
  worked_example: "AY 2026-27 original filed 25-07-2026; revised 15-02-2027; TI 8,00,000 -> valid; fee 5,000 (s.234-I)."
  positive: "Revised 20-12-2026 -> valid, no fee."
  negative: "Belated return filed 05-01-2027 for AY 2026-27 -> not allowed (only ITR-U possible)."
implementation:
  handler: ""
  pseudocode: |-
    end_pY = date(2026,3,31)
    belated_last = date(2026,12,31)
    revised_last = date(2027,3,31)
    fee = (1000 if ti<=500000 else 5000) if rev > date(2026,12,31) else 0
