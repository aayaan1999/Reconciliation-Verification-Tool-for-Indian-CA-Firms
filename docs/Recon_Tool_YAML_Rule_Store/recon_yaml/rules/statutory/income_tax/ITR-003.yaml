notes: "[VERIFICATION 13-10-2026] Partly confirmed, with a new drafting conflict. Official Finance Act 2026: s.139(5) substituted (w.e.f. 01-03-2026) – revised return 'at any time before the end of the relevant assessment year or before the completion of the assessment, whichever is earlier', subject to s.234-I. That is 12 months from the end of the PY, so revised return for AY 2026-27 is allowed up to 31-03-2027. New s.234-I (FA 2026 s.16, w.e.f. 01-03-2026): fee Rs 1,000 (total income up to Rs 5 lakh) / Rs 5,000 where a s.139(5) return is furnished 'beyond nine months but before twelve months from the end of the relevant assessment year'. Read literally ('assessment year', not 'previous year'), the fee window falls after the revision window has closed, so the fee would never apply. The Finance Bill 2026 Memorandum states the intent: a fee for revised returns filed beyond nine months from the end of the tax year/PY, i.e. after 31-12-2026 for AY 2026-27. The rule follows the intent; a CA must decide whether to levy the fee given the literal wording. The same wording was read in two separate copies (official ITD PDF and the gazette copy). Under the 2025 Act the Memorandum (official, Bill stage) proposes s.263(5) at 12 months from end of tax year with fee u/s 428(b). The ITD portal s.263 page still shows 9 months and no 31-Aug row, so it has not been updated – enacted 2025-Act text not read. CORRECTION: Add a flag: 's.234-I as enacted refers to nine to twelve months from end of the relevant ASSESSMENT YEAR – literal reading makes fee inapplicable; rule applies fee to revisions after 31-12 following the PY per Memorandum intent – CA policy choice (config: fee_234I_mode = intent|literal, default intent with warning)'. Based on Notes on Clauses to Finance Bill 2026 (cl.5, cl.12, cl.57, cl.83) and secondary sources reporting enactment; enacted text not opened. Notes on Clauses s.428 wording for revised-return fee refers to 'nine months' while revision window is twelve months - consistent reading is that fee applies to revisions in months 10-12. The s.263 portal text still shows 9-month revision (pre-amendment)."
