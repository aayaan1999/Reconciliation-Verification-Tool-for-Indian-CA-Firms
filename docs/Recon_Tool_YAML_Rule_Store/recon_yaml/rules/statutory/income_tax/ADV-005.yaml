    url: "https://www.incometaxindia.gov.in/w/rule-269-1"
    ref: "Under s.533(2)(u); part month = full month; amount rounded to Rs 100"
    official: true
notes: "Segmenting after part payment: the law (s.234B(2) / s.424(4)) computes interest up to the date of SA payment on the full shortfall, then on the balance after reducing the SA tax paid. The 'start' for the next segment begins from the month after the payment month per CPC practice vs. same month - implementation detail, CA to confirm (example above counts from day after payment, hence June)."
