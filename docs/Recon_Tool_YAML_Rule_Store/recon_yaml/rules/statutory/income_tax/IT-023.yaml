  name: "100% disallowance for non-deduction / non-payment of TDS on payments to non-residents - s.40(a)(i) / s.35"
  purpose: "Disallow full amount of interest, royalty, FTS or other sums payable outside India or to non-residents where TDS not deducted/paid."
