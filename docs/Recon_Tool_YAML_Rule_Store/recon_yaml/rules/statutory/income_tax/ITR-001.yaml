schema_version: "1.0"
rule:
  id: "ITR-001"
  version: "1"
  type: "statutory"
  domain: "income_tax"
  category: "ITR - Due dates"
  name: "Return due dates for AY 2026-27 (FY 2025-26) under Income-tax Act 1961 as amended by Finance Act 2026, with CBDT extension"
  purpose: "Drive late-filing, 234A, 234F, 43B, 40(a)(ia), regime option and loss carry-forward checks."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "AY 2026-27."
  period_basis: ""
legal:
  provisions: "Income-tax Act 1961 s.139(1) Explanation 2 (substituted by Finance Act 2026 cl.5 - table: 30 Nov / 31 Oct / 31 Aug / 31 Jul); s.44AB specified date; CBDT Circular No. 07/2026 dated 28-09-2026 (F. No. 225/128/2026/ITA-II)."
  applicability: "All assessees for AY 2026-27."
  exemptions_exceptions: "Interest u/s 234A may still run from the original date if CBDT so specifies (not stated in Circular 07/2026)."
  thresholds_rates: "Not applicable."
  rounding: "Not applicable."
  due_dates: "TP: 30-11-2026; audit/company: 21-11-2026 (extended from 31-10-2026); tax audit report: 21-10-2026 (extended from 30-09-2026); non-audit business/profession (ITR-3/ITR-4): 31-08-2026; others (ITR-1/ITR-2): 31-07-2026."
inputs:
  documents: []
  fields:
    - "assessee_type"
    - "audit_required"
    - "tp_report_required_92E"
    - "has_business_income"
    - "is_partner_of_audited_firm"
  prerequisites: "Assessee category: TP report required (92E); company / audited; non-audited business/profession (incl. partner of non-audited firm and spouse u/s 5A); others."
  input_validations: "Business assessee flagged late using 31-07-2026 -> High (wrong). Audit case filed 15-11-2026 -> on time."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "due = lookup(category)"
  steps:
    - "If 92E applies -> 30-11-2026."
    - "Else if company or audit required (or partner of audited firm) -> 31-10-2026, extended to 21-11-2026 by Circular 07/2026."
    - "Else if business/profession income (non-audit) -> 31-08-2026."
    - "Else -> 31-07-2026."
    - "Audit report (44AB) specified date 30-09-2026, extended to 21-10-2026."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "due_date, legal_basis, extension_reference."
  recommended_action: "High."
  common_discrepancies: "Treating 31-08-2026 as a CBDT extension rather than statutory; ignoring Circular 07/2026."
tests:
  worked_example: "Non-audit freelancer files ITR-4 on 20-08-2026 -> due 31-08-2026 -> on time; no 234F. Same person filing 05-09-2026 -> late by 1 month part -> 234A 1 month; fee 5,000 if TI > 5 lakh."
  positive: "Company files 20-11-2026 -> on time (extended)."
  negative: "Salaried filing 15-08-2026 -> late (due 31-07-2026)."
implementation:
  handler: ""
  pseudocode: |-
    def due_ay2627(c):
        if c.tp_92e: return date(2026,11,30)
        if c.company or c.audit or c.partner_audited_firm: return date(2026,11,21)  # Circular 07/2026
        if c.has_business_income: return date(2026,8,31)
        return date(2026,7,31)
