notes: "[VERIFICATION 13-10-2026] Official Finance Act 2026 (No. 4 of 2026, assent 30-03-2026) s.5(a) substitutes the Explanation 2 table in s.139(1) w.e.f. 01-03-2026. Sl.3 covers an assessee with business/profession income whose accounts need no audit under this Act or any other law, and a partner (or spouse u/s 5A) of such a non-audited firm, where s.92E does not apply: due date 31 August. Other rows: 31 July (any other assessee), 31 October (company / audited, no 92E), 30 November (92E). So the 31-Aug date applies to AY 2026-27. CBDT Circular 07/2026 (28-09-2026, F.No.225/128/2026/ITA-II) extends the return due date for persons at Sl.2 of the table from 31-10-2026 to 21-11-2026, and the audit report specified date to 21-10-2026. Circular 07/2026 verified on official site (it refers to 'Explanation 2 to s.139(1), sl. no. 2' - consistent with the substituted table). Finance Act 2026 Explanation 2 table verified from Notes on Clauses to the Finance Bill (Bill stage); Finance Act 2026 received assent 30-03-2026 (Act No. 4 of 2026) - passage with 30+ amendments; final enacted text of cl.5 not opened. Effective date of the substituted Explanation 2 for AY 2026-27 relies on secondary sources (CalcGuru, StudyCafe, ClearTax). No CBDT extension of 31-07-2026 / 31-08-2026 dates found."
