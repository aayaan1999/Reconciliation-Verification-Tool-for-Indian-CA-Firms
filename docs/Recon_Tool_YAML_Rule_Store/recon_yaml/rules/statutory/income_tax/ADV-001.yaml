schema_version: "1.0"
rule:
  id: "ADV-001"
  version: "1"
  type: "statutory"
  domain: "income_tax"
  category: "ADV - Advance tax liability"
  name: "Advance tax liability threshold Rs 10,000 and senior-citizen exemption"
  purpose: "Determine whether advance tax was payable at all (precondition for 234B/234C or s.424/425)."
governance:
  enabled: false
  verification_status: "verified_official"
  verification_label: "Verified – official source"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "Continuing; ss.403-404 from FY 2026-27."
  period_basis: ""
legal:
  provisions: "Income-tax Act 1961 s.207(1),(2), s.208, s.209 -> Income-tax Act 2025 s.403(1),(3), s.404, s.405 (current income computation - inferred)."
  applicability: "All assessees."
  exemptions_exceptions: "Senior citizen (resident, 60+, no business income)."
  thresholds_rates: "Rs 10,000."
  rounding: "Not specified in law – implementation choice (compare unrounded)."
  due_dates: "See ADV-002/003."
inputs:
  documents: []
  fields:
    - "tax_on_total_income"
    - "tds_tcs_total"
    - "reliefs"
    - "mat_amt_credit"
    - "date_of_birth"
    - "residential_status"
    - "has_business_income"
  prerequisites: "Estimated/returned tax, TDS/TCS for the year, age, business income flag."
  input_validations: "234B/234C charged where not liable -> High."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "liable = not senior_exempt and (tax - tds_tcs - reliefs) >= 10000"
  steps:
    - "If resident individual aged 60+ at any time during the year AND no business/profession income -> not liable (s.207(2) / s.403(3))."
    - "net = tax on current income - TDS/TCS (- reliefs/credits)."
    - "If net >= 10,000 -> liable; else not liable."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "advance_tax_liable (bool), net_tax."
  recommended_action: "High."
  common_discrepancies: "Exempting seniors with business income; ignoring TDS when testing threshold."
tests:
  worked_example: "Resident aged 62 with pension + interest + capital gains, net tax 1,20,000 -> exempt (no business income). Age 45 salaried with net tax after TDS 9,990 -> not liable."
  positive: "Freelancer net tax 15,000 -> liable."
  negative: "Resident aged 61 with small business income 2,00,000, net tax 50,000 -> liable (business income kills exemption)."
implementation:
  handler: ""
  pseudocode: |-
    senior = resident and age_at_any_time >= 60 and not has_biz
    liable = (not senior) and (tax - tds - reliefs) >= 10000
sources:
  - title: "Income-tax Act, 2025 - Section 403 Liability for payment of advance tax"
    url: "https://www.incometaxindia.gov.in/w/section-403-5"
    ref: "s.403(3) resident senior citizen without business income exempt"
    official: true
  - title: "Income-tax Act, 2025 - Section 404 Conditions of liability"
    url: "https://www.incometaxindia.gov.in/w/section-404-5"
    ref: "Advance tax payable where tax >= Rs 10,000"
    official: true
notes: "2025-Act ss.403, 404 verified on official site; 1961 ss.207/208 identical (established)."
