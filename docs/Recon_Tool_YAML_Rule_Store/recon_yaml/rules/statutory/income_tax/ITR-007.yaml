notes: "[VERIFICATION 13-10-2026] 1961 Act (AY 2026-27): the official FA 2026 text read contains no amendment to s.271B and no new audit-report fee; the only new fee is s.234-I. So the s.271B penalty (0.5% of turnover, max Rs 1.5 lakh) continues for AY 2026-27, with the audit report date 21-10-2026 (Circular 07/2026). 2025 Act: the Memorandum (official, Bill stage) says the penalty u/s 446 for failing to get accounts audited is converted to a fee u/s 428(c): Rs 75,000 / Rs 1,50,000 depending on delay, from 01-04-2026 (tax year 2026-27 onwards). The ITD portal s.428 page still shows only clauses (a)/(b). Enacted 2025-Act text not seen. CORRECTION: legal_provision (2025 Act limb): the penalty being replaced is ITA 2025 s.446 (not 'old s.271B'); the fee is s.428(c). Note 'per Memorandum to Finance Bill 2026; portal s.428 not yet updated'. Circular 07/2026 and s.63 verified official. s.271B penalty quantum from established law. s.428 audit-report fee from Notes on Clauses (Bill stage) - enacted text not opened."
