schema_version: "1.0"
rule:
  id: "ITR-007"
  version: "1"
  type: "statutory"
  domain: "income_tax"
  category: "ITR - Tax audit report"
  name: "Tax audit report due date and consequence of default (s.44AB / s.271B -> s.63 / s.428 fee)"
  purpose: "Check filing of audit report by specified date; quantify exposure."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: ""
  valid_to: ""
  effective_text: "AY 2026-27 (1961); Tax Year 2026-27 (2025 Act + Finance Act 2026)."
  period_basis: ""
legal:
  provisions: "Income-tax Act 1961 s.44AB (specified date), s.271B (penalty 0.5% of turnover max Rs 1,50,000); CBDT Circular 07/2026 -> Income-tax Act 2025 s.63(3),(5)(a); s.428 as amended by Finance Act 2026 (fee Rs 75,000 for delay up to 1 month; Rs 1,50,000 thereafter) - per Notes on Clauses."
  applicability: "Assessees requiring audit (IT-013)."
  exemptions_exceptions: "Reasonable cause (1961 s.273B) - 2025 equivalent not verified."
  thresholds_rates: "0.5% / Rs 1,50,000 cap (1961); Rs 75,000 / Rs 1,50,000 (2025 + FA 2026)."
  rounding: "Not applicable."
  due_dates: "AY 2026-27: 21-10-2026. Tax Year 2026-27: 30-09-2027 (unless extended)."
inputs:
  documents: []
  fields:
    - "audit_required"
    - "audit_report_filed_date"
    - "specified_date"
    - "turnover"
  prerequisites: "IT-013 = audit required; audit report upload date."
  input_validations: "Audit report after specified date -> High."
matching:
  keys: []
  key_normalisation: ""
  aggregation: ""
  comparisons: []
  tolerance: ""
calculation:
  formula: "AY26-27: pen = min(0.005*turnover, 150000); TY26-27: fee = 75000 if delay_days <= 1 month else 150000"
  steps:
    - "AY 2026-27: specified date 21-10-2026 (extended). Late -> penalty exposure s.271B = min(0.5% turnover, 1,50,000) (subject to reasonable cause s.273B)."
    - "Tax Year 2026-27: specified date 30-09-2027; delay <= 1 month -> fee 75,000; > 1 month -> 1,50,000 (s.428 per FA 2026)."
parameters: []
outcomes:
  categories: []
  default_severity: "High"
  expected_output: "late_flag, exposure."
  recommended_action: "High."
  common_discrepancies: "Using 30-09-2026 for AY 2026-27 despite extension."
tests:
  worked_example: "AY 2026-27, turnover 4 crore, report filed 05-11-2026 -> late -> exposure min(2,00,000, 1,50,000) = 1,50,000."
  positive: "Filed 20-10-2026 -> on time."
  negative: "Tax Year 2026-27 report filed 15-10-2027 (15 days late) -> fee 75,000."
implementation:
  handler: ""
  pseudocode: |-
    late = filed > specified
    exposure = min(.005*turnover,150000) if act=='1961' else (75000 if filed <= add_months(specified,1) else 150000)
