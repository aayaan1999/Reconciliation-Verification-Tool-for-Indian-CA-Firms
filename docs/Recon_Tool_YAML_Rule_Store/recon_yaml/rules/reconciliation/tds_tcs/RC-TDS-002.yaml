notes: "Thresholds/rates are not repeated here – take from round-1 rules TDS-007..TDS-032 (date-effective). 30%/100% disallowance under 1961 per established law; 2025 Act s.35 per secondary source only (round-1 IT-022/TDS-049). Short-deduction disallowance is judicially debated – CA decides whether 'SHORT_DEDUCTED' attracts 40(a)(ia). Applicable-law selector: payment/credit date ≤ 31-03-2026 → Income-tax Act 1961 + Rules 1962; ≥ 01-04-2026 → Income-tax Act 2025 + Income-tax Rules 2026 (round-1 TDS-001/IT-001)."
