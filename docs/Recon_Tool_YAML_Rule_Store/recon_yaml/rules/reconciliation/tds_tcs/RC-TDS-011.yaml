schema_version: "1.0"
rule:
  id: "RC-TDS-011"
  version: "1"
  type: "reconciliation"
  domain: "tds_tcs"
  category: "TDS – Salary annual"
  name: "24Q Q4 Annexure II (salary details) vs Form 16 Part B vs payroll annual computation"
  purpose: "Ensure annual salary computation per employee is consistent across payroll's tax computation, 24Q Q4 Annexure II and Form 16 Part B (gross salary, s.10 exemptions, standard deduction, Chapter VI-A, taxable income, tax, rebate, surcharge, cess, relief, TDS), and TDS for the year equals Σ Annexure I TDS of Q1-Q4."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: "2025-04-01"
  valid_to: ""
  effective_text: "2025-04-01"
  period_basis: "financial year / tax year (Q4 statement)"
legal:
  provisions: "IT Act 1961 s.192, s.203, Rule 31 (Form 16), Rule 31A (24Q Annexure II in Q4) – FY 2025-26; IT Act 2025 s.392, s.395(4), Rule 215 (Form 130), Rule 219 (Form 138) – tax year 2026-27; standard deduction ₹75,000 new regime / ₹50,000 old (round-1 IT-010); rebate s.87A/s.156 (round-1 IT-007/008)."
  applicability: "All employers filing 24Q/138."
  exemptions_exceptions: ""
  thresholds_rates: ""
  rounding: ""
  due_dates: ""
inputs:
  documents:
    - role: "A"
      doc_code: "TDS_RET_24Q"
      required: true
    - role: "B"
      doc_code: "F16_PARTB"
      required: true
    - role: "C"
      doc_code: "PAYROLL_REG"
      required: false
  fields: []
  prerequisites: "Q4 24Q Annexure II per employee; Form 16 Part B (generated by employer software / TRACES Part A + employer Part B); payroll annual tax computation sheet; Q1-Q3 Annexure I totals."
  input_validations: "Annexure II only in Q4 statement (Protean); every employee in Annexure I during year should appear in Annexure II (if employed/paid in year); regime flag present."
matching:
  keys:
    - left: "TDS_RET_24Q.sd_employee_pan"
      right: "F16_PARTB.sd_employee_pan"
    - left: "TDS_RET_24Q.sd_employee_pan"
      right: "PAYROLL_REG.pan"
  key_normalisation: "PAN upper-case; regime flag normalise to {NEW, OLD} (Annexure II 'opting out of 115BAC(1A)' Y/N → OLD/NEW)."
  aggregation: "employee (annual)."
  comparisons:
    - left: "annex2.gross_salary"
      right: "F16_PARTB.sd_gross_salary_total vs PAYROLL_REG.annual_gross"
    - left: "annex2.exempt_s10"
      right: "F16_PARTB.sd_exemptions_s10"
    - left: "annex2.standard_deduction"
      right: "F16_PARTB.sd_standard_deduction"
    - left: "annex2.chapter_via"
      right: "F16_PARTB.sd_chapter_via_total"
    - left: "annex2.total_taxable_income"
      right: "F16_PARTB.sd_total_taxable_income"
    - left: "annex2.net_tax_payable"
      right: "F16_PARTB.sd_net_tax_payable"
    - left: "annex2.total_tds"
      right: "Σ annexure1.tds (Q1-Q4) vs F16_PARTB.sd_tds_current_employer"
    - left: "annex2.regime"
      right: "PAYROLL_REG.tax_regime"
  tolerance: "₹0 for figures copied between documents; ₹10 for recomputed tax (s.288A/288B rounding of income/tax – round-1 IT-011/012)."
calculation:
  formula: "recomputed_tax = slab(regime, taxable_income) − rebate + surcharge + cess(4%) − relief_89; tds_gap = recomputed_tax − total_tds (positive = short deduction for year); annual_tds_check = annex2.total_tds − Σ_Q1..Q4 annexure1.tds"
  steps:
    - "Parse Annexure II and Form 16 Part B."
    - "Field-by-field compare."
    - "Recompute taxable income: gross − s.10 exemptions − s.16 deductions (+ other income declared) − Chapter VI-A (old regime only, except permitted deductions); round to ₹10."
    - "Recompute tax using round-1 IT-002/003/005/006/007 tables."
    - "Compare with net tax payable and TDS."
    - "Check Annexure II TDS = Σ Annexure I TDS for the employee across Q1-Q4 (same TAN)."
    - "Check regime: new-regime employees should not have old-regime-only exemptions/deductions (HRA, LTA, 80C etc.)."
parameters:
  - key: "tax_tolerance_inr"
    value: "10"
    type: "integer"
    unit: "INR"
    label: "Tax tolerance inr"
    editable: true
  - key: "slab_table"
    value: "IT-002/IT-003"
    type: "string"
    unit: ""
    label: "Slab table"
    editable: true
  - key: "cess_pct"
    value: "4"
    type: "integer"
    unit: "percent"
    label: "Cess pct"
    editable: true
  - key: "std_deduction_new"
    value: "75000"
    type: "integer"
    unit: ""
    label: "Std deduction new"
    editable: true
  - key: "std_deduction_old"
    value: "50000"
    type: "integer"
    unit: ""
    label: "Std deduction old"
    editable: true
outcomes:
  categories:
    - code: "MATCHED"
      description: "matched"
      severity: "Low"
    - code: "FIELD_DIFF"
      description: "field differs between Annexure II and Form 16 Part B"
      severity: "High"
    - code: "PAYROLL_DIFF"
      description: "Annexure II differs from payroll computation"
      severity: "Medium"
    - code: "TAX_RECOMPUTE_DIFF"
      description: "recomputed tax differs"
      severity: "High"
    - code: "SHORT_DEDUCTION_YEAR"
      description: "TDS < tax payable"
      severity: "High"
    - code: "EXCESS_DEDUCTION_YEAR"
      description: "TDS > tax payable"
      severity: "Low"
    - code: "ANNEX_TDS_MISMATCH"
      description: "Annexure II TDS ≠ Σ Annexure I TDS"
      severity: "Critical"
    - code: "REGIME_INCONSISTENT"
      description: "deductions not allowed in chosen regime"
      severity: "High"
  default_severity: ""
  expected_output: "pan, employee_name, regime, field, annex2_value, f16b_value, payroll_value, recomputed_value, diff, category, severity"
  recommended_action: "Correct Annexure II via correction statement; regenerate Form 16 Part B; recover short TDS (cannot be recovered after year – employee pays self-assessment tax; note s.201 exposure)."
  common_discrepancies: "Previous employer salary (Form 12B/124) not included; perquisites (17(2)) omitted; HRA allowed under new regime; s.89 relief claims; mid-year regime change; employees who left (Annexure II omitted)."
tests:
  worked_example: "E1 new regime: gross 14,00,000; std ded 75,000; taxable 13,25,000; tax per new slab (0-4L nil; 4-8L 5% = 20,000; 8-12L 10% = 40,000; 12-13.25L 15% = 18,750) = 78,750; cess 3,150 → 81,900. Annexure II net tax 81,900; Σ Annexure I TDS 78,000 → SHORT_DEDUCTION_YEAR 3,900. Form 16 Part B shows Chapter VI-A 80C 1,50,000 for E1 → REGIME_INCONSISTENT."
  positive: "E2 new regime taxable 11,50,000 → tax 55,000 (20,000 + 35,000) rebate 87A full (≤12 L) → nil; TDS nil → MATCHED."
  negative: "E3 Annexure II TDS 60,000 but Annexure I Q1-Q4 total 55,000 → ANNEX_TDS_MISMATCH 5,000."
implementation:
  handler: ""
  pseudocode: |-
    def rc_tds_011(a2, f16b, payroll, a1):
        for pan, x in a2.items():
            y = f16b.get(pan); z = payroll.get(pan)
            for fld in FIELDS: compare(x[fld], y and y[fld], z and z[fld])
            tax = compute_tax(x.regime, round10(x.taxable_income))
            tds_q = sum(r.tds for r in a1 if r.pan==pan)
            yield checks(x, tax, tds_q)
sources:
  - title: "TDSMAN – Simple guide for employee income details, Form 24Q-Q4"
    url: "https://blog.tdsman.com/2024/04/simple-guide-for-employee-income-details-form-24q-q4/"
    ref: "Annexure II feeds Form 16 Part B"
    official: false
  - title: "Protean – Do's and Don'ts for deductors/collectors (e-TDS)"
    url: "https://tinpan.proteantech.in/downloads/e-tds/download/DosandDontsdeductorscollectors.pdf"
    ref: "CIN = BSR(7) + challan serial(≤5) + date; one challan entry with full amount; Annexure II only in Q4 24Q"
    official: false
  - title: "CBDT FAQs – Form 130"
    url: "https://www.incometaxindia.gov.in/documents/d/guest/form-130-faqs"
    ref: "Form 130 (erstwhile Form 16)"
    official: true
  - title: "Income-tax Act 2025 – section 392 (salary TDS)"
    url: "https://www.incometaxindia.gov.in/w/section-392-6"
    ref: "s.392"
    official: true
notes: "Annexure II/Form 16 Part B field structure per TDSMAN (secondary). Slab/rebate figures are those verified in round-1 IT-002/IT-007 (new regime FY 2025-26: nil to ₹4 L, 5% 4-8 L, 10% 8-12 L, 15% 12-16 L, 20% 16-20 L, 25% 20-24 L, 30% above). Form 138/130 field equivalents for tax year 2026-27 not opened."
