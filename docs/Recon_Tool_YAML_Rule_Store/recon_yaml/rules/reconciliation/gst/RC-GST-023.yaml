schema_version: "1.0"
rule:
  id: "RC-GST-023"
  version: "1"
  type: "reconciliation"
  domain: "gst"
  category: "GST – Late fee"
  name: "Late fee u/s 47 computed vs paid (GSTR-3B, GSTR-1, GSTR-9)"
  purpose: "Recompute late fee for late GSTR-3B/GSTR-1/GSTR-9 and compare with fee actually paid (cash ledger / return)."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: "2021-06-01"
  valid_to: ""
  effective_text: "2021-06-01"
  period_basis: "tax period / FY"
legal:
  provisions: "CGST Act s.47(1) (Rs 100/day per Act, capped), s.47(2) (annual return: Rs 100/day, max 0.25% of turnover in State/UT); N.19/2021-CT (GSTR-3B from June 2021 period) and N.20/2021-CT (GSTR-1): Rs 25+25/day (nil: 10+10), caps Rs 500 (nil), 2,000 (AATO up to Rs 1.5 cr), 5,000 (Rs 1.5–5 cr), 10,000 (> Rs 5 cr) total; N.7/2023-CT (GSTR-9 from FY 2022-23: AATO <= Rs 5 cr Rs 25+25/day cap 0.02%+0.02%; Rs 5–20 cr Rs 50+50/day cap 0.02%+0.02%; > Rs 20 cr statutory)."
  applicability: "Taxpayers filing returns after due date."
  exemptions_exceptions: ""
  thresholds_rates: ""
  rounding: ""
  due_dates: ""
inputs:
  documents:
    - role: "A"
      doc_code: "GSTR3B"
      required: true
    - role: "B"
      doc_code: "ECL"
      required: true
    - role: "C"
      doc_code: "GSTR9"
      required: false
  fields: []
  prerequisites: "Due dates master; filing dates (GSTR-1, 3B, 9, 9C); nil-return flag; AATO of preceding FY; turnover in State for GSTR-9; ECL late fee debits."
  input_validations: "Due date master present; filing date >= period end."
matching:
  keys:
    - left: "GSTR3B.return_period"
      right: "ECL.tax_period (and fy(tax_period) when matched to GSTR9.financial_year) (minor head 'fee')"
    - left: "GSTR9.financial_year"
      right: "ECL.tax_period (and fy(tax_period) when matched to GSTR9.financial_year)"
  key_normalisation: "Period MMYYYY / FY YYYY-YY."
  aggregation: "Per return per period per head (CGST, SGST)."
  comparisons:
    - left: "computed_fee_h"
      right: "paid_fee_h"
  tolerance: "Exact (Rs 0) – fee is in whole rupees."
calculation:
  formula: "fee_total = min(days_late × per_day_total, cap_total); split 50:50 CGST/SGST; GSTR-9: fee_head = min(days × per_day_head, cap_pct_head × state_turnover)"
  steps:
    - "days_late = filing_date − due_date (>0)."
    - "Select slab (nil / AATO band)."
    - "Compute and cap."
    - "GSTR-1 late fee is collected via the next GSTR-3B (portal practice) – compare against 3B 5.1 fee field of the next period."
    - "Compare paid."
    - "57th Council late-fee waiver recommendation (08.10.2026) not applied unless notified."
