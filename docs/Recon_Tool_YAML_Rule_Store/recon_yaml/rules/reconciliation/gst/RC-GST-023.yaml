  - key: "per_day_3b_total"
    value: "50"
    type: "integer"
    unit: ""
    label: "Per day 3b total"
    editable: true
  - key: "per_day_nil_total"
    value: "20"
    type: "integer"
    unit: ""
    label: "Per day nil total"
    editable: true
  - key: "caps_total"
    value: "500/2000/5000/10000"
    type: "string"
    unit: ""
    label: "Caps total"
    editable: true
  - key: "gstr9_bands"
    value: "per N.7/2023"
    type: "string"
    unit: ""
    label: "Gstr9 bands"
    editable: true
outcomes:
  categories:
    - code: "MATCHED"
      description: ""
      severity: "Low"
    - code: "FEE_SHORT_PAID"
      description: ""
      severity: "Medium"
    - code: "FEE_EXCESS_PAID"
      description: ""
      severity: "Low"
    - code: "FEE_NOT_PAID"
      description: ""
      severity: "Medium"
  default_severity: ""
  expected_output: "exception_id; rule_id; client_id; gstin; period; doc_a_ref (file+row); doc_b_ref; match_key; match_pass (exact/fuzzy); category; severity; field_name; value_a; value_b; difference; tolerance_applied; suggested_action; legal_reference; status (Open/Under review/Resolved/Accepted-as-is); reviewer; review_comment; created_at; return_type; days_late; slab; computed; paid"
  recommended_action: "Short-paid fee: pay via DRC-03/next return; note CA review if amnesty applies."
  common_discrepancies: "Late fee waived by amnesty for older periods; GSTR-1 late fee missed; wrong AATO band."
tests:
  worked_example: "GSTR-3B Aug-2025 due 20-09-2025 filed 30-10-2025: 40 days × Rs 50 = 2,000; AATO Rs 1 cr -> cap 2,000 -> fee 2,000 (1,000+1,000). Paid 1,000 total -> FEE_SHORT_PAID 1,000."
  positive: "Nil 3B filed 60 days late: 60 × 20 = 1,200 -> cap 500 -> fee 500; paid 500 -> MATCHED."
  negative: "AATO up to Rs 2 crore and GSTR-9 not filed for FY 2024-25 -> exempt (N.15/2025-CT) -> no fee."
implementation:
  handler: ""
  pseudocode: |-
    def rc_gst_023(filings, ecl, p):
        out = []
        for f in filings:
            days = max(0, (f.filing_date - f.due_date).days)
            if f.type in ('GSTR3B','GSTR1'):
                per = p.per_day_nil_total if f.nil else p.per_day_3b_total
                cap = 500 if f.nil else cap_by_aato(p.aato_prev_fy_inr)
                fee = min(days*per, cap)
            else:
                fee = gstr9_fee(days, p.aato_prev_fy_inr, f.state_turnover)
            paid = ecl.fee_debits(f)
            if fee - paid > 0: out.append(exc('FEE_NOT_PAID' if paid==0 else 'FEE_SHORT_PAID', f, diff=fee-paid))
            elif paid - fee > 0: out.append(exc('FEE_EXCESS_PAID', f, diff=paid-fee))
        return out
