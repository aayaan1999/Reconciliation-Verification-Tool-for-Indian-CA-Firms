schema_version: "1.0"
rule:
  id: "RC-GST-037"
  version: "1"
  type: "reconciliation"
  domain: "gst"
  category: "GST – ISD"
  name: "ISD distribution (GSTR-6 / ISD invoices) vs recipient GSTR-2B ISD section and books"
  purpose: "Check ITC distributed by the Input Service Distributor equals the ISD credits in each recipient unit's GSTR-2B and books, and that distribution follows the turnover ratio."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: "2025-04-01"
  valid_to: ""
  effective_text: "2025-04-01"
  period_basis: "tax period (month)"
legal:
  provisions: "CGST Act s.2(61), s.20 (as substituted by Finance Act 2024, ISD mandatory for common input services from 01.04.2025 – N.16/2024-CT); Rule 39 (manner of distribution; pro rata on turnover); Rule 54(1) (ISD invoice); GSTR-6 (13th); recipient GSTR-2B ISD section; GSTR-3B 4A(4)."
  applicability: "Entities with multiple GSTINs under same PAN receiving common input services."
  exemptions_exceptions: ""
  thresholds_rates: ""
  rounding: ""
  due_dates: ""
inputs:
  documents:
    - role: "A"
      doc_code: "GSTR2B"
      required: true
    - role: "B"
      doc_code: "PURCH_REG"
      required: true
    - role: "C"
      doc_code: "GSTR3B"
      required: false
  fields: []
  prerequisites: "ISD distribution register / GSTR-6 (ISD GSTIN, recipient GSTIN, ISD invoice no., date, eligible/ineligible ITC by head); each recipient's GSTR-2B ISD section; recipient books; turnover of recipients for ratio. Note: GSTR-6 is not in the fixed doc list – distribution register loaded as GL/PURCH_REG of ISD (see notes)."
  input_validations: "All recipient GSTINs same PAN as ISD."
matching:
  keys:
    - left: "ISD_REG.isd_gstin"
      right: "GSTR2B.isd_distributor_gstin"
    - left: "ISD_REG.isd_invoice_no"
      right: "GSTR2B.isd_doc_no"
    - left: "ISD_REG.recipient_gstin"
      right: "GSTR2B.gstin"
  key_normalisation: "Implementation choice: (1) Invoice/document number – uppercase, trim, collapse internal spaces, remove characters other than A-Z 0-9 '/' '-'; exact pass on this form. (2) Fuzzy pass key = strip '/', '-', spaces; strip leading zeros of each numeric run; strip common FY tokens (e.g. '2025-26', '25-26', '2526', 'FY26') – only if the remainder is still >= 3 characters. Law (Rule 46(b)) allows up to 16 characters, unique per FY. (3) GSTIN – uppercase, trim, validate 15-char pattern ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ and check digit (see GST-001). (4) Dates – parse DD-MM-YYYY, DD/MM/YYYY, DD-MON-YY, YYYY-MM-DD, Excel serials into ISO date. (5) Amounts – Decimal, 2 dp, negative for credit notes only after doc-type mapping."
  aggregation: "ISD document per recipient."
  comparisons:
    - left: "ISD_REG.itc_h"
      right: "GSTR2B.igst_amount/cgst_amount/sgst_amount/cess_amount"
    - left: "GSTR2B.isd_* total"
      right: "GSTR3B.4A4"
    - left: "ISD_REG.share"
      right: "turnover_ratio × total common credit"
  tolerance: "Rs 1 per head per document (implementation choice); ratio check Rs 10 per recipient."
calculation:
  formula: "share_i = C × turnover_i / Σ turnover_j (relevant period per Rule 39); head: recipient in other state -> IGST"
  steps:
    - "Match ISD documents to recipient 2B."
    - "Compare."
    - "Recompute shares; compare."
    - "Recipient 3B 4A(4) vs 2B ISD."
    - "Ineligible ITC distributed as eligible -> INELIGIBLE_AS_ELIGIBLE."
parameters:
  - key: "tolerance_inr"
    value: "1"
    type: "integer"
    unit: "INR"
    label: "Tolerance inr"
    editable: true
  - key: "ratio_tolerance_inr"
    value: "10"
    type: "integer"
    unit: "INR"
    label: "Ratio tolerance inr"
    editable: true
  - key: "turnover_basis"
    value: ""
    type: "string"
    unit: ""
    label: "Turnover basis"
    editable: true
outcomes:
  categories:
    - code: "MATCHED"
      description: ""
      severity: "Low"
    - code: "ISD_VALUE_DIFF"
      description: ""
      severity: "High"
    - code: "NOT_IN_RECIPIENT_2B"
      description: ""
      severity: "High"
    - code: "NOT_IN_ISD_REG"
      description: ""
      severity: "High"
    - code: "RATIO_DIFF"
      description: ""
      severity: "Medium"
    - code: "3B_4A4_DIFF"
      description: ""
      severity: "High"
    - code: "INELIGIBLE_AS_ELIGIBLE"
      description: ""
      severity: "Critical"
    - code: "HEAD_DIFF"
      description: ""
      severity: "High"
  default_severity: ""
  expected_output: "exception_id; rule_id; client_id; gstin; period; doc_a_ref (file+row); doc_b_ref; match_key; match_pass (exact/fuzzy); category; severity; field_name; value_a; value_b; difference; tolerance_applied; suggested_action; legal_reference; status (Open/Under review/Resolved/Accepted-as-is); reviewer; review_comment; created_at; isd_gstin; recipient_gstin; isd_doc; share_expected"
  recommended_action: "Revise distribution via ISD credit note/debit note; recipient correct 3B."
  common_discrepancies: "Cross-charge used instead of ISD after 01.04.2025; distribution in wrong month; RCM credits distribution (Rule 39(1A) – not verified)."
tests:
  worked_example: "Common credit IGST 1,00,000; turnover A 6 cr, B 4 cr -> A 60,000, B 40,000. Distributed A 70,000, B 30,000 -> RATIO_DIFF ±10,000. B 2B ISD 30,000; B 3B 4A(4) 40,000 -> 3B_4A4_DIFF 10,000."
  positive: "Shares per ratio and 2B equal -> MATCHED."
  negative: "Service attributable only to unit A distributed only to A -> no ratio exception."
implementation:
  handler: ""
  pseudocode: |-
    def rc_gst_037(isd_reg, g2b_by_recipient, g3b_by_recipient, turnover, p):
        out = []
        for r, g2b in g2b_by_recipient.items():
            pairs, ui, ug = match_exact(isd_reg[isd_reg.recipient==r], g2b.isd, [('isd_gstin','ctin'),('doc_n','docnum_n')])
            out += compare(pairs, ['igst','cgst','sgst','cess'], p.tolerance_inr)
            out += [exc('NOT_IN_RECIPIENT_2B', a) for a in ui] + [exc('NOT_IN_ISD_REG', None, x) for x in ug]
            if abs(g3b_by_recipient[r]['4A4'].total - g2b.isd.total) > p.tolerance_inr: out.append(exc('3B_4A4_DIFF', recipient=r))
        out += ratio_check(isd_reg, turnover, p.ratio_tolerance_inr)
        return out
sources:
  - title: "TaxGuru – ISD mandatory from 1 April 2025"
    url: "https://taxguru.in/goods-and-service-tax/input-service-distributor-mandatory-1st-april-2025.html"
    ref: "N.16/2024-CT; s.2(61), s.20"
    official: false
notes: "ISD mandate from 01.04.2025 verified via TaxGuru (N.16/2024-CT). GSTR-6 is not in the fixed document list – suggest new doc code GSTR6 (not added to the rule's doc fields; ISD register is used via doc_b PURCH_REG). Rule 39 turnover period not re-verified."
