  - title: "Rule 88C CGST Rules (Chhattisgarh GST dept copy)"
    url: "https://cggst.com/wp-content/uploads/2023/07/Rule-88C-3.pdf"
    ref: "Rule 88C inserted by N.26/2022-CT dt 26.12.2022; threshold 'as recommended by Council' – not stated"
    official: false
  - title: "BDO – GSTN advisory: online functionality for difference in tax liability (DRC-01B)"
    url: "https://www.bdo.in/en-gb/insights/alerts-updates/gstn-advisory-online-functionality-in-respect-of-the-difference-in-tax"
    ref: "Council-recommended predefined limit Rs 25 lakh (footnote) and 20%; GSTR-1/IFF of next period blocked if no reply"
    official: false
  - title: "Razorpay – DRC-01B guide"
    url: "https://razorpay.com/learn/drc-01b-gst-liability-mismatch-guide/"
    ref: "thresholds not publicly disclosed; DRC-01C 'around Rs 25 lakh / 20%'"
    official: false
  - title: "ClearTax – GST return filing rule changes from July 2025"
    url: "https://cleartax.in/s/gst-return-filing-rule-changes-from-july-2025"
    ref: "GSTN advisories 07.06.2025 (3B Table 3 lock), 3-year bar"
    official: false
  - title: "CompuTax – GSTR-3B ITC locking status (09.07.2026)"
    url: "https://www.computaxonline.com/blog/post/2026/07/09/gst-itc-auto-restriction-gstr-2b-gstr-3b-hard-locking"
    ref: "3.1/3.2 locked from July 2025 (Advisory 606); Table 4 lock not officially confirmed"
    official: false
  - title: "TaxGuru – GSTN 4 advisories December 2025"
    url: "https://taxguru.in/goods-and-service-tax/gstn-issues-4-advisories-december-2025-clarify-key-compliance-procedures.html"
    ref: "05.12.2025 Table 3.2 lock; 18.12.2025 IMS CN; 29.12.2025 ECRRS/RCM"
    official: false
  - title: "TaxGuru – Advisory on Form GSTR-1A"
    url: "https://taxguru.in/goods-and-service-tax/advisory-form-gstr-1a.html"
    ref: "N.12/2024-CT; from July 2024 period; once per period; window till 3B filed; auto-populates 3B"
    official: false
  - title: "TaxGuru – Finance Act 2025 GST amendments effective 01.10.2025"
    url: "https://taxguru.in/goods-and-service-tax/gst-amendments-finance-act-2025-effective-oct-1-2025-notified.html"
    ref: "N.16/2025-CT; s.34(2) proviso; s.38; s.39(1)"
    official: false
notes: "Rule 88C text verified (state dept copy) – threshold is 'as recommended by Council'; BDO footnote cites Rs 25 lakh and 20% recommended; Razorpay says thresholds are not publicly disclosed. Treat Rs 25 lakh / 20% as an unverified risk parameter. Hard-lock dates from secondary reproductions of GSTN advisories (Advisory 606). Mapping of GSTR-1 tables to 3B rows is GSTN auto-population logic as generally described – CA to confirm for ECO s.9(5) rows."
