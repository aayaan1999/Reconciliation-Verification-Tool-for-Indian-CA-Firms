schema_version: "1.0"
rule:
  id: "RC-GST-009"
  version: "1"
  type: "reconciliation"
  domain: "gst"
  category: "GST – E-invoicing"
  name: "E-invoice reporting time limit (30 days for AATO >= Rs 10 crore) and invoices without IRN"
  purpose: "Find invoices that were reported to the IRP more than 30 days after the document date by taxpayers with AATO >= Rs 10 crore (IRP rejects these; the invoice then cannot get an IRN)."
governance:
  enabled: false
  verification_status: "verified_secondary"
  verification_label: "Verified – secondary source only"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: "2025-04-01"
  valid_to: ""
  effective_text: "2025-04-01"
  period_basis: "tax period (month)"
legal:
  provisions: "GSTN advisory (Nov 2024) – 30-day reporting limit extended to taxpayers with AATO >= Rs 10 crore from 01.04.2025 (earlier AATO >= Rs 100 crore from 01.11.2023); Rule 48(4)-(5) CGST Rules."
  applicability: "E-invoice taxpayers with AATO >= Rs 10 crore; documents dated on/after 01.04.2025."
  exemptions_exceptions: ""
  thresholds_rates: ""
  rounding: ""
  due_dates: ""
inputs:
  documents:
    - role: "A"
      doc_code: "SALES_REG"
      required: true
    - role: "B"
      doc_code: "EINV"
      required: true
  fields: []
  prerequisites: "Sales register with document date and IRN; EINV with ack date."
  input_validations: "Dates parse; AATO param present."
matching:
  keys:
    - left: "SALES_REG.voucher_no"
      right: "EINV.doc_no"
    - left: "SALES_REG.doc_type (EINV codes INV|CRN|DBN)"
      right: "EINV.doc_type"
    - left: "SALES_REG.fy"
      right: "EINV.fy"
  key_normalisation: "Implementation choice: (1) Invoice/document number – uppercase, trim, collapse internal spaces, remove characters other than A-Z 0-9 '/' '-'; exact pass on this form. (2) Fuzzy pass key = strip '/', '-', spaces; strip leading zeros of each numeric run; strip common FY tokens (e.g. '2025-26', '25-26', '2526', 'FY26') – only if the remainder is still >= 3 characters. Law (Rule 46(b)) allows up to 16 characters, unique per FY. (3) GSTIN – uppercase, trim, validate 15-char pattern ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ and check digit (see GST-001). (4) Dates – parse DD-MM-YYYY, DD/MM/YYYY, DD-MON-YY, YYYY-MM-DD, Excel serials into ISO date. (5) Amounts – Decimal, 2 dp, negative for credit notes only after doc-type mapping."
  aggregation: "Document level."
  comparisons:
    - left: "SALES_REG.voucher_date"
      right: "EINV.doc_date"
    - left: "EINV.ack_date − EINV.doc_date"
      right: "max_days"
  tolerance: "Legal: 30 days (advisory). Implementation: warn at 25 days for unreported docs."
calculation:
  formula: "delay_days = (EINV.ack_date − EINV.doc_date).days; late = delay_days > max_report_days; unreported_age = (run_date − SALES_REG.invoice_date).days"
  steps:
    - "Applicability: AATO >= threshold."
    - "For each B2B/export doc in books, find IRN."
    - "If IRN exists compute delay_days (should not exceed 30 – IRP blocks; if found, indicates back-dating) -> DOC_DATE_BACKDATED."
    - "If no IRN and unreported_age > 30 -> IRN_TIME_EXPIRED; > warn_days -> IRN_DUE_SOON."
    - "Compare doc date in books with IRN doc date -> DATE_DIFF."
parameters:
  - key: "aato_threshold_inr"
    value: "100000000"
    type: "integer"
    unit: "INR"
    label: "Aato threshold inr"
    editable: true
  - key: "max_report_days"
    value: "30"
    type: "integer"
    unit: "days"
    label: "Max report days"
    editable: true
  - key: "warn_days"
    value: "25"
    type: "integer"
    unit: "days"
    label: "Warn days"
    editable: true
  - key: "applies_to_doc_types"
    value: "INV,CRN,DBN"
    type: "string"
    unit: ""
    label: "Applies to doc types"
    editable: true
outcomes:
  categories:
    - code: "ON_TIME"
      description: ""
      severity: "Low"
    - code: "DATE_DIFF"
      description: "books date differs from IRN doc date"
      severity: "High"
    - code: "IRN_DUE_SOON"
      description: "no IRN, age > warn days"
      severity: "High"
    - code: "IRN_TIME_EXPIRED"
      description: "no IRN, age > 30 days"
      severity: "Critical"
    - code: "DOC_DATE_BACKDATED"
      description: "IRN acknowledged > 30 days after doc date"
      severity: "High"
  default_severity: ""
  expected_output: "exception_id; rule_id; client_id; gstin; period; doc_a_ref (file+row); doc_b_ref; match_key; match_pass (exact/fuzzy); category; severity; field_name; value_a; value_b; difference; tolerance_applied; suggested_action; legal_reference; status (Open/Under review/Resolved/Accepted-as-is); reviewer; review_comment; created_at; delay_days; unreported_age"
  recommended_action: "IRN_TIME_EXPIRED: CA review – invoice cannot be registered; usually cancel in books and issue fresh invoice with current date (time of supply and interest implications to be assessed)."
  common_discrepancies: "Invoices raised manually during system downtime; back-dated invoices; month-end cut-off."
tests:
  worked_example: "AATO Rs 12 crore. Books: INV-1 dt 01-08-2025 IRN ack 05-08-2025 (4 days) ON_TIME; INV-2 dt 01-08-2025 no IRN on 10-09-2025 (40 days) IRN_TIME_EXPIRED; INV-3 dt 15-08-2025 books but IRN doc date 20-08-2025 -> DATE_DIFF."
  positive: "AATO Rs 9 crore -> rule not applicable."
  negative: "CN dated 01-08-2025 reported 05-09-2025 (35 days): whether CN/DN are covered – param applies_to_doc_types; default includes CRN/DBN pending CA confirmation."
implementation:
  handler: ""
  pseudocode: |-
    def rc_gst_009(books, einv, p):
        if p.aato < p.aato_threshold_inr: return []
        out = []
        for b in books[books.doc_type.isin(p.applies_to_doc_types) & (books.invoice_date>=date(2025,4,1))]:
            e = einv_lookup(einv, b)
            if e:
                if e.doc_date != b.invoice_date: out.append(exc('DATE_DIFF', b, e))
                if (e.ack_date - e.doc_date).days > p.max_report_days: out.append(exc('DOC_DATE_BACKDATED', b, e))
            else:
                age = (p.run_date - b.invoice_date).days
                if age > p.max_report_days: out.append(exc('IRN_TIME_EXPIRED', b, age=age))
                elif age > p.warn_days: out.append(exc('IRN_DUE_SOON', b, age=age))
        return out
sources:
  - title: "Taxmann – 30-day e-invoice reporting for AATO >= Rs 10 crore"
    url: "https://www.taxmann.com/post/blog/time-limit-of-30-days-for-reporting-e-invoice-on-irp-portal-for-taxpayers-with-aato-of-10-crores-and-above-gstn-update/"
    ref: "from 01.04.2025 (seen in search results)"
    official: false
notes: "The advisory was seen only in search results (Taxmann, MahaGST copy). Whether CN/DN are covered and the AATO basis (any FY vs preceding FY) must be confirmed from the advisory text."
