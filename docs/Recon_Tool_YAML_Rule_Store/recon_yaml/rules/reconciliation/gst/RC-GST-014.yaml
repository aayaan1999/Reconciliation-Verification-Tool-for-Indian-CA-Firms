    official: false
  - title: "Circular 170/02/2022-GST"
    url: "https://www.gstcouncil.gov.in/sites/default/files/2024-06/cir-170-02-2022-cgst.pdf"
    ref: "GSTR-3B Table 4 and 3.2 reporting"
    official: true
  - title: "CompuTax – GSTR-3B ITC locking status (09.07.2026)"
    url: "https://www.computaxonline.com/blog/post/2026/07/09/gst-itc-auto-restriction-gstr-2b-gstr-3b-hard-locking"
    ref: "3.1/3.2 locked from July 2025 (Advisory 606); Table 4 lock not officially confirmed"
    official: false
  - title: "TaxGuru – ITC reclaim ledger & RCM ledger hard validations"
    url: "https://taxguru.in/goods-and-service-tax/gstn-itc-reclaim-ledger-rcm-ledger-hard-validations-block-gstr-3b-filing.html"
    ref: "advisory 29.12.2025: 4D(1) <= reclaim balance + 4B(2) current; 4A(2)+4A(3) <= 3.1(d) + RCM ledger balance"
    official: false
notes: "Rule 88D notification (N.38/2023-CT dt 04.08.2023), 7-day reply and GSTR-1/IFF blocking verified via ClearTax and Taxo reproduction of GSTN advisory 06.10.2023; threshold not published officially. Table 4 hard-lock status as of Oct 2026 unconfirmed (CompuTax July 2026). Reclaim formula follows GSTN advisory 29.12.2025 hard-validation logic (TaxGuru)."
