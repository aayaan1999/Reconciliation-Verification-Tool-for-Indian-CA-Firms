schema_version: "1.0"
rule:
  id: "RC-GST-033"
  version: "1"
  type: "reconciliation"
  domain: "gst"
  category: "GST – Rate validation"
  name: "Rate check: sales register item HSN + rate vs rate master (GST 2.0 from 22.09.2025; tobacco 01.02.2026)"
  purpose: "Check every outward line's GST rate against the rate master for the HSN and the time of supply, especially across the 22.09.2025 changeover."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: "2025-09-22"
  valid_to: ""
  effective_text: "2025-09-22"
  period_basis: "invoice date / time of supply"
legal:
  provisions: "Goods: N.9/2025-CT(Rate) & N.9/2025-IT(Rate) dt 17.09.2025 (supersede 1/2017), effective 22.09.2025 – IGST schedules: I 5%, II 18%, III 40%, IV 3%, V 0.25%, VI 1.5%, VII 28% (VII omitted from 01.02.2026 by 19/2025-CT(Rate)/IT(Rate)); Services: N.15/2025-CT(Rate) amending 11/2017-CT(Rate), effective 22.09.2025; CGST s.14 (time of supply on change in rate); compensation cess Nil for listed items from 22.09.2025 (02/2025-CC(Rate)) and tobacco/pan masala from 01.02.2026 (03/2025-CC(Rate))."
  applicability: "All suppliers."
  exemptions_exceptions: ""
  thresholds_rates: ""
  rounding: ""
  due_dates: ""
inputs:
  documents:
    - role: "A"
      doc_code: "SALES_REG"
      required: true
    - role: "B"
      doc_code: "SALES_REG"
      required: true
  fields: []
  prerequisites: "Sales register line level (HSN, description, rate, cess, date, advance/payment date for s.14); rate master table (HSN prefix, description, rate, effective_from, effective_to, conditions) loaded from notifications – note: doc_b is the RATE MASTER table (no fixed doc code; uses SALES_REG as both sides with master lookup)."
  input_validations: "Rate master loaded with effective dates; HSN present."
matching:
  keys:
    - left: "SALES_REG.hsn_sac (longest prefix)"
      right: "RATE_MASTER.hsn_prefix"
    - expression: "SALES_REG.time_of_supply within RATE_MASTER.effective_from/effective_to range"
  key_normalisation: "HSN digits only; longest-prefix match (8 -> 6 -> 4 -> 2 digits) – implementation choice; services SAC 99xxxx."
  aggregation: "Line level."
  comparisons:
    - left: "SALES_REG.gst_rate"
      right: "RATE_MASTER.rate"
    - left: "SALES_REG.cess_rate"
      right: "RATE_MASTER.cess_rate"
  tolerance: "Exact (rates)."
calculation:
  formula: "expected_rate = master.lookup(hsn, tos); tos per s.14 when rate changes: if supply before change: invoice/payment after -> earlier of invoice/payment (old rate) etc.; implementation: if invoice_date and payment_date straddle 22.09.2025 apply s.14 matrix"
  steps:
    - "Determine time of supply (s.12/13; s.14 matrix if date straddles change: supply, invoice, payment)."
    - "Lookup expected rate (some entries have conditions e.g. value thresholds – mark CONDITIONAL)."
    - "Compare."
    - "Rate higher than expected -> EXCESS_RATE (refund/CN implications); lower -> SHORT_RATE (tax short)."
    - "HSN not in master -> HSN_UNMAPPED."
parameters:
  - key: "rate_master_version"
    value: ""
    type: "string"
    unit: ""
    label: "Rate master version"
    editable: true
  - key: "changeover_date"
    value: "2025-09-22"
    type: "string"
    unit: ""
    label: "Changeover date"
    editable: true
  - key: "tobacco_changeover"
    value: "2026-02-01"
    type: "string"
    unit: ""
    label: "Tobacco changeover"
    editable: true
outcomes:
  categories:
    - code: "RATE_OK"
      description: ""
      severity: "Low"
    - code: "SHORT_RATE"
      description: ""
      severity: "Critical"
    - code: "EXCESS_RATE"
      description: ""
      severity: "Medium"
    - code: "CESS_DIFF"
      description: ""
      severity: "High"
    - code: "HSN_UNMAPPED"
      description: ""
      severity: "Medium"
    - code: "CONDITIONAL_RATE"
      description: "needs condition check"
      severity: "Medium"
    - code: "TRANSITION_CHECK"
      description: "straddles 22.09.2025"
      severity: "Medium"
  default_severity: ""
  expected_output: "exception_id; rule_id; client_id; gstin; period; doc_a_ref (file+row); doc_b_ref; match_key; match_pass (exact/fuzzy); category; severity; field_name; value_a; value_b; difference; tolerance_applied; suggested_action; legal_reference; status (Open/Under review/Resolved/Accepted-as-is); reviewer; review_comment; created_at; hsn; expected_rate; charged_rate; tax_difference"
  recommended_action: "SHORT_RATE: pay differential tax with interest; issue supplementary invoice/DN; EXCESS_RATE: CN/refund considerations (unjust enrichment)."
  common_discrepancies: "ERP masters not updated on 22.09.2025; 12% and 28% slabs discontinued; tobacco items continued at 28% + cess until 01.02.2026; services rate changes (hotel, gym, salon)."
tests:
  worked_example: "Line: HSN 8703 (car) – rate per Sch II/III by engine/length conditions -> CONDITIONAL_RATE. Line: HSN 3401 (soap) invoice 25-09-2025 charged 18%; master 5% from 22.09.2025 (per Council list, verify) -> EXCESS_RATE; tax diff = txval 10,000 × 13% = 1,300. Line: invoice 20-09-2025 at old rate -> RATE_OK."
  positive: "Invoice 15-09-2025 at 12% for item whose old rate was 12% -> RATE_OK."
  negative: "Advance received 15-09-2025, invoice 25-09-2025, goods supplied 25-09-2025 -> s.14 matrix -> TRANSITION_CHECK (CA)."
implementation:
  handler: ""
  pseudocode: |-
    def rc_gst_033(lines, master, p):
        out = []
        for l in lines:
            tos = time_of_supply(l, change_date=p.changeover_date)
            m = master.lookup(l.hsn, tos)
            if m is None: out.append(exc('HSN_UNMAPPED', l)); continue
            if m.conditional: out.append(exc('CONDITIONAL_RATE', l, expected=m.rate)); continue
            if straddles(l, p.changeover_date): out.append(exc('TRANSITION_CHECK', l))
            if l.rate < m.rate: out.append(exc('SHORT_RATE', l, expected=m.rate, diff=l.txval*(m.rate-l.rate)/100))
            elif l.rate > m.rate: out.append(exc('EXCESS_RATE', l, expected=m.rate))
            if l.cess_rate != m.cess_rate: out.append(exc('CESS_DIFF', l))
        return out
sources:
  - title: "TaxHeal – N.9/2025-IT(Rate) schedules"
    url: "https://www.taxheal.com/?p=104994"
    ref: "Sch I 5%, II 18%, III 40%, IV 3%, V 0.25%, VI 1.5%, VII 28% (omitted 01.02.2026)"
    official: false
  - title: "GST Council 56th meeting press release"
    url: "https://gstcouncil.gov.in/sites/default/files/2025-09/press_release_press_information_bureau.pdf"
    ref: "5%/18%/40%; effective 22.09.2025"
    official: true
  - title: "GST Council FAQ on GST 2.0 rate changes"
    url: "https://gstcouncil.gov.in/sites/default/files/2025-09/faq.pdf"
    ref: "FAQ 60 (GTA 5%/18%)"
    official: true
  - title: "West Bengal CTD – GST updates Dec 2025"
    url: "https://comtax.wb.gov.in/GST/GST_PPU/GST_Updates_Dec_2025.pdf"
    ref: "19/2025-CT(Rate) w.e.f. 01.02.2026"
    official: true
notes: "Schedules and dates per GST-005/006. HSN-to-schedule mapping must be loaded from notification schedules (not reproduced). Example soap rate is illustrative from Council press material – CA must verify from master. RATE_MASTER is a reference table, not a document; consider adding code RATE_MASTER (new code suggested)."
