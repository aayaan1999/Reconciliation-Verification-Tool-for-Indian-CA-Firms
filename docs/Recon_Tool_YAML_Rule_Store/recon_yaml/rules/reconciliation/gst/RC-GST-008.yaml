schema_version: "1.0"
rule:
  id: "RC-GST-008"
  version: "1"
  type: "reconciliation"
  domain: "gst"
  category: "GST – E-invoicing"
  name: "E-invoice (IRN) data vs GSTR-1 and sales register; e-invoice applicability"
  purpose: "Confirm every B2B/export invoice of an e-invoice-applicable taxpayer has a valid IRN, the IRP data equals the books and GSTR-1, and auto-populated data was not edited without reason."
governance:
  enabled: false
  verification_status: "partially_verified"
  verification_label: "Partially verified"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: "2023-08-01"
  valid_to: ""
  effective_text: "2023-08-01"
  period_basis: "tax period (month)"
legal:
  provisions: "CGST Rule 48(4) (e-invoice via IRP for notified class), Rule 48(5) (invoice without IRN not a valid invoice), Rule 48(6); N.13/2020-CT as amended – threshold AATO > Rs 5 crore in any FY from 2017-18 w.e.f. 01.08.2023 (N.10/2023-CT); exempt classes (SEZ units, insurers, banks/NBFCs, GTA, passenger transport, multiplex – per N.13/2020 as amended; not re-verified); GSTN advisory on auto-population of e-invoice into GSTR-1 (B2B 4A/4B, EXP 6A, CDNR 9B, CDNUR exports)."
  applicability: "Taxpayers whose AATO exceeded Rs 5 crore in any FY from 2017-18 (from 01.08.2023), for B2B supplies, exports, and CN/DN to registered persons."
  exemptions_exceptions: ""
  thresholds_rates: ""
  rounding: ""
  due_dates: ""
inputs:
  documents:
    - role: "A"
      doc_code: "EINV"
      required: true
    - role: "B"
      doc_code: "GSTR1"
      required: true
    - role: "C"
      doc_code: "SALES_REG"
      required: false
  fields: []
  prerequisites: "IRN data export (GSTR-1 dashboard 'Download details from e-invoice (Excel)' or IRP API) with IRN, ack no., ack date, doc no., doc date, doc type, buyer GSTIN, values, status (Active/Cancelled); GSTR-1 JSON with 'src' and 'irn' fields; client AATO history."
  input_validations: "IRN 64 hex characters; ack date >= doc date; doc type in (INV, CRN, DBN)."
matching:
  keys:
    - left: "EINV.seller_gstin"
      right: "GSTR1.gstin"
    - left: "EINV.doc_type"
      right: "GSTR1.section_doc_type"
    - left: "EINV.doc_no"
      right: "GSTR1.b2b_invoice_no | exp_invoice_no | cdnr_note_no"
    - left: "EINV.fy"
      right: "fy(GSTR1.b2b_invoice_date | exp_invoice_date | cdnr_note_date)"
  key_normalisation: "Implementation choice: (1) Invoice/document number – uppercase, trim, collapse internal spaces, remove characters other than A-Z 0-9 '/' '-'; exact pass on this form. (2) Fuzzy pass key = strip '/', '-', spaces; strip leading zeros of each numeric run; strip common FY tokens (e.g. '2025-26', '25-26', '2526', 'FY26') – only if the remainder is still >= 3 characters. Law (Rule 46(b)) allows up to 16 characters, unique per FY. (3) GSTIN – uppercase, trim, validate 15-char pattern ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ and check digit (see GST-001). (4) Dates – parse DD-MM-YYYY, DD/MM/YYYY, DD-MON-YY, YYYY-MM-DD, Excel serials into ISO date. (5) Amounts – Decimal, 2 dp, negative for credit notes only after doc-type mapping. IRN is a 64-char hash – compare exactly (lower-case). Doc type map: INV->B2B/EXP, CRN->CDNR C, DBN->CDNR D."
  aggregation: "Document level."
  comparisons:
    - left: "EINV.irn"
      right: "GSTR1.b2b_irn"
    - left: "EINV.buyer_gstin"
      right: "GSTR1.b2b_recipient_gstin | cdnr_recipient_gstin"
    - left: "EINV.doc_date"
      right: "GSTR1.b2b_invoice_date | exp_invoice_date | cdnr_note_date"
    - left: "EINV.val_total_invoice"
      right: "GSTR1.b2b_invoice_value | exp_invoice_value | cdnr_note_value"
    - left: "EINV.val_assessable"
      right: "GSTR1.b2b_taxable_value | exp_taxable_value | cdnr_taxable_value"
    - left: "EINV.val_igst/cgst/sgst/cess"
      right: "GSTR1 heads"
    - left: "EINV.irn_status"
      right: "presence in GSTR1"
    - left: "EINV.doc_no"
      right: "SALES_REG.voucher_no"
  tolerance: "Rs 0 on values where src=e-invoice (data is copied by system) – any difference means edit; Rs 1 vs books (implementation choice)."
calculation:
  formula: "einv_applicable = max(AATO_fy for fy in FY2017-18..preceding FY) > einv_threshold_inr; edited = GSTR1.src != 'e-invoice' and EINV.status=='Active' and same doc found"
  steps:
    - "Determine applicability from AATO history (param list)."
    - "Match EINV active docs to GSTR-1 docs."
    - "Compare values."
    - "Active IRN not in GSTR-1 -> IRN_NOT_IN_GSTR1."
    - "Cancelled IRN still in GSTR-1 -> CANCELLED_IRN_REPORTED."
    - "GSTR-1 B2B/EXP/CDNR doc without IRN while applicable -> NO_IRN (invalid invoice – Rule 48(5))."
    - "GSTR-1 doc where IRN exists but src blank -> EDITED_AFTER_AUTOPOP."
    - "Books doc vs EINV -> IRN_NOT_IN_BOOKS / BOOKS_NO_IRN."
parameters:
  - key: "einv_threshold_inr"
    value: "50000000"
    type: "integer"
    unit: "INR"
    label: "Einv threshold inr"
    editable: true
  - key: "aato_history"
    value: "{}"
    type: "string"
    unit: ""
    label: "Aato history"
    editable: true
  - key: "client_exempt_class"
    value: "false"
    type: "boolean"
    unit: ""
    label: "Client exempt class"
    editable: true
outcomes:
  categories:
    - code: "MATCHED"
      description: ""
      severity: "Low"
    - code: "VALUE_DIFF"
      description: "values differ"
      severity: "High"
    - code: "IRN_NOT_IN_GSTR1"
      description: "active IRN not reported"
      severity: "High"
    - code: "CANCELLED_IRN_REPORTED"
      description: "cancelled IRN still in GSTR-1"
      severity: "High"
    - code: "NO_IRN"
      description: "applicable B2B/export doc without IRN"
      severity: "Critical"
    - code: "EDITED_AFTER_AUTOPOP"
      description: "auto-populated doc edited (IRN blanked)"
      severity: "Medium"
    - code: "BOOKS_NO_IRN"
      description: "books invoice lacks IRN"
      severity: "Critical"
    - code: "IRN_NOT_IN_BOOKS"
      description: "IRN with no books entry"
      severity: "High"
    - code: "EXEMPT_ENTITY"
      description: "client in exempt class"
      severity: "Low"
  default_severity: ""
  expected_output: "exception_id; rule_id; client_id; gstin; period; doc_a_ref (file+row); doc_b_ref; match_key; match_pass (exact/fuzzy); category; severity; field_name; value_a; value_b; difference; tolerance_applied; suggested_action; legal_reference; status (Open/Under review/Resolved/Accepted-as-is); reviewer; review_comment; created_at; irn; ack_no; ack_date; einv_status; gstr1_src"
  recommended_action: "NO_IRN / BOOKS_NO_IRN: Critical – invoice not valid under Rule 48(5); generate IRN (subject to 30-day limit, RC-GST-009) or cancel and reissue; inform buyer. CANCELLED_IRN_REPORTED: amend GSTR-1."
  common_discrepancies: "Invoices raised from a second billing system without IRP integration; IRN cancelled after 24 hours not possible so CN issued instead; invoice edited in GSTR-1 after auto-population; amendments in GSTR-1 not reflected in IRP."
tests:
  worked_example: "AATO FY 2024-25 Rs 7 crore -> applicable. EINV Aug-2025: INV/101 active txval 2,00,000 IGST 36,000; INV/102 cancelled; INV/103 active. GSTR-1 Aug: INV/101 src e-invoice same values -> MATCHED; INV/102 present -> CANCELLED_IRN_REPORTED; INV/103 missing -> IRN_NOT_IN_GSTR1; INV/104 B2B without IRN -> NO_IRN (invoice invalid; buyer ITC risk)."
  positive: "Client AATO max Rs 4.8 crore all years -> not applicable; NO_IRN rule skipped."
  negative: "B2C invoices of e-invoice taxpayer (no IRN needed; dynamic QR code is separate requirement) -> not flagged NO_IRN."
implementation:
  handler: ""
  pseudocode: |-
    def rc_gst_008(einv, g1, books, p):
        if p.client_exempt_class: return [exc('EXEMPT_ENTITY')]
        applicable = max(p.aato_history.values(), default=0) > p.einv_threshold_inr
        act, can = einv[einv.status=='ACT'], einv[einv.status=='CNL']
        docs = concat(g1.b2b, g1.exp, g1.cdnr)
        pairs, ue, ug = match_exact(act, docs, [('doc_n','inum_n'),('fy','fy')])
        out = compare(pairs, ['txval','iamt','camt','samt','csamt','val'], 0)
        out += [exc('EDITED_AFTER_AUTOPOP', a, x) for a, x in pairs if x.src != 'e-invoice']
        out += [exc('IRN_NOT_IN_GSTR1', a) for a in ue]
        out += [exc('CANCELLED_IRN_REPORTED', c) for c in can if c.doc_n in set(docs.inum_n)]
        if applicable: out += [exc('NO_IRN', None, x) for x in ug if x.doc_date >= date(2023,8,1)]
        out += books_vs_einv(books, einv)
        return out
sources:
  - title: "GSTN advisory – auto-population of e-invoice details into GSTR-1 (ICMAI copy)"
    url: "https://icmai.in/upload/Taxation/Advisory_auto-population_GSTR-1.pdf"
    ref: "B2B 4A/4B, EXP 6A, CDNR 9B, CDNUR(exports) auto-populated; edits blank the IRN; cancelled IRN deleted"
    official: false
  - title: "EY – e-invoicing threshold lowered to Rs 5 crore"
    url: "https://www.ey.com/en_in/alerts-hub/2023/05/cbic-lowers-turnover-threshold-for-e-invoicing-to-inr5-crores-with-effect-from-1-august-2023"
    ref: "N.10/2023-CT (seen in search results)"
    official: false
notes: "Auto-population behaviour verified from GSTN advisory copy (ICMAI). Rs 5 crore threshold (N.10/2023-CT) seen in search results only (EY). Exempt classes from statute knowledge – CA to confirm. AATO test 'any preceding FY from 2017-18' is the common reading – CA review."
