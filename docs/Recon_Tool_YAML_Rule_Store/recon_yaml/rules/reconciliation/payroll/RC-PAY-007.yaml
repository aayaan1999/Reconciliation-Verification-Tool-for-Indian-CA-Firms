schema_version: "1.0"
rule:
  id: "RC-PAY-007"
  version: "1"
  type: "reconciliation"
  domain: "payroll"
  category: "Payroll – Labour Codes"
  name: "Code on Wages 50% wage-definition check – payroll wage components vs statutory 'wages' used for PF/ESI/gratuity"
  purpose: "For each employee-month, compute statutory wages = included components + excess of excluded components over 50% of total remuneration, and compare with the PF/ESI wage base used in payroll/ECR."
governance:
  enabled: false
  verification_status: "verified_secondary"
  verification_label: "Verified – secondary source only"
  reviewed_by: ""
  reviewed_on: ""
  review_decision: ""
  last_modified_by: "import"
  last_modified_on: "2026-10-14"
  change_note: "Imported from Recon_Tool_Rulebook_v2.xlsx (research date 13-10-2026)"
validity:
  valid_from: "2025-11-21"
  valid_to: ""
  effective_text: "2025-11-21"
  period_basis: "wage month"
legal:
  provisions: "Code on Wages 2019 s.2(y) and proviso; Code on Social Security 2020 s.2(88) and proviso (in force 21-11-2025 per S.O. 5319(E)/5322(E)); MoLE FAQs 16-03-2026 (clarification) – round-1 PAY-001/002."
  applicability: "All employers from 21-11-2025."
  exemptions_exceptions: ""
  thresholds_rates: ""
  rounding: ""
  due_dates: ""
inputs:
  documents:
    - role: "A"
      doc_code: "PAYROLL_REG"
      required: true
    - role: "B"
      doc_code: "ECR"
      required: true
  fields: []
  prerequisites: "Payroll component master tagging each pay head as INCLUDED (basic, DA, retaining allowance) or EXCLUDED (HRA, conveyance, overtime, commission, bonus, employer PF etc.) – CA-maintained from the bare Act."
  input_validations: "Every pay head tagged."
matching:
  keys:
    - left: "PAYROLL_REG.uan"
      right: "ECR.uan"
    - left: "PAYROLL_REG.wage_month"
      right: "ECR.wage_month"
  key_normalisation: "As RC-PAY-001."
  aggregation: "employee + month."
  comparisons:
    - left: "computed_code_wages"
      right: "PAYROLL_REG.pf_wages"
    - left: "computed_code_wages"
      right: "ECR.epf_wages (before ceiling)"
  tolerance: "₹1."
calculation:
  formula: "total = W_inc + W_exc; code_wages = W_inc + max(0, W_exc − 0.5 × total)"
  steps:
    - "Sum included and excluded components."
    - "Compute add-back."
    - "Compare with PF wage base (pre-ceiling) and ESI wage base."
    - "Flag under-statement; note if employer restricts to ceiling the add-back may have no contribution effect."
parameters:
  - key: "exclusion_cap_pct"
    value: "50"
    type: "integer"
    unit: "percent"
    label: "Exclusion cap pct"
    editable: true
  - key: "apply_from"
    value: "2025-11-21"
    type: "string"
    unit: ""
    label: "Apply from"
    editable: true
outcomes:
  categories:
    - code: "COMPLIANT"
      description: "compliant"
      severity: "Low"
    - code: "WAGES_UNDERSTATED"
      description: "base below code wages"
      severity: "High"
    - code: "NO_EFFECT_CEILING"
      description: "understated but contribution capped at ceiling anyway"
      severity: "Low"
    - code: "COMPONENT_UNMAPPED"
      description: "component unmapped"
      severity: "Medium"
  default_severity: ""
  expected_output: "emp, month, w_inc, w_exc, total, code_wages, payroll_pf_wages, diff, contribution_effect, category, severity"
  recommended_action: "Restructure wage base; compute arrears from 21-11-2025 if required (CA judgement)."
  common_discrepancies: "Special allowance treated as excluded; in-kind remuneration; gratuity base."
tests:
  worked_example: "CTC components: basic 20,000; HRA 15,000; special allowance 15,000 → total 50,000; excluded 30,000; 50% = 25,000; add-back 5,000 → code wages 25,000. Payroll PF wages 20,000 → WAGES_UNDERSTATED 5,000; if restricted to ₹15,000 ceiling (pre 17-09-2026) → NO_EFFECT_CEILING."
  positive: "Basic 30,000, HRA 10,000 → excluded 10,000 ≤ 20,000 → code wages 30,000 = PF wages → COMPLIANT."
  negative: "Unmapped 'Flexi pay' head → COMPONENT_UNMAPPED."
implementation:
  handler: ""
  pseudocode: |-
    def rc_pay_007(payroll, cmap):
        for e in payroll:
            inc = sum(v for k,v in e.heads.items() if cmap[k]=='INC'); exc = sum(v for k,v in e.heads.items() if cmap[k]=='EXC')
            cw = inc + max(0, exc - 0.5*(inc+exc))
            yield cmp(cw, e.pf_wages_pre_ceiling)
sources:
  - title: "KS&K – 50% wage rule under Labour Codes"
    url: "https://ksandk.com/labour-employment/50-wage-rule-labour-codes-salary-pf-gratuity/"
    ref: "50% wage definition"
    official: false
  - title: "SGCMS – FAQs by EPFO: wage ceiling raised to ₹25,000"
    url: "https://www.sgcms.com/regulatory-updates/faqs-by-epfo-wage-ceiling-raised-to-25000/"
    ref: "ceiling ₹25,000 from 17-09-2026; Sep-2026 split"
    official: false
notes: "Section text not opened on official site (round-1 PAY-002). Inclusion list must be confirmed from bare Act."
