schema_version: "1.0"
document:
  code: "GSTR7"
  name: "FORM GSTR-7 – Return for tax deducted at source (GST TDS u/s 51)"
  issuer_system: "GST portal (filed by deductor); deductee sees in GSTR-2A TDS & TDS/TCS credit received"
  legal_basis: "s.51 & s.39(3) CGST Act; Rule 66 CGST Rules; Notification 09/2025-CT dt 11.02.2025 (invoice-wise details, effective 01.04.2025 – portal functionality deferred per GSTN advisory 07.05.2025)"
  new_form_no: "GSTR-7A = TDS certificate"
  frequency: "monthly"
  formats_available: "Online; offline tool JSON/CSV; PDF; GSTR-7A certificate PDF"
  how_obtained: "Deductor: GST portal > Returns > GSTR-7; Deductee: Returns > TDS and TCS credit received / GSTR-2A TDS"
  due_date: "10th of following month"
  tables_used: "3 Details of tax deducted at source; 4 Amendments; 5 Tax deduction at source and paid; 6 Interest, late fee payable and paid; 7 Refund claimed; 8 Debit entries in cash ledger"
  used_by_rules:
    - "RC-GST-035"
  verification_status: "verified_secondary"
  notes: "Deductee recon: GSTR-7 (via 2A TDS / TDS credit received) vs deductee SALES_REG receipts from government deductors and vs 26AS-type ledger. Invoice-wise reporting amended in law from 01.04.2025 but portal deferred (status as of Oct 2026 not re-checked)."
  sources:
    - title: "FORM GSTR-7 (Chhattisgarh GST copy)"
      url: "https://www.cggst.com/uploads/document/1745416157-r-07.pdf"
      ref: ""
      official: false
    - title: "GSTN advisory 07.05.2025 – deferment of invoice-wise reporting in GSTR-7 (TaxO)"
      url: "https://taxo.online/latest-news/07-05-2025-gstn-issued-advisory-on-deferment-invoice-wise-reporting-functionality-in-form-gstr-7/"
      ref: "N.09/2025-CT"
      official: false
    - title: "FAQs > Form GSTR-7 (GST portal)"
      url: "https://tutorial.gst.gov.in/userguide/returns/GSTR7_FAQ.htm"
      ref: "seen in search results only"
      official: true
fields:
  - name: "deductor_gstin"
    label: "GSTIN (of deductor)"
    source_path: "1"
    data_type: "string"
    required: "yes"
    validation: "GSTIN with TDS registration (13th char 'D' – unverified)"
    description: ""
    origin: "catalogue"
  - name: "return_period"
    label: "Tax period"
    source_path: "header"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "deductee_gstin"
    label: "GSTIN of deductee"
    source_path: "Table 3 col 1"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Match to deductee GSTR-2A tds[].gstin_deductor side"
    origin: "catalogue"
  - name: "amount_paid"
    label: "Amount paid to deductee on which tax is deducted"
    source_path: "Table 3 col 2"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Taxable value; TDS applies where contract value > Rs 2.5 lakh"
    origin: "catalogue"
  - name: "tds_igst"
    label: "Amount of tax deducted at source – Integrated Tax"
    source_path: "Table 3 col 3"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; = 2% of col 2 (inter-State)"
    description: ""
    origin: "catalogue"
  - name: "tds_cgst"
    label: "Amount of tax deducted at source – Central Tax"
    source_path: "Table 3 col 4"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; = 1% of col 2"
    description: ""
    origin: "catalogue"
  - name: "tds_sgst"
    label: "Amount of tax deducted at source – State/UT Tax"
    source_path: "Table 3 col 5"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; = 1% of col 2"
    description: ""
    origin: "catalogue"
  - name: "deductee_invoice_no"
    label: "Invoice number (invoice-wise reporting)"
    source_path: "Table 3 (as amended by N.09/2025-CT) [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: "max 16 chars"
    description: "Pending portal deployment"
    origin: "catalogue"
  - name: "deductee_invoice_date"
    label: "Invoice date"
    source_path: "Table 3 (amended) [JSON name unverified]"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "amend_original_month"
    label: "Original details – Month"
    source_path: "Table 4 col 1"
    data_type: "string"
    required: "no"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "amend_original_gstin"
    label: "Original GSTIN of deductee"
    source_path: "Table 4 col 2"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: ""
    origin: "catalogue"
  - name: "amend_revised_gstin"
    label: "Revised GSTIN of deductee"
    source_path: "Table 4 col 4"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: ""
    origin: "catalogue"
  - name: "amend_revised_amount"
    label: "Revised amount paid to deductee"
    source_path: "Table 4 col 5"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "tds_paid"
    label: "Tax deducted – Amount paid (IGST/CGST/SGST)"
    source_path: "Table 5"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Reconcile with ECL debit"
    origin: "catalogue"
  - name: "interest_payable_paid"
    label: "Interest on TDS – payable / paid"
    source_path: "Table 6(I)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "late_fee_payable_paid"
    label: "Late fee – payable / paid (CGST/SGST)"
    source_path: "Table 6(II)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "arn"
    label: "ARN"
    source_path: "Filing"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "filing_date"
    label: "Date of filing"
    source_path: "Filing"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "tds_credit_action"
    label: ""
    source_path: ""
    data_type: "enum Accept|Reject|Pending"
    required: ""
    validation: ""
    description: "Deductee's action on the TDS credit in the GST portal 'TDS and TCS Credit Received' functionality for this GSTR-7 entry; not part of GSTR-7 itself. Source: download of TDS/TCS credit received for the deductee GSTIN."
    origin: "new (design)"
  - name: "tds_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Per head: tds_igst / tds_cgst / tds_sgst."
    origin: "derived"
