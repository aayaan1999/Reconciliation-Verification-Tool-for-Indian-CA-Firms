schema_version: "1.0"
document:
  code: "CLIENT_INVOICE"
  name: "Client-provided invoice copies (sales/purchase tax invoices, CN/DN)"
  issuer_system: "Client (scanned PDF / e-invoice PDF with QR) – OCR/extracted to structured data"
  legal_basis: "CGST Act s.31 read with CGST Rules 46 (tax invoice particulars), 53 (debit/credit note), 48 (e-invoice / IRN, QR code) – contents prescribed by law; extraction field set is implementation design"
  new_form_no: ""
  frequency: "Ad hoc (sample-based vouching)"
  formats_available: "PDF / image (OCR), e-invoice JSON/QR"
  how_obtained: "Client uploads invoice copies; tool extracts fields (OCR / QR decode for signed e-invoice)"
  due_date: ""
  tables_used: "Supplier & recipient details; document details; line items; tax; totals; IRN/QR; signature"
  used_by_rules:
    - "RC-ACC-011"
  verification_status: "unverified"
  notes: "Mandatory invoice particulars per CGST Rule 46 are from professional knowledge (not re-opened this session – see gst.json for verified sources). Extraction fields and OCR confidence are implementation design."
  sources:
    - title: "Tally – Sample Excel files for import (field names & aliases)"
      url: "https://help.tallysolutions.com/tally-prime/import-data/download-sample-excel-files-with-data-for-import"
      ref: "Voucher Date, Voucher Number, Party Name, Buyer/Supplier GSTIN/UIN, Item, Rate, Quantity, Ledger Group"
      official: false
fields:
  - name: "supplier_name"
    label: "Name of supplier"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "supplier_gstin"
    label: "GSTIN of supplier"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "supplier_address"
    label: "Address of supplier"
    source_path: "Header"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "invoice_no"
    label: "Invoice number (consecutive, max 16 chars)"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Za-z0-9/\\-]{1,16}$"
    description: "Rule 46(b)."
    origin: "catalogue"
  - name: "invoice_date"
    label: "Date of issue"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "document_type"
    label: "Document type"
    source_path: "Header"
    data_type: "enum"
    required: "yes"
    validation: "INV|CRN|DBN|BOS"
    description: ""
    origin: "catalogue"
  - name: "recipient_name"
    label: "Name of recipient"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "recipient_gstin"
    label: "GSTIN/UIN of recipient"
    source_path: "Header"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "place_of_supply"
    label: "Place of supply (state name & code)"
    source_path: "Header"
    data_type: "string"
    required: ""
    validation: ""
    description: "Required for inter-state."
    origin: "catalogue"
  - name: "hsn_sac"
    label: "HSN/SAC"
    source_path: "Line"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "description"
    label: "Description of goods/services"
    source_path: "Line"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "quantity"
    label: "Quantity"
    source_path: "Line"
    data_type: "decimal"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "uqc"
    label: "Unit"
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "taxable_value"
    label: "Taxable value"
    source_path: "Line"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "gst_rate"
    label: "Rate of tax"
    source_path: "Line"
    data_type: "decimal"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "igst"
    label: "IGST amount"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "cgst"
    label: "CGST amount"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "sgst"
    label: "SGST/UTGST amount"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "cess"
    label: "Cess"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "invoice_total"
    label: "Total invoice value"
    source_path: "Total"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "reverse_charge"
    label: "Whether tax payable on reverse charge"
    source_path: "Header"
    data_type: "enum"
    required: "yes"
    validation: "Y|N"
    description: ""
    origin: "catalogue"
  - name: "irn"
    label: "IRN"
    source_path: "e-Invoice"
    data_type: "string"
    required: "no"
    validation: "64 hex chars"
    description: "Validate via signed QR."
    origin: "catalogue"
  - name: "irn_ack_no"
    label: "Ack No."
    source_path: "e-Invoice"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "irn_ack_date"
    label: "Ack Date"
    source_path: "e-Invoice"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "signature_present"
    label: "Signature / digital signature"
    source_path: "Footer"
    data_type: "boolean"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "ocr_confidence"
    label: "Extraction confidence (tool)"
    source_path: "Meta"
    data_type: "decimal"
    required: "no"
    validation: "0-1"
    description: "Implementation field."
    origin: "catalogue"
