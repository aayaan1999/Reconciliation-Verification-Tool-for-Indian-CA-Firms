schema_version: "1.0"
document:
  code: "GSTR2A"
  name: "FORM GSTR-2A – Auto-drafted details of inward supplies (dynamic)"
  issuer_system: "GST portal (auto-drafted from suppliers' GSTR-1/IFF/1A, GSTR-5, GSTR-6, GSTR-7, GSTR-8, ICEGATE)"
  legal_basis: "s.38 CGST Act (as substituted) / Rule 60 CGST Rules"
  new_form_no: ""
  frequency: "monthly (dynamic, updates as suppliers file)"
  formats_available: "Online view; Excel and JSON download (section-wise), via API"
  how_obtained: "GST portal > Returns Dashboard > period > GSTR-2A > Download (Excel / JSON)"
  due_date: "Not applicable (statement)"
  tables_used: "Part A: B2B, B2BA, CDN, CDNA (CDNR), ECO documents; Part B: ISD, ISDA; Part C: TDS, TDSA, TCS; Part D: IMPG, IMPGSEZ (ICEGATE). GSTR-9 Table 8A was based on 2A up to FY 2022-23"
  used_by_rules:
    - "RC-GST-016"
  verification_status: "verified_secondary"
  notes: "Keys from india-compliance RawField2a (OSS implementation of GSTN download API) – secondary; not seen in GSTN's own schema. Section key names (b2b, b2ba, cdn, cdna, isd, isda, impg, impgsez, tds, tcs) inferred from that code. GSTR-2A is dynamic: always store download timestamp. Do not use 2A for ITC eligibility after 01.01.2022 (s.16(2)(aa) – 2B is the reference) except for GSTR-9 8A history up to FY 2022-23."
  sources:
    - title: "india-compliance – GSTR-2A/2B/IMS portal JSON keys (gst_returns/fields/gstr2.py, ims.py)"
      url: "https://github.com/resilient-tech/india-compliance"
      ref: "RawField2a, RawField2b, ims.RawField"
      official: false
    - title: "Manual > GSTR-9 (8A source change 2A -> 2B)"
      url: "https://tutorial.gst.gov.in/userguide/returns/Manual_gstr9.htm"
      ref: ""
      official: true
fields:
  - name: "gstin"
    label: "GSTIN of recipient"
    source_path: "header"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: ""
    origin: "catalogue"
  - name: "return_period"
    label: "Tax period"
    source_path: "header"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "supplier_gstin"
    label: "GSTIN of supplier"
    source_path: "b2b[].ctin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Match key"
    origin: "catalogue"
  - name: "supplier_name"
    label: "Trade/Legal name"
    source_path: "b2b[].trdnm"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "gstr1_filing_status"
    label: "GSTR-1/IFF/GSTR-5 filing status"
    source_path: "b2b[].cfs"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: "Supplier filed GSTR-1"
    origin: "catalogue"
  - name: "gstr3b_filing_status"
    label: "GSTR-3B filing status of supplier"
    source_path: "b2b[].cfs3b"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: "Used for Rule 37A test"
    origin: "catalogue"
  - name: "gstr1_filing_date"
    label: "GSTR-1/IFF/GSTR-5 filing date"
    source_path: "b2b[].fldtr1"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Supplier filing date"
    origin: "catalogue"
  - name: "gstr1_period"
    label: "GSTR-1/IFF/GSTR-5 period"
    source_path: "b2b[].flprdr1"
    data_type: "string"
    required: "no"
    validation: "MMYYYY e.g. '092026'"
    description: "Supplier's period"
    origin: "catalogue"
  - name: "supplier_cancellation_date"
    label: "Effective date of cancellation"
    source_path: "b2b[].dtcancel"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Supplier registration cancelled – ITC risk"
    origin: "catalogue"
  - name: "invoice_no"
    label: "Invoice number"
    source_path: "b2b[].inv[].inum"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Match key"
    origin: "catalogue"
  - name: "invoice_date"
    label: "Invoice Date"
    source_path: "b2b[].inv[].idt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "invoice_value"
    label: "Invoice Value"
    source_path: "b2b[].inv[].val"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "invoice_type"
    label: "Invoice type"
    source_path: "b2b[].inv[].inv_typ"
    data_type: "enum"
    required: "yes"
    validation: "R | SEWP | SEWOP | DE"
    description: ""
    origin: "catalogue"
  - name: "pos"
    label: "Place of supply"
    source_path: "b2b[].inv[].pos"
    data_type: "string"
    required: "yes"
    validation: "2-digit state code 01-38 or 96/97 (other territory / outside India); zero-padded string e.g. '07'"
    description: ""
    origin: "catalogue"
  - name: "reverse_charge"
    label: "Supply Attract Reverse Charge"
    source_path: "b2b[].inv[].rchrg"
    data_type: "enum"
    required: "yes"
    validation: "Y/N"
    description: ""
    origin: "catalogue"
  - name: "amendment_period"
    label: "Amended in period"
    source_path: "b2ba[].inv[].aspd"
    data_type: "string"
    required: "no"
    validation: "MMYYYY e.g. '092026'"
    description: "Period in which amended"
    origin: "catalogue"
  - name: "amendment_type"
    label: "Type of amendment"
    source_path: "b2ba[].inv[].atyp"
    data_type: "enum"
    required: "no"
    validation: "R (Receiver GSTIN amended) | N (Invoice number amended) | D (Other details amended)"
    description: ""
    origin: "catalogue"
  - name: "original_invoice_no"
    label: "Original invoice number"
    source_path: "b2ba[].inv[].oinum"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "original_invoice_date"
    label: "Original invoice date"
    source_path: "b2ba[].inv[].oidt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "diff_percent"
    label: "Applicable % of Tax Rate"
    source_path: "*.diff_percent"
    data_type: "decimal"
    required: "no"
    validation: "0.65 or 1"
    description: ""
    origin: "catalogue"
  - name: "irn"
    label: "IRN"
    source_path: "*.irn"
    data_type: "string"
    required: "no"
    validation: "64 chars"
    description: ""
    origin: "catalogue"
  - name: "irn_date"
    label: "IRN Date"
    source_path: "*.irngendate"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "source_type"
    label: "Source"
    source_path: "*.srctyp"
    data_type: "string"
    required: "no"
    validation: ""
    description: "e-Invoice / manual"
    origin: "catalogue"
  - name: "note_no"
    label: "Note number"
    source_path: "cdn[].nt[].nt_num"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "CDN key"
    origin: "catalogue"
  - name: "note_type"
    label: "Note type"
    source_path: "cdn[].nt[].ntty"
    data_type: "enum"
    required: "yes"
    validation: "C | D"
    description: ""
    origin: "catalogue"
  - name: "note_date"
    label: "Note date"
    source_path: "cdn[].nt[].nt_dt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
