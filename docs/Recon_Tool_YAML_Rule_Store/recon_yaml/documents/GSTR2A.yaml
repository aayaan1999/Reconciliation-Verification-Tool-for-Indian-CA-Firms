    source_path: "impg[].refdt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "sez_gstin"
    label: "GSTIN of SEZ supplier"
    source_path: "impgsez[].sgstin"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: ""
    origin: "catalogue"
  - name: "sez_trade_name"
    label: "Trade name of SEZ"
    source_path: "impgsez[].tdname"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "tds_deductor_gstin"
    label: "GSTIN of Deductor"
    source_path: "tds[].gstin_deductor"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
