    source_path: "cdna[].nt[].ont_num"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "original_note_date"
    label: "Original note date"
    source_path: "cdna[].nt[].ont_dt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "rate"
    label: "Rate (%)"
    source_path: "*.itms[].itm_det.rt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: ""
    origin: "catalogue"
  - name: "taxable_value"
    label: "Taxable Value"
    source_path: "*.itms[].itm_det.txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "igst_amount"
    label: "Integrated Tax"
    source_path: "*.itms[].itm_det.iamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
