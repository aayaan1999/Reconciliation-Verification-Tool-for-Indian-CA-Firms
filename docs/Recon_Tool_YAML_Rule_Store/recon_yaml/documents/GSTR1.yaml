schema_version: "1.0"
document:
  code: "GSTR1"
  name: "FORM GSTR-1 – Details of outward supplies of goods or services"
  issuer_system: "GST portal (gst.gov.in) – filed by supplier; downloadable JSON/Excel from Returns Dashboard / offline tool"
  legal_basis: "s.37 CGST Act; Rule 59(1), CGST Rules 2017; Notification 78/2020-CT (HSN digits); Notification 26/2022-CT (Tables 14 & 15); HSN Phase-III & Table 13 mandatory per GSTN advisory dt 01.05.2025"
  new_form_no: ""
  frequency: "monthly (or quarterly under QRMP, AATO up to Rs 5 crore)"
  formats_available: "JSON (portal download / GST Offline Tool import), Excel (offline tool template), PDF (filed return summary)"
  how_obtained: "GST portal > Returns Dashboard > period > GSTR-1/IFF > Prepare Online/Offline > Download (JSON via offline tool 'Download filed GSTR-1'); or ERP/GSP export"
  due_date: "11th of following month (monthly); 13th of month following quarter (QRMP) – Rule 59; extensions by notification"
  tables_used: "4A/4B/6B/6C (b2b: regular, RCM, SEZ WP/WOP, deemed export); 5 (b2cl); 6A (exp: WPAY/WOPAY); 7 (b2cs); 8 (nil: nil/exempt/non-GST); 9A (b2ba/b2cla/expa amendments); 9B (cdnr, cdnur); 9C (cdnra, cdnura); 10 (b2csa); 11A/11B (at, txpd + amendments); 12 (hsn – hsn_b2b/hsn_b2c from May-2025); 13 (doc_issue); 14 (supeco clttx/paytx) & 14A; 15 & 15A (ECO u/s 9(5))"
  used_by_rules:
    - "RC-GST-001"
    - "RC-GST-002"
    - "RC-GST-003"
    - "RC-GST-004"
    - "RC-GST-005"
    - "RC-GST-006"
    - "RC-GST-007"
    - "RC-GST-008"
    - "RC-GST-011"
    - "RC-GST-012"
    - "RC-GST-024"
    - "RC-GST-029"
    - "RC-GST-030"
    - "RC-GST-032"
    - "RC-GST-034"
    - "RC-GST-039"
  verification_status: "partially_verified"
  notes: "JSON keys taken from GSTN payload sample (Vayana b2b example) and the open-source india-compliance field map, which reads/writes the GSTN schema; GSTN's own developer-portal schema pages could not be opened. Keys for amendment sections (b2ba, b2cla, expa, cdnra, cdnura, b2csa, ata, txpda), Table 15 keys and b2cs/at sply_ty are UNVERIFIED. Date format dd-mm-yyyy is the GSTN convention but was not seen in a live file in this session. Credit notes stored unsigned with ntty – engine must apply sign. B2CL threshold Rs 1 lakh applies from 01.08.2024 (earlier Rs 2.5 lakh) per india-compliance constant; confirm against Notification 12/2024-CT. Table 12 validations vs other tables are warning-only (advisory 01.05.2025). Amendments: s.37(3) – by 30 Nov following FY or annual return, whichever earlier. Three-year bar on filing (s.37(5))."
  sources:
    - title: "Vayana GSP docs – GSTR-1 download (GSTN payload sample, b2b)"
      url: "https://docs.enriched-api.vayana.com/routes/basic/gstn/apis/returns/Gstr-Download-Lite-Api/gstr-1/"
      ref: ""
      official: false
    - title: "india-compliance (ERPNext GST app) – GSTR-1 field map (gst_returns/fields/gstr1.py, RawField = portal JSON keys)"
      url: "https://github.com/resilient-tech/india-compliance"
      ref: "india_compliance/gst_returns/fields/gstr1.py; utils/gstr_1/sections/*.py (develop branch, cloned 13-10-2026)"
      official: false
    - title: "GST Developer Portal – Taxpayer API (returns/ledger lists)"
      url: "https://developer.gst.gov.in/apiportal/taxpayer/returns/apilist"
      ref: "Index only; schema pages not readable in this session"
      official: true
    - title: "GSTN advisory 01.05.2025 – HSN Table 12 and Table 13 (TaxO reproduction)"
      url: "https://taxo.online/latest-news/02-05-2025-gstn-issued-advisory-relating-to-reporting-of-hsn-codes-in-table-12-and-list-of-documents-in-table-13-of-gstr-1-1a/"
      ref: ""
      official: false
    - title: "GSTN advisory 15.01.2024 – new Tables 14 & 15 in GSTR-1 (TaxO reproduction)"
      url: "https://taxo.online/latest-news/16-01-2024-gstn-issued-advisory-on-introduction-of-new-tables-14-15-in-gstr-1/"
      ref: "N.26/2022-CT"
      official: false
    - title: "GST portal contextual help – GSTR-1 Table 14"
      url: "https://tutorial.gst.gov.in/contextualhelp/Einv/SUPECO_14.htm"
      ref: ""
      official: true
fields:
  - name: "gstin"
    label: "GSTIN of supplier"
    source_path: "header.gstin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: "Return filer GSTIN"
    origin: "catalogue"
  - name: "return_period"
    label: "Tax period"
    source_path: "header.fp"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: "Filing period (month; for QRMP quarterly GSTR-1 = last month of quarter)"
    origin: "catalogue"
  - name: "b2b_recipient_gstin"
    label: "GSTIN/UIN of Recipient"
    source_path: "Table 4A/4B/6B/6C; b2b[].ctin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Recipient GSTIN/UIN"
    origin: "catalogue"
  - name: "b2b_recipient_filing_status"
    label: "Counter-party filing status"
    source_path: "b2b[].cfs"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: "Whether recipient has filed (download only)"
    origin: "catalogue"
  - name: "b2b_invoice_no"
    label: "Invoice Number"
    source_path: "b2b[].inv[].inum"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars; ^[a-zA-Z0-9/-]{1,16}$ (Rule 46: unique per FY)"
    description: "Invoice number – primary match key with GSTR-2A/2B/IMS, e-invoice DocDtls.No"
    origin: "catalogue"
  - name: "b2b_invoice_date"
    label: "Invoice date"
    source_path: "b2b[].inv[].idt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Invoice date"
    origin: "catalogue"
  - name: "b2b_invoice_value"
    label: "Invoice Value"
    source_path: "b2b[].inv[].val"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Total invoice value incl. tax"
    origin: "catalogue"
  - name: "b2b_pos"
    label: "Place Of Supply"
    source_path: "b2b[].inv[].pos"
    data_type: "string"
    required: "yes"
    validation: "2-digit state code 01-38 or 96/97 (other territory / outside India); zero-padded string e.g. '07'"
    description: "Place of supply state code; drives IGST vs CGST+SGST"
    origin: "catalogue"
  - name: "b2b_reverse_charge"
    label: "Reverse Charge"
    source_path: "b2b[].inv[].rchrg"
    data_type: "enum"
    required: "yes"
    validation: "Y/N"
    description: "Y = Table 4B (tax payable by recipient)"
    origin: "catalogue"
  - name: "b2b_invoice_type"
    label: "Invoice Type"
    source_path: "b2b[].inv[].inv_typ"
    data_type: "enum"
    required: "yes"
    validation: "R (Regular B2B) | SEWP (SEZ with payment) | SEWOP (SEZ without payment) | DE (Deemed export)"
    description: "R/DE -> Table 4A/4B/6C; SEWP/SEWOP -> Table 6B"
    origin: "catalogue"
  - name: "b2b_ecom_gstin"
    label: "E-Commerce GSTIN"
    source_path: "b2b[].inv[].etin"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "ECO GSTIN where supply made through ECO"
    origin: "catalogue"
  - name: "b2b_diff_percent"
    label: "Applicable % of Tax Rate"
    source_path: "b2b[].inv[].diff_percent"
    data_type: "decimal"
    required: "no"
    validation: "0.65 or blank/1"
    description: "65% concessional rate flag (legacy)"
    origin: "catalogue"
  - name: "b2b_irn"
    label: "IRN"
    source_path: "b2b[].inv[].irn"
    data_type: "string"
    required: "no"
    validation: "64 hex chars"
    description: "IRN where auto-populated from e-invoice (download only)"
    origin: "catalogue"
  - name: "b2b_irn_date"
    label: "IRN generation date"
    source_path: "b2b[].inv[].irngendate"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "IRN date (download only)"
    origin: "catalogue"
  - name: "b2b_source_type"
    label: "Source"
    source_path: "b2b[].inv[].srctyp"
    data_type: "enum"
    required: "no"
    validation: "e.g. 'e-Invoice' / blank"
    description: "Source of record (auto-populated from IRP or manual)"
    origin: "catalogue"
  - name: "b2b_item_no"
    label: "Item serial"
    source_path: "b2b[].inv[].itms[].num"
    data_type: "integer"
    required: "yes"
    validation: ">=1"
    description: "Rate-line serial number"
    origin: "catalogue"
  - name: "b2b_rate"
    label: "Rate"
    source_path: "b2b[].inv[].itms[].itm_det.rt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: "Tax rate of the rate line"
    origin: "catalogue"
  - name: "b2b_taxable_value"
    label: "Taxable Value"
    source_path: "b2b[].inv[].itms[].itm_det.txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Taxable value per rate"
    origin: "catalogue"
  - name: "b2b_igst"
    label: "Integrated Tax Amount"
    source_path: "b2b[].inv[].itms[].itm_det.iamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; only when inter-State (pos != supplier state) or SEZ/IgstOnIntra"
    description: "IGST"
    origin: "catalogue"
  - name: "b2b_cgst"
    label: "Central Tax Amount"
    source_path: "b2b[].inv[].itms[].itm_det.camt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; must equal samt"
    description: "CGST"
    origin: "catalogue"
  - name: "b2b_sgst"
    label: "State/UT Tax Amount"
    source_path: "b2b[].inv[].itms[].itm_det.samt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "SGST/UTGST"
    origin: "catalogue"
  - name: "b2b_cess"
    label: "Cess Amount"
    source_path: "b2b[].inv[].itms[].itm_det.csamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Compensation cess"
    origin: "catalogue"
  - name: "record_flag"
    label: "Action flag"
    source_path: "*.flag / cflag"
    data_type: "enum"
    required: "no"
    validation: "e.g. U/A/D/N (upload/accept/delete etc.) – values unverified"
    description: "Record status flag in GSTN payloads"
    origin: "catalogue"
  - name: "b2cl_pos"
    label: "Place Of Supply"
    source_path: "Table 5; b2cl[].pos"
    data_type: "string"
    required: "yes"
    validation: "2-digit state code 01-38 or 96/97 (other territory / outside India); zero-padded string e.g. '07'"
    description: "B2C large: inter-State invoice to unregistered person with value > Rs 1 lakh (from 01.08.2024; earlier Rs 2.5 lakh)"
    origin: "catalogue"
  - name: "b2cl_invoice_no"
    label: "Invoice Number"
    source_path: "b2cl[].inv[].inum"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Invoice number"
    origin: "catalogue"
  - name: "b2cl_invoice_date"
    label: "Invoice date"
    source_path: "b2cl[].inv[].idt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Invoice date"
    origin: "catalogue"
  - name: "b2cl_invoice_value"
    label: "Invoice Value"
    source_path: "b2cl[].inv[].val"
    data_type: "decimal"
    required: "yes"
    validation: "> B2CL threshold"
    description: "Invoice value"
    origin: "catalogue"
  - name: "b2cl_rate"
    label: "Rate"
    source_path: "b2cl[].inv[].itms[].itm_det.rt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: "Rate"
    origin: "catalogue"
  - name: "b2cl_taxable_value"
    label: "Taxable Value"
    source_path: "b2cl[].inv[].itms[].itm_det.txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Taxable value"
    origin: "catalogue"
  - name: "b2cl_igst"
    label: "Integrated Tax Amount"
    source_path: "b2cl[].inv[].itms[].itm_det.iamt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "IGST (only IGST + cess in B2CL)"
    origin: "catalogue"
  - name: "b2cl_cess"
    label: "Cess Amount"
    source_path: "b2cl[].inv[].itms[].itm_det.csamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Cess"
    origin: "catalogue"
  - name: "b2cs_type"
    label: "Type"
    source_path: "Table 7; b2cs[].typ"
    data_type: "enum"
    required: "yes"
    validation: "OE (other than e-commerce) – 'E' no longer reported separately"
    description: "B2C small type"
    origin: "catalogue"
  - name: "b2cs_pos"
    label: "Place Of Supply"
    source_path: "b2cs[].pos"
    data_type: "string"
    required: "yes"
    validation: "2-digit state code 01-38 or 96/97 (other territory / outside India); zero-padded string e.g. '07'"
    description: "State-wise summary key"
    origin: "catalogue"
  - name: "b2cs_supply_type"
    label: "Supply type"
    source_path: "b2cs[].sply_ty"
    data_type: "enum"
    required: "no"
    validation: "INTER/INTRA [JSON name unverified]"
    description: "Inter/intra-State"
    origin: "catalogue"
  - name: "b2cs_rate"
    label: "Rate"
    source_path: "b2cs[].rt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: "Rate (summary key POS+rate)"
    origin: "catalogue"
  - name: "b2cs_taxable_value"
    label: "Taxable Value"
    source_path: "b2cs[].txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); may be negative after CN adjustment"
    description: "Net taxable value per POS+rate"
    origin: "catalogue"
  - name: "b2cs_igst"
    label: "Integrated Tax Amount"
    source_path: "b2cs[].iamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "IGST"
    origin: "catalogue"
  - name: "b2cs_cgst"
    label: "Central Tax Amount"
    source_path: "b2cs[].camt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "CGST"
    origin: "catalogue"
  - name: "b2cs_sgst"
    label: "State/UT Tax Amount"
    source_path: "b2cs[].samt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "SGST"
    origin: "catalogue"
  - name: "b2cs_cess"
    label: "Cess Amount"
    source_path: "b2cs[].csamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Cess"
    origin: "catalogue"
  - name: "exp_type"
    label: "Export type"
    source_path: "Table 6A; exp[].exp_typ"
    data_type: "enum"
    required: "yes"
    validation: "WPAY | WOPAY"
    description: "Export with / without payment of IGST"
    origin: "catalogue"
  - name: "exp_invoice_no"
    label: "Invoice Number"
    source_path: "exp[].inv[].inum"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Export invoice number"
    origin: "catalogue"
  - name: "exp_invoice_date"
    label: "Invoice date"
    source_path: "exp[].inv[].idt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Export invoice date"
    origin: "catalogue"
  - name: "exp_invoice_value"
    label: "Invoice Value"
    source_path: "exp[].inv[].val"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Invoice value"
    origin: "catalogue"
  - name: "exp_port_code"
    label: "Port Code"
    source_path: "exp[].inv[].sbpcode"
    data_type: "string"
    required: "no"
    validation: "6-char ICEGATE port code"
    description: "Shipping bill port"
    origin: "catalogue"
  - name: "exp_shipping_bill_no"
    label: "Shipping Bill Number"
    source_path: "exp[].inv[].sbnum"
    data_type: "string"
    required: "no"
    validation: "numeric, max 7 digits (unverified)"
    description: "Shipping bill/BoE number – match to ICEGATE/refund"
    origin: "catalogue"
  - name: "exp_shipping_bill_date"
    label: "Shipping Bill Date"
    source_path: "exp[].inv[].sbdt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Shipping bill date"
    origin: "catalogue"
  - name: "exp_rate"
    label: "Rate"
    source_path: "exp[].inv[].itms[].rt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: "Rate"
    origin: "catalogue"
  - name: "exp_taxable_value"
    label: "Taxable Value"
    source_path: "exp[].inv[].itms[].txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Taxable value"
    origin: "catalogue"
  - name: "exp_igst"
    label: "Integrated Tax Amount"
    source_path: "exp[].inv[].itms[].iamt"
    data_type: "decimal"
    required: "no"
    validation: "0 for WOPAY"
    description: "IGST"
    origin: "catalogue"
  - name: "exp_cess"
    label: "Cess Amount"
    source_path: "exp[].inv[].itms[].csamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Cess"
    origin: "catalogue"
  - name: "nil_supply_type"
    label: "Description"
    source_path: "Table 8; nil.inv[].sply_ty"
    data_type: "enum"
    required: "yes"
    validation: "INTRB2B | INTRB2C | INTRAB2B | INTRAB2C"
    description: "Inter/intra-State to registered/unregistered"
    origin: "catalogue"
  - name: "nil_rated_amount"
    label: "Nil Rated Supplies"
    source_path: "nil.inv[].nil_amt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Nil rated"
    origin: "catalogue"
  - name: "exempted_amount"
    label: "Exempted (other than nil rated/non GST supply)"
    source_path: "nil.inv[].expt_amt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Exempt"
    origin: "catalogue"
  - name: "non_gst_amount"
    label: "Non-GST supplies"
    source_path: "nil.inv[].ngsup_amt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Non-GST -> GSTR-3B 3.1(e)"
    origin: "catalogue"
  - name: "cdnr_recipient_gstin"
    label: "GSTIN/UIN of Recipient"
    source_path: "Table 9B; cdnr[].ctin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Recipient of note"
    origin: "catalogue"
  - name: "cdnr_note_type"
    label: "Note Type"
    source_path: "cdnr[].nt[].ntty"
    data_type: "enum"
    required: "yes"
    validation: "C (credit) | D (debit)"
    description: "Sign: C reduces, D increases liability"
    origin: "catalogue"
  - name: "cdnr_note_no"
    label: "Note Number"
    source_path: "cdnr[].nt[].nt_num"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Credit/debit note number"
    origin: "catalogue"
  - name: "cdnr_note_date"
    label: "Note Date"
    source_path: "cdnr[].nt[].nt_dt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Note date; CN time limit s.34(2): 30 Nov following FY"
    origin: "catalogue"
  - name: "cdnr_note_value"
    label: "Note Value"
    source_path: "cdnr[].nt[].val"
    data_type: "decimal"
    required: "yes"
