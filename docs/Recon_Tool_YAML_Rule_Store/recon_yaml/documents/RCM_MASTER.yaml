schema_version: "1.0"
document:
  code: "RCM_MASTER"
  name: "RCM expense-head mapping master"
  issuer_system: "Tool-maintained master (CA-configured)"
  legal_basis: "Design document (not a statutory form)"
  new_form_no: ""
  frequency: ""
  formats_available: ""
  how_obtained: ""
