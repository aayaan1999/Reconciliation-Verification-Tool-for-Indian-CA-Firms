fields:
  - name: "gl_head"
    label: "GL expense ledger"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Joins to GL.ledger_name."
    origin: "new document (design)"
  - name: "rcm_category"
    label: "RCM category"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Notified service/goods category (label from notification, CA-configured)."
    origin: "new document (design)"
  - name: "supply_kind"
    label: "Domestic / import of services"
    source_path: "Row"
    data_type: "enum"
    required: "yes"
    validation: "DOMESTIC|IMPORT_SERVICES"
    description: "Drives 4A(3) vs 4A(2)."
    origin: "new document (design)"
  - name: "rate"
    label: "GST rate"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(5,3)"
    description: ""
    origin: "new document (design)"
  - name: "supplier_condition"
    label: "Supplier condition"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: "E.g. only when supplier unregistered / specific supplier type."
    origin: "new document (design)"
  - name: "itc_eligible"
    label: "ITC eligible"
    source_path: "Row"
    data_type: "enum"
    required: "yes"
    validation: "Y|N"
    description: ""
    origin: "new document (design)"
  - name: "effective_from"
    label: "Effective from"
    source_path: "Row"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "new document (design)"
  - name: "effective_to"
    label: "Effective to"
    source_path: "Row"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "new document (design)"
