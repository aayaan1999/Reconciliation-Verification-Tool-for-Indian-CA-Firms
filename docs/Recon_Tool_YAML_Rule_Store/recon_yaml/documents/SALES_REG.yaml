schema_version: "1.0"
document:
  code: "SALES_REG"
  name: "Sales register (sales day book, invoice/line level)"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law. Supports CGST Act s.35 / Rule 56 accounts, GSTR-1 reconciliation"
  new_form_no: ""
  frequency: "Monthly"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Tally Prime: Display More Reports > Account Books > Sales Register > month > Alt+E Export (Excel) / or GSTR-1 export; ERP sales register export"
  due_date: ""
  tables_used: "Invoice header + line (item) + tax ledgers; credit/debit notes"
  used_by_rules:
    - "RC-GST-001"
    - "RC-GST-002"
    - "RC-GST-003"
    - "RC-GST-004"
    - "RC-GST-005"
    - "RC-GST-006"
    - "RC-GST-008"
    - "RC-GST-009"
    - "RC-GST-010"
    - "RC-GST-011"
    - "RC-GST-012"
    - "RC-GST-029"
    - "RC-GST-033"
    - "RC-GST-034"
    - "RC-GST-036"
    - "RC-GST-040"
    - "RC-TDS-012"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "Tally – Sample Excel files for import (field names & aliases)"
      url: "https://help.tallysolutions.com/tally-prime/import-data/download-sample-excel-files-with-data-for-import"
      ref: "Voucher Date, Voucher Number, Party Name, Buyer/Supplier GSTIN/UIN, Item, Rate, Quantity, Ledger Group"
      official: false
    - title: "Tally – Sales Register (Sales Day Book)"
      url: "https://help.tallysolutions.com/docs/te9rel66/Reports/Display_Registers_Ledgers/Sales_Register_Sales_Day_Book.htm"
      ref: "Monthly summary → voucher list; Excel/Pivot export"
      official: false
fields:
  - name: "voucher_date"
    label: "Voucher Date (Invoice Date)"
    source_path: "Voucher"
    data_type: "date"
    required: "yes"
    validation: "ISO yyyy-mm-dd"
    description: "Invoice/document date."
    origin: "catalogue"
  - name: "voucher_type"
    label: "Voucher Type"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: "Sales|Purchase|Credit Note|Debit Note|..."
    description: ""
    origin: "catalogue"
  - name: "voucher_no"
    label: "Voucher Number (Invoice No.)"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars for GST doc no. (normalise: upper, strip spaces)"
    description: "Key to GSTR1/EINV/GSTR2B."
    origin: "catalogue"
  - name: "supplier_invoice_no"
    label: "Supplier Invoice No. / Reference No."
    source_path: "Voucher"
    data_type: "string"
    required: ""
    validation: ""
    description: "Purchase side key to GSTR-2B."
    origin: "catalogue"
  - name: "supplier_invoice_date"
    label: "Supplier Invoice Date / Reference Date"
    source_path: "Voucher"
    data_type: "date"
    required: ""
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "party_name"
    label: "Party Name (Customer's/Supplier's Name)"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "party_gstin"
    label: "Buyer/Supplier – GSTIN/UIN"
    source_path: "Voucher"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: "Blank = unregistered (B2C / URP)."
    origin: "catalogue"
  - name: "party_pan"
    label: "PAN/IT No."
    source_path: "Party master"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "Derive from GSTIN chars 3-12 if absent."
    origin: "catalogue"
  - name: "party_state"
    label: "State / Place of Supply"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: "2-digit GST state code"
    description: "Determines IGST vs CGST+SGST."
    origin: "catalogue"
  - name: "registration_type"
    label: "Registration Type"
    source_path: "Party master"
    data_type: "enum"
    required: "no"
    validation: "Regular|Composition|Unregistered|Consumer|SEZ|Overseas"
    description: ""
    origin: "catalogue"
  - name: "ledger_name"
    label: "Sales/Purchase ledger"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "item_name"
    label: "Item Name (Stock Item)"
    source_path: "Inventory"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "hsn_sac"
    label: "HSN/SAC"
    source_path: "Inventory"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{4,8}$"
    description: ""
    origin: "catalogue"
  - name: "quantity"
    label: "Quantity"
    source_path: "Inventory"
    data_type: "decimal"
    required: "no"
    validation: "3 dp"
    description: ""
    origin: "catalogue"
  - name: "uom"
    label: "Quantity UOM"
    source_path: "Inventory"
    data_type: "string"
    required: "no"
    validation: "GST UQC"
    description: ""
    origin: "catalogue"
  - name: "rate"
    label: "Item Rate"
    source_path: "Inventory"
    data_type: "decimal"
    required: "no"
    validation: "4 dp"
    description: ""
    origin: "catalogue"
  - name: "taxable_value"
    label: "Taxable value (Assessable value)"
    source_path: "Amount"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "gst_rate"
    label: "GST Rate"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "0|0.1|0.25|1|1.5|3|5|6|7.5|12|18|28|40 (per notified schedule)"
    description: ""
    origin: "catalogue"
  - name: "igst"
    label: "IGST"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "cgst"
    label: "CGST"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "sgst_utgst"
    label: "SGST/UTGST"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "cess"
    label: "Cess"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tcs_amount"
    label: "TCS (s.206C / s.394)"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "round_off"
    label: "Round off"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "invoice_value"
    label: "Gross Total / Invoice value"
    source_path: "Amount"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "reverse_charge"
    label: "Reverse charge applicable"
    source_path: "Tax"
    data_type: "enum"
    required: "no"
    validation: "Y|N"
    description: ""
    origin: "catalogue"
  - name: "irn"
    label: "IRN"
    source_path: "e-Invoice"
    data_type: "string"
    required: "no"
    validation: "64-char hash"
    description: "Key to EINV."
    origin: "catalogue"
  - name: "ack_no_irn"
    label: "e-Invoice Ack No."
    source_path: "e-Invoice"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "eway_bill_no"
    label: "e-Way Bill No."
    source_path: "e-Way Bill"
    data_type: "string"
    required: "no"
    validation: "12 digits"
    description: "Key to EWB."
    origin: "catalogue"
  - name: "original_invoice_no"
    label: "Original invoice no. (for CN/DN)"
    source_path: "Voucher"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "narration"
    label: "Narration"
    source_path: "Voucher"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "tds_by_customer_section"
    label: "TDS deducted by customer – section"
    source_path: "Receivable"
    data_type: "string"
    required: "no"
    validation: ""
    description: "For 26AS matching of income side."
    origin: "catalogue"
  - name: "tds_by_customer_amount"
    label: "TDS deducted by customer – amount"
    source_path: "Receivable"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "place_of_supply"
    label: ""
    source_path: ""
    data_type: "string(2) state code"
    required: ""
    validation: ""
    description: "Place of supply on the invoice (Tally: Place of Supply). Fallback: party_state when not captured."
    origin: "new (design)"
  - name: "ecom_gstin"
    label: ""
    source_path: ""
    data_type: "string GSTIN"
    required: ""
    validation: ""
    description: "GSTIN of the e-commerce operator through which the supply was made (blank if none)."
    origin: "new (design)"
  - name: "shipping_bill_no"
    label: ""
    source_path: ""
    data_type: "string"
    required: ""
    validation: ""
    description: "Shipping bill number recorded on the export invoice (Tally export details / EINV export_shipping_bill_no)."
    origin: "new (design)"
  - name: "shipping_bill_date"
    label: ""
    source_path: ""
    data_type: "date"
    required: ""
    validation: ""
    description: "Shipping bill date recorded on the export invoice."
    origin: "new (design)"
  - name: "port_code"
    label: ""
    source_path: ""
    data_type: "string"
    required: ""
    validation: ""
    description: "Port code of the shipping bill recorded on the export invoice."
    origin: "new (design)"
  - name: "ship_to_state"
    label: ""
    source_path: ""
    data_type: "string(2) state code"
    required: ""
    validation: ""
    description: "State of the consignee / ship-to address on the invoice."
    origin: "new (design)"
  - name: "supply_class"
    label: ""
    source_path: ""
    data_type: "enum TAXABLE|NIL|EXEMPT|NON_GST|ZERO_RATED"
    required: ""
    validation: ""
    description: "GST classification of the item/ledger line from the item or sales-ledger master (nil-rated and exempt both carry 0% and cannot be told apart from gst_rate)."
    origin: "new (design)"
  - name: "tcs_section_code"
    label: ""
    source_path: ""
    data_type: "string"
    required: ""
    validation: ""
    description: "Income-tax TCS collection code applied on the sale (27EQ collection code format); sales register only carries tcs_amount."
    origin: "new (design)"
  - name: "is_cancelled"
    label: ""
    source_path: ""
    data_type: "enum Y|N"
    required: ""
    validation: ""
    description: "Voucher marked cancelled in books (Tally cancelled voucher) - needed for Table 13 counts."
    origin: "new (design)"
  - name: "fy"
    label: ""
    source_path: ""
    data_type: "string 'YYYY-YY'"
    required: "no"
    validation: ""
    description: "DERIVED: Indian financial year (1 Apr - 31 Mar) containing voucher_date, format 'YYYY-YY' e.g. '2025-26'"
    origin: "derived"
  - name: "supply_type"
    label: ""
    source_path: ""
    data_type: "enum INTER|INTRA"
    required: "no"
    validation: ""
    description: "DERIVED: 'INTER' if pos state code differs from the supplier's own GSTIN state code (or igst > 0), else 'INTRA'."
    origin: "derived"
  - name: "sum_txval"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ taxable_value over the rule's group key."
    origin: "derived"
  - name: "sum_igst"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ igst over the rule's group key."
    origin: "derived"
  - name: "sum_cgst"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ cgst over the rule's group key."
    origin: "derived"
  - name: "sum_sgst"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ sgst_utgst over the rule's group key."
    origin: "derived"
  - name: "sum_cess"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ cess over the rule's group key."
    origin: "derived"
  - name: "export_type"
    label: ""
    source_path: ""
    data_type: "enum WPAY|WOPAY|SEWP|SEWOP|DE"
    required: "no"
    validation: ""
    description: "DERIVED: registration_type 'Overseas' -> 'WPAY' if igst > 0 else 'WOPAY'; 'SEZ' -> 'SEWP' if igst > 0 else 'SEWOP'; deemed exports need a ledger/voucher flag."
    origin: "derived"
  - name: "note_type"
    label: ""
    source_path: ""
    data_type: "enum C|D"
    required: "no"
    validation: ""
    description: "DERIVED: voucher_type 'Credit Note' -> 'C', 'Debit Note' -> 'D' (voucher-type map configurable)."
    origin: "derived"
  - name: "latest_revised_version"
    label: ""
    source_path: ""
    data_type: "group"
    required: "no"
    validation: ""
    description: "DERIVED: Latest version of the invoice in the books (after alterations), i.e. the row with the latest alteration for voucher_no; requires the export to carry the current version only or an alteration timestamp. (catalogue name: \"latest revised version\")"
    origin: "derived"
  - name: "doc_type"
    label: ""
    source_path: ""
    data_type: "enum"
    required: "no"
    validation: ""
    description: "DERIVED: Mapped from voucher_type via a configurable map; code list depends on the target document (see context_dependent)."
    origin: "derived"
  - name: "hsn_set"
    label: ""
    source_path: ""
    data_type: "set<string>"
    required: "no"
    validation: ""
    description: "DERIVED: Sorted distinct hsn_sac over the item rows of the invoice (voucher_no)."
    origin: "derived"
  - name: "b2b_or_b2c"
    label: ""
    source_path: ""
    data_type: "enum B2B|B2C"
    required: "no"
    validation: ""
    description: "DERIVED: 'B2B' if party_gstin is non-blank else 'B2C' (aligns with GSTR1 hsn_section hsn_b2b/hsn_b2c)."
    origin: "derived"
  - name: "sum_tax_heads"
    label: ""
    source_path: ""
    data_type: "group"
    required: "no"
    validation: ""
    description: "DERIVED: Tuple (Σ igst, Σ cgst, Σ sgst_utgst, Σ cess) over (hsn_sac, gst_rate, b2b_or_b2c)."
    origin: "derived"
  - name: "sum_qty"
    label: ""
    source_path: ""
    data_type: "decimal(15,3)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ quantity over (hsn_sac, gst_rate, b2b_or_b2c); UOM converted to GST UQC."
    origin: "derived"
  - name: "doc_nature_code"
    label: ""
    source_path: ""
    data_type: "enum 1..12"
    required: "no"
    validation: ""
    description: "DERIVED: voucher_type mapped to GSTR-1 Table 13 doc_nature_code (configurable map, e.g. Sales -> 1, Debit Note -> 4, Credit Note -> 5)."
    origin: "derived"
  - name: "series_prefix"
    label: ""
    source_path: ""
    data_type: "string"
    required: "no"
    validation: ""
    description: "DERIVED: voucher_no with the trailing numeric run removed (normalised: upper-case, trimmed)."
    origin: "derived"
  - name: "series_from"
    label: ""
    source_path: ""
    data_type: "string"
    required: "no"
    validation: ""
    description: "DERIVED: voucher_no with the lowest trailing number within (series_prefix, doc_nature, period)."
    origin: "derived"
  - name: "series_to"
    label: ""
    source_path: ""
    data_type: "string"
    required: "no"
    validation: ""
    description: "DERIVED: voucher_no with the highest trailing number within (series_prefix, doc_nature, period)."
    origin: "derived"
  - name: "count_total"
    label: ""
    source_path: ""
    data_type: "integer"
    required: "no"
    validation: ""
    description: "DERIVED: series_to number - series_from number + 1 for the series in the period (includes cancelled numbers)."
    origin: "derived"
  - name: "count_cancelled"
    label: ""
    source_path: ""
    data_type: "integer"
    required: "no"
    validation: ""
    description: "DERIVED: Count of voucher numbers in the series range with is_cancelled = 'Y' (supporting new field) plus missing numbers if the client treats gaps as cancelled."
    origin: "derived"
  - name: "nil_supply_type"
    label: ""
    source_path: ""
    data_type: "enum INTRB2B|INTRB2C|INTRAB2B|INTRAB2C"
    required: "no"
    validation: ""
    description: "DERIVED: supply_type (INTER->INTR, INTRA->INTRA) combined with b2b_or_b2c, matching GSTR1 nil_supply_type codes."
    origin: "derived"
  - name: "nil_value"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ taxable_value where supply_class = 'NIL'."
    origin: "derived"
  - name: "exempt_value"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ taxable_value where supply_class = 'EXEMPT'."
    origin: "derived"
  - name: "non_gst_value"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ taxable_value (or invoice_value) where supply_class = 'NON_GST'."
    origin: "derived"
  - name: "time_of_supply"
    label: ""
    source_path: ""
    data_type: "date"
    required: "no"
    validation: ""
    description: "DERIVED: voucher_date as default proxy; override with a time-of-supply date field where the client records one."
    origin: "derived"
  - name: "cess_rate"
    label: ""
    source_path: ""
    data_type: "decimal(7,3)"
    required: "no"
    validation: ""
    description: "DERIVED: cess / taxable_value * 100 on the item row (ad valorem cess only; specific-rate cess cannot be derived)."
    origin: "derived"
  - name: "period"
    label: ""
    source_path: ""
    data_type: "string MMYYYY"
    required: "no"
    validation: ""
    description: "DERIVED: tax period of voucher_date, format MMYYYY e.g. '092026'"
    origin: "derived"
  - name: "eco_net_taxable"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ taxable_value of invoices with non-blank ecom_gstin minus Σ taxable_value of credit notes on such sales, per ecom_gstin and period."
    origin: "derived"
  - name: "quarter"
    label: ""
    source_path: ""
    data_type: "enum Q1|Q2|Q3|Q4"
    required: "no"
    validation: ""
    description: "DERIVED: FY quarter of voucher_date (Q1 Apr-Jun, Q2 Jul-Sep, Q3 Oct-Dec, Q4 Jan-Mar), with fy."
    origin: "derived"
  - name: "turnover_q"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ taxable_value of outward supply rows (net of credit notes) in the FY quarter."
    origin: "derived"
  - name: "fy_turnover"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ taxable_value of all outward supply rows incl. NIL/EXEMPT/NON_GST/ZERO_RATED supply_class, net of credit notes, for the FY."
    origin: "derived"
