schema_version: "1.0"
document:
  code: "F3CD"
  name: "Tax audit report – Form 3CA/3CB with Form 3CD (AY 2026-27); Form 26 from tax year 2026-27"
  issuer_system: "Prepared by tax auditor (CA) and uploaded on e-Filing portal; accepted by assessee"
  legal_basis: "IT Act 1961 s.44AB read with Rule 6G (Form 3CA/3CB/3CD); ITA 2025 s.63 read with IT Rules 2026 Rule 47, Form 26 (secondary sources)"
  new_form_no: "Form 26 (tax year 2026-27 onwards; clause renumbering not verified)"
  frequency: "Annual"
  formats_available: "JSON (offline utility) / XML (older), PDF acknowledgement; Excel working"
  how_obtained: "e-Filing portal > View Filed Forms > Form 3CA-3CD / 3CB-3CD > download JSON/PDF; or CA's working file"
  due_date: "AY 2026-27: extended to 21-10-2026 (CBDT Circular 7/2026, per prior round AUD-003)"
  tables_used: "Part A (cl.1-8: assessee details); Part B: cl.18 depreciation; cl.20(b) employees' contribution (PF/ESI) – due date vs actual payment; cl.21(a)-(i) inadmissible amounts incl. 21(b) s.40(a) TDS defaults, 21(d) s.40A(3)/(3A); cl.22 MSMED interest and s.43B(h); cl.23 s.40A(2)(b) specified persons; cl.26 s.43B; cl.31 s.269SS/269T/269ST; cl.34(a) TDS/TCS compliance, 34(b) statements not furnished/incorrect, 34(c) interest u/s 201(1A)/206C(7); cl.35 quantitative details; cl.44 GST break-up of expenditure"
  used_by_rules:
    - "RC-IT-008"
    - "RC-IT-009"
    - "RC-IT-010"
    - "RC-IT-011"
    - "RC-IT-012"
  verification_status: "partially_verified"
  notes: "Clause subjects for 21, 22, 26, 31, 34, 44 seen in PKC and CalcGuru (secondary). Column labels of cl.20(b), 31 and 34(a)/(b)/(c) are from professional knowledge of the Form 3CD layout – NOT verified this session (Unverified sub-items). Form 26 clause numbering for TY 2026-27 not verified – build a clause-mapping table when official Form 26 is opened."
  sources:
    - title: "PKC – Form 3CD AY 2026-27 clause-wise changes"
      url: "https://www.pkcindia.com/blog/form-3cd-reporting-for-ay-2026-27-clause-wise-changes-every-business-should-check-before-the-tax-audit/"
      ref: "Cl. 21, 22, 26, 34, 36B, 44"
      official: false
    - title: "CalcGuru – Form 3CD checklist AY 2026-27"
      url: "https://calcguru.in/?p=8211"
      ref: "Cl. 21, 22, 26, 31, 34, 44 incl. clause 44 columns"
      official: false
    - title: "TaxGuru – Tax audit FY 2025-26 guide Form 3CD"
      url: "https://taxguru.in/income-tax/tax-audit-fy-2025-26-guide-form-3cd.html"
      ref: "(prior round)"
      official: false
    - title: "ClearTax – Form 26 tax audit (IT Rules 2026)"
      url: "https://cleartax.in/s/form-26-tax-audit"
      ref: "(prior round, secondary)"
      official: false
    - title: "CBDT Circular 7/2026"
      url: "https://incometaxindia.gov.in/documents/d/guest/circular-7-2026-pdf"
      ref: "Extended due dates AY 2026-27 (prior round)"
      official: true
