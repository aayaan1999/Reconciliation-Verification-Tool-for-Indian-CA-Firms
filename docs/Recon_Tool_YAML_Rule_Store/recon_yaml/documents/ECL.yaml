schema_version: "1.0"
document:
  code: "ECL"
  name: "Electronic Cash Ledger (FORM GST PMT-05)"
  issuer_system: "GST portal"
  legal_basis: "s.49(1) CGST Act; Rule 87 CGST Rules (PMT-05; challan PMT-06; CPIN/CIN/BRN)"
  new_form_no: ""
  frequency: "continuous (transaction ledger)"
  formats_available: "Online; PDF/Excel download from portal; JSON via ledger API"
  how_obtained: "GST portal > Services > Ledgers > Electronic Cash Ledger > select period > Download"
  due_date: "Not applicable"
  tables_used: "Opening balance; transactions (deposit via challan, debit for returns/DRC-03/CMP-08, refund, transfer PMT-09); closing balance – each by tax head x component (Tax, Interest, Penalty, Fee, Others)"
  used_by_rules:
    - "RC-GST-021"
    - "RC-GST-023"
    - "RC-GST-035"
    - "RC-GST-036"
  verification_status: "partially_verified"
  notes: "Columns from PMT-05 as reproduced in Goa State Tax form set (rule numbers blank in that copy). API keys op_bal, cl_bal, igstbal/cgstbal/sgstbal/cessbal with tx/intr/pen/fee/oth/tot, tot_rng_bal, fr_dt, to_dt, tr[] from a GSP sandbox sample; per-transaction keys inside tr[] (dt, ref_no, tr_typ, ret_period) NOT seen – unverified."
  sources:
    - title: "GST payment forms PMT-01 to PMT-06 (Goa State Tax)"
      url: "https://statetax.goa.gov.in/PDF/gst_forms/Payment.pdf"
      ref: ""
      official: true
    - title: "Get Cash Ledger – GST API sandbox sample (Qodex)"
      url: "https://developers.qodex.ai/sandbox-api/gst-compliance/taxpayer-ledgers/get-cash-ledger"
      ref: ""
      official: false
    - title: "GST Developer Portal – Ledger API index"
      url: "https://developer.gst.gov.in/apiportal/taxpayer/ledger"
      ref: ""
      official: true
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "header / data.gstin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: ""
    origin: "catalogue"
  - name: "from_date"
    label: "From date"
    source_path: "data.fr_dt"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: "Ledger extract period (API keys fr_dt/to_dt seen in GSP sample)"
    origin: "catalogue"
  - name: "to_date"
    label: "To date"
    source_path: "data.to_dt"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "sr_no"
    label: "Sr. No."
    source_path: "PMT-05 col 1"
    data_type: "integer"
    required: "no"
    validation: ">=1"
    description: ""
    origin: "catalogue"
  - name: "txn_date"
    label: "Date (of deposit/debit)"
    source_path: "PMT-05 col 2; tr[].dt [JSON name unverified]"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "reference_no"
    label: "Reference No."
    source_path: "PMT-05 col 3; tr[].ref_no [JSON name unverified]"
    data_type: "string"
    required: "yes"
    validation: "CIN / ARN / DRC ref / demand ID"
    description: "Link to GSTR-3B ARN, CMP-08 ARN, DRC-03 ARN, challan CIN"
    origin: "catalogue"
  - name: "tax_period"
    label: "Tax Period, if applicable"
    source_path: "PMT-05; tr[].ret_period [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "description"
    label: "Description"
    source_path: "PMT-05; tr[].desc"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "txn_type"
    label: "Type of transaction"
    source_path: "PMT-05; tr[].tr_typ [JSON name unverified]"
    data_type: "enum"
    required: "yes"
    validation: "Debit | Credit (liability ledger: Debit/Payable, Credit/Paid, Reduction, Refund adjusted)"
    description: ""
    origin: "catalogue"
  - name: "deposit_time"
    label: "Time of deposit"
    source_path: "PMT-05 col 3"
    data_type: "string"
    required: "no"
    validation: "hh:mm:ss"
    description: ""
    origin: "catalogue"
  - name: "bank_reporting_date"
    label: "Reporting date (by bank)"
    source_path: "PMT-05 col 4"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "cpin"
    label: "CPIN"
    source_path: "PMT-06"
    data_type: "string"
    required: "no"
    validation: "14 digits (unverified)"
    description: "Challan identifier"
    origin: "catalogue"
  - name: "cin"
    label: "CIN (Challan Identification Number)"
    source_path: "PMT-06 paid challan"
    data_type: "string"
    required: "no"
    validation: "CPIN + bank code (unverified)"
    description: "Join to BANK_STMT"
    origin: "catalogue"
  - name: "brn_utr"
    label: "Bank Reference No. (BRN) / UTR"
    source_path: "PMT-06 paid challan"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Join to BANK_STMT narration"
    origin: "catalogue"
  - name: "opening_balance_total"
    label: "Opening Balance"
    source_path: "op_bal.tot_rng_bal / desc='Opening Balance'"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "closing_balance_total"
    label: "Closing Balance"
    source_path: "cl_bal.tot_rng_bal"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Roll-forward: opening + credits - debits = closing"
    origin: "catalogue"
  - name: "amount_igst"
    label: "Integrated Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-05 col 9 (Amount debited/credited); igstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "amount_cgst"
    label: "Central Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-05 col 9 (Amount debited/credited); cgstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "amount_sgst"
    label: "State/UT Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-05 col 9 (Amount debited/credited); sgstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "amount_cess"
    label: "Cess – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-05 col 9 (Amount debited/credited); cessbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "balance_igst"
    label: "Integrated Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-05 col 10 (Balance); igstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "balance_cgst"
    label: "Central Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-05 col 10 (Balance); cgstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "balance_sgst"
    label: "State/UT Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-05 col 10 (Balance); sgstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "balance_cess"
    label: "Cess – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-05 col 10 (Balance); cessbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "debit_tax_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: amount_<h> tax component (igstbal.tx etc.) on rows where txn_type = 'Debit'."
    origin: "derived"
  - name: "debit_interest_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: amount_<h> interest component (intr) on rows where txn_type = 'Debit'."
    origin: "derived"
  - name: "debit_fee_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: amount_<h> fee component (fee) on rows where txn_type = 'Debit'."
    origin: "derived"
  - name: "tds_credit_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: amount_<h> on rows where txn_type = 'Credit' and description indicates TDS/TCS credit accepted (pattern configurable)."
    origin: "derived"
