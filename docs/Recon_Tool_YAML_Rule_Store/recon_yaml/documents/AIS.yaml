schema_version: "1.0"
document:
  code: "AIS"
  name: "Annual Information Statement (AIS)"
  issuer_system: "Income-tax e-Filing portal – AIS module (Compliance Portal)"
  legal_basis: "IT Act 1961 s.285BB read with Rule 114-I (IT Rules 1962); ITA 2025 s.510 read with Rule 245 IT Rules 2026 (Form 168). SFT reported u/s 285BA / Rule 114E (1961)"
  new_form_no: "Form 168"
  frequency: "Annual per PAN per FY / tax year; updated as sources report"
  formats_available: "PDF, JSON, CSV (portal); AIS consolidated feedback PDF"
  how_obtained: "e-Filing portal > Annual Information Statement (AIS) > select FY > AIS tab > Download PDF/JSON/CSV"
  due_date: "No due date; review and give feedback before ITR filing"
  tables_used: "Part A General Information; Part B: TDS/TCS Information, SFT Information, Payment of Taxes, Demand and Refund, Other Information (e.g. salary, interest on refund, dividends, securities/MF transactions, foreign remittance, GST turnover EXC-GSTR3B)"
  used_by_rules:
    - "RC-BNK-005"
    - "RC-IT-001"
    - "RC-IT-003"
  verification_status: "partially_verified"
  notes: "Official pages confirm Part structure, info code/description/value, PDF/JSON/CSV and EXC-GSTR3B. SFT code list from a secondary source (TaxAJ). TDS information code pattern (e.g. 'TDS-194A') and transaction-detail column labels were NOT verified – map from the actual JSON/CSV keys at import (implementation choice). Feedback options from TaxGuru (secondary)."
  sources:
    - title: "e-Filing portal – AIS help"
      url: "https://www.incometax.gov.in/iec/foportal/help/all-topics/e-filing-services/ais-annual-information-statement"
      ref: "Part A/Part B, info code/description/value, PDF/JSON/CSV, EXC-GSTR3B"
      official: true
    - title: "e-Filing portal – AIS FAQs"
      url: "https://www.incometax.gov.in/iec/foportal/help/all-topics/e-filing-services/ais%20-%20annual%20information%20statement-faqs"
      ref: "TIS processed vs accepted value; feedback; downloads"
      official: true
    - title: "Income Tax Department – Form 168 FAQs"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/form-168-faqs"
      ref: "Form 168 (earlier 26AS/AIS); Rule 245 IT Rules 2026 / s.510 ITA 2025; Rule 114-I / s.285BB 1961"
      official: true
    - title: "TaxGuru – View AIS"
      url: "https://taxguru.in/income-tax/view-ais-annual-information-statement.html"
      ref: "Six feedback options"
      official: false
    - title: "TaxAJ – SFT codes in AIS (2026)"
      url: "https://www.taxaj.com/learn/?p=304"
      ref: "SFT-001 to SFT-018 and sub-codes"
      official: false
fields:
  - name: "pan"
    label: "PAN"
    source_path: "Part A"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "Assessee PAN."
    origin: "catalogue"
  - name: "financial_year"
    label: "Financial Year"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: ""
    origin: "catalogue"
  - name: "ais_part"
    label: "Part B section"
    source_path: "Part B"
    data_type: "enum"
    required: "yes"
    validation: "TDS_TCS|SFT|TAX_PAYMENT|DEMAND_REFUND|OTHER"
    description: "Section of Part B the record belongs to."
    origin: "catalogue"
  - name: "information_code"
    label: "Information code / SFT code"
    source_path: "Part B"
    data_type: "string"
    required: "yes"
    validation: "e.g. SFT-001..SFT-018 (with sub-codes like SFT-017(LES), SFT-018(EMF)); TDS-<section> e.g. TDS-194J (pattern implementation assumption); EXC-GSTR3B"
    description: "Code identifying the information category; key to map to ITR heads/books ledgers."
    origin: "catalogue"
  - name: "information_description"
    label: "Information description"
    source_path: "Part B"
    data_type: "string"
    required: "yes"
    validation: "free text"
    description: "Description e.g. 'Interest from deposit', 'Receipt of professional fees'."
    origin: "catalogue"
  - name: "information_source"
    label: "Information source"
    source_path: "Part B"
    data_type: "string"
    required: "yes"
    validation: "Source name + TAN/PAN/registration no."
    description: "Reporting entity (bank, employer, registrar, GSTN)."
    origin: "catalogue"
  - name: "information_count"
    label: "Count"
    source_path: "Part B"
    data_type: "integer"
    required: "no"
    validation: ">=0"
    description: "Number of underlying transactions (implementation label)."
    origin: "catalogue"
  - name: "reported_value"
    label: "Information value / Reported by source"
    source_path: "Part B"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Value as reported by the source."
    origin: "catalogue"
  - name: "modified_value"
    label: "Modified value (after feedback)"
    source_path: "Part B"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Value after taxpayer feedback."
    origin: "catalogue"
  - name: "status"
    label: "Status"
    source_path: "Part B"
    data_type: "enum"
    required: "no"
    validation: "Active|Inactive|Feedback given (as displayed)"
    description: "Display status (labels not verified)."
    origin: "catalogue"
  - name: "feedback_option"
    label: "Feedback"
    source_path: "Part B"
    data_type: "enum"
    required: "no"
    validation: "Information is correct|Income is not taxable|Information is not fully correct|Information relates to other PAN/year|Information is duplicate/included in other information|Information is denied"
    description: "Taxpayer feedback; drives TIS accepted value."
    origin: "catalogue"
  - name: "txn_quarter"
    label: "Quarter"
    source_path: "Part B transaction detail"
    data_type: "enum"
    required: "no"
    validation: "Q1|Q2|Q3|Q4"
    description: "Quarter of TDS transaction (detail view)."
    origin: "catalogue"
  - name: "txn_date"
    label: "Date of payment/credit / Reported on"
    source_path: "Part B transaction detail"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: "Transaction date."
    origin: "catalogue"
  - name: "amount_paid_credited"
    label: "Amount paid/credited"
    source_path: "Part B TDS detail"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Gross amount."
    origin: "catalogue"
  - name: "tds_deducted"
    label: "TDS deducted / TCS collected"
    source_path: "Part B TDS detail"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tds_deposited"
    label: "TDS deposited / TCS deposited"
    source_path: "Part B TDS detail"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "account_number"
    label: "Account number"
    source_path: "SFT detail (interest/deposits)"
    data_type: "string"
    required: "no"
    validation: "masked as provided"
    description: "Bank account – link to BANK_STMT."
    origin: "catalogue"
  - name: "account_type"
    label: "Account type"
    source_path: "SFT detail"
    data_type: "string"
    required: "no"
    validation: "Savings|Term|Recurring|..."
    description: ""
    origin: "catalogue"
  - name: "tax_payment_bsr"
    label: "BSR code"
    source_path: "Payment of Taxes"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{7}$"
    description: "For advance/self-assessment tax rows."
    origin: "catalogue"
  - name: "tax_payment_date"
    label: "Date of deposit"
    source_path: "Payment of Taxes"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "tax_payment_csn"
    label: "Challan serial number"
    source_path: "Payment of Taxes"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{1,5}$ (left-pad to 5 for matching)"
    description: ""
    origin: "catalogue"
  - name: "tax_payment_major_head"
    label: "Major head"
    source_path: "Payment of Taxes"
    data_type: "string"
    required: "no"
    validation: "0020|0021"
    description: ""
    origin: "catalogue"
  - name: "tax_payment_minor_head"
    label: "Minor head"
    source_path: "Payment of Taxes"
    data_type: "string"
    required: "no"
    validation: "100|300|400 ..."
    description: "100 advance tax, 300 self-assessment, 400 regular assessment."
    origin: "catalogue"
  - name: "tax_payment_amount"
    label: "Amount"
    source_path: "Payment of Taxes"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "gst_turnover"
    label: "GST turnover (EXC-GSTR3B)"
    source_path: "Other Information"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "GSTR-3B turnover by GSTIN/period for books/turnover reconciliation."
    origin: "catalogue"
  - name: "interest_reported"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ reported_value for information_code values mapped to interest income in the configurable AIS-code map."
    origin: "derived"
  - name: "property_value_reported"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ reported_value for information_code values mapped to immovable-property transactions in the configurable AIS-code map."
    origin: "derived"
