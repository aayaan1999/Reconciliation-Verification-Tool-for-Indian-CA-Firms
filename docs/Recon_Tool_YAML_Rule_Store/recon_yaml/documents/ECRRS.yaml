schema_version: "1.0"
document:
  code: "ECRRS"
  name: "Electronic Credit Reversal and Re-claimed Statement (and RCM liability/ITC statement)"
  issuer_system: "GST portal"
  legal_basis: "Circular 170/02/2022-GST (Table 4 reporting); GSTR-3B as amended by Notification 14/2022-CT; GSTN advisory (statement from August-2023 return period; opening balance by 30.11.2023, amendable thrice till 31.12.2023)"
  new_form_no: ""
  frequency: "monthly/quarterly (updated on each GSTR-3B)"
  formats_available: "Online view; download (format unverified)"
  how_obtained: "GST portal > Services > Ledgers > Electronic Credit Reversal and Re-claimed Statement"
  due_date: "Updated on GSTR-3B filing"
  tables_used: "Opening balance (one-time declaration of accumulated 4B(2) reversals); per period: ITC reversed in 4B(2) (credit to statement), ITC reclaimed in 4D(1) (debit), closing balance – by IGST/CGST/SGST/Cess"
  used_by_rules:
    - "RC-GST-014"
    - "RC-GST-018"
  verification_status: "partially_verified"
  notes: "Exact column headers of the portal statement were NOT verified; fields are derived from the described mechanics (opening + 4B(2) - 4D(1)). The 29.12.2025 GSTN advisory on blocking negative ECRRS/RCM balances (from gst.json) is unverified as to implementation. A parallel 'RCM Liability/ITC Statement' exists on the portal (3.1(d) vs 4A(2)/(3)); not catalogued separately – could be added as new code ECRL_RCM if needed."
  sources:
    - title: "Electronic Credit Reversal and Reclaimed Statement (GSTHero)"
      url: "https://gsthero.com/blog/electronic-credit-reversal-and-reclaimed-statement/"
      ref: ""
      official: false
    - title: "Understanding ECRS (Cygnet)"
      url: "https://www.cygnet.one/blog/understanding-electronic-credit-reversal-and-re-claimed-statement-ecrs"
      ref: ""
      official: false
    - title: "Circular 170/02/2022-GST (gstcouncil.gov.in)"
      url: "https://www.gstcouncil.gov.in/sites/default/files/2024-06/cir-170-02-2022-cgst.pdf"
      ref: ""
      official: true
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "header"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: ""
    origin: "catalogue"
  - name: "return_period"
    label: "Return period"
    source_path: "row"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "txn_date"
    label: "Date of filing / transaction"
    source_path: "row [JSON name unverified]"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "reference_no"
    label: "Reference No. (GSTR-3B ARN)"
    source_path: "row [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "description"
    label: "Description (Opening balance / Reversal 4B(2) / Reclaim 4D(1))"
    source_path: "row [JSON name unverified]"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "opening_igst"
    label: "Opening balance – IGST"
    source_path: "header [JSON name unverified]"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "cgst/sgst/cess likewise"
    origin: "catalogue"
  - name: "reversal_igst"
    label: "ITC reversed in Table 4(B)(2) – IGST/CGST/SGST/Cess"
    source_path: "row [JSON name unverified]"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "= GSTR-3B 4(B)(2)"
    origin: "catalogue"
  - name: "reclaim_igst"
    label: "ITC reclaimed in Table 4(D)(1) – IGST/CGST/SGST/Cess"
    source_path: "row [JSON name unverified]"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "= GSTR-3B 4(D)(1); must not exceed running balance (warning only per advisory)"
    origin: "catalogue"
  - name: "closing_igst"
    label: "Closing balance – IGST/CGST/SGST/Cess"
    source_path: "row [JSON name unverified]"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted; must be >= 0"
    description: "Closing = opening + 4B(2) - 4D(1)"
    origin: "catalogue"
