schema_version: "1.0"
document:
  code: "TRACES_JUST"
  name: "TRACES Justification Report (default details for a TDS/TCS statement)"
  issuer_system: "TRACES (CPC-TDS)"
  legal_basis: "Processing of statements u/s 200A (1961) / corresponding processing provision of ITA 2025 (not verified); intimation of defaults; s.201(1A), s.206C(7), s.234E, s.220(2) (1961) → s.398, s.427 (2025)"
  new_form_no: ""
  frequency: "Per statement (TAN + form + quarter + FY) after processing"
  formats_available: "Zip (password JR_<TAN>_<Form>_<Quarter>_<FY>) containing text file; converted to Excel by TRACES Justification Report Utility (macro)"
  how_obtained: "TRACES > Downloads > Requested Downloads / Request for Justification Report (FY, quarter, form; KYC with token no., challan, PAN-amount pairs) > HTTP download"
  due_date: ""
  tables_used: "Default summary; Short payment; Short deduction; Interest on payment default u/s 201(1A) (late payment / short payment / additional); Interest on deduction default (late deduction / short deduction / additional); Short payment on account of late filing fee (234E); Additional late filing levy; Interest u/s 220(2); PAN errors"
  used_by_rules:
    - "RC-TDS-007"
    - "RC-TDS-008"
  verification_status: "partially_verified"
  notes: "Default-type list from ClearTax and TDSMAN (secondary); download mechanics from Quicko (secondary). Exact sheet names and column headers of the Excel produced by the JR utility could not be verified – column labels above are implementation mapping; adjust importer to actual file. 2025-Act processing section not verified."
  sources:
    - title: "ClearTax – Download justification report"
      url: "https://cleartax.in/s/download-justification-report-to-reply-to-tds-demand-notice"
      ref: "Default types list"
      official: false
    - title: "Quicko – TRACES download justification report"
      url: "https://learn.quicko.com/traces-download-justification-report-24q-26q-27q"
      ref: "Request inputs; zip/text; JR utility"
      official: false
    - title: "TDSMAN – Evaluate TDS defaults using justification report"
      url: "https://blog.tdsman.com/2013/07/evaluate-your-tds-defaults-using-justification-report-downloaded-from-traces/"
      ref: "PAN errors, late payment, short deduction"
      official: false
    - title: "Income Tax Department – Section 397 ITA 2025"
      url: "https://www.incometaxindia.gov.in/w/section-397-6"
      ref: ""
      official: true
fields:
  - name: "tan"
    label: "TAN"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{4}[0-9]{5}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "financial_year"
    label: "Financial Year"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: ""
    origin: "catalogue"
  - name: "quarter"
    label: "Quarter"
    source_path: "Header"
    data_type: "enum"
    required: "yes"
    validation: "Q1|Q2|Q3|Q4"
    description: ""
    origin: "catalogue"
  - name: "form_type"
    label: "Form Type"
    source_path: "Header"
    data_type: "enum"
    required: "yes"
    validation: "24Q|26Q|27Q|27EQ|138|140|143|144"
    description: ""
    origin: "catalogue"
  - name: "token_no"
    label: "Token number of statement"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "15 digits"
    description: ""
    origin: "catalogue"
  - name: "default_type"
    label: "Type of default"
    source_path: "Detail"
    data_type: "enum"
    required: "yes"
    validation: "SHORT_PAYMENT|SHORT_DEDUCTION|INT_SHORT_PAYMENT|INT_LATE_PAYMENT|ADDL_LATE_PAYMENT_INT|INT_SHORT_DEDUCTION|INT_LATE_DEDUCTION|ADDL_LATE_DEDUCTION_INT|LATE_FILING_FEE_234E|ADDL_LATE_FILING_LEVY|INT_220_2|PAN_ERROR"
    description: "Normalised code for default sheet (labels per ClearTax list)."
    origin: "catalogue"
  - name: "challan_serial_ref"
    label: "Challan serial / CIN reference"
    source_path: "Detail"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Link to TDS_CHALLAN."
    origin: "catalogue"
  - name: "deductee_record_no"
    label: "Deductee row number in statement"
    source_path: "Detail"
    data_type: "integer"
    required: "no"
    validation: ""
    description: "Link to TDS_RET_xx DD."
    origin: "catalogue"
  - name: "deductee_pan"
    label: "PAN of deductee"
    source_path: "Detail"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "section_code"
    label: "Section"
    source_path: "Detail"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "amount_paid_credited"
    label: "Amount paid/credited"
    source_path: "Detail"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "date_paid_credited"
    label: "Date of payment/credit"
    source_path: "Detail"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "date_deducted"
    label: "Date of deduction"
    source_path: "Detail"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "date_deposit"
    label: "Date of deposit"
    source_path: "Detail"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "tds_deducted"
    label: "TDS deducted"
    source_path: "Detail"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tds_applicable_rate"
    label: "Applicable rate"
    source_path: "Detail"
    data_type: "decimal"
    required: "no"
    validation: "4 dp"
    description: "Rate per processing (e.g. 20% where PAN invalid)."
    origin: "catalogue"
  - name: "tds_rate_applied"
    label: "Rate at which deducted"
    source_path: "Detail"
    data_type: "decimal"
    required: "no"
    validation: "4 dp"
    description: ""
    origin: "catalogue"
  - name: "tds_short_deducted"
    label: "Short deduction amount"
    source_path: "Detail"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "months_delay"
    label: "No. of months of delay"
    source_path: "Detail"
    data_type: "integer"
    required: "no"
    validation: ">=0"
    description: "Part-month counted as full month (interest rule)."
    origin: "catalogue"
  - name: "interest_rate"
    label: "Interest rate"
    source_path: "Detail"
    data_type: "decimal"
    required: "no"
    validation: "1 / 1.5 (% per month)"
    description: ""
    origin: "catalogue"
  - name: "default_amount"
    label: "Default amount (interest/fee/short payment)"
    source_path: "Detail"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "late_filing_days"
    label: "Days of delay in filing"
    source_path: "Late filing fee"
    data_type: "integer"
    required: "no"
    validation: ">=0"
    description: "Fee Rs 200/day capped at TDS amount (234E/427)."
    origin: "catalogue"
  - name: "amount_paid_against_default"
    label: "Amount already paid / adjusted"
    source_path: "Summary"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "net_payable"
    label: "Net payable"
    source_path: "Summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "total_default"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ default_amount over all rows of the justification report (before amount_paid_against_default; net_payable is the after-payment figure)."
    origin: "derived"
