schema_version: "1.0"
document:
  code: "CREDITORS_AGEING"
  name: "Creditors (trade payables) ageing – bill-wise with MSME split"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law. Schedule III trade payables ageing (MSME / others; disputed); MSMED s.15/16/22; s.43B(h) – see FS-002/MSME-002"
  new_form_no: ""
  frequency: "Quarterly / half-yearly / annual"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Tally Prime: Bills Payable / Ageing Analysis > Export"
  due_date: ""
  tables_used: "Party × bill with ageing buckets and MSME category"
  used_by_rules:
    - "RC-ACC-004"
    - "RC-ACC-008"
    - "RC-IT-011"
    - "RC-IT-013"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "DPNC – Schedule III amendments w.e.f. 01-04-2021"
      url: "https://www.dpncindia.com/amendment-in-schedule-iii-of-the-companies-act-2013-applicable-w-e-f-01-04-2021"
      ref: "Ageing schedules (prior round)"
      official: false
    - title: "Taxmann – MSME Form 1 revised"
      url: "https://www.taxmann.com/post/blog/mca-revises-msme-form-1-with-enhanced-disclosures-for-reporting-payments-pending-over-45-days-to-micro-small-enterprises/"
      ref: "(prior round)"
      official: false
fields:
  - name: "as_on_date"
    label: "As on date"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "party_name"
    label: "Party name"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "party_gstin"
    label: "GSTIN"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "party_pan"
    label: "PAN"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "bill_ref"
    label: "Bill ref / invoice no."
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Bill-wise (FIFO if on-account)."
    origin: "catalogue"
  - name: "bill_date"
    label: "Bill date"
    source_path: "Row"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "due_date"
    label: "Due on"
    source_path: "Row"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "overdue_days"
    label: "Overdue by days"
    source_path: "Row"
    data_type: "integer"
    required: "no"
    validation: ">=0"
    description: ""
    origin: "catalogue"
  - name: "pending_amount"
    label: "Pending amount"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "bucket_lt1y"
    label: "Less than 1 year"
    source_path: "Schedule III bucket"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Ageing from due date (or transaction date if no due date)."
    origin: "catalogue"
  - name: "bucket_1_2y"
    label: "1-2 years"
    source_path: "Schedule III bucket"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "bucket_2_3y"
    label: "2-3 years"
    source_path: "Schedule III bucket"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "bucket_gt3y"
    label: "More than 3 years"
    source_path: "Schedule III bucket"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "disputed_flag"
    label: "Disputed"
    source_path: "Classification"
    data_type: "enum"
    required: "no"
    validation: "Y|N"
    description: ""
    origin: "catalogue"
  - name: "msme_category"
    label: "MSME category"
    source_path: "Classification"
    data_type: "enum"
    required: "no"
    validation: "Micro|Small|Medium|None"
    description: "From MSME_VENDOR_MASTER."
    origin: "catalogue"
  - name: "acceptance_date"
    label: "Date of acceptance / deemed acceptance"
    source_path: "MSMED"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: "s.15 MSMED 15/45-day test."
    origin: "catalogue"
  - name: "agreed_credit_days"
    label: "Agreed credit days (written agreement)"
    source_path: "MSMED"
    data_type: "integer"
    required: "no"
    validation: "<=45"
    description: ""
    origin: "catalogue"
