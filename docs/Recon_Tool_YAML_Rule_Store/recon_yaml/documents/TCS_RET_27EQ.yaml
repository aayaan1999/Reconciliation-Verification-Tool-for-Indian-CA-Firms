schema_version: "1.0"
document:
  code: "TCS_RET_27EQ"
  name: "Quarterly TCS statement (Form 27EQ / Form 143)"
  issuer_system: "Prepared by deductor (RPU / Tally / TDS software) → validated by Protean FVU → filed on e-Filing portal / TIN-FC; processed by TRACES (CPC-TDS)"
  legal_basis: "IT Act 1961 s.206C(3) read with Rule 31AA; ITA 2025 s.397(3)(b) read with Rule 219 (TCS u/s 394)"
  new_form_no: "Form 143 (TY 2026-27 onwards)"
  frequency: "Quarterly"
  formats_available: "Text file (.txt, '^'-delimited, FVU-validated .fvu), PDF Form 27A / statistics report; TRACES 'conso file' (.tds/.txt) for corrections; Excel from RPU/software"
  how_obtained: "From client's TDS software/RPU export, or TRACES > Statements/Payments > Request for Conso File (token no. + challan + PAN-amount KYC)"
  due_date: "FY 2025-26 (Rule 31AA): Q1 15 Jul, Q2 15 Oct, Q3 15 Jan, Q4 15 May. TY 2026-27 (Rule 219, Form 143): 31 Jul, 31 Oct, 31 Jan, 31 May"
  tables_used: "File Header (FH); Batch Header (BH) = Part A deductor details; Challan Detail (CD) = Part B / cols 401-411; Deductee Detail (DD) = Annexure / cols 412-425; collectee-specific fields"
  used_by_rules:
    - "RC-TDS-012"
  verification_status: "partially_verified"
  notes: "Record layout (FH/BH/CD/DD, '^'-delimited text, validated by Protean FVU) transcribed from an ERP vendor's documentation of the NSDL e-TDS file format and cross-checked with the Protean-hosted Form 26Q (cols 401-425). The official Protean file-format PDFs could not be opened (proxy blocked / JS site) – field numbers must be re-checked against the current file format before coding a parser. From TY 2026-27 (Q1 onwards) statements are filed in Forms 138/140/143/144 with RPU/FVU 1.x (FVU 1.2 released 19-08-2026): surcharge/cess/penalty-others removed from challan details, Interest Allocation and Others Allocation added, Date of Payment must fall within the quarter/tax year, BSR code and challan serial mapped to Form 137 columns G and I, certificate no. column moved (138: col N, 140: col O, 144: col AB, 143: col Q). Section codes change to ITA 2025 sections. For TCS the 'deductee' block is the collectee; columns are 'collected' instead of 'deducted'. Collectee-specific codes are NOT verified – load from FVU master."
  sources:
    - title: "Income Tax Department – Form No. 143 note"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/fn-143"
      ref: "TCS statement (seen in search results only)"
      official: true
    - title: "TDSMAN – Key features RPU/FVU 1.2 (Forms 138/140/143/144)"
      url: "https://blog.tdsman.com/downloads/key_features_fvu_1_2.pdf"
      ref: "Interest/Others allocation, date validation, column changes"
      official: false
    - title: "Oracle JD Edwards – Text file fields output for Form 26Q"
      url: "https://docs.oracle.com/cd/E16582_01/doc.91/e23355/txt_file_field_26q.htm"
      ref: "FH/BH/CD/DD record layout of NSDL e-TDS file (secondary transcription)"
      official: false
    - title: "Income Tax Department – Rule 219"
      url: "https://www.incometaxindia.gov.in/w/rule-219-1"
      ref: "Statement due dates"
      official: true
    - title: "TaxGuru – Q1 tax year 2026-27 TDS/TCS forms & due dates"
      url: "https://taxguru.in/income-tax/q1-tax-year-2026-27-tds-tcs-return-filing-forms-due-dates.html"
      ref: "(prior round)"
      official: false
fields:
  - name: "tan"
    label: "TAN of Deductor/Collector"
    source_path: "BH field 13 / Part A"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{4}[0-9]{5}[A-Z]$"
    description: "Primary key of statement."
    origin: "catalogue"
  - name: "deductor_pan"
    label: "PAN of Deductor"
    source_path: "BH field 15"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$ or PANNOTREQD"
    description: ""
    origin: "catalogue"
  - name: "form_no"
    label: "Form number"
    source_path: "BH field 5"
    data_type: "enum"
    required: "yes"
    validation: "24Q|26Q|27Q|27EQ|138|140|143|144"
    description: ""
    origin: "catalogue"
  - name: "financial_year"
    label: "Financial year / Tax Year"
    source_path: "BH field 17"
    data_type: "string"
    required: "yes"
    validation: "yyyyyy e.g. 202526 in file; 'Tax Year' label in new forms"
    description: ""
    origin: "catalogue"
  - name: "assessment_year"
    label: "Assessment year"
    source_path: "BH field 16"
    data_type: "string"
    required: "no"
    validation: "yyyyyy"
    description: "Legacy forms."
    origin: "catalogue"
  - name: "quarter"
    label: "Period"
    source_path: "BH field 18"
    data_type: "enum"
    required: "yes"
    validation: "Q1|Q2|Q3|Q4"
    description: ""
    origin: "catalogue"
  - name: "statement_type"
    label: "Original / Correction"
    source_path: "Header"
    data_type: "enum"
    required: "yes"
    validation: "O|C (implementation label)"
    description: "Correction statements supersede earlier data."
    origin: "catalogue"
  - name: "token_no"
    label: "Token / Provisional Receipt Number (new forms: Return Receipt Number)"
    source_path: "BH field 9/10"
    data_type: "string"
    required: "no"
    validation: "15 digits"
    description: "Needed to download TRACES_JUST and file corrections."
    origin: "catalogue"
  - name: "deductor_name"
    label: "Name of Deductor"
    source_path: "BH field 19"
    data_type: "string"
    required: "yes"
    validation: "free text"
    description: ""
    origin: "catalogue"
  - name: "deductor_type"
    label: "Deductor type"
    source_path: "BH field 32"
    data_type: "string"
    required: "yes"
    validation: "code per master (Company, Individual/HUF, Govt …)"
    description: ""
    origin: "catalogue"
  - name: "batch_total_deposit"
    label: "Batch Total of Total of Deposit Amount as per Challan"
    source_path: "BH field 47"
    data_type: "decimal"
    required: "yes"
    validation: "= Σ CD.challan_total"
    description: "Statement-level control total."
    origin: "catalogue"
  - name: "challan_count"
    label: "Count of Challan/transfer voucher records"
    source_path: "BH field 4"
    data_type: "integer"
    required: "yes"
    validation: ">=0"
    description: ""
    origin: "catalogue"
  - name: "challan_record_no"
    label: "Challan-Detail Record Number / Sl. No."
    source_path: "27EQ CD field 4 (col 401)"
    data_type: "integer"
    required: "yes"
    validation: ">=1"
    description: "Serial of challan within statement; DD rows link via this."
    origin: "catalogue"
  - name: "deductee_record_count"
    label: "Count of Deductee/Party Records"
    source_path: "27EQ CD field 5"
    data_type: "integer"
    required: "yes"
    validation: ">=0"
    description: ""
    origin: "catalogue"
  - name: "nil_challan_indicator"
    label: "NIL Challan Indicator"
    source_path: "27EQ CD field 6"
    data_type: "enum"
    required: "yes"
    validation: "Y|N"
    description: "Y when no tax deposited (all rows lower/nil)."
    origin: "catalogue"
  - name: "bsr_code"
    label: "Bank-Branch Code (BSR) / Form 24G (Form 137) Receipt Number"
    source_path: "27EQ CD field 16 (col 408)"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{7}$ (book-entry: 24G/137 receipt no.)"
    description: "Part of CIN; match key to TDS_CHALLAN."
    origin: "catalogue"
  - name: "challan_serial_no"
    label: "Bank Challan No / DDO serial no. of Form 24G"
    source_path: "27EQ CD field 12/14 (col 409)"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{1,5}$ (left-pad to 5 for matching)"
    description: "Part of CIN; never 'ITNS 281'."
    origin: "catalogue"
  - name: "challan_date"
    label: "Date of Bank Challan / Transfer Voucher"
    source_path: "27EQ CD field 18 (col 410)"
    data_type: "date"
    required: "yes"
    validation: "ddmmyyyy in file; nil challan = quarter end date"
    description: "Date of deposit; part of CIN."
    origin: "catalogue"
  - name: "minor_head"
    label: "Minor Head of Challan"
    source_path: "27EQ CD field 40 (col 411)"
    data_type: "enum"
    required: "yes"
    validation: "200|400"
    description: "200 = TDS/TCS payable by taxpayer; 400 = regular assessment (demand)."
    origin: "catalogue"
  - name: "challan_tax"
    label: "Oltas TDS/TCS – Income Tax"
    source_path: "27EQ CD field 22 (col 402)"
    data_type: "decimal"
    required: "yes"
    validation: "integer value with .00"
    description: ""
    origin: "catalogue"
  - name: "challan_surcharge"
    label: "Oltas TDS/TCS – Surcharge"
    source_path: "27EQ CD field 23"
    data_type: "decimal"
    required: "no"
    validation: "integer .00; removed from Forms 138/140/143/144 challan details (FVU 1.2)"
    description: "Legacy forms only."
    origin: "catalogue"
  - name: "challan_cess"
    label: "Oltas TDS/TCS – Cess"
    source_path: "27EQ CD field 24"
    data_type: "decimal"
    required: "no"
    validation: "integer .00; removed in new forms"
    description: "Legacy forms only."
    origin: "catalogue"
  - name: "challan_interest"
    label: "Oltas TDS/TCS – Interest Amount / Total Interest (C)"
    source_path: "27EQ CD field 25 (col 403)"
    data_type: "decimal"
    required: "yes"
    validation: "integer .00"
    description: "Interest paid in challan."
    origin: "catalogue"
  - name: "challan_fee"
    label: "Fee (s.234E / s.427) / Total Fee (D)"
    source_path: "27EQ CD field 39 (col 404)"
    data_type: "decimal"
    required: "yes"
    validation: "integer .00"
    description: "Late filing fee paid."
    origin: "catalogue"
  - name: "challan_others"
    label: "Oltas TDS/TCS – Others (amount)"
    source_path: "27EQ CD field 26 (col 405)"
    data_type: "decimal"
    required: "no"
    validation: "integer .00; Penalty/Others removed in new forms"
    description: ""
    origin: "catalogue"
  - name: "challan_total"
    label: "Total of Deposit Amount as per Challan/Transfer Voucher"
    source_path: "27EQ CD field 27 (col 406)"
    data_type: "decimal"
    required: "yes"
    validation: "= tax + surcharge + cess + interest + fee + others"
    description: "Must equal amount on CIN in OLTAS."
    origin: "catalogue"
  - name: "deductee_total_deposited"
    label: "Total Tax Deposit Amount as per deductee annexure"
    source_path: "27EQ CD field 29"
    data_type: "decimal"
    required: "yes"
    validation: "= Σ DD.tax_deposited for this challan"
    description: "Consumption of challan; must be <= challan_tax (+allocations)."
    origin: "catalogue"
  - name: "interest_allocation"
    label: "Interest Allocation"
    source_path: "27EQ Challan details (new forms, RPU/FVU 1.2)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "New column in Forms 138/140/143/144 from FVU 1.2."
    origin: "catalogue"
  - name: "others_allocation"
    label: "Others Allocation"
    source_path: "27EQ Challan details (new forms, RPU/FVU 1.2)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "New column in Forms 138/140/143/144 from FVU 1.2."
    origin: "catalogue"
  - name: "book_entry_flag"
    label: "By Book entry / Cash"
    source_path: "27EQ CD field 37 (col 407)"
    data_type: "enum"
    required: "yes"
    validation: "Y|N (C=Challan/B=Book adjustment on printed form)"
    description: "Government book adjustment vs challan."
    origin: "catalogue"
  - name: "deductee_record_no"
    label: "Deductee/Party Detail Record No"
    source_path: "27EQ DD field 5 (col 412)"
    data_type: "integer"
    required: "yes"
    validation: ">=1"
    description: ""
    origin: "catalogue"
  - name: "challan_record_no_ref"
    label: "Challan-Detail Record Number"
    source_path: "27EQ DD field 4"
    data_type: "integer"
    required: "yes"
    validation: "must exist in CD"
    description: "Link to parent challan."
    origin: "catalogue"
  - name: "deductee_code"
    label: "Deductee code"
    source_path: "27EQ DD field 8 (col 414)"
    data_type: "enum"
    required: "yes"
    validation: "01 (Company) | 02 (Other than company)"
    description: ""
    origin: "catalogue"
  - name: "deductee_pan"
    label: "PAN of deductee"
    source_path: "27EQ DD field 10 (col 415)"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$ or PANAPPLIED|PANINVALID|PANNOTAVBL"
    description: "Primary match key to books / Form 16A / 26AS of payee."
    origin: "catalogue"
  - name: "deductee_ref_no"
    label: "Deductee reference number"
    source_path: "27EQ DD field 12 (col 413)"
    data_type: "string"
    required: "no"
    validation: "max 10 chars (implementation)"
    description: "Deductor's own ref – useful to link to PARTY_MASTER."
    origin: "catalogue"
  - name: "deductee_name"
    label: "Name of deductee"
    source_path: "27EQ DD field 13 (col 416)"
    data_type: "string"
    required: "yes"
    validation: "free text"
    description: ""
    origin: "catalogue"
  - name: "tds_income_tax"
    label: "TDS/TCS – Income Tax for the period"
    source_path: "27EQ DD field 14"
    data_type: "decimal"
    required: "yes"
    validation: "2 dp"
    description: "Legacy split; new forms show total only."
    origin: "catalogue"
  - name: "tds_surcharge"
    label: "TDS/TCS – Surcharge"
    source_path: "27EQ DD field 15"
    data_type: "decimal"
    required: "no"
    validation: "2 dp"
    description: ""
    origin: "catalogue"
  - name: "tds_cess"
    label: "TDS/TCS – Cess"
    source_path: "27EQ DD field 16"
    data_type: "decimal"
    required: "no"
    validation: "2 dp"
    description: ""
    origin: "catalogue"
  - name: "tax_deducted"
    label: "Total Income Tax Deducted at Source"
    source_path: "27EQ DD field 17 (col 420)"
    data_type: "decimal"
    required: "yes"
    validation: "= 14+15+16"
    description: ""
    origin: "catalogue"
  - name: "tax_deposited"
    label: "Total Tax Deposited"
    source_path: "27EQ DD field 19 (col 421)"
    data_type: "decimal"
    required: "yes"
    validation: "2 dp; <= tax_deducted normally"
    description: ""
    origin: "catalogue"
  - name: "amount_paid_credited"
    label: "Amount of Payment / Credit (Rs)"
    source_path: "27EQ DD field 22 (col 419)"
    data_type: "decimal"
    required: "yes"
    validation: "> 0.00"
    description: "Base amount – match to books expense / payee's income."
    origin: "catalogue"
  - name: "date_paid_credited"
    label: "Date on which Amount paid / Credited"
    source_path: "27EQ DD field 23 (col 418)"
    data_type: "date"
    required: "yes"
    validation: "ddmmyyyy; FVU 1.2: must fall within the quarter and tax year of the statement"
    description: "Drives due-date and interest computations."
    origin: "catalogue"
  - name: "date_deducted"
    label: "Date on which tax Deducted / Collected"
    source_path: "27EQ DD field 24 (col 422)"
    data_type: "date"
    required: ""
    validation: "mandatory if tax_deducted > 0; within quarter"
    description: ""
    origin: "catalogue"
  - name: "rate_deducted"
    label: "Rate at which Tax Deducted / Collected"
    source_path: "27EQ DD field 26 (col 423)"
    data_type: "decimal"
    required: "yes"
    validation: "4 dp e.g. 10.0000; 0.0000 if tax 0"
    description: "Compare with section master rate."
    origin: "catalogue"
  - name: "remark_reason_code"
    label: "Remarks 1 – Reason for non-deduction / lower / higher deduction"
    source_path: "27EQ DD field 30 (col 424)"
    data_type: "enum"
    required: "no"
    validation: "A (lower/no deduction u/s 197 certificate) | B (no deduction on 15G/15H declaration u/s 197A) | C (higher rate – PAN not available) | T (transporter u/s 194C(6) with valid PAN) | Y (threshold not exceeded) | S (software payment u/s 194J, Notfn 21/2012) | Z (no deduction u/s 197A per 2018 form) | blank. Later FVU versions added further codes – load the master from the current FVU/RPU, do not hard-code"
    description: "Explains deviations from normal rate."
    origin: "catalogue"
  - name: "section_code"
    label: "Section Code under which payment made"
    source_path: "27EQ DD field 33 (col 417)"
    data_type: "string"
    required: "yes"
    validation: "Legacy: 193, 194, 194A, 194C, 194H, 194I(a), 194I(b), 194J ... (UDC master). New forms: ITA 2025 s.392/393/394 table-serial codes – load from FVU master"
    description: "Normalise via section map before matching."
    origin: "catalogue"
  - name: "lower_cert_no"
    label: "Certificate number u/s 197 (s.395 for new forms)"
    source_path: "27EQ DD field 34 (col 425; new forms col N/O/AB/Q)"
    data_type: "string"
    required: ""
    validation: "mandatory if remark A"
    description: "Match to Form 13/Form 128 certificate."
    origin: "catalogue"
  - name: "form121_uin"
    label: "UIN of Form No. 121 (declaration)"
    source_path: "27EQ Annexure (new forms)"
    data_type: "string"
    required: "no"
    validation: "alphanumeric"
    description: "Form 121 replaces 15G/15H (TY 2026-27)."
    origin: "catalogue"
  - name: "collectee_pan"
    label: "PAN of collectee"
    source_path: "27EQ DD (collectee detail)"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$ or PANNOTAVBL"
    description: "Replaces deductee_pan semantics for TCS."
    origin: "catalogue"
  - name: "amount_received_debited"
    label: "Amount received/debited"
    source_path: "27EQ DD"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Sale consideration on which TCS collected."
    origin: "catalogue"
  - name: "total_value_of_purchase"
    label: "Total Value of Purchase"
    source_path: "27EQ DD field 21"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Used for TCS sections based on value (legacy file field)."
    origin: "catalogue"
  - name: "tcs_collection_code"
    label: "Collection code / section"
    source_path: "27EQ DD"
    data_type: "string"
    required: "yes"
    validation: "legacy codes e.g. 6CA..6CR (206C sub-sections) – load from FVU master; new forms: s.394 table serial"
    description: ""
    origin: "catalogue"
  - name: "tcs_reason_code"
    label: "Reason for non-collection / lower collection"
    source_path: "27EQ DD"
    data_type: "enum"
    required: "no"
    validation: "A (lower/nil cert) | B (Form 27C declaration) | C (higher rate, no PAN) | others per FVU master"
    description: ""
    origin: "catalogue"
  - name: "tcs_cert_no"
    label: "Certificate no. u/s 206C(9) / s.395(3)"
    source_path: "27EQ DD (Form 143 col Q)"
    data_type: "string"
    required: ""
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "collectee_gstin_opt"
    label: "Whether collectee is non-resident without PE / opted flags"
    source_path: "27EQ DD"
    data_type: "enum"
    required: "no"
    validation: "per FVU master"
    description: ""
    origin: "catalogue"
