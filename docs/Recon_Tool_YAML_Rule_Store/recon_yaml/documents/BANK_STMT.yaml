schema_version: "1.0"
document:
  code: "BANK_STMT"
  name: "Bank account statement (from bank)"
  issuer_system: "Bank (internet banking / branch) – statement download"
  legal_basis: "Implementation design, not law. No single RBI-prescribed statement layout located; fields follow common bank statement conventions (value date, txn date, cheque/ref no., description, debit, credit, balance). Cheque validity 3 months per RBI."
  new_form_no: ""
  frequency: "Monthly / as required"
  formats_available: "PDF, Excel/CSV, MT940 (corporate), JSON via account aggregator (where available)"
  how_obtained: "Client downloads from net banking or bank provides; corporate H2H MT940"
  due_date: ""
  tables_used: "Header (account, IFSC, period, opening/closing balance); transaction lines"
  used_by_rules:
    - "RC-ACC-010"
    - "RC-BNK-001"
    - "RC-BNK-002"
    - "RC-BNK-003"
    - "RC-BNK-004"
    - "RC-BNK-005"
    - "RC-BNK-006"
    - "RC-PAY-002"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law (see BRS-001 in accounting.json)."
  sources:
    - title: "RBI – cheque validity 3 months"
      url: "https://www.rbi.org.in/commonman/English/scripts/Notification.aspx?Id=961"
      ref: "(prior round)"
      official: true
fields:
  - name: "bank_name"
    label: "Bank name"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "account_no"
    label: "Account number"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "digits (mask allowed)"
    description: "Key to BANK_BOOK."
    origin: "catalogue"
  - name: "ifsc"
    label: "IFSC"
    source_path: "Header"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{4}0[A-Z0-9]{6}$"
    description: ""
    origin: "catalogue"
  - name: "period_from"
    label: "Statement from"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "period_to"
    label: "Statement to"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "opening_balance"
    label: "Opening balance"
    source_path: "Header"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated signed"
    description: ""
    origin: "catalogue"
  - name: "closing_balance"
    label: "Closing balance"
    source_path: "Header"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated signed"
    description: "Opening + Σcr − Σdr = closing."
    origin: "catalogue"
  - name: "txn_date"
    label: "Transaction date / Posting date"
    source_path: "Line"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "value_date"
    label: "Value date"
    source_path: "Line"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "description"
    label: "Description / Narration / Particulars"
    source_path: "Line"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Parse UTR / cheque / UPI refs via regex (implementation)."
    origin: "catalogue"
  - name: "cheque_ref_no"
    label: "Cheque No. / Ref No."
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "utr"
    label: "UTR / RRN (parsed)"
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: "NEFT 16 / RTGS 22 / IMPS-UPI 12 (bank-industry convention, configurable)"
    description: ""
    origin: "catalogue"
  - name: "debit"
    label: "Withdrawal (Dr)"
    source_path: "Line"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "credit"
    label: "Deposit (Cr)"
    source_path: "Line"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "balance"
    label: "Balance"
    source_path: "Line"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated signed"
    description: "Running balance check."
    origin: "catalogue"
  - name: "txn_mode"
    label: "Mode (derived)"
    source_path: "Line"
    data_type: "enum"
    required: "no"
    validation: "CHQ|NEFT|RTGS|IMPS|UPI|CASH|ATM|CHARGES|INTEREST|OTHER"
    description: "Derived from description – implementation choice."
    origin: "catalogue"
  - name: "reference"
    label: ""
    source_path: ""
    data_type: "string"
    required: "no"
    validation: ""
    description: "DERIVED: coalesce(utr, cheque_ref_no, reference parsed from description (CRN/TRRN regex))."
    origin: "derived"
  - name: "amount"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: credit - debit (positive = money into bank)."
    origin: "derived"
  - name: "charges"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: debit where txn_mode = 'CHARGES'."
    origin: "derived"
  - name: "bank_tan"
    label: ""
    source_path: ""
    data_type: "string TAN"
    required: "no"
    validation: ""
    description: "DERIVED: PARTY_MASTER.tan of the party record for the bank (bank_name / account_no)."
    origin: "derived"
  - name: "interest_month"
    label: ""
    source_path: ""
    data_type: "string 'yyyy-mm'"
    required: "no"
    validation: ""
    description: "DERIVED: calendar month of txn_date of rows with txn_mode = 'INTEREST', format 'yyyy-mm'"
    origin: "derived"
  - name: "interest_credit"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: credit where txn_mode = 'INTEREST'."
    origin: "derived"
  - name: "tds_debits"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: debit on rows whose description matches the configured TDS-on-interest pattern."
    origin: "derived"
  - name: "cash_deposit_date"
    label: ""
    source_path: ""
    data_type: "date"
    required: "no"
    validation: ""
    description: "DERIVED: txn_date of rows with txn_mode = 'CASH' and credit > 0."
    origin: "derived"
  - name: "cash_deposits"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit where txn_mode = 'CASH' over the FY (per account_no)."
    origin: "derived"
  - name: "cash_deposit"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: credit where txn_mode = 'CASH'."
    origin: "derived"
  - name: "cash_withdrawal"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: debit where txn_mode in ('CASH','ATM')."
    origin: "derived"
