schema_version: "1.0"
document:
  code: "EPF_CHALLAN"
  name: "EPFO combined challan (A/c 01, 02, 10, 21 & 22) and payment receipt"
  issuer_system: "EPFO Unified Portal (TRRN generated after ECR); payment via internet banking (CRN / bank reference)"
  legal_basis: "EPF Scheme 1952 para 38 / EPF Scheme 2026; EPS 1995; EDLI 1976 (account heads)"
  new_form_no: ""
  frequency: "Monthly"
  formats_available: "PDF challan & payment receipt; ECR statement PDF/Excel"
  how_obtained: "Unified Portal > Payments > Payment (ECR) > View/print challan and payment receipt; client provides PDF"
  due_date: "15th of following month"
  tables_used: "Header (TRRN, establishment code & name, wage month, ECR Id, LIN); Subscriber summary (total subscribers, total wages EPF/EPS/EDLI); Account head table (A/C 01, 02, 10, 21, 22 × Administration charges / Employer's share / Employee's share / Total); Summary totals; Government-remitted amounts (PMRPY/ABRY, as applicable)"
  used_by_rules:
    - "RC-PAY-002"
    - "RC-PAY-006"
  verification_status: "partially_verified"
  notes: "Header/account-head labels read from a publicly posted EPFO combined challan (official layout). CRN / payment-date labels are on the separate payment receipt (not seen this session). Account formulas cross-refer to payroll.json PAY-004/005."
  sources:
    - title: "EPFO combined challan sample (public vendor portal)"
      url: "https://vcportal.endurancegroup.com/data/contractor/2303_13__section1_.pdf"
      ref: "Combined challan labels A/C 01,02,10,21,22; TRRN"
      official: false
    - title: "EPFO – Revamped ECR"
      url: "https://www.epfindia.gov.in/site_en/revamped_ecr.php"
      ref: "From wage month Sep 2025; no change in ECR format; return and payment segregated"
      official: true
    - title: "EPFO – Contribution rates"
      url: "https://www.epfindia.gov.in:443/site_docs/PDFs/MiscPDFs/ContributionRate.pdf"
      ref: "Account heads (from prior round)"
      official: true
fields:
  - name: "trrn"
    label: "TRRN"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "numeric (13 digits – implementation)"
    description: "Primary key to ECR."
    origin: "catalogue"
  - name: "establishment_code"
    label: "Establishment Code & Name"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "wage_month"
    label: "Dues for the wage month of"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "Mon-yyyy → yyyy-mm"
    description: ""
    origin: "catalogue"
  - name: "ecr_id"
    label: "ECR Id"
    source_path: "Header"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "challan_type"
    label: "Challan type"
    source_path: "Header"
    data_type: "enum"
    required: "no"
    validation: "Monthly|Arrear|Damages/Interest|... (labels not verified)"
    description: "Revamped ECR allows challan with damages/interest."
    origin: "catalogue"
  - name: "total_subscribers_epf"
    label: "Total Subscribers – EPF"
    source_path: "Subscriber details"
    data_type: "integer"
    required: "yes"
    validation: ">=0"
    description: "= count of ECR lines."
    origin: "catalogue"
  - name: "total_subscribers_eps"
    label: "Total Subscribers – EPS"
    source_path: "Subscriber details"
    data_type: "integer"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "total_subscribers_edli"
    label: "Total Subscribers – EDLI"
    source_path: "Subscriber details"
    data_type: "integer"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "total_wages_epf"
    label: "Total Wages – EPF"
    source_path: "Subscriber details"
    data_type: "integer"
    required: "yes"
    validation: "= Σ ECR.epf_wages"
    description: ""
    origin: "catalogue"
  - name: "total_wages_eps"
    label: "Total Wages – EPS"
    source_path: "Subscriber details"
    data_type: "integer"
    required: "yes"
    validation: "= Σ ECR.eps_wages"
    description: ""
    origin: "catalogue"
  - name: "total_wages_edli"
    label: "Total Wages – EDLI"
    source_path: "Subscriber details"
    data_type: "integer"
    required: "yes"
    validation: "= Σ ECR.edli_wages"
    description: ""
    origin: "catalogue"
  - name: "ac01_employer"
    label: "A/C.01 – Employer's Share"
    source_path: "Account head table"
    data_type: "integer"
    required: "yes"
    validation: "= Σ ECR.er_share_remitted"
    description: ""
    origin: "catalogue"
  - name: "ac01_employee"
    label: "A/C.01 – Employee's Share"
    source_path: "Account head table"
    data_type: "integer"
    required: "yes"
    validation: "= Σ ECR.ee_share_remitted"
    description: ""
    origin: "catalogue"
  - name: "ac02_admin"
    label: "A/C.02 – Administration Charges"
    source_path: "Account head table"
    data_type: "integer"
    required: "yes"
    validation: "rate × EPF wages subject to minimum (see PAY-004)"
    description: ""
    origin: "catalogue"
  - name: "ac10_employer"
    label: "A/C.10 – Employer's Share (Pension)"
    source_path: "Account head table"
    data_type: "integer"
    required: "yes"
    validation: "= Σ ECR.eps_contribution_remitted"
    description: ""
    origin: "catalogue"
  - name: "ac21_employer"
    label: "A/C.21 – Employer's Share (EDLI)"
    source_path: "Account head table"
    data_type: "integer"
    required: "yes"
    validation: "0.5% × EDLI wages"
    description: ""
    origin: "catalogue"
  - name: "ac22_admin"
    label: "A/C.22 – Administration Charges (EDLI)"
    source_path: "Account head table"
    data_type: "integer"
    required: "no"
    validation: "nil where waived"
    description: ""
    origin: "catalogue"
  - name: "grand_total"
    label: "Grand Total"
    source_path: "Summary"
    data_type: "integer"
    required: "yes"
    validation: "= Σ all heads"
    description: "Match to BANK_STMT debit and GL PF payable."
    origin: "catalogue"
  - name: "crn"
    label: "CRN (challan reference no.)"
    source_path: "Payment receipt"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "payment_date"
    label: "Date of payment / Date of credit"
    source_path: "Payment receipt"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: "Compare with due date (s.36(1)(va), damages)."
    origin: "catalogue"
  - name: "bank_reference_no"
    label: "Bank reference / transaction id"
    source_path: "Payment receipt"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Match to BANK_STMT."
    origin: "catalogue"
  - name: "damages_amount"
    label: "Damages (s.14B)"
    source_path: "Damages challan"
    data_type: "integer"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "interest_7q"
    label: "Interest (s.7Q)"
    source_path: "Damages challan"
    data_type: "integer"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "ac01_total"
    label: ""
    source_path: ""
    data_type: "integer"
    required: "no"
    validation: ""
    description: "DERIVED: ac01_employer + ac01_employee."
    origin: "derived"
