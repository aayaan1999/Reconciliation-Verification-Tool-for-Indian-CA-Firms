schema_version: "1.0"
document:
  code: "ADV_TAX_CHALLAN"
  name: "Advance tax / self-assessment tax challan (ITNS 280 via e-Pay Tax)"
  issuer_system: "e-Filing portal e-Pay Tax / authorised bank; OLTAS; reflected in AIS 'Payment of Taxes' and 26AS"
  legal_basis: "IT Act 1961 ss.207-211 (advance tax), s.140A (self-assessment); ITA 2025 advance tax provisions (ss.403-408 per prior round)"
  new_form_no: ""
  frequency: "Instalments 15 Jun / 15 Sep / 15 Dec / 15 Mar (single instalment by 15 Mar for presumptive) – ADV-002/003"
  formats_available: "PDF challan receipt; payment history CSV; AIS JSON"
  how_obtained: "e-Filing portal > e-File > e-Pay Tax > Payment History; AIS > Payment of Taxes"
  due_date: "15 Jun (15%), 15 Sep (45%), 15 Dec (75%), 15 Mar (100%)"
  tables_used: "Challan header; amount break-up; bank details/CIN"
  used_by_rules:
    - "RC-IT-005"
  verification_status: "partially_verified"
  notes: "Minor heads 100/300 confirmed in Protean Dos & Don'ts (official). Major head labels and 400 code from secondary/professional knowledge."
  sources:
    - title: "Protean – Dos and Don'ts for deductors/collectors"
      url: "https://tinpan.proteantech.in/downloads/e-tds/download/DosandDontsdeductorscollectors.pdf"
      ref: "CIN = BSR(7)+date+challan serial(5); challan matching"
      official: false
    - title: "ClearTax – TDS Challan ITNS 281"
      url: "https://cleartax.in/s/tds-challan-itns-281"
      ref: "Minor head 200/400; major head 0020/0021"
      official: false
    - title: "Income Tax Department – Section 234C"
      url: "https://www.incometaxindia.gov.in/w/section-234c-37"
      ref: "(prior round)"
      official: true
    - title: "Income Tax Department – Section 425 ITA 2025"
      url: "https://www.incometaxindia.gov.in/w/section-425-5"
      ref: "(prior round)"
      official: true
    - title: "e-Filing portal – AIS help"
      url: "https://www.incometax.gov.in/iec/foportal/help/all-topics/e-filing-services/ais-annual-information-statement"
      ref: "Part A/Part B, info code/description/value, PDF/JSON/CSV, EXC-GSTR3B"
      official: true
fields:
  - name: "pan"
    label: "PAN"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "assessment_year"
    label: "Assessment Year / Tax Year"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: ""
    origin: "catalogue"
  - name: "major_head"
    label: "Major Head"
    source_path: "Header"
    data_type: "enum"
    required: "yes"
    validation: "0020 (Corporation tax) | 0021 (Income tax other than companies)"
    description: ""
    origin: "catalogue"
  - name: "minor_head"
    label: "Minor Head / Type of Payment"
    source_path: "Header"
    data_type: "enum"
    required: "yes"
    validation: "100 (Advance tax) | 300 (Self-assessment tax) | 400 (Regular assessment) | others"
    description: ""
    origin: "catalogue"
  - name: "amount_tax"
    label: "Tax"
    source_path: "Amount"
    data_type: "decimal"
    required: "yes"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_surcharge"
    label: "Surcharge"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_cess"
    label: "Cess"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_interest"
    label: "Interest"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_penalty"
    label: "Penalty"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_others"
    label: "Others / Fee"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_total"
    label: "Total"
    source_path: "Amount"
    data_type: "decimal"
    required: "yes"
    validation: "= sum"
    description: ""
    origin: "catalogue"
  - name: "bsr_code"
    label: "BSR Code"
    source_path: "Bank"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{7}$"
    description: ""
    origin: "catalogue"
  - name: "date_of_deposit"
    label: "Date of Deposit"
    source_path: "Bank"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: "Determines instalment bucket for s.234C."
    origin: "catalogue"
  - name: "challan_serial_no"
    label: "Challan Serial No."
    source_path: "Bank"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{1,5}$ (left-pad to 5 for matching)"
    description: ""
    origin: "catalogue"
  - name: "cin"
    label: "CIN"
    source_path: "Bank"
    data_type: "string"
    required: "yes"
    validation: "BSR+date+CSN"
    description: "Key to ITR Schedule IT."
    origin: "catalogue"
  - name: "bank_reference_no"
    label: "Bank Reference Number"
    source_path: "Bank"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Link to BANK_STMT."
    origin: "catalogue"
