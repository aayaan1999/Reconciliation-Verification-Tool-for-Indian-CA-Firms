schema_version: "1.0"
document:
  code: "PARTY_MASTER"
  name: "Party (customer/vendor/employee/deductee) master"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law"
  new_form_no: ""
  frequency: "Maintained"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Tally Prime: List of Accounts (ledgers under Sundry Debtors/Creditors) > Export with statutory details"
  due_date: ""
  tables_used: "Ledger master with statutory identifiers (GST, PAN, TDS, MSME, bank)"
  used_by_rules:
    - "RC-ACC-005"
    - "RC-ACC-009"
    - "RC-TDS-002"
    - "RC-TDS-006"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "Tally – Sample Excel files for import (field names & aliases)"
      url: "https://help.tallysolutions.com/tally-prime/import-data/download-sample-excel-files-with-data-for-import"
      ref: "Voucher Date, Voucher Number, Party Name, Buyer/Supplier GSTIN/UIN, Item, Rate, Quantity, Ledger Group"
      official: false
    - title: "Tally – Sales Register (Sales Day Book)"
      url: "https://help.tallysolutions.com/docs/te9rel66/Reports/Display_Registers_Ledgers/Sales_Register_Sales_Day_Book.htm"
      ref: "Monthly summary → voucher list; Excel/Pivot export"
      official: false
fields:
  - name: "party_code"
    label: "Ledger alias / code"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "party_name"
    label: "Ledger name"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "ledger_group"
    label: "Group Name (Under)"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: "Sundry Debtors|Sundry Creditors|..."
    description: ""
    origin: "catalogue"
  - name: "gstin"
    label: "GST Registration – GSTIN/UIN"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "gst_registration_type"
    label: "Registration type"
    source_path: "Row"
    data_type: "enum"
    required: "no"
    validation: "Regular|Composition|Unregistered|Consumer|SEZ|Overseas"
    description: ""
    origin: "catalogue"
  - name: "state_code"
    label: "State"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "2-digit"
    description: ""
    origin: "catalogue"
  - name: "pan"
    label: "PAN/IT No."
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "pan_aadhaar_linked"
    label: "PAN operative status"
    source_path: "Row"
    data_type: "enum"
    required: "no"
    validation: "Operative|Inoperative|Unknown"
    description: "Higher rate checks."
    origin: "catalogue"
  - name: "tan"
    label: "TAN (for customers deducting TDS)"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{4}[0-9]{5}[A-Z]$"
    description: "Key to F26AS deductor TAN."
    origin: "catalogue"
  - name: "deductee_type"
    label: "Deductee type"
    source_path: "Row"
    data_type: "enum"
    required: "no"
    validation: "Company|Individual/HUF|Firm|AOP|Government|Non-resident"
    description: ""
    origin: "catalogue"
  - name: "default_tds_nature"
    label: "Default nature of payment (TDS)"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "lower_deduction_cert_no"
    label: "Lower deduction certificate no."
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "lower_deduction_rate"
    label: "Certificate rate"
    source_path: "Row"
    data_type: "decimal"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "lower_deduction_valid_from"
    label: "Certificate valid from"
    source_path: "Row"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "lower_deduction_valid_to"
    label: "Certificate valid to"
    source_path: "Row"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "lower_deduction_limit"
    label: "Certificate amount limit"
    source_path: "Row"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "msme_category"
    label: "MSME category"
    source_path: "Row"
    data_type: "enum"
    required: "no"
    validation: "Micro|Small|Medium|None"
    description: ""
    origin: "catalogue"
  - name: "udyam_no"
    label: "Udyam no."
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "related_party_flag"
    label: "Related party (s.40A(2)(b) / AS 18 / Ind AS 24)"
    source_path: "Row"
    data_type: "enum"
    required: "no"
    validation: "Y|N"
    description: ""
    origin: "catalogue"
  - name: "bank_account_no"
    label: "Bank account no."
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "ifsc"
    label: "IFSC"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{4}0[A-Z0-9]{6}$"
    description: ""
    origin: "catalogue"
  - name: "residential_status"
    label: "Residential status"
    source_path: "Row"
    data_type: "enum"
    required: "no"
    validation: "Resident|Non-resident|RNOR"
    description: "26Q vs 27Q / Form 140 vs 144."
    origin: "catalogue"
  - name: "confirmed_balance"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: ""
    validation: ""
    description: "Balance as per the balance-confirmation letter/statement received from the party, with confirmation date; not in catalogue."
    origin: "new (design)"
