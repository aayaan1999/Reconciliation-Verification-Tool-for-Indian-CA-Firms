schema_version: "1.0"
document:
  code: "RATE_MASTER"
  name: "GST rate master (HSN/SAC to rate)"
  issuer_system: "Tool-maintained master loaded from CBIC rate notifications"
  legal_basis: "Design document (not a statutory form)"
  new_form_no: ""
  frequency: ""
  formats_available: ""
  how_obtained: ""
  due_date: ""
  tables_used: ""
  used_by_rules: []
  verification_status: "unverified"
  notes: "Configurable HSN/SAC prefix to GST rate and compensation-cess rate table with effective-date ranges; one row per (hsn_prefix, condition, effective range). Content must be loaded from notifications and CA-reviewed. Added by field-model harmonisation – not in round-2 catalogue."
  sources: []
fields:
  - name: "hsn_prefix"
    label: "HSN/SAC prefix"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2,8}$"
    description: "Longest-prefix match against SALES_REG.hsn_sac."
    origin: "new document (design)"
  - name: "description"
    label: "Description of goods/services"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "new document (design)"
  - name: "condition"
    label: "Condition"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Condition text (e.g. value threshold, ITC restriction) where rate is conditional."
    origin: "new document (design)"
  - name: "rate"
    label: "GST rate (IGST %)"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(5,3)"
    description: "IGST rate; CGST = SGST = rate / 2."
    origin: "new document (design)"
  - name: "cess_rate"
    label: "Compensation cess rate"
    source_path: "Row"
    data_type: "decimal"
    required: "no"
    validation: "decimal(7,3)"
    description: "Ad valorem cess %; specific cess in cess_specific."
    origin: "new document (design)"
  - name: "cess_specific"
    label: "Specific cess"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Non-ad-valorem cess expression, if any."
    origin: "new document (design)"
  - name: "effective_from"
    label: "Effective from"
    source_path: "Row"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: "Rule ref RATE_MASTER.effective = [effective_from, effective_to]."
    origin: "new document (design)"
  - name: "effective_to"
    label: "Effective to"
    source_path: "Row"
    data_type: "date"
    required: "no"
    validation: "ISO; blank = open"
    description: ""
    origin: "new document (design)"
  - name: "notification_ref"
    label: "Notification reference"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Source notification and entry/schedule."
    origin: "new document (design)"
  - name: "effective_from"
    label: ""
    source_path: ""
    data_type: "date range"
    required: ""
    validation: ""
    description: "[effective_from, effective_to] of the RATE_MASTER row; SALES_REG.time_of_supply must fall within it. (catalogue name: \"effective_from/effective_to\")"
    origin: "new (design)"
  - name: "effective_to"
    label: ""
    source_path: ""
    data_type: "date range"
    required: ""
    validation: ""
    description: "[effective_from, effective_to] of the RATE_MASTER row; SALES_REG.time_of_supply must fall within it. (catalogue name: \"effective_from/effective_to\")"
    origin: "new (design)"
