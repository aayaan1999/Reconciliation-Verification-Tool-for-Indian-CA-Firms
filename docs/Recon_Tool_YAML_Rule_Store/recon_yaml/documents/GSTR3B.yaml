schema_version: "1.0"
document:
  code: "GSTR3B"
  name: "FORM GSTR-3B – Monthly/quarterly summary return and tax payment"
  issuer_system: "GST portal"
  legal_basis: "s.39 CGST Act; Rule 61, CGST Rules (form amended by Notification 14/2022-CT dt 05.07.2022: Table 3.1.1, revised Table 4); Rule 88D (ITC difference vs 2B); Rule 88C (liability difference vs GSTR-1)"
  new_form_no: ""
  frequency: "monthly; quarterly under QRMP"
  formats_available: "Online; JSON (save/get API, offline Excel utility v5.x), PDF (filed return / system-generated 3B)"
  how_obtained: "GST portal > Returns Dashboard > GSTR-3B > Download filed PDF; system-generated 3B summary PDF; JSON via GSP/API"
  due_date: "20th of following month (monthly); 22nd/24th of month after quarter by State group (QRMP, Notification 82/2020-CT)"
  tables_used: "3.1(a)-(e); 3.1.1(i),(ii); 3.2 (unregistered/composition/UIN by POS); 4A(1)-(5); 4B(1),(2); 4C; 4D(1),(2); 5 (exempt/nil/non-GST inward); 5.1 interest & late fee; 6.1 payment of tax (Part A other than RCM, Part B RCM)"
  used_by_rules:
    - "RC-GST-004"
    - "RC-GST-007"
    - "RC-GST-014"
    - "RC-GST-017"
    - "RC-GST-018"
    - "RC-GST-019"
    - "RC-GST-020"
    - "RC-GST-021"
    - "RC-GST-022"
    - "RC-GST-023"
    - "RC-GST-024"
    - "RC-GST-025"
    - "RC-GST-028"
    - "RC-GST-029"
    - "RC-GST-031"
    - "RC-GST-032"
    - "RC-GST-037"
    - "RC-GST-038"
    - "RC-IT-007"
  verification_status: "partially_verified"
  notes: "JSON keys verified from two independent copies of the GSTR-3B payload (Masters India save-3B doc and india-compliance template): sup_details{osup_det, osup_zero, osup_nil_exmp, isup_rev, osup_nongst}, eco_dtls{eco_sup, eco_reg_sup}, inter_sup{unreg_details, comp_details, uin_details}, itc_elg{itc_avl[IMPG,IMPS,ISRC,ISD,OTH], itc_rev[RUL,OTH], itc_net, itc_inelg[RUL,OTH]}, inward_sup.isup_details[GST,NONGST], intr_ltfee.intr_details. ltfee_details and the Table 6.1 payment JSON keys were NOT seen – unverified. Form text checked from a reproduction of the original form (pre-2022 labels for 4B/4D); amended labels per Notification 14/2022-CT from secondary source. Hard-lock of Table 3 auto-populated values from July-2025 and 3.2 non-editable from Nov-2025 – taken from existing gst.json rule GST-008 (secondary)."
  sources:
    - title: "Masters India API docs – Save GSTR-3B data (payload keys)"
      url: "https://docs.mastersindia.co/goods-and-services-tax-gst-api/save_3b_data"
      ref: ""
      official: false
    - title: "india-compliance – GSTR-3B JSON template"
      url: "https://github.com/resilient-tech/india-compliance"
      ref: "india_compliance/gst_india/doctype/gstr_3b_report/gstr_3b_report_template.json"
      official: false
    - title: "Form GSTR-3B (reproduction, Rule 61(5))"
      url: "https://www.gstgyaan.com/pdf/form-gstr-3b.pdf"
      ref: ""
      official: false
    - title: "Changes in GSTR-3B w.e.f. 01.09.2022 (VJM Global)"
      url: "https://www.vjmglobal.com/blog/changes-in-gstr-3b-with-effect-from-01-09-2022"
      ref: "N.14/2022-CT; 4B(1), 4B(2), 4D(1), 4D(2)"
      official: false
    - title: "Table 3.1.1 of GSTR-3B (ClearTax)"
      url: "https://cleartax.in/s/table-3-1-1-of-gstr-3b-for-e-commerce-transactions-under-95"
      ref: ""
      official: false
    - title: "Circular 170/02/2022-GST (gstcouncil.gov.in)"
      url: "https://www.gstcouncil.gov.in/sites/default/files/2024-06/cir-170-02-2022-cgst.pdf"
      ref: "Table 4 reporting manner"
      official: true
