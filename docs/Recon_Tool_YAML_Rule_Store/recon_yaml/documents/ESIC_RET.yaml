schema_version: "1.0"
document:
  code: "ESIC_RET"
  name: "ESIC monthly contribution (MC) upload / contribution history"
  issuer_system: "ESIC employer portal (esic.gov.in) – Monthly Contribution upload (Excel) / online entry"
  legal_basis: "ESI Act 1948 ss.39-40 & ESI (General) Regulations (contribution periods, Reg. 31 for payment); Code on Social Security 2020 Chapter IV (per prior round PAY-013/017)"
  new_form_no: ""
  frequency: "Monthly (contribution periods Apr–Sep, Oct–Mar)"
  formats_available: "Excel 97-2003 (.xls) upload template, all columns as Text; contribution history PDF/Excel download"
  how_obtained: "ESIC portal > Monthly Contributions > Upload / File Monthly Contribution; Contribution History download"
  due_date: "15th of following month (prior round PAY-016)"
  tables_used: "Employee-wise rows: IP number, IP name, no. of days, total monthly wages, reason code for zero working days, last working day; totals (wages, IP contribution, employer contribution, total contribution, government contribution)"
  used_by_rules:
    - "RC-PAY-003"
  verification_status: "verified_secondary"
  notes: "Columns from PocketHRMS help (secondary) and an ESIC contribution-history printout (official layout via a Delhi Govt site). Numeric reason codes: only 2/3/5/10 confirmed (Paybooks, secondary); full code list not verified – Ambiguous; load from current ESIC template. Excel .xls 97-2003 format per PocketHRMS."
  sources:
    - title: "PocketHRMS – ESI return file"
      url: "https://docs.pockethrms.com/report-generation/esi-return-file"
      ref: "MC upload columns; last-working-day rules; .xls"
      official: false
    - title: "ESIC contribution history sample (Delhi Govt hospital)"
      url: "https://shmch.delhi.gov.in/sites/default/files/inline-files/esic_2.pdf"
      ref: "IP Number, IP Name, No. of Days, Total Wages, Contribution, Reason"
      official: true
    - title: "Paybooks – ESI remarks values"
      url: "https://support.paybooks.in/support/solutions/articles/4000092794-why-values-need-be-selected-in-esi-remarks-field-"
      ref: "Codes 2 Left service, 3 Retired, 5 Expired, 10 Retrenchment"
      official: false
    - title: "ESIC – Contribution"
      url: "https://web.esic.gov.in/web/esic/contribution"
      ref: "Rates, due date (prior round)"
      official: true
fields:
  - name: "contribution_month"
    label: "Contribution month"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "yyyy-mm"
    description: ""
    origin: "catalogue"
  - name: "employer_code"
    label: "Employer Code"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "17 digits (implementation)"
    description: ""
    origin: "catalogue"
  - name: "ip_number"
    label: "IP Number"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{10}$"
    description: "Key to PAYROLL_REG.esic_ip_no."
    origin: "catalogue"
  - name: "ip_name"
    label: "IP Name"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "no_of_days"
    label: "No. of Days"
    source_path: "Row"
    data_type: "integer"
    required: "yes"
    validation: "0..31; fractional days rounded up to whole number"
    description: "Days for which wages paid."
    origin: "catalogue"
  - name: "total_monthly_wages"
    label: "Total Monthly Wages"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Compare with PAYROLL_REG.esi_wages."
    origin: "catalogue"
  - name: "reason_code_zero_days"
    label: "Reason Code for Zero workings days"
    source_path: "Row"
    data_type: "enum"
    required: ""
    validation: "numeric master; verified examples: 2 = Left Service, 3 = Retired, 5 = Expired, 10 = Retrenchment; others (On leave, Out of coverage, Non-implemented area, etc.) – load from ESIC template"
    description: "Required when days/wages = 0."
    origin: "catalogue"
  - name: "last_working_day"
    label: "Last Working Day"
    source_path: "Row"
    data_type: "date"
    required: ""
    validation: "dd/mm/yyyy (leading zeros); only for Left service/Retired/Out of coverage/Expired/Non-implemented area/Retrenchment"
    description: ""
    origin: "catalogue"
  - name: "ip_contribution"
    label: "IP Contribution"
    source_path: "Contribution history"
    data_type: "decimal"
    required: "no"
    validation: "0.75% of wages, rounded up to next rupee (PAY-014)"
    description: "Compare with PAYROLL_REG.ee_esi."
    origin: "catalogue"
  - name: "employer_contribution"
    label: "Employer Contribution"
    source_path: "Totals"
    data_type: "decimal"
    required: "no"
    validation: "3.25% of wages"
    description: ""
    origin: "catalogue"
  - name: "total_contribution"
    label: "Total Contribution"
    source_path: "Totals"
    data_type: "decimal"
    required: "yes"
    validation: "= IP + employer"
    description: "Match to ESIC_CHALLAN."
    origin: "catalogue"
  - name: "is_disabled"
    label: "Is Disable"
    source_path: "Contribution history"
    data_type: "enum"
    required: "no"
    validation: "Y|N"
    description: "Disabled IPs – government contribution scheme."
    origin: "catalogue"
