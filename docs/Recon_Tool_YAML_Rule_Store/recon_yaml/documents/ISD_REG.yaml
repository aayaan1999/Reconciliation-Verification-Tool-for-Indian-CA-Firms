schema_version: "1.0"
document:
  code: "ISD_REG"
  name: "ISD distribution register (GSTR-6 / ISD invoices)"
  issuer_system: "Books of the Input Service Distributor / GSTR-6 filed data"
  legal_basis: "Design document (not a statutory form)"
  new_form_no: ""
  frequency: ""
  formats_available: ""
  how_obtained: ""
  due_date: ""
  tables_used: ""
  used_by_rules: []
  verification_status: "unverified"
  notes: "Document-wise register of ITC distributed by an ISD to recipient GSTINs, used to match the recipient GSTR-2B ISD section. Added by field-model harmonisation – not in round-2 catalogue."
  sources: []
fields:
  - name: "isd_gstin"
    label: "ISD GSTIN"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (+ check digit)"
    description: ""
    origin: "new document (design)"
  - name: "ret_period"
    label: "Distribution period"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY"
    description: ""
    origin: "new document (design)"
  - name: "isd_doc_type"
    label: "Document type"
    source_path: "Row"
    data_type: "enum"
    required: "yes"
    validation: "ISD invoice | ISD credit note"
    description: ""
    origin: "new document (design)"
  - name: "isd_invoice_no"
    label: "ISD document number"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Matches GSTR2B isd_doc_no."
    origin: "new document (design)"
  - name: "isd_invoice_date"
    label: "ISD document date"
    source_path: "Row"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "new document (design)"
  - name: "recipient_gstin"
    label: "Recipient GSTIN"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (+ check digit)"
    description: ""
    origin: "new document (design)"
  - name: "itc_h"
    label: "ITC distributed"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) per head (igst/cgst/sgst/cess)"
    description: ""
    origin: "new document (design)"
  - name: "itc_eligible"
    label: "Eligible / ineligible"
    source_path: "Row"
    data_type: "enum"
    required: "yes"
    validation: "Y|N"
    description: ""
    origin: "new document (design)"
  - name: "share"
    label: "Recipient share ratio"
    source_path: "Row"
    data_type: "decimal"
    required: "no"
    validation: "decimal(9,6) 0..1"
    description: "Recipient's turnover share used for distribution."
    origin: "new document (design)"
  - name: "original_doc_no"
    label: "Original document (for credit notes/amendments)"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "new document (design)"
