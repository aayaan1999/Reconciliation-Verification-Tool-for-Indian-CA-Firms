schema_version: "1.0"
document:
  code: "RCM_STMT"
  name: "RCM Liability/ITC Statement (GST portal)"
  issuer_system: "GST portal (GSTN) - Services > Ledgers"
  legal_basis: "Design document (not a statutory form)"
  new_form_no: ""
  frequency: ""
  formats_available: ""
  how_obtained: ""
  due_date: ""
  tables_used: ""
  used_by_rules:
    - "RC-GST-020"
  verification_status: "unverified"
  notes: "Portal statement tracking reverse-charge liability paid in GSTR-3B Table 3.1(d) against RCM ITC claimed in Table 4A(2)/4A(3), with opening and closing balance per head. Exact portal column/JSON names not catalogued - confirm on first download. Added by field-model harmonisation – not in round-2 catalogue."
  sources: []
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (+ check digit)"
    description: ""
    origin: "new document (design)"
  - name: "ret_period"
    label: "Return period"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY"
    description: "GSTR-3B tax period."
    origin: "new document (design)"
  - name: "opening_h"
    label: "Opening balance"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) per head (igst/cgst/sgst/cess)"
    description: "Opening balance of RCM liability less ITC."
    origin: "new document (design)"
  - name: "liability_h"
    label: "RCM liability (3.1(d))"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) per head"
    description: "RCM liability reported/paid in GSTR-3B 3.1(d)."
    origin: "new document (design)"
  - name: "itc_h"
    label: "RCM ITC claimed (4A(2)+4A(3))"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) per head"
    description: "RCM ITC claimed in GSTR-3B 4A(2)+4A(3)."
    origin: "new document (design)"
  - name: "closing_h"
    label: "Closing balance"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) per head"
    description: "Closing = opening + liability - ITC (portal computation; verify)."
    origin: "new document (design)"
  - name: "arn"
    label: "ARN of GSTR-3B"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Return ARN, where shown."
    origin: "new document (design)"
