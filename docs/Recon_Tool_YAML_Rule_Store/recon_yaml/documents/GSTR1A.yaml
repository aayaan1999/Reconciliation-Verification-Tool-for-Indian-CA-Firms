schema_version: "1.0"
document:
  code: "GSTR1A"
  name: "FORM GSTR-1A – Amendment / addition of outward supply details for the current tax period"
  issuer_system: "GST portal"
  legal_basis: "s.37 CGST Act; Rule 59(1) proviso (inserted by Notification 12/2024-CT dt 10.07.2024)"
  new_form_no: ""
  frequency: "monthly / quarterly (optional, once per tax period)"
  formats_available: "Online / JSON download (same schema as GSTR-1 sections) / PDF"
  how_obtained: "GST portal > Returns Dashboard > period > GSTR-1A (available after GSTR-1 due date or filing, whichever later, until GSTR-3B of that period is filed)"
  due_date: "Optional; must be filed before GSTR-3B of the same period"
  tables_used: "Same table numbering as GSTR-1 (4A/4B/6B/6C, 5, 6A, 7, 8, 9A, 9B, 9C, 10, 11, 12, 13, 14/14A, 15/15A) – additions/amendments of the same tax period; net impact auto-populates GSTR-3B of same period; recipient sees in next period GSTR-2B"
  used_by_rules:
    - "RC-GST-001"
    - "RC-GST-005"
    - "RC-GST-007"
  verification_status: "partially_verified"
  notes: "Reconciliation: GSTR-1 + GSTR-1A (net) of a period = GSTR-3B Table 3.1/3.1.1/3.2 auto-population. JSON layout assumed identical to GSTR-1 – NOT verified. Field list kept generic; reuse GSTR1 field definitions per section."
  sources:
    - title: "GSTN advisory 26.07.2024 on GSTR-1A (TaxO reproduction)"
      url: "https://taxo.online/latest-news/27-07-2024-advisory-issued-relating-to-form-gstr-1a/"
      ref: "N.12/2024-CT dt 10.07.2024"
      official: false
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "header.gstin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: "Supplier GSTIN"
    origin: "catalogue"
  - name: "return_period"
    label: "Tax period"
    source_path: "header.fp"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: "Same period as the GSTR-1 being amended"
    origin: "catalogue"
  - name: "section"
    label: "Table / section"
    source_path: "b2b, b2cl, exp, b2cs, nil, cdnr, cdnur, hsn, doc_issue, supeco and amendment sections (assumed same keys as GSTR-1) [JSON name unverified]"
    data_type: "enum"
    required: "yes"
    validation: "GSTR-1 section keys"
    description: "Section in which the record is added/amended"
    origin: "catalogue"
  - name: "document_no"
    label: "Invoice / Note Number"
    source_path: "*.inum / nt_num"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Document key"
    origin: "catalogue"
  - name: "document_date"
    label: "Invoice / Note date"
    source_path: "*.idt / nt_dt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Document date"
    origin: "catalogue"
  - name: "original_document_no"
    label: "Original invoice/note number"
    source_path: "*.oinum / ont_num"
    data_type: "string"
    required: "no"
    validation: "max 16 chars"
    description: "Original document for amendment records"
    origin: "catalogue"
  - name: "recipient_gstin"
    label: "GSTIN/UIN of Recipient"
    source_path: "*.ctin"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Recipient (GSTIN correction NOT allowed in GSTR-1A; must use subsequent GSTR-1)"
    origin: "catalogue"
  - name: "invoice_value"
    label: "Invoice Value"
    source_path: "*.val"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Value"
    origin: "catalogue"
  - name: "pos"
    label: "Place Of Supply"
    source_path: "*.pos"
    data_type: "string"
    required: "yes"
    validation: "2-digit state code 01-38 or 96/97 (other territory / outside India); zero-padded string e.g. '07'"
    description: "POS"
    origin: "catalogue"
  - name: "rate"
    label: "Rate"
    source_path: "*.itms[].itm_det.rt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: "Rate"
    origin: "catalogue"
  - name: "taxable_value"
    label: "Taxable Value"
    source_path: "*.itms[].itm_det.txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Taxable value"
    origin: "catalogue"
  - name: "igst_amount"
    label: "Integrated Tax"
    source_path: "*.iamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "IGST"
    origin: "catalogue"
  - name: "cgst_amount"
    label: "Central Tax"
    source_path: "*.camt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "CGST"
    origin: "catalogue"
  - name: "sgst_amount"
    label: "State/UT Tax"
    source_path: "*.samt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "SGST"
    origin: "catalogue"
  - name: "cess_amount"
    label: "Cess"
    source_path: "*.csamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Cess"
    origin: "catalogue"
  - name: "arn"
    label: "ARN"
    source_path: "Filing"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Acknowledgement"
    origin: "catalogue"
  - name: "filing_date"
    label: "Date of filing"
    source_path: "Filing"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Must be before GSTR-3B filing date of same period"
    origin: "catalogue"
