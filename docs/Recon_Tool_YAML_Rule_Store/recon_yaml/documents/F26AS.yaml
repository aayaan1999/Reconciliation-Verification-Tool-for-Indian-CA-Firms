schema_version: "1.0"
document:
  code: "F26AS"
  name: "Form 26AS – Annual Tax Credit Statement (TRACES)"
  issuer_system: "TRACES (via e-Filing portal > e-File > Income Tax Returns > View Form 26AS)"
  legal_basis: "IT Act 1961 s.203AA / s.285BB read with Rule 31AB / Rule 114-I (IT Rules 1962); from 01-04-2026 the Annual Information Statement is Form 168 under s.510 ITA 2025 read with Rule 245 IT Rules 2026"
  new_form_no: "Form 168 (Annual Information Statement, 'earlier Form No. 26AS') – ITD Form 168 FAQ; TRACES-format 26AS continues to be published for FY 2025-26 data"
  frequency: "Annual statement per PAN per FY / tax year; refreshed continuously as deductors file / correct statements"
  formats_available: "PDF (password = DOB ddmmyyyy), Text (.txt, delimited by '^'), HTML view; TRACES text can be converted to Excel/CSV"
  how_obtained: "Taxpayer / CA logs in to incometax.gov.in > e-File > Income Tax Returns > View Form 26AS > redirected to TRACES > select AY and format (HTML/Text/PDF) > download"
  due_date: "No due date – download before ITR / tax audit and after each deductor quarterly due date (31 Jul/31 Oct/31 Jan/31 May) + processing time"
  tables_used: "PART-I Details of TDS; PART-II TDS for 15G/15H; PART-III Transactions under proviso to s.194B / first proviso to s.194R(1) / s.194S(1); PART-IV TDS u/s 194IA/194IB/194M/194S (for Seller/Landlord/Payee); PART-V proviso to s.194S(1) as per Form 26QE (VDA seller); PART-VI Details of TCS; PART-VII Paid refund (CPC-TDS source); PART-VIII TDS u/s 194IA/194IB/194M/194S (for Buyer/Tenant/Payer); PART-IX Transactions/demand payments under proviso to s.194S(1) as per 26QE (VDA buyer); PART X TDS/TCS Defaults (processing of statements)"
  used_by_rules:
    - "RC-BNK-003"
    - "RC-BNK-004"
    - "RC-IT-001"
    - "RC-IT-002"
    - "RC-IT-005"
    - "RC-IT-006"
  verification_status: "partially_verified"
  notes: "Part headings, Part I/II/VI column headers and both legends were read from a published 2026 TRACES 26AS (official layout, third-party copy). Part X column labels are as commonly printed on TRACES 26AS and were NOT seen in the opened copy – treat as implementation mapping (Partially verified). Parts IV/VIII column names other than PAN/acknowledgement/amount are implementation choices. Form 168 (AIS) is now the statutory statement; the legacy 26AS continues on TRACES for credit verification – confirm with CA which is evidence for TY 2026-27. Text download is '^'-delimited (common practice; not verified on an official page this session). Forms 26QB/26QC/26QD/26QE are replaced by Form 141 under Rule 218(3)/219 from 01-10-2026 (per prior tds_tcs.json round) – Part IV/VIII acknowledgement nomenclature may change."
  sources:
    - title: "Form 26AS (published sample, TRACES format, 2026)"
      url: "https://www.neist.res.in/assets/pdf/CAZPT3636C-2026.pdf"
      ref: "Part headings, Part I/II/VI columns, Status of Booking and Remarks legends"
      official: false
    - title: "ClearTax – View Form 26AS"
      url: "https://cleartax.in/s/view-form-26as-tax-credit-statement"
      ref: "Parts I–X description"
      official: false
    - title: "TDSMAN – FAQ on Form 26AS"
      url: "https://blog.tdsman.com/2014/06/faq-on-form-26as"
      ref: "Booking status F/O/U/P"
      official: false
    - title: "TDSMAN – Different matching statuses in Form 16/16A (2026)"
      url: "https://blog.tdsman.com/2026/02/different-matching-statuses-form-16-form-16a/"
      ref: "U/P/F/O"
      official: false
    - title: "Income Tax Department – Form 168 FAQs"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/form-168-faqs"
      ref: "Form 168 (earlier 26AS/AIS); Rule 245 IT Rules 2026 / s.510 ITA 2025; Rule 114-I / s.285BB 1961"
      official: true
fields:
  - name: "pan"
    label: "Permanent Account Number (PAN)"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "PAN of the assessee for whom statement is generated; primary key across documents."
    origin: "catalogue"
  - name: "assessee_name"
    label: "Name of Assessee"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "free text"
    description: "Name per PAN database."
    origin: "catalogue"
  - name: "financial_year"
    label: "Financial Year"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: "FY of the data (e.g. 2025-26)."
    origin: "catalogue"
  - name: "assessment_year"
    label: "Assessment Year"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: "AY (FY+1). For tax-year regime use tax_year."
    origin: "catalogue"
  - name: "pan_status"
    label: "Current Status of PAN"
    source_path: "Header"
    data_type: "enum"
    required: "no"
    validation: "Active|Inoperative|... (as printed)"
    description: "Inoperative PAN affects credit/higher rate checks."
    origin: "catalogue"
  - name: "part_code"
    label: "PART-I .. PART X"
    source_path: "Part heading"
    data_type: "enum"
    required: "yes"
    validation: "I|II|III|IV|V|VI|VII|VIII|IX|X"
    description: "Part from which the row was extracted; drives which rules use the row (Part I/VI for credit, IV for property sellers, VIII buyer-only info)."
    origin: "catalogue"
  - name: "sr_no_deductor"
    label: "Sr. No."
    source_path: "Part I/II/VI summary"
    data_type: "integer"
    required: "yes"
    validation: ">=1"
    description: "Deductor-level serial; transaction rows are nested under it."
    origin: "catalogue"
  - name: "deductor_name"
    label: "Name of Deductor / Name of Collector"
    source_path: "Part I/II/VI summary"
    data_type: "string"
    required: "yes"
    validation: "free text"
    description: "Deductor/collector name; secondary match key for books when TAN absent."
    origin: "catalogue"
  - name: "deductor_tan"
    label: "TAN of Deductor / TAN of Collector"
    source_path: "Part I/II/VI summary"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{4}[0-9]{5}[A-Z]$"
    description: "Primary match key to books party master / client invoices (Parts IV/VIII show PAN of counter-party instead)."
    origin: "catalogue"
  - name: "total_amount_paid_credited"
    label: "Total Amount Paid/ Credited (Part VI: Total Amount Paid/ Debited)"
    source_path: "Part I/II/VI summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Deductor-level total of transaction amounts."
    origin: "catalogue"
  - name: "total_tax_deducted"
    label: "Total Tax Deducted # (Part VI: Total Tax Collected)"
    source_path: "Part I/II/VI summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Deductor-level total TDS/TCS."
    origin: "catalogue"
  - name: "total_tds_deposited"
    label: "Total TDS Deposited (Part VI: Total TCS Deposited)"
    source_path: "Part I/II/VI summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Deductor-level total deposited; difference vs total_tax_deducted signals deductor default."
    origin: "catalogue"
  - name: "sr_no_txn"
    label: "Sr. No."
    source_path: "Part I/II/VI transaction"
    data_type: "integer"
    required: "yes"
    validation: ">=1"
    description: "Transaction serial within deductor."
    origin: "catalogue"
  - name: "section_code"
    label: "Section 1"
    source_path: "Part I/II/VI transaction"
    data_type: "string"
    required: "yes"
    validation: "e.g. 192, 194A, 194C, 194J(b), 206C(1H); TY 2026-27 rows may carry ITA 2025 section/serial codes – normalise via TDS-002 section map (tds_tcs.json)"
    description: "Section under which TDS/TCS was deducted (footnote 1 on the form explains codes)."
    origin: "catalogue"
  - name: "transaction_date"
    label: "Transaction Date"
    source_path: "Part I/II/VI transaction"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load); printed as dd-Mon-yyyy"
    description: "Date of payment/credit reported by deductor (DD col 418 in statement)."
    origin: "catalogue"
  - name: "status_of_booking"
    label: "Status of Booking*"
    source_path: "Part I/III/VI transaction"
    data_type: "enum"
    required: "yes"
    validation: "U|M|P|F|O|Z (U Unmatched, M Matched, P Provisional, F Final, O Overbooked, Z Mismatch)"
    description: "Credit status from statement-challan matching; only F (and P for government, M where shown) should be treated as reliable credit; U/O/Z = deductor-side issue."
    origin: "catalogue"
  - name: "date_of_booking"
    label: "Date of Booking"
    source_path: "Part I/II/VI transaction"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: "Date on which the statement entry was booked/processed."
    origin: "catalogue"
  - name: "remarks"
    label: "Remarks**"
    source_path: "Part I/II/VI transaction"
    data_type: "enum"
    required: "no"
    validation: "A|B|D|E|F|G|T|W (A bank challan correction, B deductor statement correction, D AO 24G correction, E AO challan correction, F s.197 lower/nil certificate, G reprocessing, T transporter, W Part III as submitted)"
    description: "Remarks legend; F indicates s.197 certificate – expected lower rate."
    origin: "catalogue"
  - name: "amount_paid_credited"
    label: "Amount Paid / Credited (Part VI: Amount Paid/ Debited)"
    source_path: "Part I/II/VI transaction"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Gross amount on which TDS deducted (income to be matched to books)."
    origin: "catalogue"
  - name: "tax_deducted"
    label: "Tax Deducted ## (Part VI: Tax Collected ++)"
    source_path: "Part I/II/VI transaction"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "TDS/TCS deducted per statement."
    origin: "catalogue"
  - name: "tds_deposited"
    label: "TDS Deposited (Part VI: TCS Deposited)"
    source_path: "Part I/II/VI transaction"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Amount deposited – credit available is generally this figure where status is F."
    origin: "catalogue"
  - name: "counterparty_pan"
    label: "PAN of Buyer/Tenant/Payer (Part IV) or Seller/Landlord/Payee (Part VIII)"
    source_path: "Part IV / VIII"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "For 194IA/IB/M/S rows the counter-party is identified by PAN and acknowledgement no. instead of TAN."
    origin: "catalogue"
  - name: "acknowledgement_no"
    label: "Acknowledgement Number (Form 26QB/26QC/26QD/26QE)"
    source_path: "Part IV / V / VIII / IX"
    data_type: "string"
    required: "no"
    validation: "alphanumeric"
    description: "Challan-cum-statement acknowledgement; from 01-10-2026 these move to Form 141 (see notes)."
    origin: "catalogue"
  - name: "total_transaction_amount"
    label: "Total Transaction Amount / Total Amount Paid"
    source_path: "Part IV / VIII"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Gross consideration for property/rent/contract/VDA rows."
    origin: "catalogue"
  - name: "refund_ay"
    label: "Assessment Year"
    source_path: "Part VII"
    data_type: "string"
    required: "no"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: "AY for which refund paid."
    origin: "catalogue"
  - name: "refund_mode"
    label: "Mode"
    source_path: "Part VII"
    data_type: "string"
    required: "no"
    validation: "ECS/Cheque/... as printed"
    description: "Refund mode."
    origin: "catalogue"
  - name: "refund_amount"
    label: "Amount of Refund"
    source_path: "Part VII"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Refund paid."
    origin: "catalogue"
  - name: "refund_interest"
    label: "Interest"
    source_path: "Part VII"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Interest on refund (s.244A / s.437) – taxable income to be matched with books/ITR."
    origin: "catalogue"
  - name: "refund_date"
    label: "Date of Payment"
    source_path: "Part VII"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: "Refund date."
    origin: "catalogue"
  - name: "default_fy"
    label: "Financial Year"
    source_path: "Part X"
    data_type: "string"
    required: "no"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: "FY of the deductor default (Part X shows defaults where the assessee is a deductor)."
    origin: "catalogue"
  - name: "default_short_payment"
    label: "Short Payment"
    source_path: "Part X"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Default amounts from TRACES processing – reconcile with TRACES_JUST."
    origin: "catalogue"
  - name: "default_short_deduction"
    label: "Short Deduction"
    source_path: "Part X"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "default_interest_payment"
    label: "Interest on Payment Default"
    source_path: "Part X"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "default_interest_deduction"
    label: "Interest on Deduction Default"
    source_path: "Part X"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "default_late_filing_fee"
    label: "Late Filing Fee u/s 234E"
    source_path: "Part X"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "default_interest_220"
    label: "Interest u/s 220(2)"
    source_path: "Part X"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "default_total"
    label: "Total Default"
    source_path: "Part X"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "taxpaid_amount"
    label: ""
    source_path: ""
    data_type: ""
    required: ""
    validation: ""
    description: "Referenced by RC-IT-005; not in the researched catalogue – define with the first real file."
    origin: "new (design)"
  - name: "taxpaid_cin"
    label: ""
    source_path: ""
    data_type: ""
    required: ""
    validation: ""
    description: "Referenced by RC-IT-005; not in the researched catalogue – define with the first real file."
    origin: "new (design)"
