schema_version: "1.0"
document:
  code: "BANK_BOOK"
  name: "Bank book / bank ledger (cash book – bank column)"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law"
  new_form_no: ""
  frequency: "Monthly"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Tally Prime: Ledger Vouchers of bank ledger / Bank Reconciliation screen > Export"
  due_date: ""
  tables_used: "Bank ledger lines incl. bank date"
  used_by_rules:
    - "RC-ACC-008"
    - "RC-BNK-001"
    - "RC-BNK-006"
    - "RC-GST-017"
    - "RC-IT-013"
    - "RC-PAY-005"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "Tally – Sample Excel files for import (field names & aliases)"
      url: "https://help.tallysolutions.com/tally-prime/import-data/download-sample-excel-files-with-data-for-import"
      ref: "Voucher Date, Voucher Number, Party Name, Buyer/Supplier GSTIN/UIN, Item, Rate, Quantity, Ledger Group"
      official: false
    - title: "Tally – Sales Register (Sales Day Book)"
      url: "https://help.tallysolutions.com/docs/te9rel66/Reports/Display_Registers_Ledgers/Sales_Register_Sales_Day_Book.htm"
      ref: "Monthly summary → voucher list; Excel/Pivot export"
      official: false
    - title: "RBI – cheque validity 3 months"
      url: "https://www.rbi.org.in/commonman/English/scripts/Notification.aspx?Id=961"
      ref: "(prior round)"
      official: true
fields:
  - name: "bank_ledger"
    label: "Bank ledger name"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "account_no"
    label: "Bank account number"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Key to BANK_STMT."
    origin: "catalogue"
  - name: "voucher_date"
    label: "Date"
    source_path: "Line"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "voucher_type"
    label: "Vch Type"
    source_path: "Line"
    data_type: "string"
    required: "yes"
    validation: "Payment|Receipt|Contra|Journal"
    description: ""
    origin: "catalogue"
  - name: "voucher_no"
    label: "Vch No."
    source_path: "Line"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "particulars"
    label: "Particulars (party/contra ledger)"
    source_path: "Line"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "instrument_no"
    label: "Instrument No. (Cheque/UTR)"
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "instrument_date"
    label: "Instrument Date"
    source_path: "Line"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: "Cheque validity 3 months (RBI)."
    origin: "catalogue"
  - name: "transaction_type"
    label: "Transaction Type"
    source_path: "Line"
    data_type: "enum"
    required: "no"
    validation: "Cheque|e-Fund Transfer|Cash|Others"
    description: ""
    origin: "catalogue"
  - name: "debit"
    label: "Debit (Receipt)"
    source_path: "Line"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "credit"
    label: "Credit (Payment)"
    source_path: "Line"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "bank_date"
    label: "Bank Date (reconciliation date)"
    source_path: "BRS"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: "Blank = unreconciled."
    origin: "catalogue"
  - name: "narration"
    label: "Narration"
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "bill_ref"
    label: ""
    source_path: ""
    data_type: "string"
    required: ""
    validation: ""
    description: "Bill-wise reference (supplier invoice) the payment is allocated against (Tally bill-wise allocation of the payment voucher); not in catalogue."
    origin: "new (design)"
  - name: "bill_allocations"
    label: ""
    source_path: ""
    data_type: "group"
    required: ""
    validation: ""
    description: "Same as allocation: bill-wise allocation lines {bill_ref, amount, voucher_date}."
    origin: "new (design)"
  - name: "party_gstin"
    label: ""
    source_path: ""
    data_type: "string GSTIN"
    required: "no"
    validation: ""
    description: "DERIVED: PARTY_MASTER.gstin of the party ledger in particulars."
    origin: "derived"
  - name: "paid_by_s15_due_date"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ allocation amounts for the bill_ref with voucher_date <= MSMED s.15 due date computed by the rule engine from CREDITORS_AGEING.acceptance_date / bill_date and agreed_credit_days."
    origin: "derived"
  - name: "utr"
    label: ""
    source_path: ""
    data_type: "string"
    required: "no"
    validation: ""
    description: "DERIVED: instrument_no where transaction_type = 'e-Fund Transfer'; else UTR parsed from narration (regex)."
    origin: "derived"
  - name: "amount"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: debit - credit (positive = money into bank, matching BANK_STMT.amount sign)."
    origin: "derived"
  - name: "closing_balance"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: TB opening_balance of bank_ledger + Σ(debit - credit) up to the date."
    origin: "derived"
