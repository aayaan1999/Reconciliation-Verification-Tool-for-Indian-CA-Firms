schema_version: "1.0"
document:
  code: "FS"
  name: "Financial statements (Balance Sheet, P&L, notes – Schedule III)"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Companies Act 2013 s.129 & Schedule III (companies); ICAI formats for non-corporates; ITR Part A-BS/P&L mapping. Field set is implementation design"
  new_form_no: ""
  frequency: "Annual (quarterly for listed)"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Final audited FS (PDF/Excel) or Tally Balance Sheet/P&L export; XBRL/AOC-4 for companies"
  due_date: ""
  tables_used: "Balance sheet line items; P&L line items; notes (trade receivables/payables ageing, MSME dues, PPE)"
  used_by_rules:
    - "RC-ACC-002"
    - "RC-ACC-003"
    - "RC-ACC-009"
    - "RC-GST-026"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "DPNC – Schedule III amendments w.e.f. 01-04-2021"
      url: "https://www.dpncindia.com/amendment-in-schedule-iii-of-the-companies-act-2013-applicable-w-e-f-01-04-2021"
      ref: "Ageing schedules (prior round)"
      official: false
    - title: "TaxGuru – CARO 2020 & Schedule III summary"
      url: "https://taxguru.in/company-law/summary-clauses-caro-2020-consequential-amendments-schedule-iii-companies-act-2013.html"
      ref: "Quarterly returns to banks vs books (prior round)"
      official: false
fields:
  - name: "entity_pan"
    label: "PAN"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "period_end"
    label: "Balance sheet date"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "statement"
    label: "Statement"
    source_path: "Row"
    data_type: "enum"
    required: "yes"
    validation: "BS|PL|NOTE"
    description: ""
    origin: "catalogue"
  - name: "line_item_code"
    label: "Schedule III line item code (implementation)"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Mapping key to TB fs_head."
    origin: "catalogue"
  - name: "line_item_label"
    label: "Line item"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "note_ref"
    label: "Note no."
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "current_year"
    label: "Figures as at end of current reporting period"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated (respect rounding unit per FS-005)"
    description: ""
    origin: "catalogue"
  - name: "previous_year"
    label: "Figures as at end of previous reporting period"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "rounding_unit"
    label: "Rounding unit"
    source_path: "Header"
    data_type: "enum"
    required: "no"
    validation: "Rupees|Hundreds|Thousands|Lakhs|Millions|Crores"
    description: "Scale before comparison with TB."
    origin: "catalogue"
  - name: "revenue_from_operations"
    label: "Revenue from operations"
    source_path: "PL"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Compare SALES_REG, GSTR returns, AIS EXC-GSTR3B."
    origin: "catalogue"
  - name: "profit_before_tax"
    label: "Profit before tax"
    source_path: "PL"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Compare ITR Schedule BP item 1."
    origin: "catalogue"
  - name: "msme_dues_principal"
    label: "Principal amount due to micro & small enterprises"
    source_path: "Note – MSMED s.22"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "msme_dues_interest"
    label: "Interest due thereon"
    source_path: "Note – MSMED s.22"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "fy"
    label: ""
    source_path: ""
    data_type: "string 'YYYY-YY'"
    required: "no"
    validation: ""
    description: "DERIVED: Indian financial year (1 Apr - 31 Mar) containing period_end, format 'YYYY-YY' e.g. '2025-26'"
    origin: "derived"
  - name: "turnover_gstin"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Turnover per audited FS attributable to the GSTIN: Σ TB closing_balance of revenue ledgers tagged with gstin_branch; equals revenue_from_operations for single-GSTIN entities."
    origin: "derived"
  - name: "subtotals"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: current_year of rows that are parents in the configured Schedule III line hierarchy."
    origin: "derived"
  - name: "balance_sheet_total_assets"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: current_year of the row with statement = 'BS' and the configured total-assets line_item_code."
    origin: "derived"
  - name: "msme_note_items"
    label: ""
    source_path: ""
    data_type: "group"
    required: "no"
    validation: ""
    description: "DERIVED: Tuple (msme_dues_principal, msme_dues_interest) plus other MSMED s.22 disclosure items (not catalogued)."
    origin: "derived"
  - name: "rpt_outstanding"
    label: ""
    source_path: ""
    data_type: ""
    required: ""
    validation: ""
    description: "Referenced by RC-ACC-009; not in the researched catalogue – define with the first real file."
    origin: "new (design)"
  - name: "rpt_party_name"
    label: ""
    source_path: ""
    data_type: ""
    required: ""
    validation: ""
    description: "Referenced by RC-ACC-009; not in the researched catalogue – define with the first real file."
    origin: "new (design)"
  - name: "rpt_txn_amount"
    label: ""
    source_path: ""
    data_type: ""
    required: ""
    validation: ""
    description: "Referenced by RC-ACC-009; not in the researched catalogue – define with the first real file."
    origin: "new (design)"
