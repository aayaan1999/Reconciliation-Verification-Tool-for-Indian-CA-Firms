schema_version: "1.0"
document:
  code: "GSTR8"
  name: "FORM GSTR-8 – Statement for tax collection at source by e-commerce operator (u/s 52)"
  issuer_system: "GST portal (filed by ECO); supplier sees in GSTR-2A TCS & TDS/TCS credit received"
  legal_basis: "s.52 CGST Act; Rule 67(1) CGST Rules; TCS rate 0.5% (0.25% CGST + 0.25% SGST / 0.5% IGST) from 10.07.2024 per Notification 15/2024-CT"
  new_form_no: ""
  frequency: "monthly (annual statement GSTR-9B)"
  formats_available: "Online; offline tool JSON; PDF"
  how_obtained: "ECO: GST portal > Returns > GSTR-8; Supplier: TDS and TCS credit received / GSTR-2A TCS"
  due_date: "10th of following month"
  tables_used: "3A supplies to registered persons; 3B supplies to unregistered persons; 4A/4B amendments; 5 interest; 6 tax payable and paid; 7 interest payable and paid; 8 refund; 9 debit entries"
  used_by_rules:
    - "RC-GST-036"
  verification_status: "verified_secondary"
  notes: "Supplier-side recon: GSTR-2A TCS (etin, sup_val, tx_val) vs GSTR-1 Table 14(a) (supeco.clttx) vs sales register marketplace sales. JSON keys of GSTR-8 itself unverified."
  sources:
    - title: "Form GSTR-8 (reproduction)"
      url: "https://www.gstgyaan.com/pdf/form-gstr-8.pdf"
      ref: ""
      official: false
    - title: "Changes in GSTR-8 from July 2024 – Notification 15/2024-CT TCS 0.5% (TaxHeal)"
      url: "https://www.taxheal.com/?p=96048"
      ref: ""
      official: false
fields:
  - name: "eco_gstin"
    label: "GSTIN (of ECO)"
    source_path: "1"
    data_type: "string"
    required: "yes"
    validation: "GSTIN with TCS registration (13th char 'C' – unverified)"
    description: ""
    origin: "catalogue"
  - name: "return_period"
    label: "Year / Month"
    source_path: "header"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "section"
    label: "3A registered / 3B unregistered"
    source_path: "Table 3"
    data_type: "enum"
    required: "yes"
    validation: "3A | 3B"
    description: ""
    origin: "catalogue"
  - name: "supplier_gstin"
    label: "GSTIN of supplier"
    source_path: "Table 3 col 1"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Match to supplier GSTR-1 Table 14(a) etin + value"
    origin: "catalogue"
  - name: "gross_value"
    label: "Gross value of supplies made"
    source_path: "Table 3 col 2"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "value_returned"
    label: "Value of supplies returned"
    source_path: "Table 3 col 3"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "net_amount_liable"
    label: "Net amount liable for TCS"
    source_path: "Table 3 col 4"
    data_type: "decimal"
    required: "yes"
    validation: "= col2 - col3"
    description: "Validate arithmetic"
    origin: "catalogue"
  - name: "tcs_igst"
    label: "Integrated Tax"
    source_path: "Table 3 col 5"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; 0.5% of col 4 (inter-State)"
    description: ""
    origin: "catalogue"
  - name: "tcs_cgst"
    label: "Central Tax"
    source_path: "Table 3 col 6"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; 0.25% of col 4"
    description: ""
    origin: "catalogue"
  - name: "tcs_sgst"
    label: "State/UT Tax"
    source_path: "Table 3 col 7"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; 0.25% of col 4"
    description: ""
    origin: "catalogue"
  - name: "amend_month"
    label: "Month (of original)"
    source_path: "Table 4 col 1"
    data_type: "string"
    required: "no"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "amend_original_supplier_gstin"
    label: "Original GSTIN of supplier"
    source_path: "Table 4 col 2"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: ""
    origin: "catalogue"
  - name: "amend_revised_supplier_gstin"
    label: "Revised GSTIN of supplier"
    source_path: "Table 4 col 3"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: ""
    origin: "catalogue"
  - name: "tax_payable_paid"
    label: "Tax payable / Amount paid (IGST/CGST/SGST)"
    source_path: "Table 6"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Reconcile with ECL"
    origin: "catalogue"
  - name: "interest_payable_paid"
    label: "Interest payable / paid"
    source_path: "Table 7"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "arn"
    label: "ARN"
    source_path: "Filing"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "filing_date"
    label: "Date of filing"
    source_path: "Filing"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "tcs_credit_action"
    label: ""
    source_path: ""
    data_type: "enum Accept|Reject|Pending"
    required: ""
    validation: ""
    description: "Supplier's action on the TCS credit in the GST portal 'TDS and TCS Credit Received' functionality for this GSTR-8 entry; source: download for the supplier GSTIN."
    origin: "new (design)"
  - name: "supplier_state_code"
    label: ""
    source_path: ""
    data_type: "string(2)"
    required: "no"
    validation: ""
    description: "DERIVED: First two characters of supplier_gstin (state code), per the rule text \"(supplier GSTIN state)\"."
    origin: "derived"
  - name: "tcs_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Per head: tcs_igst / tcs_cgst / tcs_sgst."
    origin: "derived"
