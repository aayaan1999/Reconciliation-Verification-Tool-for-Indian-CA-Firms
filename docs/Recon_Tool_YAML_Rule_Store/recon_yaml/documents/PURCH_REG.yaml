schema_version: "1.0"
document:
  code: "PURCH_REG"
  name: "Purchase register (purchase day book, invoice/line level)"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law. Supports CGST Act s.16 ITC conditions, GSTR-2B reconciliation, TDS (194C/194J/194Q) and clause 44"
  new_form_no: ""
  frequency: "Monthly"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Tally Prime: Purchase Register > Export; or GSTR-2 / ITC reconciliation export"
  due_date: ""
  tables_used: "Invoice header + line + tax ledgers + TDS deducted + ITC eligibility"
  used_by_rules:
    - "RC-ACC-011"
    - "RC-GST-013"
    - "RC-GST-015"
    - "RC-GST-016"
    - "RC-GST-017"
    - "RC-GST-018"
    - "RC-GST-019"
    - "RC-GST-030"
    - "RC-GST-031"
    - "RC-GST-034"
    - "RC-GST-037"
    - "RC-GST-038"
    - "RC-IT-010"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "Tally – Sample Excel files for import (field names & aliases)"
      url: "https://help.tallysolutions.com/tally-prime/import-data/download-sample-excel-files-with-data-for-import"
      ref: "Voucher Date, Voucher Number, Party Name, Buyer/Supplier GSTIN/UIN, Item, Rate, Quantity, Ledger Group"
      official: false
    - title: "Tally – Sales Register (Sales Day Book)"
      url: "https://help.tallysolutions.com/docs/te9rel66/Reports/Display_Registers_Ledgers/Sales_Register_Sales_Day_Book.htm"
      ref: "Monthly summary → voucher list; Excel/Pivot export"
      official: false
fields:
  - name: "voucher_date"
    label: "Voucher Date (Invoice Date)"
    source_path: "Voucher"
    data_type: "date"
    required: "yes"
    validation: "ISO yyyy-mm-dd"
    description: "Invoice/document date."
    origin: "catalogue"
  - name: "voucher_type"
    label: "Voucher Type"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: "Sales|Purchase|Credit Note|Debit Note|..."
    description: ""
    origin: "catalogue"
  - name: "voucher_no"
    label: "Voucher Number (Invoice No.)"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars for GST doc no. (normalise: upper, strip spaces)"
    description: "Key to GSTR1/EINV/GSTR2B."
    origin: "catalogue"
  - name: "supplier_invoice_no"
    label: "Supplier Invoice No. / Reference No."
    source_path: "Voucher"
    data_type: "string"
    required: ""
    validation: ""
    description: "Purchase side key to GSTR-2B."
    origin: "catalogue"
  - name: "supplier_invoice_date"
    label: "Supplier Invoice Date / Reference Date"
    source_path: "Voucher"
    data_type: "date"
    required: ""
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "party_name"
    label: "Party Name (Customer's/Supplier's Name)"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "party_gstin"
    label: "Buyer/Supplier – GSTIN/UIN"
    source_path: "Voucher"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: "Blank = unregistered (B2C / URP)."
    origin: "catalogue"
  - name: "party_pan"
    label: "PAN/IT No."
    source_path: "Party master"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "Derive from GSTIN chars 3-12 if absent."
    origin: "catalogue"
  - name: "party_state"
    label: "State / Place of Supply"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: "2-digit GST state code"
    description: "Determines IGST vs CGST+SGST."
    origin: "catalogue"
  - name: "registration_type"
    label: "Registration Type"
    source_path: "Party master"
    data_type: "enum"
    required: "no"
    validation: "Regular|Composition|Unregistered|Consumer|SEZ|Overseas"
    description: ""
    origin: "catalogue"
  - name: "ledger_name"
    label: "Sales/Purchase ledger"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "item_name"
    label: "Item Name (Stock Item)"
    source_path: "Inventory"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "hsn_sac"
    label: "HSN/SAC"
    source_path: "Inventory"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{4,8}$"
    description: ""
    origin: "catalogue"
  - name: "quantity"
    label: "Quantity"
    source_path: "Inventory"
    data_type: "decimal"
    required: "no"
    validation: "3 dp"
    description: ""
    origin: "catalogue"
  - name: "uom"
    label: "Quantity UOM"
    source_path: "Inventory"
    data_type: "string"
    required: "no"
    validation: "GST UQC"
    description: ""
    origin: "catalogue"
  - name: "rate"
    label: "Item Rate"
    source_path: "Inventory"
    data_type: "decimal"
    required: "no"
    validation: "4 dp"
    description: ""
    origin: "catalogue"
  - name: "taxable_value"
    label: "Taxable value (Assessable value)"
    source_path: "Amount"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "gst_rate"
    label: "GST Rate"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "0|0.1|0.25|1|1.5|3|5|6|7.5|12|18|28|40 (per notified schedule)"
    description: ""
    origin: "catalogue"
  - name: "igst"
    label: "IGST"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "cgst"
    label: "CGST"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "sgst_utgst"
    label: "SGST/UTGST"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "cess"
    label: "Cess"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tcs_amount"
    label: "TCS (s.206C / s.394)"
    source_path: "Tax"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "round_off"
    label: "Round off"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "invoice_value"
    label: "Gross Total / Invoice value"
    source_path: "Amount"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "reverse_charge"
    label: "Reverse charge applicable"
    source_path: "Tax"
    data_type: "enum"
    required: "no"
    validation: "Y|N"
    description: ""
    origin: "catalogue"
  - name: "irn"
    label: "IRN"
    source_path: "e-Invoice"
    data_type: "string"
    required: "no"
    validation: "64-char hash"
    description: "Key to EINV."
    origin: "catalogue"
  - name: "ack_no_irn"
    label: "e-Invoice Ack No."
    source_path: "e-Invoice"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "eway_bill_no"
    label: "e-Way Bill No."
    source_path: "e-Way Bill"
    data_type: "string"
    required: "no"
    validation: "12 digits"
    description: "Key to EWB."
    origin: "catalogue"
  - name: "original_invoice_no"
    label: "Original invoice no. (for CN/DN)"
    source_path: "Voucher"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "narration"
    label: "Narration"
    source_path: "Voucher"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "itc_eligibility"
    label: "ITC eligibility"
    source_path: "Tax"
    data_type: "enum"
    required: "no"
    validation: "Inputs|Capital goods|Input services|Ineligible (s.17(5))"
    description: ""
    origin: "catalogue"
  - name: "tds_section"
    label: "TDS section / Nature of payment"
    source_path: "TDS"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Link to TDS_LEDGER."
    origin: "catalogue"
  - name: "tds_amount"
    label: "TDS deducted"
    source_path: "TDS"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "msme_flag"
    label: "MSME (Udyam) category of supplier"
    source_path: "Party master"
    data_type: "enum"
    required: "no"
    validation: "Micro|Small|Medium|None"
    description: "From MSME_VENDOR_MASTER."
    origin: "catalogue"
  - name: "due_date_payment"
    label: "Due date / credit period"
    source_path: "Bill-wise"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: "For s.43B(h) / MSMED s.15."
    origin: "catalogue"
  - name: "place_of_supply"
    label: ""
    source_path: ""
    data_type: "string(2) state code"
    required: ""
    validation: ""
    description: "Place of supply as printed on the supplier invoice (recorded in books / taken from the invoice)."
    origin: "new (design)"
  - name: "itc_claim_period"
    label: ""
    source_path: ""
    data_type: "string MMYYYY"
    required: ""
    validation: ""
    description: "GSTR-3B tax period in which ITC on the document was claimed (ITC claim tag maintained in books / tool)."
    origin: "new (design)"
  - name: "boe_no"
    label: ""
    source_path: ""
    data_type: "string"
    required: ""
    validation: ""
    description: "Bill of Entry number recorded on the import purchase voucher."
    origin: "new (design)"
  - name: "boe_date"
    label: ""
    source_path: ""
    data_type: "date"
    required: ""
    validation: ""
    description: "Bill of Entry date recorded on the import purchase voucher."
    origin: "new (design)"
  - name: "port_code"
    label: ""
    source_path: ""
    data_type: "string"
    required: ""
    validation: ""
    description: "Port code of the Bill of Entry recorded on the import purchase voucher."
    origin: "new (design)"
  - name: "doc_type"
    label: ""
    source_path: ""
    data_type: "enum INV|CRN|DBN"
    required: "no"
    validation: ""
    description: "DERIVED: voucher_type mapped: Purchase -> 'INV'; supplier credit note (Debit Note voucher in Tally) -> 'CRN'; supplier debit note -> 'DBN' (configurable map)."
    origin: "derived"
  - name: "fy"
    label: ""
    source_path: ""
    data_type: "string 'YYYY-YY'"
    required: "no"
    validation: ""
    description: "DERIVED: Indian financial year (1 Apr - 31 Mar) containing supplier_invoice_date, format 'YYYY-YY' e.g. '2025-26'"
    origin: "derived"
  - name: "books_period"
    label: ""
    source_path: ""
    data_type: "string MMYYYY"
    required: "no"
    validation: ""
    description: "DERIVED: tax period of voucher_date (booking date), format MMYYYY e.g. '092026'"
    origin: "derived"
  - name: "booking_status"
    label: ""
    source_path: ""
    data_type: "enum BOOKED|NOT_BOOKED|BOOKED_INELIGIBLE"
    required: "no"
    validation: ""
    description: "DERIVED: 'BOOKED' if the IMS document matches a register row (supplier_gstin, doc_type, doc_no, fy), 'BOOKED_INELIGIBLE' if matched with itc_eligibility = Ineligible, else 'NOT_BOOKED'."
    origin: "derived"
  - name: "tax_heads"
    label: ""
    source_path: ""
    data_type: "group"
    required: "no"
    validation: ""
    description: "DERIVED: Tuple (igst, cgst, sgst_utgst, cess)."
    origin: "derived"
  - name: "cn_itc_reversed"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: igst + cgst + sgst_utgst + cess on rows with doc_type = CRN (input tax reduced in books for the supplier credit note)."
    origin: "derived"
  - name: "itc_claimed"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: igst + cgst + sgst_utgst + cess where itc_eligibility <> 'Ineligible (s.17(5))'."
    origin: "derived"
  - name: "itc_on_original"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: itc_claimed of the original invoice referenced by the note (original_invoice_no, same party_gstin)."
    origin: "derived"
  - name: "invoice_fy"
    label: ""
    source_path: ""
    data_type: "string 'YYYY-YY'"
    required: "no"
    validation: ""
    description: "DERIVED: Indian financial year (1 Apr - 31 Mar) containing supplier_invoice_date, format 'YYYY-YY' e.g. '2025-26'"
    origin: "derived"
  - name: "rcm_tax_q"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ igst + cgst + sgst_utgst + cess where reverse_charge = 'Y' in the FY quarter."
    origin: "derived"
