schema_version: "1.0"
document:
  code: "DRC03"
  name: "FORM GST DRC-03 – Intimation of payment made voluntarily or against SCN/statement/order"
  issuer_system: "GST portal"
  legal_basis: "Rule 142(2) & 142(3) CGST Rules; s.73(5)/74(5)/74A(8)-(9)/122A etc.; DRC-04 acknowledgement; DRC-03A to link DRC-03 to demand (advisory 05.06.2024)"
  new_form_no: ""
  frequency: "ad hoc"
  formats_available: "Online; PDF (filed form, DRC-04 acknowledgement)"
  how_obtained: "GST portal > Services > User Services > My Applications > Intimation of Voluntary Payment – DRC-03 > Search / Download"
  due_date: "Ad hoc (before SCN for s.73(5)/74(5) benefit; interest u/s 50 to date of payment)"
  tables_used: "Cause of payment; section; financial year & period; reference (SCN/ASMT-10/ADT/DRC-01A/Demand ID); amounts by head (Tax/Cess, Interest, Penalty, Fee, Others) x (IGST/CGST/SGST/Cess); payment from cash/credit ledger; ARN"
  used_by_rules:
    - "RC-GST-022"
  verification_status: "partially_verified"
  notes: "Fields and cause list verified from GST portal user manual (tutorial.gst.gov.in). Per-head amount breakdown labels and DRC-04/03A fields not verified."
  sources:
    - title: "Manual – GST FORM DRC-03 (GST portal user guide)"
      url: "https://tutorial.gst.gov.in/userguide/demandsandrecovery/Manual_GST_FORM_DRC-03.htm"
      ref: ""
      official: true
    - title: "Advisory for Form GST DRC-03A dated 05.06.2024 (gstgyaan)"
      url: "https://www.gstgyaan.com/advisory-for-form-gst-drc-03a-dated-05-06-2024"
      ref: "seen in search results only"
      official: false
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "header"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: ""
    origin: "catalogue"
  - name: "arn"
    label: "ARN"
    source_path: "on filing"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Appears as reference in ECL/ECRL debit"
    origin: "catalogue"
  - name: "arn_date"
    label: "Date of filing"
    source_path: "on filing"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "cause_of_payment"
    label: "Cause of Payment"
    source_path: "dropdown"
    data_type: "enum"
    required: "yes"
    validation: "Annual return | Audit | Investigation/Enforcement | Intimation of tax ascertained through FORM GST DRC-01A | Mismatch between FORM GSTR-2B and FORM GSTR-3B | Mismatch between FORM GSTR-1 and FORM GSTR-3B | Reconciliation statement | After issuance of SCN/Statement but before issuance of the order | Scrutiny | Before issuance of SCN/Statement (Voluntary) | Others | Order"
    description: "Link exception category to cause (e.g. 2B vs 3B mismatch)"
    origin: "catalogue"
  - name: "section"
    label: "Section Number"
    source_path: "dropdown"
    data_type: "string"
    required: "yes"
    validation: "e.g. 73(5), 74(5), 74A(8), 74A(9), 122A (list partially verified)"
    description: ""
    origin: "catalogue"
  - name: "financial_year"
    label: "Financial Year"
    source_path: "field"
    data_type: "string"
    required: "yes"
    validation: "YYYY-YY"
    description: ""
    origin: "catalogue"
  - name: "period_from"
    label: "Tax period From"
    source_path: "field"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "period_to"
    label: "Tax period To"
    source_path: "field"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "reference_no"
    label: "SCN / Communication / Intimation / Proceeding Reference Number"
    source_path: "conditional"
    data_type: "string"
    required: "no"
    validation: "Communication ref (voluntary/others): ^(AD|ZA|ZD)[0-9]{12}[0-9A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "reference_date"
    label: "Issue Date"
    source_path: "conditional"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "others_specify"
    label: "Please Specify (cause = Others)"
    source_path: "conditional"
    data_type: "string"
    required: "no"
    validation: "max 100 chars"
    description: ""
    origin: "catalogue"
  - name: "tax_igst"
    label: "Integrated Tax – Tax/Cess"
    source_path: "Payment details [JSON name unverified]"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Per head x component; Interest/Penalty must be paid in cash"
    origin: "catalogue"
  - name: "tax_cgst"
    label: "Central Tax – Tax"
    source_path: "Payment details [JSON name unverified]"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "tax_sgst"
    label: "State/UT Tax – Tax"
    source_path: "Payment details [JSON name unverified]"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "tax_cess"
    label: "Cess – Tax"
    source_path: "Payment details [JSON name unverified]"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "interest"
    label: "Interest (per head)"
    source_path: "Payment details"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Compare with computed s.50 interest"
    origin: "catalogue"
  - name: "penalty"
    label: "Penalty (per head)"
    source_path: "Payment details"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "fee"
    label: "Fee (per head)"
    source_path: "Payment details"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "others"
    label: "Others (per head)"
    source_path: "Payment details"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "paid_from_cash"
    label: "Amount paid from cash ledger"
    source_path: "Payment"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Join to ECL debit with ARN"
    origin: "catalogue"
  - name: "paid_from_credit"
    label: "Amount paid from credit ledger (ITC)"
    source_path: "Payment"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Join to ECRL debit (tax only)"
    origin: "catalogue"
  - name: "drc04_reference"
    label: "DRC-04 acknowledgement reference"
    source_path: "DRC-04 [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "drc03a_demand_id"
    label: "Demand ID linked via DRC-03A"
    source_path: "DRC-03A [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Adjust DRC-03 against ELL Part II demand"
    origin: "catalogue"
