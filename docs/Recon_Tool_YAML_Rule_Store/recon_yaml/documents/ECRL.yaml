schema_version: "1.0"
document:
  code: "ECRL"
  name: "Electronic Credit Ledger (FORM GST PMT-02)"
  issuer_system: "GST portal"
  legal_basis: "s.49(2) CGST Act; Rule 86 CGST Rules (PMT-02); Rule 86A (blocking); Rule 86B (1% cash); utilisation s.49(5), 49A, 49B, Rule 88A"
  new_form_no: ""
  frequency: "continuous"
  formats_available: "Online; PDF/Excel download; JSON via ledger API"
  how_obtained: "GST portal > Services > Ledgers > Electronic Credit Ledger > period > Download; also Blocked Credit statement, Negative liability statement"
  due_date: "Not applicable"
  tables_used: "Credit ledger (credits via GSTR-3B 4C, ITC-01/02/03, TRAN; debits for utilisation via GSTR-3B 6.1, DRC-03, reversal); balance of provisional credit; mismatch credit; blocked credit (Rule 86A)"
  used_by_rules:
    - "RC-GST-021"
  verification_status: "partially_verified"
  notes: "PMT-02 columns from Goa State Tax form reproduction. API JSON keys for credit ledger unverified (likely parallel to cash ledger: op_bal/cl_bal with igstTaxBal etc. – NOT confirmed)."
  sources:
    - title: "GST payment forms PMT-01 to PMT-06 (Goa State Tax)"
      url: "https://statetax.goa.gov.in/PDF/gst_forms/Payment.pdf"
      ref: ""
      official: true
    - title: "Rule 88B – CBIC tax information portal"
      url: "https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter9/rule88b_v1.00.html"
      ref: ""
      official: true
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "header / data.gstin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: ""
    origin: "catalogue"
  - name: "from_date"
    label: "From date"
    source_path: "data.fr_dt"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: "Ledger extract period (API keys fr_dt/to_dt seen in GSP sample)"
    origin: "catalogue"
  - name: "to_date"
    label: "To date"
    source_path: "data.to_dt"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "sr_no"
    label: "Sr. No."
    source_path: "PMT-02 col 1"
    data_type: "integer"
    required: "no"
    validation: ">=1"
    description: ""
    origin: "catalogue"
  - name: "txn_date"
    label: "Date (of deposit/debit)"
    source_path: "PMT-02 col 2; tr[].dt [JSON name unverified]"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "reference_no"
    label: "Reference No."
    source_path: "PMT-02 col 3; tr[].ref_no [JSON name unverified]"
    data_type: "string"
    required: "yes"
    validation: "CIN / ARN / DRC ref / demand ID"
    description: "Link to GSTR-3B ARN, CMP-08 ARN, DRC-03 ARN, challan CIN"
    origin: "catalogue"
  - name: "tax_period"
    label: "Tax Period, if applicable"
    source_path: "PMT-02; tr[].ret_period [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "description"
    label: "Description"
    source_path: "PMT-02; tr[].desc"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "txn_type"
    label: "Type of transaction"
    source_path: "PMT-02; tr[].tr_typ [JSON name unverified]"
    data_type: "enum"
    required: "yes"
    validation: "Debit | Credit (liability ledger: Debit/Payable, Credit/Paid, Reduction, Refund adjusted)"
    description: ""
    origin: "catalogue"
  - name: "credit_igst"
    label: "Credit/Debit amount – Integrated Tax"
    source_path: "PMT-02 col 7"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Credits per period should = GSTR-3B 4C"
    origin: "catalogue"
  - name: "credit_cgst"
    label: "Credit/Debit amount – Central Tax"
    source_path: "PMT-02 col 7"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "credit_sgst"
    label: "Credit/Debit amount – State/UT Tax"
    source_path: "PMT-02 col 7"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "credit_cess"
    label: "Credit/Debit amount – Cess"
    source_path: "PMT-02 col 7"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "credit_total"
    label: "Credit/Debit amount – Total"
    source_path: "PMT-02 col 7"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "balance_igst"
    label: "Balance available – Integrated Tax"
    source_path: "PMT-02 col 8"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "balance_cgst"
    label: "Balance available – Central Tax"
    source_path: "PMT-02 col 8"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "balance_sgst"
    label: "Balance available – State/UT Tax"
    source_path: "PMT-02 col 8"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "balance_cess"
    label: "Balance available – Cess"
    source_path: "PMT-02 col 8"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "balance_total"
    label: "Balance available – Total"
    source_path: "PMT-02 col 8"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "blocked_credit_flag"
    label: "Blocked under Rule 86A"
    source_path: "Blocked credit statement [JSON name unverified]"
    data_type: "boolean"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "debit_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: credit_<h> (PMT-02 col 7 amount) on rows where txn_type = 'Debit', per credit head x (igst/cgst/sgst/cess)."
    origin: "derived"
