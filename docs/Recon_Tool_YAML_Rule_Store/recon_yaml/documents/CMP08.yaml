schema_version: "1.0"
document:
  code: "CMP08"
  name: "FORM GST CMP-08 – Statement for payment of self-assessed tax (composition)"
  issuer_system: "GST portal"
  legal_basis: "s.10 & s.39(2) CGST Act; Rule 62(1)(i) CGST Rules; also Notification 02/2019-CT(Rate) service-provider scheme"
  new_form_no: ""
  frequency: "quarterly"
  formats_available: "Online; PDF"
  how_obtained: "GST portal > Services > Returns > Statement for Payment of Self-Assessed Tax (CMP-08) > View/Download"
  due_date: "18th of the month following the quarter"
  tables_used: "3 Summary of self-assessed liability (rows 1 outward incl. exempt, 2 inward RCM incl. import of services, 3 tax payable, 4 interest payable, 5 tax and interest paid); verification"
  used_by_rules:
    - "RC-GST-040"
  verification_status: "verified_secondary"
  notes: "Sum of 4 quarterly CMP-08 = GSTR-4 Table 5. Values net of advances/CN/DN; negative carried forward. JSON keys unverified."
  sources:
    - title: "FORM GST CMP-08 (Chhattisgarh GST copy)"
      url: "https://www.cggst.com/uploads/document/1748517231-form-gst-cmp-08.pdf"
      ref: ""
      official: false
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "1"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: ""
    origin: "catalogue"
  - name: "financial_year"
    label: "Financial Year"
    source_path: "header"
    data_type: "string"
    required: "yes"
    validation: "YYYY-YY"
    description: ""
    origin: "catalogue"
  - name: "quarter"
    label: "Quarter"
    source_path: "header"
    data_type: "enum"
    required: "yes"
    validation: "Q1 Apr-Jun | Q2 Jul-Sep | Q3 Oct-Dec | Q4 Jan-Mar"
    description: ""
    origin: "catalogue"
  - name: "outward_value"
    label: "Outward supplies (including exempt supplies) – Value"
    source_path: "Table 3 row 1"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); may be negative after adjustments"
    description: "Compare with books turnover of quarter"
    origin: "catalogue"
  - name: "outward_igst"
    label: "Outward – Integrated Tax"
    source_path: "Table 3 row 1"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "outward_cgst"
    label: "Outward – Central Tax"
    source_path: "Table 3 row 1"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "outward_sgst"
    label: "Outward – State/UT Tax"
    source_path: "Table 3 row 1"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "outward_cess"
    label: "Outward – Cess"
    source_path: "Table 3 row 1"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "rcm_value"
    label: "Inward supplies attracting reverse charge including import of services – Value"
    source_path: "Table 3 row 2"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "rcm_tax"
    label: "Inward RCM – Integrated/Central/State-UT/Cess"
    source_path: "Table 3 row 2"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "tax_payable"
    label: "Tax payable (1+2) – per head"
    source_path: "Table 3 row 3"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Validate = row1 + row2"
    origin: "catalogue"
  - name: "interest_payable"
    label: "Interest payable, if any – per head"
    source_path: "Table 3 row 4"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "tax_interest_paid"
    label: "Tax and interest paid – per head"
    source_path: "Table 3 row 5"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Reconcile with ECL debit (cash only)"
    origin: "catalogue"
  - name: "arn"
    label: "ARN"
    source_path: "auto after filing"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "filing_date"
    label: "Date of filing"
    source_path: "auto after filing"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Interest if after 18th"
    origin: "catalogue"
  - name: "outward_tax_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Per head: outward_igst / outward_cgst / outward_sgst / outward_cess."
    origin: "derived"
