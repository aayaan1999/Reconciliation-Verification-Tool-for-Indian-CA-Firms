schema_version: "1.0"
document:
  code: "TDS_LEDGER"
  name: "TDS/TCS payable & receivable ledgers in books (with deductee-wise detail)"
  issuer_system: "Client accounting software (Tally Prime / ERP) – export"
  legal_basis: "Implementation design, not law. Books maintained u/s 44AA (1961) / corresponding ITA 2025 provision; Companies Act 2013 s.128"
  new_form_no: ""
  frequency: "Monthly / quarterly extract"
  formats_available: "Excel / XML / JSON from Tally (Ledger Vouchers, TDS Outstandings, Form 26Q/27Q computation reports); ERP CSV"
  how_obtained: "Tally Prime: Display > Statutory Reports > TDS Reports (Outstandings / Return) or ledger vouchers of 'TDS Payable – <section>' ledgers, export Excel (Ctrl+E)"
  due_date: ""
  tables_used: "Deduction entries (expense voucher with TDS), Payment entries (challan voucher), Opening/closing TDS payable by section; TDS receivable (income side) ledger for 26AS matching"
  used_by_rules:
    - "RC-IT-002"
    - "RC-IT-009"
    - "RC-IT-012"
    - "RC-TDS-001"
    - "RC-TDS-002"
    - "RC-TDS-003"
    - "RC-TDS-004"
    - "RC-TDS-005"
    - "RC-TDS-010"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Field names mirror Tally Prime TDS masters (Nature of Payment, Deductee Type) by convention; exact Tally export column names vary by report and release."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "Tally – Sample Excel files for import (field names & aliases)"
      url: "https://help.tallysolutions.com/tally-prime/import-data/download-sample-excel-files-with-data-for-import"
      ref: "Voucher Date, Voucher Number, Party Name, Buyer/Supplier GSTIN/UIN, Item, Rate, Quantity, Ledger Group"
      official: false
fields:
  - name: "voucher_date"
    label: "Voucher Date"
    source_path: "Voucher"
    data_type: "date"
    required: "yes"
    validation: "ISO date"
    description: "Date of credit/payment to party (date_paid_credited)."
    origin: "catalogue"
  - name: "voucher_type"
    label: "Voucher Type"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: "Journal|Payment|Purchase|Receipt|Sales|..."
    description: ""
    origin: "catalogue"
  - name: "voucher_no"
    label: "Voucher Number"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "party_ledger"
    label: "Party Ledger"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "party_pan"
    label: "PAN/IT No. (party master)"
    source_path: "Party master"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "Join to statement DD PAN."
    origin: "catalogue"
  - name: "deductee_type"
    label: "Deductee Type"
    source_path: "Party master"
    data_type: "enum"
    required: "no"
    validation: "Company|Individual/HUF|Firm|... (Tally master)"
    description: "→ major head 0020/0021, deductee code 01/02."
    origin: "catalogue"
  - name: "expense_ledger"
    label: "Expense / Nature of payment ledger"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "nature_of_payment"
    label: "Nature of Payment (TDS)"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: "Tally nature of payment master"
    description: "Maps to section."
    origin: "catalogue"
  - name: "tds_section"
    label: "Section"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: "normalise 1961/2025 section codes"
    description: ""
    origin: "catalogue"
  - name: "assessable_value"
    label: "Assessable value / amount paid or credited"
    source_path: "Voucher"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Excl. GST where shown separately (CBDT Cir. 23/2017)."
    origin: "catalogue"
  - name: "gst_amount"
    label: "GST amount in invoice"
    source_path: "Voucher"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tds_rate"
    label: "TDS rate"
    source_path: "Voucher"
    data_type: "decimal"
    required: "yes"
    validation: "4 dp"
    description: ""
    origin: "catalogue"
  - name: "tds_amount"
    label: "TDS amount"
    source_path: "Voucher"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tds_ledger"
    label: "TDS Payable ledger"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "lower_deduction_cert"
    label: "Lower/No deduction certificate no."
    source_path: "Party master"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "challan_cin"
    label: "Challan reference (BSR/date/CSN) on payment voucher"
    source_path: "Payment voucher"
    data_type: "string"
    required: "no"
    validation: "CIN"
    description: "Links books payment to TDS_CHALLAN."
    origin: "catalogue"
  - name: "debit"
    label: "Debit"
    source_path: "Ledger"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "credit"
    label: "Credit"
    source_path: "Ledger"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "closing_balance"
    label: "Closing balance"
    source_path: "Ledger"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tds_receivable_deductor_tan"
    label: "Deductor TAN (TDS receivable side)"
    source_path: "TDS receivable ledger"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{4}[0-9]{5}[A-Z]$"
    description: "For F26AS/AIS matching of credits."
    origin: "catalogue"
  - name: "deduction_date"
    label: ""
    source_path: ""
    data_type: "date"
    required: "no"
    validation: ""
    description: "DERIVED: voucher_date of the voucher in which tds_amount is credited to tds_ledger (equals credit date when TDS is booked with the expense)."
    origin: "derived"
  - name: "tds_receivable"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit - credit on TDS-receivable ledger rows grouped by tds_receivable_deductor_tan (and tds_section) for the FY."
    origin: "derived"
