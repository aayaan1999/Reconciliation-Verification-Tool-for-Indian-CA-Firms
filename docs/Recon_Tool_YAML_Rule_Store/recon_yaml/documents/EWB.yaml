schema_version: "1.0"
document:
  code: "EWB"
  name: "E-way bill (FORM GST EWB-01 Part A & Part B)"
  issuer_system: "E-way bill portal (ewaybillgst.gov.in / NIC)"
  legal_basis: "s.68 CGST Act; Rule 138, 138A-138E CGST Rules; validity Rule 138(10) (1 day per 200 km; ODC 1 day per 20 km); cancellation Rule 138(9) within 24 hours; recipient acceptance Rule 138(12) 72 hours"
  new_form_no: ""
  frequency: "per consignment (ad hoc)"
  formats_available: "JSON (API / bulk), Excel/CSV report downloads from EWB portal, PDF print"
  how_obtained: "ewaybillgst.gov.in > Reports > My EWB reports / EWB generated by me / by other parties > Excel; API GetEwayBill / GetEwayBillsByDate"
  due_date: "Before commencement of movement of goods (consignment value > Rs 50,000 – threshold not re-verified this session)"
  tables_used: "Part A (supply, document, parties, items, values), Part B (vehicle/transport document), validity, status; VehiclListDetails history"
  used_by_rules:
    - "RC-GST-010"
  verification_status: "partially_verified"
  notes: "Request field lengths/enums from the official EWB API documentation (docs.ewaybillgst.gov.in, Generate EWB v1.03); GetEwayBill response keys (ewayBillDate, genMode, status, validUpto, noValidDays, extendedTimes, rejectStatus, VehiclListDetails) from a GSP sample (Logitax) and cross-checked with india-compliance constants (sub-supply types, doc types, transport modes, vehicle types). Portal Excel report column headers not verified. Rule 138 thresholds/limits from secondary source (Taxmann) – 2025 changes (e.g. base-document age limit, max extension) not verified."
  sources:
    - title: "NIC E-Way Bill API docs – Generate E-Way Bill (v1.03)"
      url: "https://docs.ewaybillgst.gov.in/apidocs/version1.03/generate-eway-bill.html"
      ref: ""
      official: true
    - title: "Logitax – Get E-Way Bill by EWB No (response sample)"
      url: "https://docs.logitax.in/Docs/Standard_Get_E_Way_Bill_By_EWB_No"
      ref: ""
      official: false
    - title: "india-compliance – e-way bill constants"
      url: "https://github.com/resilient-tech/india-compliance"
      ref: "india_compliance/gst_india/constants/e_waybill.py"
      official: false
    - title: "Process of generating e-way bill and validity (Taxmann)"
      url: "https://www.taxmann.com/post/blog/process-of-generating-e-way-bill/"
      ref: "Rule 138(9),(10),(12)"
      official: false
    - title: "New time limit for e-way bill generation and extension (ClearTax)"
      url: "https://cleartax.in/s/time-limit-for-e-way-bill-generation"
      ref: ""
      official: false
fields:
  - name: "ewb_no"
    label: "E-Way Bill No."
    source_path: "ewbNo / ewayBillNo"
    data_type: "integer"
    required: "yes"
    validation: "12 digits"
    description: "Primary key; join to EINV.EwbNo"
    origin: "catalogue"
  - name: "ewb_date"
    label: "E-Way Bill Date"
    source_path: "ewayBillDate"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy hh:mm:ss AM/PM"
    description: ""
    origin: "catalogue"
  - name: "generation_mode"
    label: "Generated mode"
    source_path: "genMode"
    data_type: "enum"
    required: "no"
    validation: "API | Excel | SMS | web (values partially seen)"
    description: ""
    origin: "catalogue"
  - name: "generator_gstin"
    label: "Generated by (GSTIN)"
    source_path: "userGstin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: ""
    origin: "catalogue"
  - name: "supply_type"
    label: "Supply type"
    source_path: "supplyType"
    data_type: "enum"
    required: "yes"
    validation: "O (Outward) | I (Inward)"
    description: ""
    origin: "catalogue"
  - name: "sub_supply_type"
    label: "Sub supply type"
    source_path: "subSupplyType"
    data_type: "enum"
    required: "yes"
    validation: "1 Supply | 2 Import | 3 Export | 4 Job Work | 5 For Own Use | 6 Job Work Returns | 7 Sales Return | 8 Others | 9 SKD/CKD | 10 Line Sales | 11 Recipient Not Known | 12 Exhibition or Fairs"
    description: "Only '1 Supply' outward should map to GSTR-1 sale"
    origin: "catalogue"
  - name: "doc_type"
    label: "Document type"
    source_path: "docType"
    data_type: "enum"
    required: "yes"
    validation: "INV | BIL | BOE | CHL | OTH"
    description: ""
    origin: "catalogue"
  - name: "doc_no"
    label: "Document No."
    source_path: "docNo"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars; alphanumeric with - and /"
    description: "Match to GSTR-1 inum / SALES_REG"
    origin: "catalogue"
  - name: "doc_date"
    label: "Document Date"
    source_path: "docDate"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy; not later than generation date"
    description: ""
    origin: "catalogue"
  - name: "from_gstin"
    label: "GSTIN of supplier (From)"
    source_path: "fromGstin"
    data_type: "string"
    required: "yes"
    validation: "15 chars or URP"
    description: ""
    origin: "catalogue"
  - name: "from_trade_name"
    label: "From – trade name"
    source_path: "fromTrdName"
    data_type: "string"
    required: "no"
    validation: "max 100"
    description: ""
    origin: "catalogue"
  - name: "from_pincode"
    label: "From PIN"
    source_path: "fromPincode"
    data_type: "integer"
    required: "yes"
    validation: "6 digits"
    description: ""
    origin: "catalogue"
  - name: "from_state_code"
    label: "From state"
    source_path: "fromStateCode"
    data_type: "integer"
    required: "yes"
    validation: "1-99"
    description: ""
    origin: "catalogue"
  - name: "act_from_state_code"
    label: "Actual dispatch state"
    source_path: "actFromStateCode"
    data_type: "integer"
    required: "yes"
    validation: "1-99"
    description: ""
    origin: "catalogue"
  - name: "to_gstin"
    label: "GSTIN of recipient (To)"
    source_path: "toGstin"
    data_type: "string"
    required: "yes"
    validation: "15 chars or URP"
    description: "Match to GSTR-1 ctin"
    origin: "catalogue"
  - name: "to_trade_name"
    label: "To – trade name"
    source_path: "toTrdName"
    data_type: "string"
    required: "no"
    validation: "max 100"
    description: ""
    origin: "catalogue"
  - name: "to_pincode"
    label: "To PIN"
    source_path: "toPincode"
    data_type: "integer"
    required: "yes"
    validation: "6 digits"
    description: ""
    origin: "catalogue"
  - name: "to_state_code"
    label: "To state (POS)"
    source_path: "toStateCode"
    data_type: "integer"
    required: "yes"
    validation: "1-99"
    description: "Compare with GSTR-1 pos"
    origin: "catalogue"
  - name: "act_to_state_code"
    label: "Actual ship-to state"
    source_path: "actToStateCode"
    data_type: "integer"
    required: "yes"
    validation: "1-99"
    description: ""
    origin: "catalogue"
  - name: "transaction_type"
    label: "Transaction type"
    source_path: "transactionType"
    data_type: "enum"
    required: "yes"
    validation: "1 Regular | 2 Bill To-Ship To | 3 Bill From-Dispatch From | 4 Combination of 2 and 3"
    description: ""
    origin: "catalogue"
  - name: "total_taxable_value"
    label: "Total taxable value"
    source_path: "totalValue"
    data_type: "decimal"
    required: "no"
    validation: "decimal(18,2)"
    description: "Compare with GSTR-1 txval"
    origin: "catalogue"
  - name: "cgst_value"
    label: "CGST"
    source_path: "cgstValue"
    data_type: "decimal"
    required: "no"
    validation: "decimal(18,2)"
    description: ""
    origin: "catalogue"
  - name: "sgst_value"
    label: "SGST"
    source_path: "sgstValue"
    data_type: "decimal"
    required: "no"
    validation: "decimal(18,2)"
    description: ""
    origin: "catalogue"
  - name: "igst_value"
    label: "IGST"
    source_path: "igstValue"
    data_type: "decimal"
    required: "no"
    validation: "decimal(18,2)"
    description: ""
    origin: "catalogue"
  - name: "cess_value"
    label: "Cess"
    source_path: "cessValue"
    data_type: "decimal"
    required: "no"
    validation: "decimal(18,2)"
    description: ""
    origin: "catalogue"
  - name: "cess_non_advol_value"
    label: "Cess non-advol"
    source_path: "cessNonAdvolValue"
    data_type: "decimal"
    required: "no"
    validation: "decimal(18,2)"
    description: ""
    origin: "catalogue"
  - name: "other_value"
    label: "Other value"
    source_path: "otherValue"
    data_type: "decimal"
    required: "no"
    validation: "decimal(18,2)"
    description: ""
    origin: "catalogue"
  - name: "total_invoice_value"
    label: "Total invoice value"
    source_path: "totInvValue"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(18,2)"
    description: "Compare with GSTR-1 val"
    origin: "catalogue"
  - name: "item_hsn"
    label: "HSN Code"
    source_path: "itemList[].hsnCode"
    data_type: "integer"
    required: "yes"
    validation: "4-8 digits; valid per GST master"
    description: ""
    origin: "catalogue"
  - name: "item_product_name"
    label: "Product name"
    source_path: "itemList[].productName"
    data_type: "string"
    required: "no"
    validation: "max 100"
    description: ""
    origin: "catalogue"
  - name: "item_quantity"
    label: "Quantity"
    source_path: "itemList[].quantity"
    data_type: "decimal"
    required: "no"
    validation: "decimal"
    description: "Compare with STOCK_REG"
    origin: "catalogue"
  - name: "item_qty_unit"
    label: "Unit"
    source_path: "itemList[].qtyUnit"
    data_type: "string"
    required: "no"
    validation: "UQC code"
    description: ""
    origin: "catalogue"
  - name: "item_taxable_amount"
    label: "Taxable amount"
    source_path: "itemList[].taxableAmount"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(18,2)"
    description: ""
    origin: "catalogue"
  - name: "item_cgst_rate"
    label: "CGST rate"
    source_path: "itemList[].cgstRate"
    data_type: "decimal"
    required: "no"
    validation: "decimal(6,3)"
    description: "also sgstRate, igstRate, cessRate"
    origin: "catalogue"
  - name: "trans_mode"
    label: "Mode"
    source_path: "transMode"
    data_type: "enum"
    required: "no"
    validation: "1 Road | 2 Rail | 3 Air | 4 Ship | 5 In Transit"
    description: ""
    origin: "catalogue"
  - name: "trans_distance"
    label: "Approximate distance (km)"
    source_path: "transDistance / actualDist"
    data_type: "integer"
    required: "yes"
    validation: "0-4000"
    description: "Drives validity"
    origin: "catalogue"
  - name: "transporter_id"
    label: "Transporter ID"
    source_path: "transporterId"
    data_type: "string"
    required: "no"
    validation: "15-char GSTIN/TRANSIN"
    description: ""
    origin: "catalogue"
  - name: "transporter_name"
    label: "Transporter name"
    source_path: "transporterName"
    data_type: "string"
    required: "no"
    validation: "max 100"
    description: ""
    origin: "catalogue"
  - name: "trans_doc_no"
    label: "Transport document No."
    source_path: "transDocNo"
    data_type: "string"
    required: "no"
    validation: "max 15; mandatory for rail/air/ship"
    description: ""
    origin: "catalogue"
  - name: "trans_doc_date"
    label: "Transport document date"
    source_path: "transDocDate"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "vehicle_no"
    label: "Vehicle No."
    source_path: "vehicleNo / VehiclListDetails[].vehicleNo"
    data_type: "string"
    required: "no"
    validation: "7-15 chars; mandatory for road (Part B)"
    description: ""
    origin: "catalogue"
  - name: "vehicle_type"
    label: "Vehicle type"
    source_path: "vehicleType"
    data_type: "enum"
    required: "no"
    validation: "R (Regular) | O (Over Dimensional Cargo)"
    description: "ODC validity 20 km/day"
    origin: "catalogue"
  - name: "valid_upto"
    label: "Valid Upto"
    source_path: "validUpto"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy hh:mm:ss AM/PM"
    description: "Blank until Part B"
    origin: "catalogue"
  - name: "no_valid_days"
    label: "Validity days"
    source_path: "noValidDays"
    data_type: "integer"
    required: "no"
    validation: ">=1"
    description: "= ceil(distance/200) normal, ceil(distance/20) ODC"
    origin: "catalogue"
  - name: "extended_times"
    label: "Times extended"
    source_path: "extendedTimes"
    data_type: "integer"
    required: "no"
    validation: ">=0"
    description: ""
    origin: "catalogue"
  - name: "status"
    label: "Status"
    source_path: "status"
    data_type: "enum"
    required: "yes"
    validation: "ACT (active) | CNL (cancelled) – CNL unverified"
    description: "Cancelled EWB with invoice in GSTR-1 – check"
    origin: "catalogue"
  - name: "reject_status"
    label: "Rejected by recipient"
    source_path: "rejectStatus"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: ""
    origin: "catalogue"
  - name: "hsn_set"
    label: ""
    source_path: ""
    data_type: "set<string>"
    required: "no"
    validation: ""
    description: "DERIVED: Sorted distinct item_hsn values of the e-way bill."
    origin: "derived"
