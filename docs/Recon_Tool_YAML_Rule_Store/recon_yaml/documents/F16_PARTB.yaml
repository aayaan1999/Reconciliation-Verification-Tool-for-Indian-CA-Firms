schema_version: "1.0"
document:
  code: "F16_PARTB"
  name: "Form 16 Part B / Form 130 Part C Annexure-I – salary and tax computation"
  issuer_system: "Employer payroll software (generated); certified by employer"
  legal_basis: "IT Act 1961 s.203 / Rule 31 (Form 16 Part B, Annexure); ITA 2025 s.395(4)(b) / Rule 215(1) (Form 130 Part C Annexure-I)"
  new_form_no: "Form 130 Part C Annexure-I"
  frequency: "Annual per employee"
  formats_available: "PDF; payroll software Excel"
  how_obtained: "From employer/payroll software (not generated by TRACES)"
  due_date: "15 June following the FY / tax year"
  tables_used: "Gross salary (s.17(1), 17(2), 17(3)); exemptions u/s 10; standard deduction and professional tax (s.16); income from salary; other income reported; Chapter VI-A deductions; total taxable income; tax, rebate, surcharge, cess; relief (s.89/s.157); TDS; net payable"
  used_by_rules:
    - "RC-TDS-011"
  verification_status: "partially_verified"
  notes: "Same data elements as 24Q Q4 Annexure II (SD records) so it can be matched 1:1 by PAN. Form 130 structure (Part C Annexure-I: gross salary breakup, exemptions, deductions, taxable income, tax, relief u/s 157, TDS, net payable) verified from ITD FAQ; individual line labels from professional knowledge."
  sources:
    - title: "Income Tax Department – Form 130 FAQs"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/form-130-faqs"
      ref: "s.395(4)(b); Rule 215(1); Part A/B/C; due 15 June"
      official: true
    - title: "Income Tax Department – Form No. 138 note"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/fn-138"
      ref: "s.397(3)(b) ITA 2025; Rule 219; Annexure I/II/III"
      official: true
fields:
  - name: "sd_employee_pan"
    label: "PAN of the employee"
    source_path: "Form 16 Part B / Form 130 Part C Annexure-I"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "Match key to PAYROLL_REG / F16_PARTB."
    origin: "catalogue"
  - name: "sd_employee_name"
    label: "Name of the employee"
    source_path: "Form 16 Part B / Form 130 Part C Annexure-I"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "sd_employee_category"
    label: "Deductee category"
    source_path: "Form 16 Part B / Form 130 Part C Annexure-I"
    data_type: "enum"
    required: "no"
    validation: "W (woman) | S (senior) | O (super senior) | G (general) – legacy codes, verify"
    description: ""
    origin: "catalogue"
  - name: "sd_period_from"
    label: "Period of employment – From"
    source_path: "Form 16 Part B / Form 130 Part C Annexure-I"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "sd_period_to"
    label: "Period of employment – To"
    source_path: "Form 16 Part B / Form 130 Part C Annexure-I"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "sd_new_regime_optout"
    label: "Whether opting out of taxation u/s 115BAC(1A) (new regime: s.202 ITA 2025)"
    source_path: "Form 16 Part B / Form 130 Part C Annexure-I"
    data_type: "enum"
    required: "yes"
    validation: "Y|N"
    description: "Regime used for TDS computation."
    origin: "catalogue"
  - name: "sd_gross_salary_17_1"
    label: "Salary as per s.17(1)"
    source_path: "Form 16 Part B / Form 130 Part C Annexure-I"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
