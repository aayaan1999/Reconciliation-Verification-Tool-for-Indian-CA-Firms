    source_path: "Table 5 row 1"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Auto from CMP-08s – sum of 4 quarters"
    origin: "catalogue"
  - name: "t5_outward_tax"
