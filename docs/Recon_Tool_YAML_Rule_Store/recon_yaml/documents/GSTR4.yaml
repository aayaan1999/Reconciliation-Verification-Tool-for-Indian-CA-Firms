schema_version: "1.0"
document:
  code: "GSTR4"
  name: "FORM GSTR-4 – Annual return for composition taxpayers"
  issuer_system: "GST portal"
  legal_basis: "s.39(2) CGST Act; Rule 62 CGST Rules; Notification 12/2024-CT (due date 30 June from FY 2024-25 – secondary)"
  new_form_no: ""
  frequency: "annual"
  formats_available: "Online; offline tool JSON; PDF"
  how_obtained: "GST portal > Returns Dashboard > FY > GSTR-4 (Annual) > Download"
  due_date: "30 June following the FY (from FY 2024-25; earlier 30 April)"
  tables_used: "3 (AATO, ARN); 4A-4D inward supplies; 5 summary of self-assessed liability as per CMP-08; 6 rate-wise outward & RCM inward; 7 TDS/TCS credit; 8 tax, interest, late fee payable and paid; 9 refund"
  used_by_rules:
    - "RC-GST-040"
  verification_status: "verified_secondary"
  notes: "Table structure from a reproduction of the form (gstgyaan). JSON keys unverified. Due-date change to 30 June per secondary source (IndiaFilings) cited in gst.json."
  sources:
    - title: "Form GSTR-4 (reproduction)"
      url: "https://www.gstgyaan.com/pdf/form-gstr-4.pdf"
      ref: ""
      official: false
    - title: "GSTR-4 filing (IndiaFilings)"
      url: "https://www.indiafilings.com/learn/gstr-4-filing/"
      ref: ""
      official: false
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "1"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: ""
    origin: "catalogue"
  - name: "financial_year"
    label: "Financial year"
    source_path: "header"
    data_type: "string"
    required: "yes"
    validation: "YYYY-YY"
    description: ""
    origin: "catalogue"
  - name: "prev_year_aggregate_turnover"
    label: "Aggregate turnover in the preceding financial year"
    source_path: "3(a)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Composition limit check (Rs 1.5 cr goods / Rs 50 lakh services – not re-verified)"
    origin: "catalogue"
  - name: "in_section"
    label: "Inward supply category"
    source_path: "4A/4B/4C/4D"
    data_type: "enum"
    required: "yes"
    validation: "4A registered non-RCM | 4B registered RCM | 4C unregistered | 4D import of services"
    description: ""
    origin: "catalogue"
  - name: "in_supplier_gstin"
    label: "GSTIN of supplier"
    source_path: "Table 4 col 1"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Match to GSTR-2A/2B (composition dealers see 4A auto-populated)"
    origin: "catalogue"
  - name: "in_invoice_no"
    label: "Invoice No."
    source_path: "Table 4 col 2"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "in_invoice_date"
    label: "Invoice Date"
    source_path: "Table 4 col 3"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "in_invoice_value"
    label: "Invoice Value"
    source_path: "Table 4 col 4"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "in_rate"
    label: "Rate"
    source_path: "Table 4 col 5"
    data_type: "decimal"
    required: "no"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: ""
    origin: "catalogue"
  - name: "in_taxable_value"
    label: "Taxable value"
    source_path: "Table 4 col 6"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "in_igst"
    label: "Integrated Tax"
    source_path: "Table 4 col 7"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "in_cgst"
    label: "Central Tax"
    source_path: "Table 4 col 8"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "in_sgst"
