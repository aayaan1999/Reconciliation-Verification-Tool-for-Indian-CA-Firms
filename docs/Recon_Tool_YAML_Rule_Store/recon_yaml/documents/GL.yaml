schema_version: "1.0"
document:
  code: "GL"
  name: "General ledger / Day book (voucher-line level journal)"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law; Companies Act 2013 s.128 & Rule 3 Accounts Rules (audit trail); s.44AA IT Act"
  new_form_no: ""
  frequency: "Monthly / annual"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Tally Prime: Day Book (Alt+F2 period) > Export Excel/XML; or Ledger Vouchers per ledger"
  due_date: ""
  tables_used: "One row per voucher ledger-line (double entry)"
  used_by_rules:
    - "RC-ACC-001"
    - "RC-ACC-005"
    - "RC-ACC-006"
    - "RC-ACC-007"
    - "RC-ACC-009"
    - "RC-ACC-010"
    - "RC-ACC-011"
    - "RC-BNK-002"
    - "RC-BNK-003"
    - "RC-BNK-004"
    - "RC-BNK-005"
    - "RC-GST-019"
    - "RC-GST-027"
    - "RC-GST-028"
    - "RC-GST-035"
    - "RC-GST-039"
    - "RC-IT-001"
    - "RC-IT-003"
    - "RC-IT-006"
    - "RC-IT-008"
    - "RC-IT-010"
    - "RC-IT-012"
    - "RC-PAY-005"
    - "RC-TDS-002"
    - "RC-TDS-005"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "Tally – Sample Excel files for import (field names & aliases)"
      url: "https://help.tallysolutions.com/tally-prime/import-data/download-sample-excel-files-with-data-for-import"
      ref: "Voucher Date, Voucher Number, Party Name, Buyer/Supplier GSTIN/UIN, Item, Rate, Quantity, Ledger Group"
      official: false
    - title: "Tally – Sales Register (Sales Day Book)"
      url: "https://help.tallysolutions.com/docs/te9rel66/Reports/Display_Registers_Ledgers/Sales_Register_Sales_Day_Book.htm"
      ref: "Monthly summary → voucher list; Excel/Pivot export"
      official: false
fields:
  - name: "voucher_date"
    label: "Voucher Date"
    source_path: "Voucher"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "voucher_type"
    label: "Voucher Type"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "voucher_no"
    label: "Voucher Number"
    source_path: "Voucher"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "voucher_guid"
    label: "Voucher GUID / master id"
    source_path: "Voucher"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Unique id for de-duplication and audit trail."
    origin: "catalogue"
  - name: "ledger_name"
    label: "Ledger (Particulars)"
    source_path: "Line"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "ledger_group"
    label: "Group Name (Under/Parent)"
    source_path: "Ledger master"
    data_type: "string"
    required: "yes"
    validation: "Tally primary groups"
    description: "Maps to FS heads."
    origin: "catalogue"
  - name: "debit"
    label: "Debit"
    source_path: "Line"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "credit"
    label: "Credit"
    source_path: "Line"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "party_gstin"
    label: "GSTIN/UIN of party"
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "party_pan"
    label: "PAN of party"
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "cost_centre"
    label: "Cost Centre"
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "bill_ref"
    label: "Bill-wise reference (Agst Ref/New Ref)"
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Ageing."
    origin: "catalogue"
  - name: "instrument_no"
    label: "Cheque/Instrument No. / UTR"
    source_path: "Bank allocation"
    data_type: "string"
    required: "no"
    validation: ""
    description: "BRS matching."
    origin: "catalogue"
  - name: "payment_mode"
    label: "Transaction type (Cheque/e-Fund transfer/Cash)"
    source_path: "Bank allocation"
    data_type: "string"
    required: "no"
    validation: ""
    description: "s.40A(3)/269ST checks."
    origin: "catalogue"
  - name: "tds_section"
    label: "TDS nature of payment"
    source_path: "Line"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "narration"
    label: "Narration"
    source_path: "Voucher"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "entered_by"
    label: "Entered by / altered by (audit trail)"
    source_path: "Edit log"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Rule 3(1) Accounts Rules."
    origin: "catalogue"
  - name: "entered_on"
    label: "Entry/alteration timestamp"
    source_path: "Edit log"
    data_type: "date"
    required: "no"
    validation: "ISO datetime"
    description: ""
    origin: "catalogue"
  - name: "period_tos"
    label: ""
    source_path: ""
    data_type: "string MMYYYY"
    required: "no"
    validation: ""
    description: "DERIVED: Tax period of the time of supply of the RCM expense; default voucher_date of the expense, overridable by the rule engine."
    origin: "derived"
  - name: "payment_base"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Taxable value (income credit excl. GST) of the invoice(s) referenced by bill_ref on which the government deductor paid."
    origin: "derived"
  - name: "tds_receivable_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit - credit on GST-TDS receivable ledgers per head (IGST/CGST/SGST)."
    origin: "derived"
  - name: "pos"
    label: ""
    source_path: ""
    data_type: "string(2)"
    required: "no"
    validation: ""
    description: "DERIVED: PARTY_MASTER.state_code of the customer on the advance receipt voucher (default POS proxy)."
    origin: "derived"
  - name: "gst_rate"
    label: ""
    source_path: ""
    data_type: "decimal(5,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Output-GST credited / advance amount excl. tax on the receipt voucher, rounded to the nearest configured GST rate."
    origin: "derived"
  - name: "period"
    label: ""
    source_path: ""
    data_type: "string"
    required: "no"
    validation: ""
    description: "DERIVED: Period of voucher_date - MMYYYY or yyyy-mm per counterpart (see context_dependent)."
    origin: "derived"
  - name: "advance_received_excl_tax"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on ledgers mapped to 'customer advance' in period, less output GST credited in the same receipt vouchers."
    origin: "derived"
  - name: "tax_on_advance_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on output-GST ledger head h in receipt vouchers posted to 'customer advance' ledgers."
    origin: "derived"
  - name: "advance_adjusted"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit on 'customer advance' ledgers in vouchers adjusting the advance against sales invoices, excl. GST."
    origin: "derived"
  - name: "party_id"
    label: ""
    source_path: ""
    data_type: "string"
    required: "no"
    validation: ""
    description: "DERIVED: ledger_name of the voucher line whose ledger_group is Sundry Debtors / Sundry Creditors (party ledger), joined to PARTY_MASTER.party_name."
    origin: "derived"
  - name: "base_amount"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: debit on expense-ledger line of the voucher, excluding GST ledger lines, per party (party_id/party_pan)."
    origin: "derived"
  - name: "first_credit_date"
    label: ""
    source_path: ""
    data_type: "date"
    required: "no"
    validation: ""
    description: "DERIVED: Min voucher_date on which the party ledger was credited for the expense (bill_ref / voucher)."
    origin: "derived"
  - name: "income_booked"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit - debit on income ledgers for the party, excluding GST ledger lines."
    origin: "derived"
  - name: "income_booked_incl_gst"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: income_booked + output-GST ledger credits in the same vouchers."
    origin: "derived"
  - name: "bank_account_no"
    label: ""
    source_path: ""
    data_type: "string"
    required: "no"
    validation: ""
    description: "DERIVED: BANK_BOOK.account_no where BANK_BOOK.bank_ledger = GL.ledger_name."
    origin: "derived"
  - name: "amount"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: debit - credit of the GL line (signed; use abs() when matching gross amounts)."
    origin: "derived"
  - name: "fixed_asset"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit on fixed-asset ledgers mapped to immovable property (FY)."
    origin: "derived"
  - name: "tcs_receivable"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit - credit on TCS-receivable ledgers per party (FY)."
    origin: "derived"
  - name: "salary_expense"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit - credit on ledgers mapped to payroll component 'salary expense' in period."
    origin: "derived"
  - name: "pf_payable_credit"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on ledgers mapped to 'PF payable' in period."
    origin: "derived"
  - name: "esi_payable_credit"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on ledgers mapped to 'ESI payable' in period."
    origin: "derived"
  - name: "pt_payable"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on ledgers mapped to 'PT payable' in period."
    origin: "derived"
  - name: "tds_salary_payable"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on ledgers mapped to 'TDS on salary payable' in period."
    origin: "derived"
  - name: "net_salary_payable"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on ledgers mapped to 'salary payable' in period."
    origin: "derived"
  - name: "bank_charges"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit on ledgers mapped to 'bank charges'."
    origin: "derived"
  - name: "gst_input_on_charges"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit on input-GST ledgers in vouchers that also debit a bank-charges ledger."
    origin: "derived"
  - name: "voucher_month"
    label: ""
    source_path: ""
    data_type: "string 'yyyy-mm'"
    required: "no"
    validation: ""
    description: "DERIVED: calendar month of voucher_date, format 'yyyy-mm'"
    origin: "derived"
  - name: "interest_income"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on ledgers mapped to 'bank interest income' (per bank, per voucher_month)."
    origin: "derived"
  - name: "tds_receivable_194"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit - credit on TDS-receivable ledger lines with tds_section = '194N' (rule token tds_receivable_194N)."
    origin: "derived"
  - name: "cash_contra_date"
    label: ""
    source_path: ""
    data_type: "date"
    required: "no"
    validation: ""
    description: "DERIVED: voucher_date of 'Contra' vouchers on the cash ledger."
    origin: "derived"
  - name: "cash_book_contra_credit"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on the cash ledger in voucher_type 'Contra' (cash deposited into bank)."
    origin: "derived"
  - name: "cash_balance_before_deposit"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Running balance of the cash ledger immediately before the contra deposit voucher."
    origin: "derived"
  - name: "party_balance_at_date"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Running Σ(debit - credit) of the party ledger up to the confirmation date, plus TB opening_balance of that ledger."
    origin: "derived"
  - name: "depreciation_expense"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit - credit on depreciation-expense ledgers mapped to the asset class (FY)."
    origin: "derived"
  - name: "capex_debits"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ debit on fixed-asset ledgers mapped to the asset class (FY)."
    origin: "derived"
  - name: "asset_credits"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ credit on fixed-asset ledgers mapped to the asset class (FY)."
    origin: "derived"
  - name: "quarter_end"
    label: ""
    source_path: ""
    data_type: "date"
    required: "no"
    validation: ""
    description: "DERIVED: Quarter-end date (30-Jun, 30-Sep, 31-Dec, 31-Mar) at which ledger balances are taken."
