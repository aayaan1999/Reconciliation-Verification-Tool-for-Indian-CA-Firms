schema_version: "1.0"
document:
  code: "GSTR2B"
  name: "FORM GSTR-2B – Auto-drafted ITC statement (static)"
  issuer_system: "GST portal (generated from GSTR-1/IFF/1A, GSTR-5, GSTR-6, ICEGATE; filtered by IMS actions)"
  legal_basis: "s.38 CGST Act; Rule 60(7)-(9) CGST Rules; s.16(2)(aa); Rule 36(4); Rule 88D"
  new_form_no: ""
  frequency: "monthly (GSTR-2BQ quarterly for QRMP)"
  formats_available: "Online, Excel, JSON (download); PDF summary"
  how_obtained: "GST portal > Returns Dashboard > period > GSTR-2B > Download Excel / JSON; recompute after IMS actions"
  due_date: "Draft generated on 14th of following month; recomputable until GSTR-3B filed"
  tables_used: "Summary sheets: ITC Available (Part A I: B2B invoices/DN/ECO (IMS) -> 4(A)(5); II ISD -> 4(A)(4); III RCM -> 3.1(d)/4(A)(3); IV Imports IMPG/IMPGSEZ -> 4(A)(1); Part B credit notes), ITC Not Available (-> 4(D)(2)), ITC Reversal (Rule 37A -> 4(B)(2)), ITC Rejected (IMS). Detail sheets: B2B, B2BA, B2B-CDNR, B2B-CDNRA, ECO, ECOA, ISD, ISDA, IMPG, IMPGA, IMPGSEZ, IMPGSEZA, B2B/B2BA/B2B-DNR/B2B-DNRA (ITC Reversal), and *(Rejected) sheets"
  used_by_rules:
    - "RC-BNK-002"
    - "RC-GST-013"
    - "RC-GST-014"
    - "RC-GST-015"
    - "RC-GST-016"
    - "RC-GST-025"
    - "RC-GST-031"
    - "RC-GST-037"
    - "RC-GST-038"
  verification_status: "verified_secondary"
  notes: "JSON keys verified from two independent sources (Vayana GSP copy of GSTN payload, and india-compliance RawField2b); Excel labels from the GSTR-2B Excel template v1.1 bundled with india-compliance (copy of portal layout). itcavl 'T' and rsn code values are unverified. Note key differences vs GSTR-1/2A: dt (not idt), typ (not inv_typ), rev (not rchrg), items[] with igst/cgst/sgst/cess (not itms/itm_det with iamt...), ntnum (not nt_num), suptyp in CDNR. Draft 2B not generated if previous period GSTR-3B unfiled."
  sources:
    - title: "Vayana GSP docs – GSTR-2B download (GSTN payload sample)"
      url: "https://docs.enriched-api.vayana.com/routes/basic/gstn/apis/returns/Gstr-Download-Lite-Api/gstr-2b/"
      ref: ""
      official: false
    - title: "india-compliance – GSTR-2A/2B/IMS portal JSON keys (gst_returns/fields/gstr2.py, ims.py)"
      url: "https://github.com/resilient-tech/india-compliance"
      ref: "RawField2a, RawField2b, ims.RawField"
      official: false
    - title: "india-compliance – GSTR-2B Excel template v1.1 (copy of portal download layout)"
      url: "https://github.com/resilient-tech/india-compliance"
      ref: "india_compliance/gst_india/data/gstr2b_excel_template_v1.1.xlsx"
      official: false
    - title: "GSTN FAQs on IMS (gstgyaan copy)"
      url: "https://www.gstgyaan.com/pdf/faqs-on-invoice-management-system.pdf"
      ref: "2B generation 14th, recompute"
      official: false
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "data.gstin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: "Recipient GSTIN"
    origin: "catalogue"
  - name: "return_period"
    label: "Tax Period"
    source_path: "data.rtnprd"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: "2B period"
    origin: "catalogue"
  - name: "version"
    label: "Version"
    source_path: "data.version"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Schema version"
    origin: "catalogue"
  - name: "generation_date"
    label: "Date of generation"
    source_path: "data.gendt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "2B generation (14th) / recompute date"
    origin: "catalogue"
  - name: "supplier_gstin"
    label: "GSTIN of supplier"
    source_path: "docdata.b2b[].ctin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Match key"
    origin: "catalogue"
  - name: "supplier_name"
    label: "Trade/Legal name"
    source_path: "docdata.b2b[].trdnm"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "supplier_filing_date"
    label: "GSTR-1/IFF/GSTR-5 Filing Date"
    source_path: "docdata.b2b[].supfildt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Supplier filing date – determines 2B period"
    origin: "catalogue"
  - name: "supplier_period"
    label: "GSTR-1/IFF/GSTR-5 Period"
    source_path: "docdata.b2b[].supprd"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: "Supplier's tax period"
    origin: "catalogue"
  - name: "invoice_no"
    label: "Invoice number"
    source_path: "docdata.b2b[].inv[].inum"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Match key"
    origin: "catalogue"
  - name: "invoice_type"
    label: "Invoice type"
    source_path: "docdata.b2b[].inv[].typ"
    data_type: "enum"
    required: "yes"
    validation: "R | SEWP | SEWOP | DE (2B uses 'typ', not 'inv_typ')"
    description: ""
    origin: "catalogue"
  - name: "invoice_date"
    label: "Invoice Date"
    source_path: "docdata.b2b[].inv[].dt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "2B uses 'dt', not 'idt'"
    origin: "catalogue"
  - name: "invoice_value"
    label: "Invoice Value"
    source_path: "docdata.b2b[].inv[].val"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "pos"
    label: "Place of supply"
    source_path: "docdata.b2b[].inv[].pos"
    data_type: "string"
    required: "yes"
    validation: "2-digit state code 01-38 or 96/97 (other territory / outside India); zero-padded string e.g. '07'"
    description: ""
    origin: "catalogue"
  - name: "reverse_charge"
    label: "Supply Attract Reverse Charge"
    source_path: "docdata.b2b[].inv[].rev"
    data_type: "enum"
    required: "yes"
    validation: "Y/N"
    description: "Y -> 3.1(d) & 4(A)(3)"
    origin: "catalogue"
  - name: "itc_availability"
    label: "ITC Availability"
    source_path: "docdata.*.itcavl"
    data_type: "enum"
    required: "yes"
    validation: "Y | N | T (temporary – unverified)"
    description: "N -> 'ITC not available' sheet -> 4(D)(2)"
    origin: "catalogue"
  - name: "itc_unavailability_reason"
    label: "Reason"
    source_path: "docdata.*.rsn"
    data_type: "enum"
    required: "no"
    validation: "e.g. P (POS rule, s.17(5)/IGST-intra) | C (s.16(4) time-barred) – codes unverified"
    description: "Why ITC not available"
    origin: "catalogue"
  - name: "diff_percent"
    label: "Applicable % of Tax Rate"
    source_path: "docdata.*.diffprcnt"
    data_type: "decimal"
    required: "no"
    validation: "0.65 or 1/absent"
    description: ""
    origin: "catalogue"
  - name: "source_type"
    label: "Source"
    source_path: "docdata.*.srctyp"
    data_type: "string"
    required: "no"
    validation: "e.g. 'e-Invoice'"
    description: ""
    origin: "catalogue"
  - name: "irn"
    label: "IRN"
    source_path: "docdata.*.irn"
    data_type: "string"
    required: "no"
    validation: "64 chars"
    description: "Join to EINV.Irn"
    origin: "catalogue"
  - name: "irn_date"
    label: "IRN Date"
    source_path: "docdata.*.irngendate"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "item_no"
    label: "Item no"
    source_path: "docdata.*.items[].num"
    data_type: "integer"
    required: "yes"
    validation: ">=1"
    description: ""
    origin: "catalogue"
  - name: "rate"
    label: "Rate (%)"
    source_path: "docdata.*.items[].rt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: ""
    origin: "catalogue"
  - name: "taxable_value"
    label: "Taxable Value (₹)"
    source_path: "docdata.*.items[].txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "igst_amount"
    label: "Integrated Tax(₹)"
    source_path: "docdata.*.items[].igst"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "2B uses igst/cgst/sgst/cess, not iamt/camt/samt/csamt"
    origin: "catalogue"
  - name: "cgst_amount"
    label: "Central Tax(₹)"
    source_path: "docdata.*.items[].cgst"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "sgst_amount"
    label: "State/UT Tax(₹)"
    source_path: "docdata.*.items[].sgst"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "cess_amount"
    label: "Cess(₹)"
    source_path: "docdata.*.items[].cess"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "original_invoice_no"
    label: "Original Details – Invoice number"
    source_path: "docdata.b2ba[].inv[].oinum"
    data_type: "string"
    required: "no"
    validation: ""
    description: "B2BA"
    origin: "catalogue"
  - name: "original_invoice_date"
    label: "Original Details – Invoice Date"
    source_path: "docdata.b2ba[].inv[].oidt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "note_no"
    label: "Note number"
    source_path: "docdata.cdnr[].nt[].ntnum"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "CDNR key ('ntnum', not 'nt_num')"
    origin: "catalogue"
  - name: "note_type"
    label: "Note type"
    source_path: "docdata.cdnr[].nt[].typ"
    data_type: "enum"
    required: "yes"
    validation: "C | D"
    description: "In CDNR 'typ' = note type"
    origin: "catalogue"
  - name: "note_supply_type"
    label: "Note Supply type"
    source_path: "docdata.cdnr[].nt[].suptyp"
    data_type: "enum"
    required: "yes"
    validation: "R | SEWP | SEWOP | DE"
    description: ""
    origin: "catalogue"
  - name: "note_date"
    label: "Note date"
    source_path: "docdata.cdnr[].nt[].dt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "original_note_type"
    label: "Original Note type"
    source_path: "docdata.cdnra[].nt[].onttyp"
    data_type: "enum"
    required: "no"
    validation: "C | D"
    description: ""
    origin: "catalogue"
  - name: "original_note_no"
    label: "Original Note number"
    source_path: "docdata.cdnra[].nt[].ontnum"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "original_note_date"
    label: "Original Note date"
    source_path: "docdata.cdnra[].nt[].ontdt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "itc_reduction_required"
    label: "Whether ITC to be reduced (Taxpayer's Input)"
    source_path: "docdata.b2ba/cdnr/cdnra[].itcRedReq"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: "IMS credit-note / downward amendment ITC reduction declaration"
    origin: "catalogue"
  - name: "declared_igst"
    label: "Amount declared by taxpayer for ITC reduction – IGST"
    source_path: "docdata.*.declIgst"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Also declCgst, declSgst, declCess"
    origin: "catalogue"
  - name: "remarks"
    label: "Remarks"
    source_path: "docdata.*.remarks"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "isd_doc_type"
    label: "ISD Document type"
    source_path: "docdata.isd[].doclist[].doctyp"
    data_type: "enum"
    required: "no"
    validation: "ISDI (invoice) | ISDC (credit note)"
    description: ""
    origin: "catalogue"
  - name: "isd_doc_no"
    label: "ISD Document number"
    source_path: "docdata.isd[].doclist[].docnum"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "isd_doc_date"
    label: "ISD Document date"
    source_path: "docdata.isd[].doclist[].docdt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "isd_original_invoice_no"
    label: "Original Invoice Number"
    source_path: "docdata.isd[].doclist[].oinvnum"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "isd_original_invoice_date"
    label: "Original invoice date"
    source_path: "docdata.isd[].doclist[].oinvdt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "isd_itc_eligible"
    label: "Eligibility of ITC"
    source_path: "docdata.isd[].doclist[].itcelg"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: ""
    origin: "catalogue"
  - name: "isd_original_doc"
    label: "Original ISD document type/number/date"
    source_path: "docdata.isda[].doclist[].odoctyp/odocnum/odocdt"
    data_type: "string"
    required: "no"
    validation: ""
    description: "ISDA"
    origin: "catalogue"
  - name: "boe_ref_date"
    label: "Icegate Reference Date"
    source_path: "docdata.impg[].refdt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "boe_received_date"
    label: "Record received date"
    source_path: "docdata.impg[].recdt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "port_code"
    label: "Port Code"
    source_path: "docdata.impg[].portcode"
    data_type: "string"
    required: "no"
    validation: "6 chars"
    description: ""
    origin: "catalogue"
  - name: "boe_no"
    label: "Bill of Entry Details – Number"
    source_path: "docdata.impg[].boenum"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Match to BoE in purchase register"
    origin: "catalogue"
  - name: "boe_date"
    label: "Bill of Entry Details – Date"
    source_path: "docdata.impg[].boedt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "boe_amended"
    label: "Amended (Yes/No)"
    source_path: "docdata.impg[].isamd"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: ""
    origin: "catalogue"
  - name: "boe_taxable_value"
    label: "Taxable Value"
    source_path: "docdata.impg[].txval"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "boe_igst"
    label: "Integrated Tax(₹)"
    source_path: "docdata.impg[].igst"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "-> 4(A)(1)"
    origin: "catalogue"
  - name: "boe_cess"
    label: "Cess(₹)"
    source_path: "docdata.impg[].cess"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "impgsez_supplier_gstin"
    label: "GSTIN of supplier (SEZ)"
    source_path: "docdata.impgsez[].ctin; boe[] as impg"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: ""
    origin: "catalogue"
  - name: "eco_gstin"
    label: "GSTIN of ECO"
    source_path: "docdata.ecom[].ctin"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Documents on which ECO pays tax u/s 9(5)"
    origin: "catalogue"
  - name: "summary_itc_available"
    label: "FORM SUMMARY – ITC Available (Part A I-IV, Part B)"
    source_path: "itcsumm.itcavl.{nonrevsup, isdsup, revsup, imports, othersup}.{igst,cgst,sgst,cess}"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "nonrevsup -> 4(A)(5); isdsup -> 4(A)(4); revsup -> 3.1(d)/4(A)(3); imports -> 4(A)(1); othersup (credit notes) net off 4(A)"
    origin: "catalogue"
  - name: "summary_itc_unavailable"
    label: "FORM SUMMARY – ITC Not Available"
    source_path: "itcsumm.itcunavl.*"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "-> 4(D)(2)"
    origin: "catalogue"
  - name: "summary_itc_reversal"
    label: "FORM SUMMARY – ITC Reversal (Rule 37A)"
    source_path: "itcsumm.itcrev.*"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "-> 4(B)(2)"
    origin: "catalogue"
  - name: "summary_supplier_wise"
    label: "Supplier-wise summary"
    source_path: "cpsumm.{b2b,b2ba,cdnr,cdnra,isd,isda,impgsez,ecom,ecoma}[].ctin/trdnm/supprd/supfildt/ttldocs/txval/igst/cgst/sgst/cess(/nttyp)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Counter-party summary for supplier-level reconciliation"
    origin: "catalogue"
  - name: "rejected_docs"
    label: "ITC Rejected (records rejected on IMS)"
    source_path: "docRejdata.{b2b,b2ba,cdnr,cdnra,ecom,ecoma,isd,isda}"
    data_type: "object"
    required: "no"
    validation: "same shape as docdata"
    description: "View-only; not to be claimed"
    origin: "catalogue"
  - name: "doc_type"
    label: ""
    source_path: ""
    data_type: "enum INV|CRN|DBN"
    required: "no"
    validation: ""
    description: "DERIVED: Raw key typ is invoice_type (R/SEWP/SEWOP/DE) in b2b and note_type (C/D) in cdnr. Rule meaning is document type: source section b2b/b2ba -> 'INV'; cdnr/cdnra note_type 'C' -> 'CRN', 'D' -> 'DBN'."
    origin: "derived"
  - name: "b2b_net_itc"
    label: ""
    source_path: ""
    data_type: "decimal(15,2) per head"
    required: "no"
    validation: ""
    description: "DERIVED: Per head: Σ items of b2b + b2ba documents with itc_availability='Y' minus Σ cdnr (+cdnra) credit notes with itc_availability='Y'; cross-check with summary_itc_available.nonrevsup (+ othersup netting)."
    origin: "derived"
  - name: "isd_itc"
    label: ""
    source_path: ""
    data_type: "decimal(15,2) per head"
    required: "no"
    validation: ""
    description: "DERIVED: Σ ISD section document amounts with isd_itc_eligible='Y' (ISD credit notes negative); cross-check summary_itc_available.isdsup."
    origin: "derived"
  - name: "impg_itc"
    label: ""
    source_path: ""
    data_type: "decimal(15,2) per head"
    required: "no"
    validation: ""
    description: "DERIVED: Σ boe_igst and boe_cess over impg + impgsez rows of the period; cross-check summary_itc_available.imports."
    origin: "derived"
  - name: "tax_heads"
    label: ""
    source_path: ""
    data_type: "group"
    required: "no"
    validation: ""
    description: "DERIVED: Tuple (igst_amount, cgst_amount, sgst_amount, cess_amount)."
    origin: "derived"
