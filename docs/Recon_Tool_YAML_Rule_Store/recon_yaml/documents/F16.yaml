schema_version: "1.0"
document:
  code: "F16"
  name: "Form 16 / Form 130 – TDS certificate on salary (Part A from TRACES)"
  issuer_system: "TRACES (Part A generated) + employer (Part B / Annexure)"
  legal_basis: "IT Act 1961 s.203 read with Rule 31 (Form 16); ITA 2025 s.395(4)(b) read with Rule 215(1) Table Sl.1 (Form 130)"
  new_form_no: "Form 130 (TY 2026-27 onwards)"
  frequency: "Annual per employee"
  formats_available: "PDF (TRACES Part A; employer-generated Part B), digitally signed; bulk zip from TRACES"
  how_obtained: "Employer: TRACES > Downloads > Form 16 (Part A) after Q4 24Q/138 processed; employee receives from employer"
  due_date: "15 June following the FY / tax year (Form 130 FAQ)"
  tables_used: "Form 16: Part A (employer/employee/TAN/PAN, quarter-wise summary of amount paid, tax deducted & deposited, receipt nos.; challan/BIN details); Part B (salary computation – see F16_PARTB). Form 130: Part A (employer & employee details), Part B (summary-level reconciliation of amount paid and TDS), Part C Annexure-I (salary) / Annexure-II (specified senior citizens)"
  used_by_rules: []
  verification_status: "partially_verified"
  notes: "Form 130 legal basis, Parts and due date verified from ITD Form 130 FAQ. Form 16 Part A column labels are from professional knowledge of the TRACES layout (not re-opened this session). Part B / salary annexure is catalogued separately as F16_PARTB."
  sources:
    - title: "Income Tax Department – Form 130 FAQs"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/form-130-faqs"
      ref: "s.395(4)(b); Rule 215(1); Part A/B/C; due 15 June"
      official: true
    - title: "TDSMAN – Different matching statuses in Form 16/16A (2026)"
      url: "https://blog.tdsman.com/2026/02/different-matching-statuses-form-16-form-16a/"
      ref: "U/P/F/O"
      official: false
    - title: "Income Tax Department – Form No. 138 note"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/fn-138"
      ref: "s.397(3)(b) ITA 2025; Rule 219; Annexure I/II/III"
      official: true
fields:
  - name: "certificate_no"
    label: "Certificate No."
    source_path: "Part A header"
    data_type: "string"
    required: "yes"
    validation: "alphanumeric (TRACES)"
    description: "Unique certificate id."
    origin: "catalogue"
  - name: "employer_tan"
    label: "TAN of the Deductor"
    source_path: "Part A"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{4}[0-9]{5}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "employer_pan"
    label: "PAN of the Deductor"
    source_path: "Part A"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "employee_pan"
    label: "PAN of the Employee"
    source_path: "Part A"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "Key to PAYROLL_REG / TDS_RET_24Q SD."
    origin: "catalogue"
  - name: "employee_name"
    label: "Name and address of the Employee"
    source_path: "Part A"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "assessment_year"
    label: "Assessment Year / Tax Year"
    source_path: "Part A"
    data_type: "string"
    required: "yes"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: ""
    origin: "catalogue"
  - name: "period_from"
    label: "Period with the Employer – From"
    source_path: "Part A"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "period_to"
    label: "Period with the Employer – To"
    source_path: "Part A"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "quarter"
    label: "Quarter(s)"
    source_path: "Part A summary"
    data_type: "enum"
    required: "yes"
    validation: "Q1|Q2|Q3|Q4"
    description: ""
    origin: "catalogue"
  - name: "receipt_no"
    label: "Receipt Numbers of original quarterly statements of TDS"
    source_path: "Part A summary"
    data_type: "string"
    required: "yes"
    validation: "8 chars (token/receipt)"
    description: "Must match TDS_RET_24Q token."
    origin: "catalogue"
  - name: "amount_paid_credited"
    label: "Amount paid/credited"
    source_path: "Part A summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Quarter-wise salary paid."
    origin: "catalogue"
  - name: "tax_deducted"
    label: "Amount of tax deducted"
    source_path: "Part A summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tax_deposited"
    label: "Amount of tax deposited/remitted"
    source_path: "Part A summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "challan_bsr"
    label: "BSR Code of the Bank Branch"
    source_path: "Part A – challan details"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{7}$"
    description: ""
    origin: "catalogue"
  - name: "challan_date"
    label: "Date on which tax deposited"
    source_path: "Part A – challan details"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "challan_serial"
    label: "Challan Serial Number"
    source_path: "Part A – challan details"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{1,5}$ (left-pad to 5 for matching)"
    description: ""
    origin: "catalogue"
  - name: "challan_tax_deposited"
    label: "Tax deposited in respect of the deductee"
    source_path: "Part A – challan details"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "challan_status"
    label: "Status of matching with OLTAS"
    source_path: "Part A – challan details"
    data_type: "enum"
    required: "no"
    validation: "U|P|F|O"
    description: "Credit status per TRACES legend."
    origin: "catalogue"
