schema_version: "1.0"
document:
  code: "BRS"
  name: "Bank reconciliation statement"
  issuer_system: "Prepared by client accountant or generated by the tool from BANK_BOOK and BANK_STMT"
  legal_basis: "Design document (not a statutory form)"
  new_form_no: ""
  frequency: ""
  formats_available: ""
  how_obtained: ""
  due_date: ""
  tables_used: ""
  used_by_rules: []
  verification_status: "unverified"
  notes: "Statement reconciling book balance of a bank ledger to the bank statement balance at a date, listing reconciling items. Added by field-model harmonisation – not in round-2 catalogue."
  sources: []
fields:
  - name: "bank_ledger"
    label: "Bank ledger"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Joins to BANK_BOOK.bank_ledger / TB.ledger_name."
    origin: "new document (design)"
  - name: "account_no"
    label: "Account number"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "new document (design)"
  - name: "as_on_date"
    label: "As on date"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "new document (design)"
  - name: "book_balance"
    label: "Balance as per books"
    source_path: "Summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) signed"
    description: ""
    origin: "new document (design)"
  - name: "cheques_issued_not_presented"
    label: "Cheques issued not presented"
    source_path: "Summary"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2)"
    description: ""
    origin: "new document (design)"
  - name: "deposits_not_credited"
    label: "Cheques deposited not credited"
    source_path: "Summary"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2)"
    description: ""
    origin: "new document (design)"
  - name: "bank_credits_not_in_books"
    label: "Credits in bank not in books"
    source_path: "Summary"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2)"
    description: ""
    origin: "new document (design)"
  - name: "bank_debits_not_in_books"
    label: "Debits in bank not in books"
    source_path: "Summary"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2)"
    description: ""
    origin: "new document (design)"
  - name: "computed_bank_balance"
    label: "Balance as per bank (computed)"
    source_path: "Summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) signed"
    description: "book_balance + cheques_issued_not_presented - deposits_not_credited + bank_credits_not_in_books - bank_debits_not_in_books."
    origin: "new document (design)"
  - name: "item_ref"
    label: "Reconciling item reference"
    source_path: "Item"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Voucher/cheque/UTR of each reconciling item."
    origin: "new document (design)"
  - name: "item_amount"
    label: "Reconciling item amount"
    source_path: "Item"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2)"
    description: ""
    origin: "new document (design)"
