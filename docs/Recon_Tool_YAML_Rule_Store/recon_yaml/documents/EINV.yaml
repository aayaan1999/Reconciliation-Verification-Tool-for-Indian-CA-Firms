schema_version: "1.0"
document:
  code: "EINV"
  name: "E-invoice (IRN) data – FORM GST INV-01 schema as registered on the Invoice Registration Portal"
  issuer_system: "IRP (einvoice1.gst.gov.in / NIC and other IRPs); auto-populated to GSTR-1"
  legal_basis: "Rule 48(4) CGST Rules; FORM GST INV-01 (Notification 60/2020-CT); applicability by AATO (Rs 5 crore from 01.08.2023, Notification 10/2023-CT); 30-day reporting limit for AATO >= Rs 10 crore (GSTN advisory)"
  new_form_no: ""
  frequency: "per document (ad hoc)"
  formats_available: "JSON (IRP API / bulk download), Excel (IRP reports), signed QR; GST portal 'e-Invoice' download in GSTR-1"
  how_obtained: "einvoice1.gst.gov.in > Search / Bulk download of IRNs; ERP/GSP JSON; GST portal > Returns > e-Invoice > download auto-populated e-invoice details"
  due_date: "Before issuing invoice; IRN must be obtained within 30 days of document date for AATO >= Rs 10 crore (advisory)"
  tables_used: "Version, TranDtls, DocDtls, SellerDtls, BuyerDtls, DispDtls, ShipDtls, ItemList (BchDtls, AttribDtls), ValDtls, PayDtls, RefDtls (DocPerdDtls, PrecDocDtls, ContrDtls), AddlDocDtls, ExpDtls, EwbDtls; response Data (AckNo, AckDt, Irn, SignedInvoice, SignedQRCode, Status, EwbNo, EwbDt, EwbValidTill)"
  used_by_rules:
    - "RC-GST-008"
    - "RC-GST-009"
    - "RC-GST-010"
  verification_status: "verified_official"
  notes: "Field names, patterns and lengths verified on NIC e-invoice API sandbox (official) – schema v1.1. Date formats differ: request dd/mm/yyyy, response yyyy-mm-dd hh:mm:ss. IRN cancellation within 24 hours (not re-verified this session). B2C supplies are outside IRN (dynamic QR). Status ACT/CNL from Get-IRN-details convention – CNL not seen this session."
  sources:
    - title: "NIC e-Invoice API sandbox – Generate IRN (schema v1.1)"
      url: "https://einv-apisandbox.nic.in/version1.03/generate-irn.html"
      ref: ""
      official: true
    - title: "Logitax – Standard Create E-invoice (field list)"
      url: "https://docs.logitax.in/Docs/Standard_Create_E_invoice"
      ref: ""
      official: false
    - title: "Schema (Version 1.1) – e-invoice field table (ICAI branch reproduction)"
      url: "https://mspa.in/detail/38865.aspx"
      ref: ""
      official: false
    - title: "EY – e-invoicing threshold Rs 5 crore w.e.f. 01.08.2023"
      url: "https://www.ey.com/en_in/alerts-hub/2023/05/cbic-lowers-turnover-threshold-for-e-invoicing-to-inr5-crores-with-effect-from-1-august-2023"
      ref: ""
      official: false
    - title: "Time limit of 30 days for reporting e-invoice for AATO >= Rs 10 crore (Taxmann)"
      url: "https://www.taxmann.com/post/blog/time-limit-of-30-days-for-reporting-e-invoice-on-irp-portal-for-taxpayers-with-aato-of-10-crores-and-above-gstn-update/"
      ref: ""
      official: false
fields:
  - name: "schema_version"
    label: "Version"
    source_path: "Version"
    data_type: "string"
    required: "yes"
    validation: "1-6 chars e.g. '1.1'"
    description: ""
    origin: "catalogue"
  - name: "irn"
    label: "Invoice Reference Number"
    source_path: "Irn (response Data.Irn)"
    data_type: "string"
    required: "yes"
    validation: "64 chars (SHA-256 hex of supplier GSTIN + FY + doc type + doc no)"
    description: "Join key to GSTR-1 b2b irn and GSTR-2B irn"
    origin: "catalogue"
  - name: "ack_no"
    label: "Acknowledgement number"
    source_path: "Data.AckNo"
    data_type: "integer"
    required: "yes"
    validation: "15 digits (sample)"
    description: ""
    origin: "catalogue"
  - name: "ack_date"
    label: "Acknowledgement date-time"
    source_path: "Data.AckDt"
    data_type: "date"
    required: "yes"
    validation: "yyyy-mm-dd hh:mm:ss"
    description: "IRN date; check 30-day reporting window vs DocDtls.Dt for AATO >= Rs 10 crore"
    origin: "catalogue"
  - name: "irn_status"
    label: "Status"
    source_path: "Data.Status"
    data_type: "enum"
    required: "no"
    validation: "ACT (active) | CNL (cancelled)"
    description: "Cancelled IRN must not appear as live invoice in GSTR-1"
    origin: "catalogue"
  - name: "signed_qr"
    label: "Signed QR Code"
    source_path: "Data.SignedQRCode"
    data_type: "string"
    required: "no"
    validation: "JWT"
    description: ""
    origin: "catalogue"
  - name: "tax_scheme"
    label: "Tax scheme"
    source_path: "TranDtls.TaxSch"
    data_type: "enum"
    required: "yes"
    validation: "GST"
    description: ""
    origin: "catalogue"
  - name: "supply_type"
    label: "Type of supply"
    source_path: "TranDtls.SupTyp"
    data_type: "enum"
    required: "yes"
    validation: "B2B | SEZWP | SEZWOP | EXPWP | EXPWOP | DEXP"
    description: "Maps to GSTR-1: B2B->4A/4B (inv_typ R), SEZWP/SEZWOP->6B, DEXP->6C (DE), EXPWP/EXPWOP->6A (WPAY/WOPAY)"
    origin: "catalogue"
  - name: "reverse_charge"
    label: "Tax payable under reverse charge"
    source_path: "TranDtls.RegRev"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: "-> rchrg"
    origin: "catalogue"
  - name: "ecom_gstin"
    label: "GSTIN of e-commerce operator"
    source_path: "TranDtls.EcmGstin"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$"
    description: "-> etin"
    origin: "catalogue"
  - name: "igst_on_intra"
    label: "IGST on intra-State supply"
    source_path: "TranDtls.IgstOnIntra"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: ""
    origin: "catalogue"
  - name: "doc_type"
    label: "Document type"
    source_path: "DocDtls.Typ"
    data_type: "enum"
    required: "yes"
    validation: "INV | CRN | DBN"
    description: "INV -> b2b/exp; CRN/DBN -> cdnr/cdnur"
    origin: "catalogue"
  - name: "doc_no"
    label: "Document number"
    source_path: "DocDtls.No"
    data_type: "string"
    required: "yes"
    validation: "^[a-zA-Z1-9][a-zA-Z0-9/-]{0,15}$ (max 16; cannot start with 0)"
    description: "Match to GSTR-1 inum / nt_num (normalise case)"
    origin: "catalogue"
  - name: "doc_date"
    label: "Document date"
    source_path: "DocDtls.Dt"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "seller_gstin"
    label: "Supplier GSTIN"
    source_path: "SellerDtls.Gstin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$"
    description: ""
    origin: "catalogue"
  - name: "seller_legal_name"
    label: "Legal name"
    source_path: "SellerDtls.LglNm"
    data_type: "string"
    required: "yes"
    validation: "3-100 chars"
    description: ""
    origin: "catalogue"
  - name: "seller_state_code"
    label: "State code"
    source_path: "SellerDtls.Stcd"
    data_type: "string"
    required: "yes"
    validation: "^(?!0+$)[0-9]{1,2}$"
    description: ""
    origin: "catalogue"
  - name: "seller_pin"
    label: "PIN code"
    source_path: "SellerDtls.Pin"
    data_type: "integer"
    required: "yes"
    validation: "100000-999999"
    description: ""
    origin: "catalogue"
  - name: "buyer_gstin"
    label: "Buyer GSTIN"
    source_path: "BuyerDtls.Gstin"
    data_type: "string"
    required: "yes"
    validation: "^(([0-9]{2}[0-9A-Z]{13})|URP)$ (URP for exports)"
    description: "-> ctin"
    origin: "catalogue"
  - name: "buyer_legal_name"
    label: "Legal name"
    source_path: "BuyerDtls.LglNm"
    data_type: "string"
    required: "yes"
    validation: "3-100 chars"
    description: ""
    origin: "catalogue"
  - name: "buyer_pos"
    label: "Place of supply"
    source_path: "BuyerDtls.Pos"
    data_type: "string"
    required: "yes"
    validation: "1-2 digit state code; 96 = outside India"
    description: "-> pos (zero-pad to 2)"
    origin: "catalogue"
  - name: "buyer_state_code"
    label: "State code"
    source_path: "BuyerDtls.Stcd"
    data_type: "string"
    required: "yes"
    validation: "^(?!0+$)[0-9]{1,2}$"
    description: ""
    origin: "catalogue"
  - name: "buyer_pin"
    label: "PIN code"
    source_path: "BuyerDtls.Pin"
    data_type: "integer"
    required: "no"
    validation: "100000-999999"
    description: ""
    origin: "catalogue"
  - name: "ship_gstin"
    label: "Consignee GSTIN"
    source_path: "ShipDtls.Gstin"
    data_type: "string"
    required: "no"
    validation: "GSTIN or URP"
    description: ""
    origin: "catalogue"
  - name: "item_sl_no"
    label: "Item serial number"
    source_path: "ItemList[].SlNo"
    data_type: "string"
    required: "yes"
    validation: "1-6 digits"
    description: ""
    origin: "catalogue"
  - name: "item_is_service"
    label: "Service flag"
    source_path: "ItemList[].IsServc"
    data_type: "enum"
    required: "yes"
    validation: "Y/N"
    description: ""
    origin: "catalogue"
  - name: "item_hsn"
    label: "HSN code"
    source_path: "ItemList[].HsnCd"
    data_type: "string"
    required: "yes"
    validation: "4, 6 or 8 digits; not all zeros"
    description: "Compare with GSTR-1 Table 12 HSN"
    origin: "catalogue"
  - name: "item_qty"
    label: "Quantity"
    source_path: "ItemList[].Qty"
    data_type: "decimal"
    required: "no"
    validation: "0-9999999999.999"
    description: ""
    origin: "catalogue"
  - name: "item_unit"
    label: "Unit"
    source_path: "ItemList[].Unit"
    data_type: "string"
    required: "no"
    validation: "^[A-Za-z]{3,8}$ (UQC)"
    description: ""
    origin: "catalogue"
  - name: "item_unit_price"
    label: "Unit price"
    source_path: "ItemList[].UnitPrice"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,3)"
    description: ""
    origin: "catalogue"
  - name: "item_total_amount"
    label: "Gross amount"
    source_path: "ItemList[].TotAmt"
    data_type: "decimal"
    required: "yes"
    validation: "= UnitPrice x Qty (validate)"
    description: ""
    origin: "catalogue"
  - name: "item_discount"
    label: "Discount"
    source_path: "ItemList[].Discount"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "item_assessable_value"
    label: "Taxable value (AssAmt)"
    source_path: "ItemList[].AssAmt"
    data_type: "decimal"
    required: "yes"
    validation: "= TotAmt - Discount (validate)"
    description: "-> txval"
    origin: "catalogue"
  - name: "item_gst_rate"
    label: "GST rate"
    source_path: "ItemList[].GstRt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: "-> rt"
    origin: "catalogue"
  - name: "item_igst"
    label: "IGST amount"
    source_path: "ItemList[].IgstAmt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "item_cgst"
    label: "CGST amount"
    source_path: "ItemList[].CgstAmt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "item_sgst"
    label: "SGST amount"
    source_path: "ItemList[].SgstAmt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "item_cess_rate"
    label: "Cess rate"
    source_path: "ItemList[].CesRt"
    data_type: "decimal"
    required: "no"
    validation: "0-999.999"
    description: ""
    origin: "catalogue"
  - name: "item_cess"
    label: "Cess amount"
    source_path: "ItemList[].CesAmt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "item_cess_non_advol"
    label: "Cess non-advalorem amount"
    source_path: "ItemList[].CesNonAdvlAmt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "item_state_cess"
    label: "State cess amount"
    source_path: "ItemList[].StateCesAmt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "item_other_charges"
    label: "Other charges"
    source_path: "ItemList[].OthChrg"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "item_total_value"
    label: "Total item value"
    source_path: "ItemList[].TotItemVal"
    data_type: "decimal"
    required: "yes"
    validation: "= AssAmt + taxes + cess + OthChrg (validate)"
    description: ""
    origin: "catalogue"
  - name: "val_assessable"
    label: "Total assessable value"
    source_path: "ValDtls.AssVal"
    data_type: "decimal"
    required: "yes"
    validation: "= sum(AssAmt)"
    description: "Invoice-level txval"
    origin: "catalogue"
  - name: "val_cgst"
    label: "Total CGST"
    source_path: "ValDtls.CgstVal"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "val_sgst"
    label: "Total SGST"
    source_path: "ValDtls.SgstVal"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "val_igst"
    label: "Total IGST"
    source_path: "ValDtls.IgstVal"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "val_cess"
    label: "Total cess"
    source_path: "ValDtls.CesVal"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "val_state_cess"
    label: "Total state cess"
    source_path: "ValDtls.StCesVal"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "val_discount"
    label: "Total discount"
    source_path: "ValDtls.Discount"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "val_other_charges"
    label: "Total other charges"
    source_path: "ValDtls.OthChrg"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "val_round_off"
    label: "Round-off amount"
    source_path: "ValDtls.RndOffAmt"
    data_type: "decimal"
    required: "no"
    validation: "-99.99 to 99.99"
    description: ""
    origin: "catalogue"
  - name: "val_total_invoice"
    label: "Final invoice value"
    source_path: "ValDtls.TotInvVal"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "-> val"
    origin: "catalogue"
  - name: "val_total_invoice_fc"
    label: "Final invoice value in foreign currency"
    source_path: "ValDtls.TotInvValFc"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "preceding_invoice_no"
    label: "Preceding invoice reference"
    source_path: "RefDtls.PrecDocDtls[].InvNo"
    data_type: "string"
    required: "no"
    validation: "1-16 chars"
    description: "Original invoice for CRN/DBN"
    origin: "catalogue"
  - name: "preceding_invoice_date"
    label: "Preceding invoice date"
    source_path: "RefDtls.PrecDocDtls[].InvDt"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "export_shipping_bill_no"
    label: "Shipping bill number"
    source_path: "ExpDtls.ShipBNo"
    data_type: "string"
    required: "no"
    validation: "1-20 chars"
    description: "-> sbnum"
    origin: "catalogue"
  - name: "export_shipping_bill_date"
    label: "Shipping bill date"
    source_path: "ExpDtls.ShipBDt"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy"
    description: "-> sbdt"
    origin: "catalogue"
  - name: "export_port"
    label: "Port code"
    source_path: "ExpDtls.Port"
    data_type: "string"
    required: "no"
    validation: "2-10 alphanumeric"
    description: "-> sbpcode"
    origin: "catalogue"
  - name: "export_refund_claim"
    label: "Claiming refund"
    source_path: "ExpDtls.RefClm"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: ""
    origin: "catalogue"
  - name: "export_currency"
    label: "Foreign currency"
    source_path: "ExpDtls.ForCur"
    data_type: "string"
    required: "no"
    validation: "3-16 letters"
    description: ""
    origin: "catalogue"
  - name: "export_country"
    label: "Country code"
    source_path: "ExpDtls.CntCode"
    data_type: "string"
    required: "no"
    validation: "2 letters"
    description: ""
    origin: "catalogue"
  - name: "ewb_no"
    label: "E-way bill number"
    source_path: "Data.EwbNo"
    data_type: "integer"
    required: "no"
    validation: "12 digits"
    description: "Join to EWB.ewb_no"
    origin: "catalogue"
  - name: "ewb_date"
    label: "E-way bill date"
    source_path: "Data.EwbDt"
    data_type: "date"
    required: "no"
    validation: "yyyy-mm-dd hh:mm:ss"
    description: ""
    origin: "catalogue"
  - name: "ewb_valid_till"
    label: "E-way bill valid till"
    source_path: "Data.EwbValidTill"
    data_type: "date"
    required: "no"
    validation: "yyyy-mm-dd hh:mm:ss"
    description: ""
    origin: "catalogue"
  - name: "ewb_transporter_id"
    label: "Transporter ID"
    source_path: "EwbDtls.TransId"
    data_type: "string"
    required: "no"
    validation: "15 chars GSTIN/TRANSIN"
    description: ""
    origin: "catalogue"
  - name: "ewb_distance"
    label: "Distance"
    source_path: "EwbDtls.Distance"
    data_type: "integer"
    required: "no"
    validation: "0-4000 km"
    description: ""
    origin: "catalogue"
  - name: "ewb_vehicle_no"
    label: "Vehicle number"
    source_path: "EwbDtls.VehNo"
    data_type: "string"
    required: "no"
    validation: "4-20 alphanumeric"
    description: ""
    origin: "catalogue"
  - name: "ewb_trans_mode"
    label: "Transport mode"
    source_path: "EwbDtls.TransMode"
    data_type: "enum"
    required: "no"
    validation: "1 Road | 2 Rail | 3 Air | 4 Ship"
    description: ""
    origin: "catalogue"
  - name: "fy"
    label: ""
    source_path: ""
    data_type: "string 'YYYY-YY'"
    required: "no"
    validation: ""
    description: "DERIVED: Indian financial year (1 Apr - 31 Mar) containing doc_date, format 'YYYY-YY' e.g. '2025-26'"
    origin: "derived"
