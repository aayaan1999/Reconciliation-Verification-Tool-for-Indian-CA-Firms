schema_version: "1.0"
document:
  code: "STOCK_REG"
  name: "Stock register / stock summary (item-wise movement)"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law. Supports CARO 3(ii), Form 3CD cl.35 quantitative details, FS-007"
  new_form_no: ""
  frequency: "Monthly / quarterly / annual"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Tally Prime: Stock Summary / Stock Item vouchers > Export; ERP inventory ledger"
  due_date: ""
  tables_used: "Item × godown: opening, inward, outward, closing qty & value"
  used_by_rules:
    - "RC-ACC-007"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "Tally – Sample Excel files for import (field names & aliases)"
      url: "https://help.tallysolutions.com/tally-prime/import-data/download-sample-excel-files-with-data-for-import"
      ref: "Voucher Date, Voucher Number, Party Name, Buyer/Supplier GSTIN/UIN, Item, Rate, Quantity, Ledger Group"
      official: false
    - title: "Tally – Sales Register (Sales Day Book)"
      url: "https://help.tallysolutions.com/docs/te9rel66/Reports/Display_Registers_Ledgers/Sales_Register_Sales_Day_Book.htm"
      ref: "Monthly summary → voucher list; Excel/Pivot export"
      official: false
fields:
  - name: "period_from"
    label: "Period from"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "period_to"
    label: "Period to"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "item_code"
    label: "Stock Item / code"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "item_name"
    label: "Item Name"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "stock_group"
    label: "Stock Group / category"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "RM|WIP|FG|Traded|Stores"
    description: ""
    origin: "catalogue"
  - name: "hsn"
    label: "HSN"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "godown"
    label: "Godown / location"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "uom"
    label: "Unit"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "opening_qty"
    label: "Opening Quantity"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "3 dp"
    description: ""
    origin: "catalogue"
  - name: "opening_value"
    label: "Opening Value"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "inward_qty"
    label: "Inwards Quantity"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "3 dp"
    description: "Σ PURCH_REG qty."
    origin: "catalogue"
  - name: "inward_value"
    label: "Inwards Value"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "outward_qty"
    label: "Outwards Quantity"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "3 dp"
    description: "Σ SALES_REG qty + consumption."
    origin: "catalogue"
  - name: "outward_value"
    label: "Outwards Value"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "closing_qty"
    label: "Closing Quantity"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "= opening + in − out"
    description: ""
    origin: "catalogue"
  - name: "closing_rate"
    label: "Closing Rate"
    source_path: "Row"
    data_type: "decimal"
    required: "no"
    validation: "4 dp"
    description: "Valuation method per AS 2."
    origin: "catalogue"
  - name: "closing_value"
    label: "Closing Value"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Match to TB inventory & STOCK_STMT_BANK."
    origin: "catalogue"
  - name: "physical_qty"
    label: "Physical verification quantity"
    source_path: "Verification"
    data_type: "decimal"
    required: "no"
    validation: "3 dp"
    description: "CARO 3(ii)(a) discrepancy %."
    origin: "catalogue"
