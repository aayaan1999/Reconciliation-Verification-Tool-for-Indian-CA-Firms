schema_version: "1.0"
document:
  code: "DEBTORS_AGEING"
  name: "Debtors (trade receivables) ageing – bill-wise"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law. Schedule III trade receivables ageing (Division I/II) – see FS-003/LED-011"
  new_form_no: ""
  frequency: "Quarterly / annual"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Tally Prime: Bills Receivable / Ageing Analysis (Alt+E > Others > Bills Receivable) > Export"
  due_date: ""
  tables_used: "Party × bill with ageing buckets; Schedule III classification (undisputed/disputed; considered good / significant increase in credit risk / credit impaired)"
  used_by_rules:
    - "RC-ACC-004"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "DPNC – Schedule III amendments w.e.f. 01-04-2021"
      url: "https://www.dpncindia.com/amendment-in-schedule-iii-of-the-companies-act-2013-applicable-w-e-f-01-04-2021"
      ref: "Ageing schedules (prior round)"
      official: false
fields:
  - name: "as_on_date"
    label: "As on date"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "party_name"
    label: "Party name"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "party_gstin"
    label: "GSTIN"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "party_pan"
    label: "PAN"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "bill_ref"
    label: "Bill ref / invoice no."
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Bill-wise (FIFO if on-account)."
    origin: "catalogue"
  - name: "bill_date"
    label: "Bill date"
    source_path: "Row"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "due_date"
    label: "Due on"
    source_path: "Row"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "overdue_days"
    label: "Overdue by days"
    source_path: "Row"
    data_type: "integer"
    required: "no"
    validation: ">=0"
    description: ""
    origin: "catalogue"
  - name: "pending_amount"
    label: "Pending amount"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "bucket_lt6m"
    label: "Less than 6 months"
    source_path: "Schedule III bucket"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Ageing from due date (or transaction date if no due date)."
    origin: "catalogue"
  - name: "bucket_6m_1y"
    label: "6 months – 1 year"
    source_path: "Schedule III bucket"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "bucket_1_2y"
    label: "1-2 years"
    source_path: "Schedule III bucket"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "bucket_2_3y"
    label: "2-3 years"
    source_path: "Schedule III bucket"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "disputed_flag"
    label: "Disputed"
    source_path: "Classification"
    data_type: "enum"
    required: "no"
    validation: "Y|N"
    description: ""
    origin: "catalogue"
  - name: "bucket_gt3y"
    label: "More than 3 years"
    source_path: "Schedule III bucket"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "credit_risk_class"
    label: "Considered good / significant increase in credit risk / credit impaired"
    source_path: "Classification"
    data_type: "enum"
    required: "no"
    validation: "GOOD|SICR|IMPAIRED"
    description: ""
    origin: "catalogue"
