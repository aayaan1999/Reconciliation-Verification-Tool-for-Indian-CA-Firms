schema_version: "1.0"
document:
  code: "ITR"
  name: "Income-tax Return (ITR-1 to ITR-7) – filed JSON / acknowledgement"
  issuer_system: "Income-tax e-Filing portal (offline utility / online); JSON schema published per AY"
  legal_basis: "IT Act 1961 s.139 read with Rule 12 (AY 2026-27); ITA 2025 s.263 read with corresponding IT Rules 2026 (tax year 2026-27 onwards; rule no. not verified)"
  new_form_no: "ITR forms renotified under IT Rules 2026 for tax year 2026-27 (numbers not verified)"
  frequency: "Annual"
  formats_available: "JSON (filed return / pre-filled JSON), PDF (ITR-V / acknowledgement), XML (older AYs)"
  how_obtained: "e-Filing portal > e-File > Income Tax Returns > View Filed Returns > Download JSON/PDF; pre-filled JSON from portal"
  due_date: "AY 2026-27: non-audit 31 Jul 2026 (as extended per prior round); audit cases 21 Nov 2026 (CBDT Circular 7/2026, prior round) – see ITR-001"
  tables_used: "Part A-General; Schedule S (salary); Schedule HP; Schedule BP (business/profession income, incl. 44AD/44ADA); Schedule CG; Schedule OS; Schedule CYLA/BFLA; Schedule VI-A; Schedule SI; Schedule EI; Part B-TI (total income); Part B-TTI (tax liability, interest 234A/B/C, fee 234F, taxes paid, refund/payable); Schedule IT (advance & self-assessment tax challans); Schedule TDS1 (salary – from Form 16); Schedule TDS2 (other than salary – Form 16A/16B/16C); Schedule TDS3 (Form 16B/16C/16D/16E as applicable); Schedule TCS; Schedule AL; Part A-BS / Part A-P&L (ITR-3/5/6); Schedule GST turnover; Schedule 112A/115AD"
  used_by_rules:
    - "RC-IT-002"
    - "RC-IT-003"
    - "RC-IT-004"
    - "RC-IT-005"
    - "RC-IT-006"
    - "RC-IT-007"
  verification_status: "partially_verified"
  notes: "Schedule names are the standard ITR structure; only the ITR-3 AY 2026-27 schema change document (v1.1, TDSSection enum change in TDS2/TDS3) was opened. JSON element paths are not given because the full schema was not opened – map from the published JSON schema of the relevant AY at implementation. Labels marked from professional knowledge need CA review. Tax-year 2026-27 ITR forms under IT Rules 2026 not verified."
  sources:
    - title: "e-Filing – ITR-3 schema change document AY 2026-27 v1.1"
      url: "https://www.incometax.gov.in/iec/foportal/sites/default/files/2026-07/ITR%203_Schema%20change%20document_AY2026-27_V1.1_0.pdf"
      ref: "ScheduleTDS2/TDS3 TDSSection enum updated 30-06-2026"
      official: true
    - title: "TaxHeal – Part B-TTI AY 2026-27"
      url: "https://www.taxheal.com/part-b-tti-computation-of-tax-liability-on-total-income-ay-2026-27.html"
      ref: ""
      official: false
    - title: "TaxHeal – Part B-TI AY 2026-27"
      url: "https://www.taxheal.com/part-b-ti-statement-of-income-for-the-period-ended-on-31st-march-ay-2026-27.html"
      ref: ""
      official: false
    - title: "CBDT Circular 7/2026"
      url: "https://incometaxindia.gov.in/documents/d/guest/circular-7-2026-pdf"
      ref: "Extended due dates AY 2026-27 (prior round)"
      official: true
    - title: "Income Tax Department – Rule 37BA"
      url: "https://www.incometaxindia.gov.in/w/rule-37ba"
      ref: "(prior round)"
      official: true
fields:
  - name: "pan"
    label: "PAN"
    source_path: "PartA_GEN1"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "assessment_year"
    label: "Assessment Year"
    source_path: "Form header"
    data_type: "string"
    required: "yes"
    validation: "yyyy (e.g. 2026)"
    description: ""
    origin: "catalogue"
  - name: "itr_form"
    label: "ITR form"
    source_path: "Form header"
    data_type: "enum"
    required: "yes"
    validation: "ITR-1|ITR-2|ITR-3|ITR-4|ITR-5|ITR-6|ITR-7|ITR-U"
    description: ""
    origin: "catalogue"
  - name: "filing_section"
    label: "Return filed under section"
    source_path: "PartA_GEN1.FilingStatus"
    data_type: "enum"
    required: "yes"
    validation: "139(1)|139(4)|139(5)|139(8A)|... (11/12/13/17/21 codes in schema)"
    description: ""
    origin: "catalogue"
  - name: "ack_no"
    label: "Acknowledgement number"
    source_path: "ITR-V"
    data_type: "string"
    required: "yes"
    validation: "15 digits"
    description: ""
    origin: "catalogue"
  - name: "filing_date"
    label: "Date of filing"
    source_path: "ITR-V"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: "Used for s.234A/234F."
    origin: "catalogue"
  - name: "regime_opted"
    label: "Opting out of new tax regime u/s 115BAC(6)"
    source_path: "PartA_GEN1"
    data_type: "enum"
    required: "yes"
    validation: "Y|N"
    description: ""
    origin: "catalogue"
  - name: "audit_flag"
    label: "Liable for audit u/s 44AB"
    source_path: "PartA_GEN2 / Audit info"
    data_type: "enum"
    required: "no"
    validation: "Y|N"
    description: ""
    origin: "catalogue"
  - name: "audit_report_date"
    label: "Date of furnishing audit report"
    source_path: "Audit info"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: "Match to F3CD ack date."
    origin: "catalogue"
  - name: "bp_net_profit_pl"
    label: "Profit before tax as per P&L"
    source_path: "Schedule BP item 1"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Match to FS."
    origin: "catalogue"
  - name: "bp_turnover_gross_receipts"
    label: "Gross turnover / receipts"
    source_path: "Schedule BP / Part A-P&L / 44AD block"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
