schema_version: "1.0"
document:
  code: "F16A"
  name: "Form 16A / Form 131 – TDS certificate other than salary"
  issuer_system: "TRACES (generated) issued by deductor"
  legal_basis: "IT Act 1961 s.203 read with Rule 31 (Form 16A); ITA 2025 s.395(4) read with Rule 215(1) Table Sl.2 (Form 131)"
  new_form_no: "Form 131 (TY 2026-27 onwards)"
  frequency: "Quarterly per deductee"
  formats_available: "PDF (TRACES-generated, digitally signed); bulk zip"
  how_obtained: "Deductor: TRACES > Downloads > Form 16A; deductee: received from deductor (client provides copies)"
  due_date: "Within 15 days from the due date of furnishing the quarterly statement (prior round TDS-040)"
  tables_used: "Header (deductor, deductee, period); Summary of payment (amount, nature, section, date); Summary of tax deducted and deposited (book adjustment / challan with BSR, date, CSN, status of matching)"
  used_by_rules:
    - "RC-TDS-009"
  verification_status: "partially_verified"
  notes: "Form 131 numbering from prior round (incometaxindia.gov.in Form 130/131 references; TaxGuru). Column labels are professional knowledge of TRACES Form 16A – not verified this session."
  sources:
    - title: "TDSMAN – Different matching statuses in Form 16/16A (2026)"
      url: "https://blog.tdsman.com/2026/02/different-matching-statuses-form-16-form-16a/"
      ref: "U/P/F/O"
      official: false
    - title: "Income Tax Department – Form 130 FAQs"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/form-130-faqs"
      ref: "s.395(4)(b); Rule 215(1); Part A/B/C; due 15 June"
      official: true
    - title: "TaxGuru – Form 131 TDS certificate"
      url: "https://taxguru.in/income-tax/income-tax-form-131-tds-certificate-u-s-395-4-non-salary-pension-senior-citizen-interest.html"
      ref: "(prior round)"
      official: false
fields:
  - name: "certificate_no"
    label: "Certificate No."
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "alphanumeric"
    description: ""
    origin: "catalogue"
  - name: "last_updated_on"
    label: "Last updated on"
    source_path: "Header"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "deductor_tan"
    label: "TAN of the Deductor"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{4}[0-9]{5}[A-Z]$"
    description: "Match key to 26AS/AIS and books party master."
    origin: "catalogue"
  - name: "deductor_pan"
    label: "PAN of the Deductor"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "deductee_pan"
    label: "PAN of the Deductee"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "financial_year"
    label: "Assessment Year / Tax Year"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: ""
    origin: "catalogue"
  - name: "period_from"
    label: "Period – From"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "period_to"
    label: "Period – To"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "quarter"
    label: "Quarter"
    source_path: "Summary of payment"
    data_type: "enum"
    required: "yes"
    validation: "Q1|Q2|Q3|Q4"
    description: ""
    origin: "catalogue"
  - name: "receipt_no"
    label: "Receipt Numbers of Original Quarterly Statements"
    source_path: "Summary"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "amount_paid_credited"
    label: "Amount paid/credited"
    source_path: "Summary of payment"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "nature_of_payment"
    label: "Nature of payment (section)"
    source_path: "Summary of payment"
    data_type: "string"
    required: "yes"
    validation: "section code"
    description: ""
    origin: "catalogue"
  - name: "date_paid_credited"
    label: "Date of payment/credit"
    source_path: "Summary of payment"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "tax_deducted"
    label: "Amount of tax deducted"
    source_path: "Summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tax_deposited"
    label: "Amount of tax deposited/remitted"
    source_path: "Summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "challan_bsr"
    label: "BSR Code of the Bank Branch"
    source_path: "Challan details"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{7}$"
    description: ""
    origin: "catalogue"
  - name: "challan_date"
    label: "Date on which tax deposited"
    source_path: "Challan details"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: ""
    origin: "catalogue"
  - name: "challan_serial"
    label: "Challan Serial Number"
    source_path: "Challan details"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{1,5}$ (left-pad to 5 for matching)"
    description: ""
    origin: "catalogue"
  - name: "status_of_matching"
    label: "Status of matching with OLTAS"
    source_path: "Challan details"
    data_type: "enum"
    required: "no"
    validation: "U|P|F|O"
    description: ""
    origin: "catalogue"
  - name: "issue_date"
    label: ""
    source_path: ""
    data_type: "date"
    required: ""
    validation: ""
    description: "Date the certificate was issued/sent to the deductee, from the tool's/deductor's dispatch log. Proxy: last_updated_on (TRACES generation date)."
    origin: "new (design)"
