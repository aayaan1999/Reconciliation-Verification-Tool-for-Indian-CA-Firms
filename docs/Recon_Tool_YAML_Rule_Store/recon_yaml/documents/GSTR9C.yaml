schema_version: "1.0"
document:
  code: "GSTR9C"
  name: "FORM GSTR-9C – Reconciliation statement (self-certified)"
  issuer_system: "GST portal"
  legal_basis: "s.44 CGST Act (as amended by Finance Act 2021, self-certification); Rule 80(3) CGST Rules; Notification 30/2021-CT (self-certified 9C, AATO > Rs 5 crore)"
  new_form_no: ""
  frequency: "annual"
  formats_available: "Offline tool JSON upload; PDF"
  how_obtained: "GST portal > Annual Return > FY > GSTR-9C (offline tool) > Download filed PDF"
  due_date: "31 December following the FY (with GSTR-9)"
  tables_used: "Part II: 5A-5R, 6, 7A-7G, 8; Part III: 9A-9R, 10, 11; Part IV: 12A-12F, 13, 14A-14T, 15, 16; Part V (additional liability)"
  used_by_rules: []
  verification_status: "verified_secondary"
  notes: "Labels from a reproduction of the 9C form (pre-2021 version with auditor Part B; Part A tables unchanged structurally). Since FY 2020-21 the form is self-certified and Table 14 (expense-wise ITC) became optional per Notification 30/2021-CT (from memory – verify). Offline tool JSON keys NOT verified. Rate rows in Table 9 reflect pre-GST-2.0 rates; FY 2025-26 involves 5%/18%/40% from 22.09.2025 – check portal tool."
  sources:
    - title: "Form GSTR-9C (reproduction)"
      url: "https://www.gstgyaan.com/pdf/form-gstr-9c.pdf"
      ref: ""
      official: false
    - title: "FAQs on GSTR-9 & 9C changes FY 2024-25 (GSTZen)"
      url: "https://gstzen.in/a/faqs-on-gstr-9-9c-changes-fy-2024-25.html"
      ref: ""
      official: false
    - title: "GSTR-9C reconciliation statement (ClearTax)"
      url: "https://cleartax.in/s/gst-reconciliation-statement-gstr-9c"
      ref: ""
      official: false
