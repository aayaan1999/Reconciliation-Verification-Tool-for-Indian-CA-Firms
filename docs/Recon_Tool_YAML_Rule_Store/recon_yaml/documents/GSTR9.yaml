schema_version: "1.0"
document:
  code: "GSTR9"
  name: "FORM GSTR-9 – Annual return (regular taxpayer)"
  issuer_system: "GST portal"
  legal_basis: "s.44 CGST Act; Rule 80 CGST Rules; Notification 15/2025-CT (exemption AATO up to Rs 2 crore, FY 2024-25 onwards); CGST (Third Amendment) Rules 2025 – Notification 13/2025-CT dt 17.09.2025 (form changes; per secondary source)"
  new_form_no: ""
  frequency: "annual"
  formats_available: "Online; JSON (offline tool); Excel (offline tool); PDF (system computed summary, draft, filed); 8A invoice-wise Excel; Table 12 HSN download"
  how_obtained: "GST portal > Annual Return > FY > GSTR-9 > Download (system-computed PDF / 8A Excel / filed PDF)"
  due_date: "31 December following the FY"
  tables_used: "Part II: 4A-4N, 5A-5N; Part III: 6A-6O (6A1, 6A2 from FY 2024-25), 7A-7J (7A1, 7A2), 8A-8K (8H1); Part IV: 9; Part V: 10-14; Part VI: 15-19"
  used_by_rules:
    - "RC-GST-023"
    - "RC-GST-024"
    - "RC-GST-025"
    - "RC-GST-026"
    - "RC-GST-027"
    - "RC-GST-032"
  verification_status: "partially_verified"
  notes: "Row labels verified against a reproduction of the original form (gstgyaan) and GSTN user manual tiles (tutorial.gst.gov.in). New FY 2024-25 rows (6A1, 6A2, 7A1, 7A2, 8H1) and the new Table 9/14 columns are confirmed by the GSTN manual to exist, but their exact labels are from secondary sources. 4G1/5C1 exist from FY 2023-24 per manual; labels unverified. Offline-tool JSON key names NOT verified – use table codes as field keys."
  sources:
    - title: "Manual > GSTR-9 (GST portal user guide)"
      url: "https://tutorial.gst.gov.in/userguide/returns/Manual_gstr9.htm"
      ref: ""
      official: true
    - title: "Form GSTR-9 (reproduction)"
      url: "https://www.gstgyaan.com/pdf/form-gstr-9.pdf"
      ref: ""
      official: false
    - title: "FAQs on GSTR-9 & 9C changes FY 2024-25 (GSTZen)"
      url: "https://gstzen.in/a/faqs-on-gstr-9-9c-changes-fy-2024-25.html"
      ref: ""
      official: false
    - title: "GSTR-9 FY 2024-25 changes (TaxGuru)"
      url: "https://taxguru.in/?p=1004189"
      ref: "N.13/2025-CT dt 17.09.2025"
      official: false
    - title: "Notification No. 15/2025-Central Tax (TaxHeal)"
      url: "https://www.taxheal.com/?p=105269"
      ref: ""
      official: false
