  - name: "eps_wages"
    label: "EPS wages"
    source_path: "Wage base"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "edli_wages"
