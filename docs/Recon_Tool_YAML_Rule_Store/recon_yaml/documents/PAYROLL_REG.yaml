  - name: "tds_salary"
    label: "Income-tax (TDS u/s 192 / s.392)"
    source_path: "Deductions"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Σ quarter = 24Q DD."
    origin: "catalogue"
  - name: "other_deductions"
    label: "Other deductions (loans/advances)"
    source_path: "Deductions"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "net_pay"
    label: "Net pay"
    source_path: "Pay"
    data_type: "decimal"
    required: "yes"
    validation: "= gross − deductions"
    description: "Match to BANK_STMT salary payout."
    origin: "catalogue"
  - name: "er_eps"
    label: "Employer EPS (8.33%)"
    source_path: "Employer"
    data_type: "decimal"
    required: "no"
