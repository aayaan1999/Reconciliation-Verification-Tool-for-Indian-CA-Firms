schema_version: "1.0"
document:
  code: "PAYROLL_REG"
  name: "Payroll register / salary sheet (monthly, employee-wise)"
  issuer_system: "Client payroll software (Tally Payroll, greytHR, Zoho, Keka, ERP) – export"
  legal_basis: "Implementation design, not law. Registers of wages required under Code on Wages 2019 / state rules (form not specified here)"
  new_form_no: ""
  frequency: "Monthly"
  formats_available: "Excel / CSV / JSON export"
  how_obtained: "Client exports monthly salary register (all earnings and deductions columns) from payroll software"
  due_date: ""
  tables_used: "Employee identity; attendance; earnings heads; statutory wage bases; deductions (PF, ESI, PT, LWF, TDS); employer contributions; net pay"
  used_by_rules:
    - "RC-PAY-001"
    - "RC-PAY-003"
    - "RC-PAY-004"
    - "RC-PAY-005"
    - "RC-PAY-006"
    - "RC-PAY-007"
    - "RC-PAY-008"
    - "RC-TDS-010"
    - "RC-TDS-011"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Field naming convention internal to the tool; map client columns at import."
  sources:
    - title: "EPFO – Contribution rates"
      url: "https://www.epfindia.gov.in:443/site_docs/PDFs/MiscPDFs/ContributionRate.pdf"
      ref: "Account heads (from prior round)"
      official: true
    - title: "ESIC – Contribution"
      url: "https://web.esic.gov.in/web/esic/contribution"
      ref: "Rates, due date (prior round)"
      official: true
fields:
  - name: "wage_month"
    label: "Wage month"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "yyyy-mm"
    description: ""
    origin: "catalogue"
  - name: "employee_id"
    label: "Employee code"
    source_path: "Employee"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "employee_name"
    label: "Employee name"
    source_path: "Employee"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "pan"
    label: "PAN"
    source_path: "Employee"
    data_type: "string"
    required: "no"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "Key to 24Q/F16."
    origin: "catalogue"
  - name: "uan"
    label: "UAN"
    source_path: "Employee"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{12}$"
    description: "Key to ECR."
    origin: "catalogue"
  - name: "esic_ip_no"
    label: "ESIC IP number"
    source_path: "Employee"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{10}$"
    description: "Key to ESIC_RET."
    origin: "catalogue"
  - name: "date_of_joining"
    label: "Date of joining"
    source_path: "Employee"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "date_of_exit"
    label: "Date of leaving"
    source_path: "Employee"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "state_of_work"
    label: "Work location state"
    source_path: "Employee"
    data_type: "string"
    required: "yes"
    validation: "state code"
    description: "Drives PT/LWF."
    origin: "catalogue"
  - name: "days_in_month"
    label: "Days in month"
    source_path: "Attendance"
    data_type: "integer"
    required: "yes"
    validation: "28-31"
    description: ""
    origin: "catalogue"
  - name: "paid_days"
    label: "Paid days"
    source_path: "Attendance"
    data_type: "decimal"
    required: "yes"
    validation: "0..days_in_month"
    description: ""
    origin: "catalogue"
  - name: "lop_days"
    label: "Loss of pay days (NCP)"
    source_path: "Attendance"
    data_type: "decimal"
    required: "no"
    validation: ">=0"
    description: "ECR NCP days."
    origin: "catalogue"
  - name: "basic"
    label: "Basic"
    source_path: "Earnings"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "da"
    label: "Dearness allowance"
    source_path: "Earnings"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "retaining_allowance"
    label: "Retaining allowance"
    source_path: "Earnings"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "hra"
    label: "HRA"
    source_path: "Earnings"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "other_allowances"
    label: "Other allowances (itemised)"
    source_path: "Earnings"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "overtime"
    label: "Overtime"
    source_path: "Earnings"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "bonus_incentive"
    label: "Bonus / incentive"
    source_path: "Earnings"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "arrears"
    label: "Arrears"
    source_path: "Earnings"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "ECR arrear fields."
    origin: "catalogue"
  - name: "gross_earnings"
    label: "Gross earnings"
    source_path: "Earnings"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "= ECR gross wages."
    origin: "catalogue"
  - name: "statutory_wages"
