    source_path: "Pay"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "tax_regime"
    label: ""
    source_path: ""
    data_type: "enum OLD|NEW"
    required: ""
    validation: ""
    description: "Income-tax regime opted by the employee for the FY (employee declaration in payroll); not in catalogue."
    origin: "new (design)"
  - name: "pt_registration_no"
    label: ""
    source_path: ""
    data_type: "string"
    required: ""
    validation: ""
    description: "Employer's professional-tax registration number for state_of_work, from the entity configuration (one per state); payroll rows do not carry it."
    origin: "new (design)"
  - name: "pay_month"
    label: ""
    source_path: ""
    data_type: "string 'yyyy-mm'"
    required: "no"
    validation: ""
    description: "DERIVED: calendar month of payment_date, format 'yyyy-mm'; fallback wage_month when payment_date blank."
    origin: "derived"
  - name: "annual_gross"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ gross_earnings over wage_month in the FY for the employee (pan)."
    origin: "derived"
