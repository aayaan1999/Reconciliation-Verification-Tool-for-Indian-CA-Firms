    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "ee_pf"
    label: "Employee PF contribution"
    source_path: "Deductions"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "ee_vpf"
    label: "Voluntary PF"
    source_path: "Deductions"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
