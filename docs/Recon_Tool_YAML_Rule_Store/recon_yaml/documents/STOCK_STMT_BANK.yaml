schema_version: "1.0"
document:
  code: "STOCK_STMT_BANK"
  name: "Quarterly/monthly stock & book-debt statement submitted to bank (drawing power statement)"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law. Bank sanction terms; CARO 2020 cl.3(ii)(b) and Schedule III additional disclosure (quarterly returns vs books) – see FS-007"
  new_form_no: ""
  frequency: "Monthly / quarterly per sanction"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Client copy of statement submitted to bank (Excel/PDF)"
  due_date: ""
  tables_used: "Inventory by category, receivables (ageing-wise eligible), creditors, drawing power"
  used_by_rules:
    - "RC-ACC-007"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "TaxGuru – CARO 2020 & Schedule III summary"
      url: "https://taxguru.in/company-law/summary-clauses-caro-2020-consequential-amendments-schedule-iii-companies-act-2013.html"
      ref: "Quarterly returns to banks vs books (prior round)"
      official: false
    - title: "DPNC – Schedule III amendments w.e.f. 01-04-2021"
      url: "https://www.dpncindia.com/amendment-in-schedule-iii-of-the-companies-act-2013-applicable-w-e-f-01-04-2021"
      ref: "Ageing schedules (prior round)"
      official: false
fields:
  - name: "bank_name"
    label: "Bank"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "facility"
    label: "Facility / sanctioned limit"
    source_path: "Header"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "statement_date"
    label: "As on date"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: "Quarter-end for CARO."
    origin: "catalogue"
  - name: "submission_date"
    label: "Date of submission"
    source_path: "Header"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "inventory_rm"
    label: "Raw materials"
    source_path: "Inventory"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "inventory_wip"
    label: "Work-in-progress"
    source_path: "Inventory"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "inventory_fg"
    label: "Finished goods / stock-in-trade"
    source_path: "Inventory"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "inventory_total"
    label: "Total inventory"
    source_path: "Inventory"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Compare STOCK_REG/TB."
    origin: "catalogue"
  - name: "debtors_total"
    label: "Book debts (total)"
    source_path: "Receivables"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Compare DEBTORS_AGEING."
    origin: "catalogue"
  - name: "debtors_eligible"
    label: "Eligible debtors (< N days)"
    source_path: "Receivables"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "creditors_total"
    label: "Sundry creditors"
    source_path: "Payables"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Compare CREDITORS_AGEING."
    origin: "catalogue"
  - name: "margin_pct"
    label: "Margin %"
    source_path: "DP"
    data_type: "decimal"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "drawing_power"
    label: "Drawing power"
    source_path: "DP"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "outstanding_balance"
    label: "Outstanding in CC account"
    source_path: "DP"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Compare BANK_STMT."
    origin: "catalogue"
  - name: "inventory_class"
    label: ""
    source_path: ""
    data_type: "enum RM|WIP|FG"
    required: "no"
    validation: ""
    description: "DERIVED: Unpivot of inventory_rm / inventory_wip / inventory_fg columns."
    origin: "derived"
  - name: "inventory_value"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: inventory_<class> for the unpivoted class; inventory_total when compared in aggregate."
    origin: "derived"
