schema_version: "1.0"
document:
  code: "ESIC_CHALLAN"
  name: "ESIC contribution challan / payment receipt"
  issuer_system: "ESIC employer portal (challan generated after MC filing; paid via authorised bank / SBI e-pay)"
  legal_basis: "ESI Act 1948 s.39-40; ESI (General) Regulations (payment of contributions); Code on Social Security 2020"
  new_form_no: ""
  frequency: "Monthly"
  formats_available: "PDF challan / e-receipt"
  how_obtained: "ESIC portal > Generate Challan > Print challan / receipt (client provides PDF)"
  due_date: "15th of following month"
  tables_used: "Challan header; contribution amount; payment details"
  used_by_rules:
    - "RC-PAY-003"
    - "RC-PAY-006"
  verification_status: "unverified"
  notes: "Field labels are implementation choices based on common ESIC e-challan printouts – not verified on an official page this session."
  sources:
    - title: "ESIC – Contribution"
      url: "https://web.esic.gov.in/web/esic/contribution"
      ref: "Rates, due date (prior round)"
      official: true
fields:
  - name: "employer_code"
    label: "Employer Code"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "contribution_period"
    label: "Contribution period / month"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "yyyy-mm"
    description: ""
    origin: "catalogue"
  - name: "challan_no"
    label: "Challan Number / Transaction No."
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Key."
    origin: "catalogue"
  - name: "challan_created_date"
    label: "Challan created date"
    source_path: "Header"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "amount"
    label: "Amount paid"
    source_path: "Amount"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "= ESIC_RET.total_contribution (+ interest/damages if any)."
    origin: "catalogue"
  - name: "payment_date"
    label: "Challan submitted / paid date"
    source_path: "Payment"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: "Due-date test, s.36(1)(va)."
    origin: "catalogue"
  - name: "bank_reference_no"
    label: "Bank transaction / reference no."
    source_path: "Payment"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Match to BANK_STMT."
    origin: "catalogue"
  - name: "payment_mode"
    label: "Mode of payment"
    source_path: "Payment"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
