schema_version: "1.0"
document:
  code: "FAR"
  name: "Fixed asset register"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law. Supports Companies Act Sch. II depreciation, IT Act s.32 / block WDV (AUD-004), CARO 3(i), Form 3CD cl.18"
  new_form_no: ""
  frequency: "Annual / quarterly"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Client FAR (Excel/ERP module); Tally fixed asset ledgers export"
  due_date: ""
  tables_used: "Asset-wise: identity, acquisition, depreciation (book & tax), disposals"
  used_by_rules:
    - "RC-ACC-006"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "TaxGuru – CARO 2020 & Schedule III summary"
      url: "https://taxguru.in/company-law/summary-clauses-caro-2020-consequential-amendments-schedule-iii-companies-act-2013.html"
      ref: "Quarterly returns to banks vs books (prior round)"
      official: false
fields:
  - name: "asset_id"
    label: "Asset ID / tag"
    source_path: "Asset"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "asset_description"
    label: "Description"
    source_path: "Asset"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "asset_class"
    label: "Asset class (Schedule III PPE / intangible)"
    source_path: "Asset"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "it_block"
    label: "Income-tax block / rate"
    source_path: "Tax"
    data_type: "string"
    required: "yes"
    validation: "e.g. P&M 15%"
    description: ""
    origin: "catalogue"
  - name: "location"
    label: "Location"
    source_path: "Asset"
    data_type: "string"
    required: "no"
    validation: ""
    description: "CARO physical verification."
    origin: "catalogue"
  - name: "supplier_name"
    label: "Supplier"
    source_path: "Acquisition"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "supplier_gstin"
    label: "Supplier GSTIN"
    source_path: "Acquisition"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: "Link to PURCH_REG (capital goods ITC)."
    origin: "catalogue"
  - name: "invoice_no"
    label: "Purchase invoice no."
    source_path: "Acquisition"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "purchase_date"
    label: "Date of acquisition"
    source_path: "Acquisition"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "put_to_use_date"
    label: "Date put to use"
    source_path: "Acquisition"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: "180-day half-rate rule (tax)."
    origin: "catalogue"
  - name: "cost"
    label: "Original cost (excl. ITC claimed)"
    source_path: "Acquisition"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "itc_claimed"
    label: "GST ITC claimed"
    source_path: "Acquisition"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "useful_life_years"
    label: "Useful life (Sch. II)"
    source_path: "Book"
    data_type: "decimal"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "residual_value"
    label: "Residual value"
    source_path: "Book"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "dep_method"
    label: "Depreciation method"
    source_path: "Book"
    data_type: "enum"
    required: "no"
    validation: "SLM|WDV"
    description: ""
    origin: "catalogue"
  - name: "opening_wdv_book"
    label: "Opening WDV (book)"
    source_path: "Book"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "depreciation_book"
    label: "Depreciation for the year (book)"
    source_path: "Book"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Match to GL/TB."
    origin: "catalogue"
  - name: "closing_wdv_book"
    label: "Closing WDV (book)"
    source_path: "Book"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "disposal_date"
    label: "Date of sale/discard"
    source_path: "Disposal"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "sale_value"
    label: "Sale consideration"
    source_path: "Disposal"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "title_deed_holder"
    label: "Title deeds in name of (immovable)"
    source_path: "CARO"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Schedule III / CARO 3(i)(c)."
    origin: "catalogue"
  - name: "gross_block_closing"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ cost where disposal_date is blank or after FY end, per asset_class."
    origin: "derived"
  - name: "accum_dep_closing"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ (cost - closing_wdv_book) for assets held at FY end, per asset_class."
    origin: "derived"
  - name: "additions"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ cost where purchase_date within the FY, per asset_class."
    origin: "derived"
  - name: "disposals"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ cost where disposal_date within the FY, per asset_class (gross cost removed)."
    origin: "derived"
