schema_version: "1.0"
document:
  code: "TDS_CHALLAN"
  name: "TDS/TCS payment challan (ITNS 281 / e-Pay Tax challan receipt; CIN)"
  issuer_system: "e-Filing portal e-Pay Tax (authorised bank / payment gateway); OLTAS / TIN; challan status on TIN & TRACES"
  legal_basis: "IT Act 1961 s.200(1)/s.206C(3) read with Rule 30 / Rule 37CA (deposit); ITA 2025 s.397 read with Rule 218 (IT Rules 2026). Book-adjustment: Form 24G → Form 137"
  new_form_no: "Challan ITNS 281 via e-Pay Tax continues (no renumbered challan identified); Form 137 replaces 24G for book adjustment"
  frequency: "Monthly (per deposit); ad hoc for demand (minor head 400)"
  formats_available: "PDF challan receipt (e-Pay Tax); CSV/Excel from TIN challan status enquiry / TRACES challan status; client software export"
  how_obtained: "e-Filing portal > e-File > e-Pay Tax > Payment History (download challan receipt); TIN-NSDL/Protean Challan Status Enquiry by TAN + period; TRACES > Challan Status"
  due_date: "7th of next month; March deductions by 30 April (government: same day for book entry) – Rule 30 / Rule 218"
  tables_used: "Challan header (TAN, name, AY/tax year, major head, minor head, nature of payment); Amount break-up (tax, surcharge, cess, interest, penalty, fee 234E/427, others); Bank details (BSR, date, CSN, CIN, bank reference)"
  used_by_rules:
    - "RC-TDS-003"
    - "RC-TDS-004"
    - "RC-TDS-007"
    - "RC-TDS-008"
    - "RC-TDS-012"
  verification_status: "partially_verified"
  notes: "Minor heads 200/400 and major heads 0020/0021 from ClearTax (secondary); CIN composition (BSR + tender date + CSN) from Protean Dos & Don'ts (official). Under e-Pay Tax the ITNS 281 paper form is no longer used, but the same data elements appear on the challan receipt. Challan 'nature of payment' codes are not reproduced here – load master."
  sources:
    - title: "Protean – Dos and Don'ts for deductors/collectors"
      url: "https://tinpan.proteantech.in/downloads/e-tds/download/DosandDontsdeductorscollectors.pdf"
      ref: "CIN = BSR(7)+date+challan serial(5); challan matching"
      official: false
    - title: "ClearTax – TDS Challan ITNS 281"
      url: "https://cleartax.in/s/tds-challan-itns-281"
      ref: "Minor head 200/400; major head 0020/0021"
      official: false
    - title: "Income Tax Department – Rule 218"
      url: "https://www.incometaxindia.gov.in/w/rule-218-1"
      ref: "Deposit due dates"
      official: true
    - title: "Income Tax Department – Form No. 137 note"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/fn-137"
      ref: "Book adjustment statement (ex-24G), Rule 218"
      official: true
    - title: "TDSMAN – Key features RPU/FVU 1.2 (Forms 138/140/143/144)"
      url: "https://blog.tdsman.com/downloads/key_features_fvu_1_2.pdf"
      ref: "Interest/Others allocation, date validation, column changes"
      official: false
fields:
  - name: "tan"
    label: "TAN"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{4}[0-9]{5}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "deductor_name"
    label: "Name"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "assessment_year"
    label: "Assessment Year / Tax Year"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: ""
    origin: "catalogue"
  - name: "major_head"
    label: "Major Head"
    source_path: "Header"
    data_type: "enum"
    required: "yes"
    validation: "0020 (Company deductees) | 0021 (Non-company deductees)"
    description: "Must align with deductee code in statement."
    origin: "catalogue"
  - name: "minor_head"
    label: "Minor Head / Type of Payment"
    source_path: "Header"
    data_type: "enum"
    required: "yes"
    validation: "200 (TDS/TCS payable by taxpayer) | 400 (TDS/TCS regular assessment – demand)"
    description: "400 challans must not be consumed in regular statements."
    origin: "catalogue"
  - name: "nature_of_payment"
    label: "Nature of Payment (section code)"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "section code e.g. 92B, 94C, 94J (challan codes – load master)"
    description: "Used to cross-check with statement section."
    origin: "catalogue"
  - name: "amount_tax"
    label: "Tax"
    source_path: "Amount"
    data_type: "decimal"
    required: "yes"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_surcharge"
    label: "Surcharge"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_cess"
    label: "Cess"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_interest"
    label: "Interest"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: "s.201(1A)/s.398(3) interest paid."
    origin: "catalogue"
  - name: "amount_penalty"
    label: "Penalty"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_fee"
    label: "Fee under section 234E (s.427)"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_others"
    label: "Others"
    source_path: "Amount"
    data_type: "decimal"
    required: "no"
    validation: "integer INR (whole rupees)"
    description: ""
    origin: "catalogue"
  - name: "amount_total"
    label: "Total"
    source_path: "Amount"
    data_type: "decimal"
    required: "yes"
    validation: "= sum of heads"
    description: ""
    origin: "catalogue"
  - name: "bsr_code"
    label: "BSR Code"
    source_path: "Bank"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{7}$"
    description: "CIN part 1."
    origin: "catalogue"
  - name: "date_of_deposit"
    label: "Date of Deposit / Tender date"
    source_path: "Bank"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy (normalise to ISO yyyy-mm-dd on load)"
    description: "CIN part 2; compared with due date."
    origin: "catalogue"
  - name: "challan_serial_no"
    label: "Challan Serial Number"
    source_path: "Bank"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{1,5}$ (left-pad to 5 for matching)"
    description: "CIN part 3."
    origin: "catalogue"
  - name: "cin"
    label: "Challan Identification Number (CIN)"
    source_path: "Bank"
    data_type: "string"
    required: "yes"
    validation: "BSR(7) + ddmmyyyy(8) + CSN(5) = 20 chars (implementation composition)"
    description: "Primary key across challan, statement CD and TDS_LEDGER."
    origin: "catalogue"
  - name: "bank_reference_no"
    label: "Bank Reference Number"
    source_path: "Bank"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Link to BANK_STMT debit."
    origin: "catalogue"
  - name: "bank_name"
    label: "Name of Bank"
    source_path: "Bank"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "payment_mode"
    label: "Mode of payment"
    source_path: "Bank"
    data_type: "enum"
    required: "no"
    validation: "Net banking|Debit card|NEFT/RTGS|Over the counter|Payment gateway"
    description: ""
    origin: "catalogue"
  - name: "challan_status_oltas"
    label: "Challan status / Unconsumed balance (TRACES)"
    source_path: "TRACES challan status"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Unconsumed amount after statement consumption."
    origin: "catalogue"
