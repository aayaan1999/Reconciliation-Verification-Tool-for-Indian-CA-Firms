schema_version: "1.0"
document:
  code: "ECR"
  name: "Electronic Challan-cum-Return (EPFO ECR text file / ECR 2.0)"
  issuer_system: "EPFO Unified Portal (employer) – ECR upload; revamped ECR from wage month Sep 2025 (return and payment segregated)"
  legal_basis: "EPF Scheme 1952 paras 36/38 (monthly return/remittance) / EPF Scheme 2026 under Code on Social Security 2020 (per prior round PAY-008/010); EPF Act 1952 s.6"
  new_form_no: ""
  frequency: "Monthly (per wage month)"
  formats_available: "Text file (.txt), fields separated by '#~#', one member per line; portal-generated ECR statement PDF/Excel after upload"
  how_obtained: "Prepared by payroll software; uploaded at unifiedportal-emp.epfindia.gov.in > Payments > ECR Upload; client provides uploaded .txt and ECR statement"
  due_date: "15th of the following month (prior round PAY-008)"
  tables_used: "ECR 2.0 (UAN-based) 11 fields per member line; legacy ECR (member-ID based) 25 fields incl. arrears, new-joiner and exit fields"
  used_by_rules:
    - "RC-PAY-001"
    - "RC-PAY-002"
    - "RC-PAY-007"
  verification_status: "partially_verified"
  notes: "ECR 2.0 field order and validations from EPFO 'Introduction to ECR 2.0' (official); '#~#' separator and legacy 25-field structure from EPFO ECR File Structure (official; legacy member-ID format – separator assumed to continue for ECR 2.0, consistent with EPFO revamped-ECR page stating 'no change in the existing format of the ECR'). Wage ceiling change to Rs 25,000 from 17-09-2026 is from prior payroll round (secondary). ECR due date and revamped-ECR return/payment segregation: EPFO page."
  sources:
    - title: "EPFO – Introduction to ECR 2.0"
      url: "https://www.epfindia.gov.in:443/site_docs/PDFs/EPFOUnifiedPortal/Introduction_ECR2.0.pdf"
      ref: "11-field UAN-based ECR validations"
      official: true
    - title: "EPFO – ECR for Employers File Structure"
      url: "https://epfindia.gov.in/site_docs/PDFs/OnlineECR_PDFs/ECR_ForEmployers_FileStructure.pdf"
      ref: "Legacy 25-field ECR (#~# separator)"
      official: true
    - title: "EPFO – Revamped ECR"
      url: "https://www.epfindia.gov.in/site_en/revamped_ecr.php"
      ref: "From wage month Sep 2025; no change in ECR format; return and payment segregated"
      official: true
fields:
  - name: "uan"
    label: "UAN"
    source_path: "ECR 2.0 field 1"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{12}$; must be linked to establishment; DOJ <= wage month, DOE >= wage month"
    description: "Primary key to PAYROLL_REG."
    origin: "catalogue"
  - name: "member_name"
    label: "Member Name"
    source_path: "ECR 2.0 field 2"
    data_type: "string"
    required: "yes"
    validation: "display only; legacy: max 85 chars, only '.' special char"
    description: "Credit goes to UAN regardless of name."
    origin: "catalogue"
  - name: "gross_wages"
    label: "Gross Wages"
    source_path: "ECR 2.0 field 3"
    data_type: "integer"
    required: "yes"
    validation: "whole rupees"
    description: "Total emoluments for month."
    origin: "catalogue"
  - name: "epf_wages"
    label: "EPF Wages"
    source_path: "ECR 2.0 field 4"
    data_type: "integer"
    required: "yes"
    validation: "whole rupees; <= gross_wages; 0 only if no wages earned"
    description: ""
    origin: "catalogue"
  - name: "eps_wages"
    label: "EPS Wages"
    source_path: "ECR 2.0 field 5"
    data_type: "integer"
    required: "yes"
    validation: "whole rupees; <= epf_wages; capped at wage ceiling (15,000; 25,000 from 17-09-2026 per prior round PAY-005); 0 for non-EPS members / age > 58"
    description: ""
    origin: "catalogue"
  - name: "edli_wages"
    label: "EDLI Wages"
    source_path: "ECR 2.0 field 6"
    data_type: "integer"
    required: "yes"
    validation: "whole rupees; max = wage ceiling; generally = epf_wages up to ceiling"
    description: ""
    origin: "catalogue"
  - name: "ee_share_remitted"
    label: "EPF Contribution (EE Share) remitted"
    source_path: "ECR 2.0 field 7"
    data_type: "integer"
    required: "yes"
    validation: "whole rupees; <= gross_wages"
    description: "Compare with PAYROLL_REG.ee_pf."
    origin: "catalogue"
  - name: "eps_contribution_remitted"
    label: "EPS Contribution remitted"
    source_path: "ECR 2.0 field 8"
    data_type: "integer"
    required: "yes"
    validation: "whole rupees; <= round(8.33% × eps_wages) (+1.16% of wages above ceiling where higher pension)"
    description: "→ challan A/c 10."
    origin: "catalogue"
  - name: "er_share_remitted"
    label: "EPF-EPS Difference (ER Share) remitted"
    source_path: "ECR 2.0 field 9"
    data_type: "integer"
    required: "yes"
    validation: "whole rupees"
    description: "→ challan A/c 1 employer part."
    origin: "catalogue"
  - name: "ncp_days"
    label: "NCP Days"
    source_path: "ECR 2.0 field 10"
    data_type: "integer"
    required: "yes"
    validation: "0..31, full days only; = days in month if wages zero"
    description: "Compare with PAYROLL_REG.lop_days."
    origin: "catalogue"
  - name: "refund_of_advances"
    label: "Refund of Advances"
    source_path: "ECR 2.0 field 11"
    data_type: "integer"
    required: "no"
    validation: "whole rupees"
    description: ""
    origin: "catalogue"
  - name: "legacy_member_id"
    label: "Member ID Number"
    source_path: "Legacy ECR field 1"
    data_type: "integer"
    required: "no"
    validation: "7 digits"
    description: "Legacy only."
    origin: "catalogue"
  - name: "ee_share_due"
    label: "EPF Contribution (EE Share) due"
    source_path: "Legacy ECR field 5"
    data_type: "integer"
    required: "no"
    validation: ">= remitted"
    description: "Due vs remitted gap = arrear/short remittance."
    origin: "catalogue"
  - name: "eps_due"
    label: "EPS Contribution due"
    source_path: "Legacy ECR field 7"
    data_type: "integer"
    required: "no"
    validation: ">= remitted"
    description: ""
    origin: "catalogue"
  - name: "er_share_due"
    label: "Diff EPF and EPS Contribution (ER Share) due"
    source_path: "Legacy ECR field 9"
    data_type: "integer"
    required: "no"
    validation: ">= remitted"
    description: ""
    origin: "catalogue"
  - name: "arrear_epf_wages"
    label: "Arrear EPF Wages"
    source_path: "Legacy ECR field 13"
    data_type: "integer"
    required: "no"
    validation: "whole rupees"
    description: ""
    origin: "catalogue"
  - name: "arrear_epf_ee"
    label: "Arrear EPF EE Share"
    source_path: "Legacy ECR field 14"
    data_type: "integer"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "arrear_epf_er"
    label: "Arrear EPF ER Share"
    source_path: "Legacy ECR field 15"
    data_type: "integer"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "arrear_eps"
    label: "Arrear EPS Share"
    source_path: "Legacy ECR field 16"
    data_type: "integer"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "date_of_joining_epf"
    label: "Date of Joining EPF"
    source_path: "Legacy ECR field 21"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy; <= ECR month"
    description: "New members only."
    origin: "catalogue"
  - name: "date_of_exit_epf"
    label: "Date of Exit from EPF"
    source_path: "Legacy ECR field 23"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy; >= joining"
    description: ""
    origin: "catalogue"
  - name: "reason_for_leaving"
    label: "Reason for Leaving"
    source_path: "Legacy ECR field 25"
    data_type: "enum"
    required: ""
    validation: "C (cessation) | S (superannuation) | R (retirement) | D (death in service) | P (permanent disablement); mandatory if exit date given"
    description: ""
    origin: "catalogue"
  - name: "wage_month"
    label: "Wage month"
    source_path: "Upload metadata"
    data_type: "string"
    required: "yes"
    validation: "yyyy-mm"
    description: "Not in file line; captured at upload."
    origin: "catalogue"
  - name: "establishment_id"
    label: "Establishment ID"
    source_path: "Upload metadata"
    data_type: "string"
    required: "yes"
    validation: "e.g. 15-char code (state+office+est no+ext)"
    description: ""
    origin: "catalogue"
  - name: "trrn"
    label: "TRRN"
    source_path: "Upload metadata"
    data_type: "string"
    required: "no"
    validation: "13 digits (implementation)"
    description: "Links ECR to EPF_CHALLAN."
    origin: "catalogue"
