schema_version: "1.0"
document:
  code: "IMS"
  name: "Invoice Management System – recipient action dashboard (Accept / Reject / Pending)"
  issuer_system: "GST portal (IMS dashboard; records from suppliers' saved/filed GSTR-1/1A/IFF)"
  legal_basis: "s.38 CGST Act and Rule 60 (as amended); GSTN IMS FAQs; IMS live from 01.10.2024 (actions from 14.10.2024)"
  new_form_no: ""
  frequency: "continuous; actions frozen on GSTR-3B filing of the period"
  formats_available: "Online; Excel/JSON download (via API)"
  how_obtained: "GST portal > Services > Returns > Invoice Management System > Inward supplies > Download"
  due_date: "Actions any time before GSTR-3B of the relevant period is filed; pending records drop off after s.16(4) time limit"
  tables_used: "Inward: B2B, B2BA, B2BCN, B2BCNA, B2BDN, B2BDNA, ECOM, ECOMA. Excluded (go straight to 2B): RCM, ITC ineligible due to POS/s.16(4), Rule 37A, GSTR-5/6, ICEGATE"
  used_by_rules:
    - "RC-GST-013"
    - "RC-GST-015"
    - "RC-GST-030"
  verification_status: "partially_verified"
  notes: "Field keys from india-compliance ims.RawField (secondary). Behaviour from GSTN IMS FAQs. Action rules: may change any number of times until 3B filed; latest action prevails; original and amendment in different 2B periods – act on original first. Rejected CN after 3B filed -> supplier's liability increased in later period. IMS action API codes not verified."
  sources:
    - title: "india-compliance – GSTR-2A/2B/IMS portal JSON keys (gst_returns/fields/gstr2.py, ims.py)"
      url: "https://github.com/resilient-tech/india-compliance"
      ref: "RawField2a, RawField2b, ims.RawField"
      official: false
    - title: "GSTN FAQs on Invoice Management System (gstgyaan copy)"
      url: "https://www.gstgyaan.com/pdf/faqs-on-invoice-management-system.pdf"
      ref: ""
      official: false
    - title: "FAQs on Invoice Management System (ClearTax)"
      url: "https://cleartax.in/s/faqs-on-invoice-management-system-ims-gst"
      ref: ""
      official: false
fields:
  - name: "supplier_gstin"
    label: "GSTIN of supplier"
    source_path: "inv[].stin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "IMS uses 'stin'"
    origin: "catalogue"
  - name: "supplier_return_period"
    label: "Supplier return period"
    source_path: "inv[].rtnprd"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "ims_category"
    label: "Category"
    source_path: "section key"
    data_type: "enum"
    required: "yes"
    validation: "B2B | B2BA | B2BCN | B2BCNA | B2BDN | B2BDNA | ECOM | ECOMA"
    description: ""
    origin: "catalogue"
  - name: "supply_type"
    label: "Invoice/Supply type"
    source_path: "inv[].inv_typ"
    data_type: "enum"
    required: "no"
    validation: "R | SEWP | SEWOP | DE"
    description: ""
    origin: "catalogue"
  - name: "document_no"
    label: "Invoice number"
    source_path: "inv[].inum (notes: nt_num)"
    data_type: "string"
    required: "yes"
    validation: ""
    description: "Match key"
    origin: "catalogue"
  - name: "document_date"
    label: "Invoice date"
    source_path: "inv[].idt (notes: nt_dt)"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "original_document_no"
    label: "Original invoice/note number"
    source_path: "inv[].oinum / ont_num"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Amendment records"
    origin: "catalogue"
  - name: "original_document_date"
    label: "Original date"
    source_path: "inv[].oidt / ont_dt"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: ""
    origin: "catalogue"
  - name: "document_value"
    label: "Invoice value"
    source_path: "inv[].val"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "pos"
    label: "Place of supply"
    source_path: "inv[].pos"
    data_type: "string"
    required: "yes"
    validation: "2-digit state code 01-38 or 96/97 (other territory / outside India); zero-padded string e.g. '07'"
    description: ""
    origin: "catalogue"
  - name: "taxable_value"
    label: "Taxable value"
    source_path: "inv[].txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "igst_amount"
    label: "Integrated tax"
    source_path: "inv[].iamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "cgst_amount"
    label: "Central tax"
    source_path: "inv[].camt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "sgst_amount"
    label: "State/UT tax"
    source_path: "inv[].samt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "cess_amount"
    label: "Cess"
    source_path: "inv[].cess"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "ims_action"
    label: "Action"
    source_path: "inv[].action"
    data_type: "enum"
    required: "yes"
    validation: "Accept | Reject | Pending | No Action (deemed accepted on 2B generation). API codes believed A/R/P/N – UNVERIFIED"
    description: "Accept -> 2B ITC Available -> 3B; Reject -> 2B ITC Rejected (not in 3B); Pending -> excluded from 2B/3B until acted"
    origin: "catalogue"
  - name: "previous_action"
    label: "Previous status"
    source_path: "inv[].prev_status"
    data_type: "enum"
    required: "no"
    validation: "as action"
    description: ""
    origin: "catalogue"
  - name: "pending_action_blocked"
    label: "Pending not allowed"
    source_path: "inv[].ispendactblocked"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: "Pending not allowed for original CNs, upward CN amendments, downward CN amendment where original rejected, downward invoice/DN amendment where original accepted & 3B filed"
    origin: "catalogue"
  - name: "supplier_filing_status"
    label: "Supplier return filing status"
    source_path: "inv[].srcfilstatus"
    data_type: "enum"
    required: "no"
    validation: "Filed / Not filed (values unverified)"
    description: "Records appear on save; only filed records go to 2B"
    origin: "catalogue"
  - name: "supplier_return_form"
    label: "Source form"
    source_path: "inv[].srcform"
    data_type: "enum"
    required: "no"
    validation: "R1 | R1A | IFF (values unverified)"
    description: ""
    origin: "catalogue"
  - name: "itc_reduction_required"
    label: "Whether ITC to be reduced"
    source_path: "inv[].itcRedReq"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: "CN / downward amendment acceptance"
    origin: "catalogue"
  - name: "itc_reduction_blocked"
    label: "ITC reduction field blocked"
    source_path: "inv[].isItcRedReqBlocked"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: ""
    origin: "catalogue"
  - name: "declared_igst"
    label: "Amount declared for ITC reduction – IGST"
    source_path: "inv[].declIgst (declCgst, declSgst, declCess)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: ""
    origin: "catalogue"
  - name: "remarks"
    label: "Remarks"
    source_path: "inv[].remarks"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "recipient_gstin"
    label: ""
    source_path: ""
    data_type: "string GSTIN"
    required: ""
    validation: ""
    description: "GSTIN of the taxpayer whose IMS dashboard was downloaded (file header / logged-in GSTIN); IMS rows do not carry it."
    origin: "new (design)"
  - name: "doc_type"
    label: ""
    source_path: ""
    data_type: "enum INV|CRN|DBN"
    required: "no"
    validation: ""
    description: "DERIVED: From ims_category: B2B/B2BA/ECOM/ECOMA -> 'INV'; B2BCN/B2BCNA -> 'CRN'; B2BDN/B2BDNA -> 'DBN'."
    origin: "derived"
  - name: "fy"
    label: ""
    source_path: ""
    data_type: "string 'YYYY-YY'"
    required: "no"
    validation: ""
    description: "DERIVED: Indian financial year (1 Apr - 31 Mar) containing document_date, format 'YYYY-YY' e.g. '2025-26'"
    origin: "derived"
  - name: "tax_heads"
    label: ""
    source_path: ""
    data_type: "group"
    required: "no"
    validation: ""
    description: "DERIVED: Tuple (igst_amount, cgst_amount, sgst_amount, cess_amount)."
    origin: "derived"
  - name: "pending_since"
    label: ""
    source_path: ""
    data_type: "date"
    required: "no"
    validation: ""
    description: "DERIVED: Earliest IMS download snapshot date (or supplier_return_period) at which the document had ims_action = 'Pending', carried forward while it stays Pending. Requires the tool to keep IMS snapshots."
    origin: "derived"
  - name: "cn_tax"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: igst_amount + cgst_amount + sgst_amount + cess_amount where ims_category in ('B2BCN','B2BCNA')."
    origin: "derived"
