schema_version: "1.0"
document:
  code: "IFF"
  name: "Invoice Furnishing Facility (QRMP taxpayers, months M1 and M2)"
  issuer_system: "GST portal"
  legal_basis: "s.37 CGST Act; Rule 59(2) CGST Rules (QRMP scheme, Notification 84/2020-CT and 82/2020-CT)"
  new_form_no: ""
  frequency: "monthly (optional) for first two months of quarter"
  formats_available: "Online / Offline tool JSON / Excel; same schema as GSTR-1 b2b/cdnr/b2ba/cdnra sections"
  how_obtained: "GST portal > Returns Dashboard > month M1/M2 > IFF; download as for GSTR-1"
  due_date: "1st to 13th of month following M1 / M2"
  tables_used: "4A/4B/6B/6C (b2b), 9A (b2ba), 9B (cdnr), 9C (cdnra), 14/14A(b) and 15/15A B2B & URP2B (ECO) – no B2C, HSN or documents-issued tables; value limit Rs 50 lakh per month (per Rule 59(2) – not re-verified)"
  used_by_rules: []
  verification_status: "partially_verified"
  notes: "Records in IFF flow to recipient GSTR-2A/2B/IMS of that month. No separate amendment of IFF in M1/M2; amend via quarterly GSTR-1/GSTR-1A. JSON keys as GSTR-1 (Partially verified). Rs 50 lakh cap not re-verified this session."
  sources:
    - title: "india-compliance (ERPNext GST app) – GSTR-1 field map (gst_returns/fields/gstr1.py, RawField = portal JSON keys)"
      url: "https://github.com/resilient-tech/india-compliance"
      ref: "india_compliance/gst_returns/fields/gstr1.py; utils/gstr_1/sections/*.py (develop branch, cloned 13-10-2026)"
      official: false
    - title: "Vayana GSP docs – GSTR-1 download (GSTN payload sample, b2b)"
      url: "https://docs.enriched-api.vayana.com/routes/basic/gstn/apis/returns/Gstr-Download-Lite-Api/gstr-1/"
      ref: ""
      official: false
    - title: "GSTN advisory 26.07.2024 on GSTR-1A (IFF relationship)"
      url: "https://taxo.online/latest-news/27-07-2024-advisory-issued-relating-to-form-gstr-1a/"
      ref: ""
      official: false
    - title: "GSTN advisory 15.01.2024 – Tables 14 & 15 available in IFF (B2B, URP2B)"
      url: "https://taxo.online/latest-news/16-01-2024-gstn-issued-advisory-on-introduction-of-new-tables-14-15-in-gstr-1/"
      ref: ""
      official: false
fields:
  - name: "gstin"
    label: "GSTIN of supplier"
    source_path: "header.gstin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: "Return filer GSTIN"
    origin: "catalogue"
  - name: "return_period"
    label: "Tax period"
    source_path: "header.fp"
    data_type: "string"
    required: "yes"
    validation: "MMYYYY e.g. '092026'"
    description: "Filing period (month; for QRMP quarterly GSTR-1 = last month of quarter)"
    origin: "catalogue"
  - name: "b2b_recipient_gstin"
    label: "GSTIN/UIN of Recipient"
    source_path: "Table 4A/4B/6B/6C; b2b[].ctin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Recipient GSTIN/UIN"
    origin: "catalogue"
  - name: "b2b_recipient_filing_status"
    label: "Counter-party filing status"
    source_path: "b2b[].cfs"
    data_type: "enum"
    required: "no"
    validation: "Y/N"
    description: "Whether recipient has filed (download only)"
    origin: "catalogue"
  - name: "b2b_invoice_no"
    label: "Invoice Number"
    source_path: "b2b[].inv[].inum"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars; ^[a-zA-Z0-9/-]{1,16}$ (Rule 46: unique per FY)"
    description: "Invoice number – primary match key with GSTR-2A/2B/IMS, e-invoice DocDtls.No"
    origin: "catalogue"
  - name: "b2b_invoice_date"
    label: "Invoice date"
    source_path: "b2b[].inv[].idt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Invoice date"
    origin: "catalogue"
  - name: "b2b_invoice_value"
    label: "Invoice Value"
    source_path: "b2b[].inv[].val"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Total invoice value incl. tax"
    origin: "catalogue"
  - name: "b2b_pos"
    label: "Place Of Supply"
    source_path: "b2b[].inv[].pos"
    data_type: "string"
    required: "yes"
    validation: "2-digit state code 01-38 or 96/97 (other territory / outside India); zero-padded string e.g. '07'"
    description: "Place of supply state code; drives IGST vs CGST+SGST"
    origin: "catalogue"
  - name: "b2b_reverse_charge"
    label: "Reverse Charge"
    source_path: "b2b[].inv[].rchrg"
    data_type: "enum"
    required: "yes"
    validation: "Y/N"
    description: "Y = Table 4B (tax payable by recipient)"
    origin: "catalogue"
  - name: "b2b_invoice_type"
    label: "Invoice Type"
    source_path: "b2b[].inv[].inv_typ"
    data_type: "enum"
    required: "yes"
    validation: "R (Regular B2B) | SEWP (SEZ with payment) | SEWOP (SEZ without payment) | DE (Deemed export)"
    description: "R/DE -> Table 4A/4B/6C; SEWP/SEWOP -> Table 6B"
    origin: "catalogue"
  - name: "b2b_ecom_gstin"
    label: "E-Commerce GSTIN"
    source_path: "b2b[].inv[].etin"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "ECO GSTIN where supply made through ECO"
    origin: "catalogue"
  - name: "b2b_diff_percent"
    label: "Applicable % of Tax Rate"
    source_path: "b2b[].inv[].diff_percent"
    data_type: "decimal"
    required: "no"
    validation: "0.65 or blank/1"
    description: "65% concessional rate flag (legacy)"
    origin: "catalogue"
  - name: "b2b_irn"
    label: "IRN"
    source_path: "b2b[].inv[].irn"
    data_type: "string"
    required: "no"
    validation: "64 hex chars"
    description: "IRN where auto-populated from e-invoice (download only)"
    origin: "catalogue"
  - name: "b2b_irn_date"
    label: "IRN generation date"
    source_path: "b2b[].inv[].irngendate"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "IRN date (download only)"
    origin: "catalogue"
  - name: "b2b_source_type"
    label: "Source"
    source_path: "b2b[].inv[].srctyp"
    data_type: "enum"
    required: "no"
    validation: "e.g. 'e-Invoice' / blank"
    description: "Source of record (auto-populated from IRP or manual)"
    origin: "catalogue"
  - name: "b2b_item_no"
    label: "Item serial"
    source_path: "b2b[].inv[].itms[].num"
    data_type: "integer"
    required: "yes"
    validation: ">=1"
    description: "Rate-line serial number"
    origin: "catalogue"
  - name: "b2b_rate"
    label: "Rate"
    source_path: "b2b[].inv[].itms[].itm_det.rt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: "Tax rate of the rate line"
    origin: "catalogue"
  - name: "b2b_taxable_value"
    label: "Taxable Value"
    source_path: "b2b[].inv[].itms[].itm_det.txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Taxable value per rate"
    origin: "catalogue"
  - name: "b2b_igst"
    label: "Integrated Tax Amount"
    source_path: "b2b[].inv[].itms[].itm_det.iamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; only when inter-State (pos != supplier state) or SEZ/IgstOnIntra"
    description: "IGST"
    origin: "catalogue"
  - name: "b2b_cgst"
    label: "Central Tax Amount"
    source_path: "b2b[].inv[].itms[].itm_det.camt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted; must equal samt"
    description: "CGST"
    origin: "catalogue"
  - name: "b2b_sgst"
    label: "State/UT Tax Amount"
    source_path: "b2b[].inv[].itms[].itm_det.samt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "SGST/UTGST"
    origin: "catalogue"
  - name: "b2b_cess"
    label: "Cess Amount"
    source_path: "b2b[].inv[].itms[].itm_det.csamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Compensation cess"
    origin: "catalogue"
  - name: "record_flag"
    label: "Action flag"
    source_path: "*.flag / cflag"
    data_type: "enum"
    required: "no"
    validation: "e.g. U/A/D/N (upload/accept/delete etc.) – values unverified"
    description: "Record status flag in GSTN payloads"
    origin: "catalogue"
  - name: "cdnr_recipient_gstin"
    label: "GSTIN/UIN of Recipient"
    source_path: "Table 9B; cdnr[].ctin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Recipient of note"
    origin: "catalogue"
  - name: "cdnr_note_type"
    label: "Note Type"
    source_path: "cdnr[].nt[].ntty"
    data_type: "enum"
    required: "yes"
    validation: "C (credit) | D (debit)"
    description: "Sign: C reduces, D increases liability"
    origin: "catalogue"
  - name: "cdnr_note_no"
    label: "Note Number"
    source_path: "cdnr[].nt[].nt_num"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Credit/debit note number"
    origin: "catalogue"
  - name: "cdnr_note_date"
    label: "Note Date"
    source_path: "cdnr[].nt[].nt_dt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Note date; CN time limit s.34(2): 30 Nov following FY"
    origin: "catalogue"
  - name: "cdnr_note_value"
    label: "Note Value"
    source_path: "cdnr[].nt[].val"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted (unsigned; sign from ntty)"
    description: "Note value"
    origin: "catalogue"
  - name: "cdnr_pos"
    label: "Place Of Supply"
    source_path: "cdnr[].nt[].pos"
    data_type: "string"
    required: "yes"
    validation: "2-digit state code 01-38 or 96/97 (other territory / outside India); zero-padded string e.g. '07'"
    description: "POS"
    origin: "catalogue"
  - name: "cdnr_reverse_charge"
    label: "Reverse Charge"
    source_path: "cdnr[].nt[].rchrg"
    data_type: "enum"
    required: "yes"
    validation: "Y/N"
    description: "RCM note"
    origin: "catalogue"
  - name: "cdnr_note_supply_type"
    label: "Note Supply Type"
    source_path: "cdnr[].nt[].inv_typ"
    data_type: "enum"
    required: "yes"
    validation: "R | SEWP | SEWOP | DE"
    description: "Supply type of note"
    origin: "catalogue"
  - name: "cdnr_rate"
    label: "Rate"
    source_path: "cdnr[].nt[].itms[].itm_det.rt"
    data_type: "decimal"
    required: "yes"
    validation: "decimal; notified GST rate (0, 0.1, 0.25, 1, 1.5, 3, 5, 6, 7.5, 12, 18, 28, 40 – validate against rate master)"
    description: "Rate"
    origin: "catalogue"
  - name: "cdnr_taxable_value"
    label: "Taxable Value"
    source_path: "cdnr[].nt[].itms[].itm_det.txval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Taxable value"
    origin: "catalogue"
  - name: "cdnr_igst"
    label: "Integrated Tax Amount"
    source_path: "cdnr[].nt[].itms[].itm_det.iamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "IGST"
    origin: "catalogue"
  - name: "cdnr_cgst"
    label: "Central Tax Amount"
    source_path: "cdnr[].nt[].itms[].itm_det.camt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "CGST"
    origin: "catalogue"
  - name: "cdnr_sgst"
    label: "State/UT Tax Amount"
    source_path: "cdnr[].nt[].itms[].itm_det.samt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "SGST"
    origin: "catalogue"
  - name: "cdnr_cess"
    label: "Cess Amount"
    source_path: "cdnr[].nt[].itms[].itm_det.csamt"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted"
    description: "Cess"
    origin: "catalogue"
  - name: "amend_original_invoice_no"
    label: "Original Invoice Number"
    source_path: "Table 9A; b2ba/b2cla/expa[].inv[].oinum"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Original invoice being amended (b2ba/b2cla/expa section names per GSTN convention [JSON name unverified])"
    origin: "catalogue"
  - name: "amend_original_invoice_date"
    label: "Original Invoice date"
    source_path: "b2ba[].inv[].oidt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Original invoice date"
    origin: "catalogue"
  - name: "amend_original_note_no"
    label: "Original Note Number"
    source_path: "Table 9C; cdnra[].nt[].ont_num"
    data_type: "string"
    required: "yes"
    validation: "max 16 chars"
    description: "Original note being amended [JSON name unverified]"
    origin: "catalogue"
  - name: "amend_original_note_date"
    label: "Original Note Date"
    source_path: "cdnra[].nt[].ont_dt"
    data_type: "date"
    required: "yes"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Original note date [JSON name unverified]"
    origin: "catalogue"
  - name: "eco_section"
    label: "Table 14 tab"
    source_path: "Table 14(a)/(b); supeco.clttx[] / supeco.paytx[]"
    data_type: "enum"
    required: "yes"
    validation: "clttx = 14(a) liable to collect TCS u/s 52; paytx = 14(b) liable to pay tax u/s 9(5)"
    description: "ECO-wise summary by supplier"
    origin: "catalogue"
  - name: "eco_gstin"
    label: "GSTIN of e-commerce operator"
    source_path: "supeco.*[].etin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "ECO GSTIN – match to GSTR-8 (ctin of supplier) and 2A TCS"
    origin: "catalogue"
  - name: "eco_net_value"
    label: "Net value of supplies"
    source_path: "supeco.*[].suppval"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2); may be negative"
    description: "Net supplies through ECO"
    origin: "catalogue"
  - name: "eco_igst"
    label: "Integrated tax"
    source_path: "supeco.*[].igst"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2)"
    description: "IGST (note key 'igst', not 'iamt')"
    origin: "catalogue"
  - name: "eco_cgst"
    label: "Central tax"
    source_path: "supeco.*[].cgst"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2)"
    description: "CGST"
    origin: "catalogue"
  - name: "eco_sgst"
    label: "State/UT tax"
    source_path: "supeco.*[].sgst"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2)"
    description: "SGST"
    origin: "catalogue"
  - name: "eco_cess"
    label: "Cess"
    source_path: "supeco.*[].cess"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2)"
    description: "Cess"
    origin: "catalogue"
  - name: "eco95_section"
    label: "Table 15 sub-table"
    source_path: "Table 15 (filed by ECO): B2B / B2C / URP2B / URP2C [JSON name unverified]"
    data_type: "enum"
    required: "yes"
    validation: "B2B | B2C | URP2B | URP2C"
    description: "Supplies on which ECO pays tax u/s 9(5); B2B & URP2B document-level; B2C & URP2C POS+rate-wise; auto-populates GSTR-3B 3.1.1(i)"
    origin: "catalogue"
  - name: "eco95_supplier_gstin"
    label: "GSTIN of supplier"
    source_path: "Table 15 B2B/B2C [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Registered supplier on whose behalf ECO pays"
    origin: "catalogue"
  - name: "eco95_recipient_gstin"
    label: "GSTIN of recipient"
    source_path: "Table 15 B2B/URP2B [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[0-9A-Z]{13}$ (generic GSTIN/UIN pattern used in NIC e-invoice schema)"
    description: "Recipient"
    origin: "catalogue"
  - name: "eco95_doc_no"
    label: "Document number"
    source_path: "Table 15 B2B/URP2B [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: "max 16 chars"
    description: "Document number"
    origin: "catalogue"
  - name: "eco95_doc_date"
    label: "Document date"
    source_path: "Table 15 B2B/URP2B [JSON name unverified]"
    data_type: "date"
    required: "no"
    validation: "dd-mm-yyyy (GSTN return-API convention; confirm on first real file)"
    description: "Document date"
    origin: "catalogue"
