schema_version: "1.0"
document:
  code: "TIS"
  name: "Taxpayer Information Summary (TIS)"
  issuer_system: "Income-tax e-Filing portal – AIS module"
  legal_basis: "Derived summary of AIS (s.285BB / Rule 114-I; s.510 / Rule 245) – administrative summary, not a separate statutory form"
  new_form_no: ""
  frequency: "Annual per PAN per FY; updates after feedback processing"
  formats_available: "PDF, JSON (portal)"
  how_obtained: "e-Filing portal > AIS > TIS tab > Download"
  due_date: "No due date; used to pre-fill ITR"
  tables_used: "Category-wise summary (e.g. Salary, Interest from savings bank, Interest from deposits, Dividend, Sale of securities, Rent received, Business receipts, Purchase of time deposits ...) with processed and accepted/derived values"
  used_by_rules:
    - "RC-IT-004"
  verification_status: "verified_official"
  notes: "Field labels per AIS FAQ (official). Category list is not enumerated officially – load categories dynamically."
  sources:
    - title: "e-Filing portal – AIS FAQs"
      url: "https://www.incometax.gov.in/iec/foportal/help/all-topics/e-filing-services/ais%20-%20annual%20information%20statement-faqs"
      ref: "TIS processed vs accepted value; feedback; downloads"
      official: true
    - title: "e-Filing portal – AIS help"
      url: "https://www.incometax.gov.in/iec/foportal/help/all-topics/e-filing-services/ais-annual-information-statement"
      ref: "Part A/Part B, info code/description/value, PDF/JSON/CSV, EXC-GSTR3B"
      official: true
    - title: "Income Tax Department – Form 168 FAQs"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/form-168-faqs"
      ref: "Form 168 (earlier 26AS/AIS); Rule 245 IT Rules 2026 / s.510 ITA 2025; Rule 114-I / s.285BB 1961"
      official: true
fields:
  - name: "pan"
    label: "PAN"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "financial_year"
    label: "Financial Year"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "^20[0-9]{2}-[0-9]{2}$ (e.g. 2025-26)"
    description: ""
    origin: "catalogue"
  - name: "information_category"
    label: "Information category"
    source_path: "Summary"
    data_type: "string"
    required: "yes"
    validation: "free text as displayed"
    description: "Category; map to ITR head via configurable table."
    origin: "catalogue"
  - name: "processed_value"
    label: "Value processed by system"
    source_path: "Summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "System value after de-duplication rules."
    origin: "catalogue"
  - name: "derived_value"
    label: "Value accepted by taxpayer/confirmed by source (derived value)"
    source_path: "Summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Value after considering taxpayer feedback; used for ITR pre-fill – preferred compare value."
    origin: "catalogue"
  - name: "reported_value_sum"
    label: "Reported by Source"
    source_path: "Detail"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Sum of AIS reported values for the category."
    origin: "catalogue"
