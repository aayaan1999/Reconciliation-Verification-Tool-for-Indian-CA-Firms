schema_version: "1.0"
document:
  code: "TB"
  name: "Trial balance (ledger-wise, opening / Dr / Cr / closing)"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law"
  new_form_no: ""
  frequency: "Monthly / quarterly / annual"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Tally Prime: Trial Balance > F12 show ledgers, opening, transactions > Export Excel"
  due_date: ""
  tables_used: "Ledger-wise balances with group hierarchy"
  used_by_rules:
    - "RC-ACC-001"
    - "RC-ACC-002"
    - "RC-ACC-003"
    - "RC-ACC-004"
    - "RC-ACC-006"
    - "RC-BNK-006"
    - "RC-GST-026"
    - "RC-GST-027"
    - "RC-GST-028"
    - "RC-IT-007"
    - "RC-IT-008"
    - "RC-PAY-008"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "Tally – Export data in TallyPrime"
      url: "https://help.tallysolutions.com/tally-prime/export-data-in-tally"
      ref: "Formats: ASCII, Excel, HTML, JPEG, PDF, XML, JSON; Bills receivable ageing export"
      official: false
    - title: "Tally – Sample Excel files for import (field names & aliases)"
      url: "https://help.tallysolutions.com/tally-prime/import-data/download-sample-excel-files-with-data-for-import"
      ref: "Voucher Date, Voucher Number, Party Name, Buyer/Supplier GSTIN/UIN, Item, Rate, Quantity, Ledger Group"
      official: false
    - title: "Tally – Sales Register (Sales Day Book)"
      url: "https://help.tallysolutions.com/docs/te9rel66/Reports/Display_Registers_Ledgers/Sales_Register_Sales_Day_Book.htm"
      ref: "Monthly summary → voucher list; Excel/Pivot export"
      official: false
fields:
  - name: "period_from"
    label: "Period from"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "period_to"
    label: "Period to"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "ledger_name"
    label: "Particulars (Ledger)"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "ledger_group"
    label: "Group"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "primary_group"
    label: "Primary group / nature"
    source_path: "Row"
    data_type: "enum"
    required: "yes"
    validation: "Assets|Liabilities|Income|Expenses"
    description: ""
    origin: "catalogue"
  - name: "fs_head"
    label: "Schedule III / FS line mapping"
    source_path: "Mapping"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Implementation mapping to FS."
    origin: "catalogue"
  - name: "opening_balance"
    label: "Opening Balance"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated (signed: Dr +, Cr −)"
    description: ""
    origin: "catalogue"
  - name: "debit_total"
    label: "Debit (transactions)"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "credit_total"
    label: "Credit (transactions)"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "closing_balance"
    label: "Closing Balance"
    source_path: "Row"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated signed"
    description: ""
    origin: "catalogue"
  - name: "gstin_branch"
    label: ""
    source_path: ""
    data_type: "string GSTIN"
    required: ""
    validation: ""
    description: "GSTIN to which the TB (or ledger) belongs, for multi-GSTIN entities (company/branch/cost-centre tagging in books)."
    origin: "new (design)"
  - name: "taxable_turnover_by_rate"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ closing_balance of sales ledgers grouped by the GST rate mapped to each ledger (ledger mapping configurable)."
    origin: "derived"
  - name: "fy"
    label: ""
    source_path: ""
    data_type: "string 'YYYY-YY'"
    required: "no"
    validation: ""
    description: "DERIVED: Indian financial year (1 Apr - 31 Mar) containing period_to, format 'YYYY-YY' e.g. '2025-26'"
    origin: "derived"
  - name: "itc_booked_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: debit_total of input-GST ledger head h for the FY (ledger mapping configurable)."
    origin: "derived"
  - name: "month"
    label: ""
    source_path: ""
    data_type: "string MMYYYY"
    required: "no"
    validation: ""
    description: "DERIVED: tax period of period_to, format MMYYYY e.g. '092026' (monthly TB)."
    origin: "derived"
  - name: "output_credit_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: credit_total - debit_total (credit-note debits) of output-GST ledger head h in the month (ledger mapping configurable)."
    origin: "derived"
  - name: "rcm_payable_credit_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: credit_total of RCM-payable ledger head h in the month (ledger mapping configurable)."
    origin: "derived"
  - name: "input_debit_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: debit_total of input-GST ledger head h in the month (ledger mapping configurable)."
    origin: "derived"
  - name: "itc_reversal_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ GL credit on input-GST ledger head h in reversal journals (tagged) in the month (ledger mapping configurable)."
    origin: "derived"
  - name: "setoff_entries_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ GL debit on output-GST ledger head h in set-off journals crediting input-GST ledgers (ledger mapping configurable)."
    origin: "derived"
  - name: "cash_paid_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ GL debit on output-GST ledger head h in vouchers crediting the electronic-cash-ledger / bank ledger (ledger mapping configurable)."
    origin: "derived"
  - name: "closing_output_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: closing_balance of output-GST ledger head h after set-off (ledger mapping configurable)."
    origin: "derived"
  - name: "pan"
    label: ""
    source_path: ""
    data_type: "string"
    required: "no"
    validation: ""
    description: "DERIVED: Entity PAN: FS.entity_pan, or gstin_branch[2:12]."
    origin: "derived"
  - name: "revenue_from_operations"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ closing_balance of ledgers whose fs_head = revenue from operations (ledger mapping configurable)."
    origin: "derived"
  - name: "gratuity_provision"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: closing_balance of ledger mapped to 'provision for gratuity' (ledger mapping configurable)."
    origin: "derived"
  - name: "bonus_provision"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: closing_balance of ledger mapped to 'provision for bonus' (ledger mapping configurable)."
    origin: "derived"
  - name: "sundry_debtors_total"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ closing_balance where ledger_group = 'Sundry Debtors' (ledger mapping configurable)."
    origin: "derived"
  - name: "sundry_creditors_total"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: Σ closing_balance where ledger_group = 'Sundry Creditors' (ledger mapping configurable)."
    origin: "derived"
  - name: "asset_ledger_closing"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: closing_balance of fixed-asset ledgers mapped to the asset class (ledger mapping configurable)."
    origin: "derived"
  - name: "accum_dep_ledger"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: closing_balance of accumulated-depreciation ledgers mapped to the asset class (ledger mapping configurable)."
    origin: "derived"
