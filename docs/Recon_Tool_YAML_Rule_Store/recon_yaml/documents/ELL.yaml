schema_version: "1.0"
document:
  code: "ELL"
  name: "Electronic Liability Register (FORM GST PMT-01) – Part I return-related, Part II other than return"
  issuer_system: "GST portal"
  legal_basis: "s.49(7) CGST Act; Rule 85 CGST Rules (PMT-01)"
  new_form_no: ""
  frequency: "continuous"
  formats_available: "Online; PDF/Excel download"
  how_obtained: "GST portal > Services > Ledgers > Electronic Liability Register > Part I (return related) / Part II (demands)"
  due_date: "Not applicable"
  tables_used: "Part I: return-related liabilities (GSTR-3B, CMP-08, GSTR-7/8 etc.) debit/payable and credit/paid; Part II: other liabilities (demands, DRC orders) with Demand ID, stay status"
  used_by_rules:
    - "RC-GST-022"
  verification_status: "partially_verified"
  notes: "Columns from PMT-01 reproduction. Recon: closing payable for a return period should be nil after GSTR-3B; Part II outstanding vs DRC-03 payments. JSON keys unverified."
  sources:
    - title: "GST payment forms PMT-01 to PMT-06 (Goa State Tax)"
      url: "https://statetax.goa.gov.in/PDF/gst_forms/Payment.pdf"
      ref: ""
      official: true
fields:
  - name: "gstin"
    label: "GSTIN"
    source_path: "header / data.gstin"
    data_type: "string"
    required: "yes"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$ (regular taxpayer; UIN/TDS/NRTP/OIDAR GSTINs differ – use generic ^[0-9]{2}[0-9A-Z]{13}$ as fallback) + mod-36 check digit"
    description: ""
    origin: "catalogue"
  - name: "from_date"
    label: "From date"
    source_path: "data.fr_dt"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: "Ledger extract period (API keys fr_dt/to_dt seen in GSP sample)"
    origin: "catalogue"
  - name: "to_date"
    label: "To date"
    source_path: "data.to_dt"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "sr_no"
    label: "Sr. No."
    source_path: "PMT-01 Part I/II col 1"
    data_type: "integer"
    required: "no"
    validation: ">=1"
    description: ""
    origin: "catalogue"
  - name: "txn_date"
    label: "Date (of deposit/debit)"
    source_path: "PMT-01 Part I/II col 2; tr[].dt [JSON name unverified]"
    data_type: "date"
    required: "yes"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "reference_no"
    label: "Reference No."
    source_path: "PMT-01 Part I/II col 3; tr[].ref_no [JSON name unverified]"
    data_type: "string"
    required: "yes"
    validation: "CIN / ARN / DRC ref / demand ID"
    description: "Link to GSTR-3B ARN, CMP-08 ARN, DRC-03 ARN, challan CIN"
    origin: "catalogue"
  - name: "tax_period"
    label: "Tax Period, if applicable"
    source_path: "PMT-01 Part I/II; tr[].ret_period [JSON name unverified]"
    data_type: "string"
    required: "no"
    validation: "MMYYYY e.g. '092026'"
    description: ""
    origin: "catalogue"
  - name: "description"
    label: "Description"
    source_path: "PMT-01 Part I/II; tr[].desc"
    data_type: "string"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "txn_type"
    label: "Type of transaction"
    source_path: "PMT-01 Part I/II; tr[].tr_typ [JSON name unverified]"
    data_type: "enum"
    required: "yes"
    validation: "Debit | Credit (liability ledger: Debit/Payable, Credit/Paid, Reduction, Refund adjusted)"
    description: ""
    origin: "catalogue"
  - name: "ledger_part"
    label: "Part"
    source_path: "PMT-01"
    data_type: "enum"
    required: "yes"
    validation: "I (return related) | II (other than return)"
    description: ""
    origin: "catalogue"
  - name: "ledger_used"
    label: "Ledger used for discharging liability"
    source_path: "PMT-01 col 4/5"
    data_type: "enum"
    required: "no"
    validation: "Cash | Credit"
    description: ""
    origin: "catalogue"
  - name: "demand_id"
    label: "Demand ID"
    source_path: "PMT-01 Part II header"
    data_type: "string"
    required: "no"
    validation: ""
    description: "Link to DRC-07 / DRC-03 'Order' cause"
    origin: "catalogue"
  - name: "demand_date"
    label: "Demand date"
    source_path: "PMT-01 Part II header"
    data_type: "date"
    required: "no"
    validation: "dd/mm/yyyy"
    description: ""
    origin: "catalogue"
  - name: "stay_status"
    label: "Status (Stayed/Un-stayed)"
    source_path: "PMT-01 Part II col 10"
    data_type: "enum"
    required: "no"
    validation: "Stayed | Un-stayed"
    description: ""
    origin: "catalogue"
  - name: "act"
    label: "Act"
    source_path: "PMT-01 Part II header"
    data_type: "enum"
    required: "no"
    validation: "CGST | SGST | IGST | Cess"
    description: ""
    origin: "catalogue"
  - name: "amount_igst"
    label: "Integrated Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-01 col 7/8 (Amount debited/credited); igstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "amount_cgst"
    label: "Central Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-01 col 7/8 (Amount debited/credited); cgstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "amount_sgst"
    label: "State/UT Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-01 col 7/8 (Amount debited/credited); sgstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "amount_cess"
    label: "Cess – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-01 col 7/8 (Amount debited/credited); cessbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "balance_payable_igst"
    label: "Integrated Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-01 col 8/9 (Balance payable); igstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "balance_payable_cgst"
    label: "Central Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-01 col 8/9 (Balance payable); cgstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "balance_payable_sgst"
    label: "State/UT Tax – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-01 col 8/9 (Balance payable); sgstbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "balance_payable_cess"
    label: "Cess – Tax / Interest / Penalty / Fee / Others / Total"
    source_path: "PMT-01 col 8/9 (Balance payable); cessbal.{tx,intr,pen,fee,oth,tot} (in op_bal/cl_bal; per-transaction keys unverified)"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2); >= 0 unless noted per component"
    description: "Store one column per component"
    origin: "catalogue"
  - name: "liability_created_h"
    label: ""
    source_path: ""
    data_type: "decimal(15,2)"
    required: "no"
    validation: ""
    description: "DERIVED: amount_<h> on rows where txn_type = 'Debit' (Payable, liability created) in ledger_part 'I'."
    origin: "derived"
