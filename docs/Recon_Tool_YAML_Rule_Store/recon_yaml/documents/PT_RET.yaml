schema_version: "1.0"
document:
  code: "PT_RET"
  name: "Professional Tax return (state-specific; employer)"
  issuer_system: "State commercial tax / PT portals (e.g. Maharashtra MahaGST PTRC, Karnataka, West Bengal, Tamil Nadu local bodies)"
  legal_basis: "Article 276 of the Constitution (cap Rs 2,500 p.a.) and respective State PT Acts/Rules (e.g. Maharashtra State Tax on Professions, Trades, Callings and Employments Act, 1975) – see payroll.json PAY-018..024"
  new_form_no: "State-specific (e.g. Maharashtra Form III – not verified)"
  frequency: "Monthly / annual / half-yearly depending on state and liability slab"
  formats_available: "State portal acknowledgement PDF; Excel/CSV upload (state-specific)"
  how_obtained: "State PT portal > return filing history (client provides acknowledgement & return copy)"
  due_date: "State-specific – maintain in state master"
  tables_used: "Slab-wise employee count and tax (salary slabs), total tax payable, tax paid, interest/penalty"
  used_by_rules:
    - "RC-PAY-004"
  verification_status: "unverified"
  notes: "Generic recommended structure across states – implementation design; each state's form varies. CA to confirm per state."
  sources:
    - title: "BankBazaar – Maharashtra PT slab"
      url: "https://bankbazaar.com/tax/maharashtra-professional-tax-slab-rate.html"
      ref: "(prior round)"
      official: false
    - title: "WBXpress – PT schedule 2026"
      url: "https://wbxpress.com/schedule-rates-tax-professions-trades-callings-employments-2026/"
      ref: "(prior round)"
      official: false
fields:
  - name: "state"
    label: "State"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "state code"
    description: ""
    origin: "catalogue"
  - name: "registration_no"
    label: "PT registration (RC) number"
    source_path: "Header"
    data_type: "string"
    required: "yes"
    validation: "state format"
    description: ""
    origin: "catalogue"
  - name: "period_from"
    label: "Return period from"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "period_to"
    label: "Return period to"
    source_path: "Header"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "slab_from"
    label: "Salary slab – from"
    source_path: "Slab table"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "slab_to"
    label: "Salary slab – to"
    source_path: "Slab table"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "slab_rate"
    label: "Rate per month"
    source_path: "Slab table"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Per state master (incl. Feb Rs 300 in MH)."
    origin: "catalogue"
  - name: "employee_count"
    label: "Number of employees"
    source_path: "Slab table"
    data_type: "integer"
    required: "yes"
    validation: ">=0"
    description: "Compare to PAYROLL_REG counts per slab."
    origin: "catalogue"
  - name: "tax_amount"
    label: "Amount of tax"
    source_path: "Slab table"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "total_tax_payable"
    label: "Total tax payable"
    source_path: "Summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "= Σ PAYROLL_REG.pt for period."
    origin: "catalogue"
  - name: "interest_penalty"
    label: "Interest / penalty"
    source_path: "Summary"
    data_type: "decimal"
    required: "no"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: ""
    origin: "catalogue"
  - name: "tax_paid"
    label: "Tax paid (challan details)"
    source_path: "Summary"
    data_type: "decimal"
    required: "yes"
    validation: "decimal(15,2) INR; >= 0 unless stated"
    description: "Match to PT_CHALLAN."
    origin: "catalogue"
  - name: "filing_date"
    label: "Date of filing"
    source_path: "Ack"
    data_type: "date"
    required: "yes"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "period"
    label: ""
    source_path: ""
    data_type: "string 'yyyy-mm'"
    required: "no"
    validation: ""
    description: "DERIVED: calendar month of period_from, format 'yyyy-mm' (for monthly returns; for longer periods the range period_from..period_to)."
    origin: "derived"
