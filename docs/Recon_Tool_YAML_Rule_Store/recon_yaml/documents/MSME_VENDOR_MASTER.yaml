schema_version: "1.0"
document:
  code: "MSME_VENDOR_MASTER"
  name: "MSME vendor master (Udyam registration details)"
  issuer_system: "Client accounting software (Tally Prime / ERP) or client-prepared register"
  legal_basis: "Implementation design, not law. MSMED Act 2006 s.2/s.7 classification (revised limits from 01-04-2025 – MSME-001), Udyam registration; MSME Form 1 (MCA)"
  new_form_no: ""
  frequency: "Maintained; refresh annually"
  formats_available: "Excel (.xlsx), XML, JSON, PDF, ASCII text (Tally Prime export formats); CSV from ERPs"
  how_obtained: "Client vendor master export + Udyam certificates / vendor declarations"
  due_date: ""
  tables_used: "Vendor × Udyam details"
  used_by_rules:
    - "RC-ACC-008"
    - "RC-IT-011"
    - "RC-IT-013"
  verification_status: "unverified"
  notes: "Recommended standard field set – implementation design, not law. Column names follow Tally Prime field names/aliases where available (Voucher Date, Voucher Number, Party Name, Buyer/Supplier – GSTIN/UIN, Item Name, Quantity, Rate); exact export headers vary by report, configuration (F12) and release – map at import."
  sources:
    - title: "FoxMandal – MSME classification limits revised"
      url: "https://foxmandal.in/news/monetary-limits-for-msme-classification-revised/"
      ref: "(prior round)"
      official: false
    - title: "Taxmann – MSME Form 1 revised"
      url: "https://www.taxmann.com/post/blog/mca-revises-msme-form-1-with-enhanced-disclosures-for-reporting-payments-pending-over-45-days-to-micro-small-enterprises/"
      ref: "(prior round)"
      official: false
fields:
  - name: "vendor_code"
    label: "Vendor code"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "vendor_name"
    label: "Vendor name"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: ""
    description: ""
    origin: "catalogue"
  - name: "vendor_pan"
    label: "PAN"
    source_path: "Row"
    data_type: "string"
    required: "yes"
    validation: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    description: "Key across docs."
    origin: "catalogue"
  - name: "vendor_gstin"
    label: "GSTIN"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
    description: ""
    origin: "catalogue"
  - name: "udyam_no"
    label: "Udyam Registration Number"
    source_path: "Row"
    data_type: "string"
    required: "no"
    validation: "^UDYAM-[A-Z]{2}-[0-9]{2}-[0-9]{7}$"
    description: ""
    origin: "catalogue"
  - name: "msme_category"
    label: "Enterprise type (Micro/Small/Medium)"
    source_path: "Row"
    data_type: "enum"
    required: "no"
    validation: "Micro|Small|Medium"
    description: ""
    origin: "catalogue"
  - name: "activity_type"
    label: "Major activity (Manufacturing/Services/Trading)"
    source_path: "Row"
    data_type: "enum"
    required: "no"
    validation: "Manufacturing|Services|Trading"
    description: "Traders: s.43B(h) applicability – CA review."
    origin: "catalogue"
  - name: "udyam_date"
    label: "Date of Udyam registration"
    source_path: "Row"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "classification_valid_from"
    label: "Classification effective from"
    source_path: "Row"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "declaration_received_on"
    label: "Date vendor declaration received"
    source_path: "Row"
    data_type: "date"
    required: "no"
    validation: "ISO"
    description: ""
    origin: "catalogue"
  - name: "written_credit_days"
    label: "Agreed credit days"
    source_path: "Row"
    data_type: "integer"
    required: "no"
    validation: ""
    description: ""
    origin: "catalogue"
