# Where the pack's own figures disagree although a negative control calls them consistent.
# The rule fails on the pack with exactly this difference, is not counted as a false
# positive, and passes on the corrected copy. The rule is never loosened to hide it.
pack_errors:
  - control: "N15"
    rule: "RECON-MAT-010"
    difference: "10.00"
    note: "AY 2026-27 row: 6061420 carried in + 5540210 - 755049 excess FTC = 10846581; the table shows 10846571. The AY 2025-26 row is Rs 9,00,000 apart too (1284910 + 4790830 - 914320 = 5161420 against 6061420); only this year's row is read."
