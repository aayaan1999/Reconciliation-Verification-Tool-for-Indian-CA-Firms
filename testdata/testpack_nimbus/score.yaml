# Test Pack A (fictional Nimbus Logic Systems Private Limited), Pass 1: the JSON file only.
# Which rules detect each finding of the answer key (10_EXPECTED_FINDINGS.csv), with the
# difference each must show, and which rules must not fire on each negative control
# (11_NEGATIVE_CONTROLS.csv). Read by TestTestPackAPass1 (SPEC-005).
#
# Differences are those the finding shows; "0.00" for a finding that states values found
# together or a value and a law table's value (no difference is shown). A finding with no
# rule yet says what it waits for. "in_json: false" marks a finding
# whose data is not in the JSON at all (draft versions, signing date, ledgers): Pass 1 can
# never detect it. When a later spec adds a rule, add it here; the test then requires it.
#
# plant (SPEC-007) puts one finding's figures, on its own, into the corrected copy of the
# pack (content/profiles/taxsuite_pack/*/v1/samples/nimbus_pack_corrected.json); exactly
# the rules of detected_by must then fail, and no other (TestTestPackAOneDefectAtATime).
# Each step is one of:
#   { copy: "<path>" }                         the pack's value at path, put at the same path
#   { copy: "<path>", to: "<path>" }           the pack's value at path, put at another path
#   { copy: "<path>", append_to: "<path>" }    the pack's value at path, added to a list
#   { path: "<path>", value: "<JSON>" }        a value of the answer key the pack does not hold
#                                              alone, because there it is mixed with another
#                                              finding's figures
schema: "recon.testpack.score/1"

findings:
  - id: "F01"
    critical: true
    detected_by:
