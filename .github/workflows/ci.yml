name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet for Windows
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Tests (including the architecture guard, never from cache)
        id: tests
        run: go test -count=1 ./...

      - name: Build for Windows
        run: GOOS=windows GOARCH=amd64 go build -o build/windows/ ./cmd/...

      - name: Keep the engine dependency proof
        # Upload whenever the tests ran, even if they failed; skip it when an earlier step
        # stopped the run, so the proof file being absent is not reported as a second failure.
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: engine-deps
          path: build/engine-deps-*.txt
          if-no-files-found: error
