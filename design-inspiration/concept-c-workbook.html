<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept C: Workbook</title>
<!-- Design concept only, not production code. System fonts only; loads nothing from the internet.
     Identity: the spreadsheet CA staff already live in. Gridlines, frozen headers, sheet tabs at
     the bottom, cell-by-cell keyboard movement, and a source bar (where a formula bar would be)
     that names the file and place every selected figure came from. Cobalt for the cursor only. -->
<style>
:root {
  --bg: #ffffff; --chrome: #f6f7f9; --head: #eff1f4; --grid: #d9dde3; --ink: #1f2328; --muted: #5d646e;
  --cursor: #234e9c; --cursor-soft: #e9eff9; --red: #b3261e; --red-fill: #fbeae8; --green: #17663a; --green-fill: #e7f3eb;
  --amber: #7d5200; --amber-fill: #fbf3dc;
  --body: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Mono', Consolas, ui-monospace, monospace;
  /* spacing: 4px base; one row is 30px */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --row: 30px;
  --fs-xs: 12px; --fs-s: 13px; --fs-m: 14px; --fs-l: 16px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; background: var(--bg); color: var(--ink); font: var(--fs-s)/1.4 var(--body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cursor); outline-offset: 1px; }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }

.title { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); background: var(--chrome); border-bottom: 1px solid var(--grid); flex-wrap: wrap; }
.title h1 { font-size: var(--fs-m); font-weight: 600; margin: 0; }
.title .ty { color: var(--muted); }
.title .illus { margin-left: auto; font-size: var(--fs-xs); color: var(--amber); background: var(--amber-fill); padding: 2px var(--s2); border-radius: 3px; }
.title select { border: 1px solid var(--grid); border-radius: 3px; padding: 3px 6px; background: var(--bg); }

/* The source bar: where a formula bar would be. */
.srcbar { display: grid; grid-template-columns: 92px minmax(0, 1fr); border-bottom: 1px solid var(--grid); min-height: 32px; }
.srcbar .k { display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--grid); color: var(--muted); font-size: var(--fs-xs); background: var(--chrome); }
.srcbar .v { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s3); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.srcbar .v b { font-weight: 600; }
.srcbar .v code { font: 12px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

.sheet { overflow: auto; position: relative; }
table.g { border-collapse: separate; border-spacing: 0; min-width: 100%; }
.g th, .g td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); height: var(--row); padding: 0 var(--s2); white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.g td.wide { max-width: 380px; }
.g thead th { position: sticky; top: 0; z-index: 2; background: var(--head); font-weight: 600; text-align: left; font-size: var(--fs-xs); color: var(--muted); }
.g thead th.n { text-align: right; }
.g .rn { position: sticky; left: 0; z-index: 1; background: var(--head); color: var(--muted); text-align: center; font-size: var(--fs-xs); width: 40px; min-width: 40px; padding: 0; }
.g thead .rn { z-index: 3; }
.g td.cur { outline: 2px solid var(--cursor); outline-offset: -2px; background: var(--cursor-soft); }
.g tr.on .rn { background: var(--cursor); color: #fff; }
.g td.wrap { white-space: normal; }
.g tr.grp td { background: var(--chrome); font-weight: 600; }
.g tr.grp td .muted { font-weight: 400; }
.g tr.tot td { font-weight: 600; border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); }
.g td.diff { color: var(--red); font-weight: 600; background: var(--red-fill); }
.g td.diff.cur { background: var(--cursor-soft); }
.g td.red { color: var(--red); font-weight: 600; }
.g td.fill-red { background: var(--red-fill); color: var(--red); }
.g td.fill-green { background: var(--green-fill); color: var(--green); }
.g td.fill-amber { background: var(--amber-fill); color: var(--amber); }
.g td.fill-cursor { background: var(--cursor-soft); color: var(--cursor); }
.g td.rid { font: 12px var(--mono); color: var(--muted); }
.g tr.detail td { white-space: normal; height: auto; padding: var(--s3) var(--s3) var(--s3) var(--s4); background: #fbfcfd; }
.g input.cell { width: 100%; border: 0; outline: 0; background: transparent; height: calc(var(--row) - 4px); padding: 0; }
.g td.filter { background: var(--bg); padding: 0 2px; }
.g td.filter input, .g td.filter select { width: 100%; border: 1px solid var(--grid); border-radius: 2px; height: 24px; padding: 0 4px; background: var(--bg); font-size: var(--fs-xs); }
.vals { border-collapse: collapse; margin: 0 0 var(--s2); }
.vals td { border: 0; border-bottom: 1px solid var(--grid); height: auto; padding: 4px var(--s4) 4px 0; white-space: normal; max-width: none; }
.vals td.n { font-size: var(--fs-m); }
.vals code { font: 12px var(--mono); color: var(--muted); word-break: break-all; }
.arith { font-variant-numeric: tabular-nums; color: var(--muted); margin: var(--s2) 0 0; }
.arith b { color: var(--red); }

/* Sheet tabs and status bar at the bottom. */
.foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-top: 1px solid var(--grid); background: var(--chrome); }
.tabs { display: flex; overflow-x: auto; }
.tabs button { border: 0; border-right: 1px solid var(--grid); background: none; padding: 7px var(--s4); cursor: pointer; white-space: nowrap; color: var(--muted); display: flex; gap: var(--s2); align-items: center; }
.tabs button[aria-selected='true'] { background: var(--bg); color: var(--cursor); font-weight: 600; box-shadow: inset 0 2px 0 var(--cursor); }
.tabs .x { color: var(--muted); padding: 0 2px; }
.status { padding: 7px var(--s3); color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; }
.status b { color: var(--ink); }
kbd { font: 11px var(--mono); }

@media (max-width: 760px) {
  .status { display: none; }
  .foot { grid-template-columns: 1fr; }
  .srcbar { grid-template-columns: 64px minmax(0, 1fr); }
  .g th, .g td { max-width: 220px; }
  /* The first data column stays put while the rest scrolls sideways. */
  .g td:nth-child(2), .g th:nth-child(2) { position: sticky; left: 40px; z-index: 1; background: var(--bg); box-shadow: 1px 0 0 var(--grid); }
  .g thead th:nth-child(2) { background: var(--head); z-index: 3; }
}
</style>
</head>

"statutory","domain":"tds_tcs","category":"TDS – E-commerce","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-026.yaml"},{"id":"TDS-027","title":"Specified bank TDS for senior citizens 75+ (s.194P / s.393(1) Sl.8(iii))","type":"statutory","domain":"tds_tcs","category":"TDS – Senior citizen","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-027.yaml"},{"id":"TDS-028","title":"Purchase of goods (s.194Q / s.393(1) Sl.8(ii))","type":"statutory","domain":"tds_tcs","category":"TDS – Purchase of goods","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-028.yaml"},{"id":"TDS-029","title":"Business perquisites/benefits (s.194R / s.393(1) Sl.8(iv))","type":"statutory","domain":"tds_tcs","category":"TDS – Perquisites","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-029.yaml"},{"id":"TDS-030","title":"Virtual digital asset transfer (s.194S / s.393(1) Sl.8(vi))","type":"statutory","domain":"tds_tcs","category":"TDS – VDA","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-030.yaml"},{"id":"TDS-031","title":"Payments by firm to partners (s.194T / s.393(3) Sl.7) – NEW","type":"statutory","domain":"tds_tcs","category":"TDS – Partners","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-031.yaml"},{"id":"TDS-032","title":"Payments to non-residents (s.195 / s.393(2) Sl.17) – brief","type":"statutory","domain":"tds_tcs","category":"TDS – Non-resident","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/st ook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-039.yaml"},{"id":"TDS-040","title":"TDS certificates (Form 16/16A; Form 130/131; 27D/133)","type":"statutory","domain":"tds_tcs","category":"TDS – Certificates","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-040.yaml"},{"id":"TDS-041","title":"Lower / nil deduction certificate (s.197 / s.395(1); Form 13 -> Form 128)","type":"statutory","domain":"tds_tcs","category":"TDS – Certificates","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-041.yaml"},{"id":"TDS-042","title":"Form 15G/15H declarations (s.197A / s.393(6)-(7); Form 121)","type":"statutory","domain":"tds_tcs","category":"TDS – Declarations","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-042.yaml"},{"id":"TDS-043","title":"Deductor reconciliation: books TDS ledger vs challans vs statements","type":"statutory","domain":"tds_tcs","category":"TDS – Reconciliation","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-043.yaml"},{"id":"TDS-044","title":"Deductee reconciliation: Form 26AS/AIS vs books","type":"statutory","domain":"tds_tcs","category":"TDS – Reconciliation","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-044.yaml"},{"id":"TDS-045","title":"Default computation as in TRACES justification report","type":"statutory","domain":"tds_tcs","category":"TDS – Reconciliation","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-045.yaml"},{"id":"TDS-046","title":"Rounding of TDS amounts","type":"statutory","domain":"tds_tcs","category":"TDS – Rounding","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-046.yaml"},{"id":"TDS-047","title":"Exclusion of GST from TDS base (CBDT Circular 23/2017)","type":"statutory","domain":"tds_tcs","category":"TDS – Base","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-047.yaml"},{"id":"TDS-048","title":"Correction statements & limitation for default orders","type":"statutory","domain":"tds_tcs","category":"TDS – Process","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-048.yaml"},{"id":"TDS-049","title":"Disallowance for non-deduction (s.40(a)(i)/(ia))","type":"statutory","domain":"tds_tcs","category":"TDS – Consequences","status":"disabled","source":"rulebook","tax_years":[],"version":"1","runnable":false,"file_path":"recon_yaml/rules/statutory/tds_tcs/TDS-049.yaml"}]};</script>
<script>
// ---------- Shared helpers (the same in every concept) ----------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
function inr(p) {
  const neg = p < 0, m = Math.abs(p), r = String(Math.floor(m / 100)), c = String(m % 100).padStart(2, '0')
  const g = r.length > 3 ? r.slice(0, -3).replace(/\B(?=(\d{2})+$)/g, ',') + ',' + r.slice(-3) : r
  return (neg ? '−' : '') + g + '.' + c
}
function val(v) {
  if (v.kind === 'money') return inr(v.paise)
  if (v.kind === 'text') return v.text.trim() === '' ? '(blank)' : v.text
  if (v.kind === 'bool') return v.bool ? 'Yes' : 'No'
  if (v.kind === 'rate') return inr(v.rate_bp) + '%'
  return ''
}
const runOf = (c) => c.runs.map((k) => DATA.runs[k])
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0)
function boardRow(c) {
  const rs = runOf(c)
  if (!rs.length) return { ...c, ran: false }
  return { ...c, ran: true, files: sum(rs, (r) => r.files.length), findings: sum(rs, (r) => r.counts.fail), cannot: sum(rs, (r) => r.counts.cannot_check) }
}
const decisions = {}
const KIND = { fix: 'Fix', not_an_issue: 'Not an issue', ask_client: 'Ask client' }
const staff = 'A. Staff (illustrative)'
function arith(f) {
  if (!f.showDiff || f.values.length !== 2 || f.values.some((v) => v.value.kind !== 'money')) return ''
  const [a, b] = f.values[0].value.paise >= f.values[1].value.paise ? f.values : [f.values[1], f.values[0]]
  if (a.value.paise - b.value.paise !== f.diff) return ''
  return `${esc(a.label)} ${inr(a.value.paise)} − ${esc(b.label)} ${inr(b.value.paise)} = <b>${inr(f.diff)}</b>`
}
const where = (f) => [f.subject.period, f.subject.match_key].filter(Boolean).join(' · ')
const typeText = { statutory: 'Statutory', reconciliation: 'Reconciliation', 'tie-out': 'Tie-out', gst: 'GST' }
const statusText = { active: 'Active', testing: 'Testing', disabled: 'Switched off', draft: 'Draft' }
const sourceText = { rulebook: 'Rule book', builtin: 'Engine rule', office: 'Office edit' }
const domainText = { gst: 'GST', tds_tcs: 'TDS / TCS', income_tax: 'Income tax', payroll: 'Payroll', bank: 'Bank', accounting: 'Accounting', msme: 'MSME', company_law: 'Company law', audit: 'Audit', other: 'Other' }

// ---------- State: one cursor per sheet ----------
const S = { sheet: 'board', open: [], cur: {}, run: {}, expanded: new Set(), cls: {}, ticked: new Set(), noteFor: null, rf: { id: '', title: '', type: '', category: '', status: '' } }
const app = document.getElementById('app'), srcEl = document.getElementById('src'), statusEl = document.getElementById('status')
document.getElementById('ty').textContent = DATA.taxYear
const cur = () => (S.cur[S.sheet] ||= { r: 0, c: 1 })
function go(sheet) { if (sheet.startsWith('c') && !S.open.includes(sheet)) S.open.push(sheet); S.sheet = sheet; render(); app.focus({ preventScroll: true }) }
function fromHash() {
  const [s, id] = location.hash.slice(1).split('/')
  if (s === 'client') go(id || 'c7'); else if (['board', 'worklist', 'rules'].includes(s)) go(s); else render()
}
window.addEventListener('hashchange', fromHash)

// Each sheet builds rows: { cells: [{ html, cls, src }], kind, key }.
const cell = (html, cls = '', src = '') => ({ html, cls, src })

function boardSheet() {
  const rows = DATA.clients.map(boardRow)
  const out = rows.map((r) => ({ key: r.id, kind: 'client', cells: [
    cell(`<b>${esc(r.name)}</b>`, '', r.name), cell(esc(r.pan_last4)), cell(r.last_run_on || '–'),
    cell(r.ran ? r.files : '–', 'n'), cell(r.ran ? r.findings : '–', 'n ' + (r.findings ? 'red' : '')), cell(r.ran ? r.cannot : '–', 'n'),
    !r.ran ? cell('Not run yet', 'muted') : r.findings ? cell('Findings to review', 'fill-red') : cell('No findings', 'fill-green')] }))
  const ran = rows.filter((r) => r.ran)
  out.push({ kind: 'total', cells: [cell(`Total, ${rows.length} clients`), cell(''), cell(''), cell(sum(ran, (r) => r.files), 'n'), cell(sum(ran, (r) => r.findings), 'n red'), cell(sum(ran, (r) => r.cannot), 'n'), cell(`${rows.length - ran.length} not run`, 'muted')] })
  return { head: ['Client', 'PAN ending', 'Last run', 'Files read', 'Findings', 'Cannot check', 'Status'], num: [3, 4, 5], rows: out,
    hint: '<kbd>↑↓←→</kbd> move · <kbd>Enter</kbd> open the client file · <kbd>2</kbd> Worklist <kbd>3</kbd> Rules',
    enter: (row) => row.kind === 'client' && go(row.key) }
}

function clientSheet(id) {
  const c = DATA.clients.find((x) => x.id === id)
  const rs = runOf(c)
  const ri = S.run[id] || 0
  const r = rs[ri]
  if (!r) return { head: ['Client'], rows: [{ kind: 'info', cells: [cell(`${esc(c.name)}: no checks run yet.`)] }], hint: '', tools: '' }
  const rows = []
  let n = 0
  for (const g of r.groups) {
    rows.push({ kind: 'grp', cells: [cell(`▾ ${esc(g.heading)} <span class="muted">${g.findings.length} ${g.findings.length === 1 ? 'finding' : 'findings'}</span>`, '', g.heading)], span: 8 })
    for (const f of g.findings) {
      n++
      const d = decisions[f.id]
      const [a, b] = f.values
      const money = f.showDiff && a && a.value.kind === 'money'
      const fig = (v) => (v ? cell(esc(val(v.value)), v.value.kind === 'money' ? 'n' : '', `${v.label}|${v.file ? v.file + ' ' + v.path : 'worked out by the check'}`) : cell(''))
      rows.push({ kind: 'finding', key: f.id, f, cells: [
        cell(esc(f.rule), 'rid'), cell(esc(f.title), 'wide', f.title), cell(esc(where(f)) + (f.code ? ` <span class="muted">· ${esc(f.code)}</span>` : '')),
        // Two figures sit side by side only when there are exactly two; with more, the
        // working opens on Enter so no pair is ever shown beside a difference it does not make.
        ...(f.values.length > 2 ? [cell(`${f.values.length} figures · Enter for the working`, 'muted'), cell('')] : [fig(a), fig(b)]),
        money ? cell(inr(f.diff), 'n diff', `Difference|${f.law.join('; ')}`) : cell(''),
        d ? cell(KIND[d.kind], d.kind === 'fix' ? 'fill-cursor' : d.kind === 'ask_client' ? 'fill-amber' : 'fill-green') : cell('Open', 'fill-red'),
        S.noteFor === f.id ? cell(`<input class="cell" data-note="${f.id}" placeholder="Note, then Enter" aria-label="Note for Not an issue">`) : cell(esc(d ? d.note : ''), 'muted')] })
      if (S.expanded.has(f.id)) {
        const ar = arith(f)
        rows.push({ kind: 'detail', span: 8, cells: [cell(`<table class="vals">${f.values.map((v) => `<tr><td>${esc(v.label)}</td><td class="n">${esc(val(v.value))}</td><td><code>${v.file ? esc(v.file + ' ' + v.path) : 'worked out by the check'}</code></td></tr>`).join('')}</table>${ar ? `<p class="arith">${ar}</p>` : ''}<p class="muted" style="margin:6px 0 0">Rule basis: ${f.law.map(esc).join('; ')}${d ? ` · ${KIND[d.kind]} by ${esc(d.by)}` : ''}</p>`)] })
      }
    }
  }
  rows.push({ kind: 'grp', span: 8, cells: [cell(`Cannot check <span class="muted">${r.cannot.length}</span>`)] })
  r.cannot.forEach((x) => rows.push({ kind: 'info', cells: [cell(esc(x.rule), 'rid'), cell(esc(x.title)), cell('Missing: ' + x.missing.map(esc).join('; '), 'muted'), cell(''), cell(''), cell(''), cell(''), cell('')] }))
  rows.push({ kind: 'grp', span: 8, cells: [cell(`Passed <span class="muted">${r.passed.length}</span>`)] })
  r.passed.forEach((x) => rows.push({ kind: 'info', cells: [cell(esc(x.rule), 'rid'), cell(esc(x.title)), cell(''), cell(''), cell(''), cell(''), cell('Pass', 'fill-green'), cell('')] }))
  const open = r.groups.flatMap((g) => g.findings).filter((f) => !decisions[f.id]).length
  return {
    head: ['Rule', 'Check', 'Period · item', 'First figure', 'Second figure', 'Difference', 'Decision', 'Note'], num: [3, 4, 5], rows,
    tools: rs.length > 1 ? `<select data-run="${id}" aria-label="Type of check">${rs.map((x, i) => `<option value="${i}" ${i === ri ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : `<span class="muted">${esc(r.name)}</span>`,
    hint: `<b>${esc(c.name)}</b> · Checks <b>${r.counts.checks}</b> · Findings <b>${r.counts.fail}</b> · Open <b>${open}</b> · Pass <b>${r.counts.pass}</b> · Cannot check <b>${r.counts.cannot_check}</b> · <kbd>Enter</kbd> working · <kbd>1 2 3</kbd> decide`,
    enter: (row) => { if (row.kind === 'finding') { S.expanded.has(row.key) ? S.expanded.delete(row.key) : S.expanded.add(row.key); render() } },
    decide: (row, kind) => {
      if (row.kind !== 'finding') return
      if (kind === 'not_an_issue') { S.noteFor = row.key; render(); app.querySelector('[data-note]')?.focus(); return }
      decisions[row.key] = { kind, note: '', by: staff }; render()
    },
  }
}

function worklistSheet() {
  const rows = DATA.worklist.map((it, i) => ({ key: i, kind: 'item', cells: [
    cell(`<input type="checkbox" data-tick="${i}" ${S.ticked.has(i) ? 'checked' : ''} aria-label="Tick ${esc(it.ledger)}">`),
    cell(esc(it.client_name), 'muted', it.client_name), cell(`<b>${esc(it.ledger)}</b>`, '', it.ledger), cell(esc(it.group)),
    cell(esc(it.kind_text) + (it.times ? ` ×${esc(it.times)}` : '') + (it.missing_months.length ? ` <span class="muted">(${it.missing_months.join(', ')})</span>` : ''), it.kind === 'step_change' ? 'fill-amber' : it.kind === 'vanished' ? 'muted' : 'fill-cursor'),
    cell(it.kind === 'new_head' ? '–' : inr(it.prior_total), 'n'), cell(it.kind === 'vanished' ? '–' : inr(it.current_total), 'n'),
    cell(`${it.prior_months} → ${it.current_months}`, 'n'),
    S.editing === i ? cell(`<input class="cell" data-cls="${i}" value="${esc(S.cls[i] || '')}" placeholder="Type, then Enter" aria-label="Classification">`) : cell(esc(S.cls[i] || ''), S.cls[i] ? 'fill-green' : '')] }))
  const done = Object.keys(S.cls).length
  return { head: ['', 'Client', 'Ledger head', 'Group', 'What changed', 'Last year', 'This year', 'Months', 'Classification'], num: [5, 6, 7], rows,
    tools: S.ticked.size ? `<input id="bulk" placeholder="Classification for ${S.ticked.size} ticked" style="border:1px solid var(--grid);border-radius:3px;padding:3px 6px"> <button data-bulk style="border:1px solid var(--cursor);background:var(--cursor);color:#fff;border-radius:3px;padding:3px 10px">Save</button>` : '',
    hint: `To classify <b>${DATA.worklist.length - done}</b> · Done <b>${done}</b> · <kbd>Space</kbd> tick · <kbd>Enter</kbd> type the classification (staff write it; the tool never fills it in)`,
    enter: (row) => { S.editing = row.key; render(); app.querySelector('[data-cls]')?.focus() },
    space: (row) => { S.ticked.has(row.key) ? S.ticked.delete(row.key) : S.ticked.add(row.key); render() } }
}

function rulesSheet() {
  const f = S.rf
  const list = DATA.rules.filter((r) => (!f.id || r.id.toLowerCase().includes(f.id.toLowerCase())) && (!f.title || r.title.toLowerCase().includes(f.title.toLowerCase())) && (!f.type || r.type === f.type) && (!f.category || r.category.toLowerCase().includes(f.category.toLowerCase())) && (!f.status || r.status === f.status))
  const sel = (k, m) => `<select data-rf="${k}"><option value="">All</option>${[...new Set(DATA.rules.map((r) => r[k]))].sort().map((v) => `<option value="${v}" ${f[k] === v ? 'selected' : ''}>${esc(m[v] || v)}</option>`).join('')}</select>`
  const txt = (k) => `<input data-rf="${k}" value="${esc(f[k])}" placeholder="Filter" aria-label="Filter ${k}">`
  return { head: ['Rule', 'Name', 'Type', 'Subject', 'Category', 'Tax years', 'Status', 'Source'],
    filter: [txt('id'), txt('title'), sel('type', typeText), '', txt('category'), '', sel('status', statusText), ''],
    rows: list.map((r) => ({ key: r.id, kind: 'rule', cells: [cell(esc(r.id), 'rid', r.file_path), cell(esc(r.title), '', r.title), cell(esc(typeText[r.type] || r.type)), cell(esc(domainText[r.domain] || r.domain || '–')),
      cell(esc(r.category)), cell(r.tax_years.length ? r.tax_years.join(', ') : 'Not dated', r.tax_years.length ? '' : 'muted'),
      cell(statusText[r.status] || r.status, r.status === 'testing' ? 'fill-amber' : r.status === 'active' ? 'fill-green' : 'muted'), cell(`${sourceText[r.source] || r.source} v${esc(r.version)}`, 'muted')] })),
    hint: `<b>${list.length}</b> of ${DATA.rules.length} rules · read-only · filters sit under the headings`, tools: '' }
}

let SH = null
function render() {
  SH = S.sheet === 'board' ? boardSheet() : S.sheet === 'worklist' ? worklistSheet() : S.sheet === 'rules' ? rulesSheet() : clientSheet(S.sheet)
  const p = cur()
  p.r = Math.max(0, Math.min(SH.rows.length - 1, p.r))
  const width = SH.head.length
  app.innerHTML = `<table class="g" aria-label="${esc(S.sheet)}"><thead><tr><th class="rn"></th>${SH.head.map((h, j) => `<th class="${(SH.num || []).includes(j) ? 'n' : ''}">${esc(h)}</th>`).join('')}</tr>
    ${SH.filter ? `<tr><th class="rn"></th>${SH.filter.map((x) => `<td class="filter">${x}</td>`).join('')}</tr>` : ''}</thead>
    <tbody>${SH.rows.map((row, i) => {
      const on = i === p.r
      if (row.span) return `<tr class="${row.kind} ${on ? 'on' : ''}" data-row="${i}"><td class="rn">${i + 1}</td><td colspan="${width}" class="${on ? 'cur' : ''}">${row.cells[0].html}</td></tr>`
      return `<tr class="${row.kind === 'total' ? 'tot' : ''} ${on ? 'on' : ''}" data-row="${i}"><td class="rn">${i + 1}</td>${row.cells.map((c, j) => `<td data-c="${j}" class="${c.cls} ${on && j === p.c ? 'cur' : ''}">${c.html}</td>`).join('')}</tr>`
    }).join('')}</tbody></table>`
  // Source bar: for a figure, its label and the file place it came from.
  const row = SH.rows[p.r]
  const c = row && (row.span ? row.cells[0] : row.cells[Math.min(p.c, row.cells.length - 1)])
  const [lab, place] = (c && c.src ? c.src : '').split('|')
  srcEl.innerHTML = place ? `<b>${esc(lab)}</b><code>${esc(place)}</code>` : esc(lab || (c ? c.html.replace(/<[^>]+>/g, '') : ''))
  statusEl.innerHTML = SH.hint
  document.getElementById('sheettools').innerHTML = SH.tools || ''
  const tabs = [['board', 'Season board'], ['worklist', 'Worklist'], ['rules', 'Rules'], ...S.open.map((id) => [id, DATA.clients.find((x) => x.id === id).name])]
  document.getElementById('tabs').innerHTML = tabs.map(([k, t]) => `<button role="tab" data-sheet="${k}" aria-selected="${k === S.sheet}">${esc(t)}${k.startsWith('c') ? `<span class="x" data-closetab="${k}" aria-label="Close">×</span>` : ''}</button>`).join('')
  // Keep the cursor in view; a full-width group row only scrolls up and down.
  const curTd = app.querySelector('td.cur')
  if (curTd) {
    const a = app.getBoundingClientRect(), b = curTd.getBoundingClientRect(), head = 32
    if (b.top < a.top + head) app.scrollTop -= a.top + head - b.top
    else if (b.bottom > a.bottom) app.scrollTop += b.bottom - a.bottom
    if (curTd.colSpan === 1) {
      if (b.left < a.left + 40) app.scrollLeft -= a.left + 40 - b.left
      else if (b.right > a.right) app.scrollLeft += b.right - a.right
    }
  }
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const x = e.target.closest('[data-closetab]')
  if (x) { S.open = S.open.filter((k) => k !== x.dataset.closetab); if (S.sheet === x.dataset.closetab) S.sheet = 'board'; return render() }
  const b = e.target.closest('[data-sheet]'); if (b) go(b.dataset.sheet)
})
document.getElementById('sheettools').addEventListener('change', (e) => { if (e.target.dataset.run) { S.run[e.target.dataset.run] = +e.target.value; cur().r = 0; render() } })
document.getElementById('sheettools').addEventListener('click', (e) => {
  if (e.target.dataset.bulk !== undefined) { const v = document.getElementById('bulk').value.trim(); if (v) { S.ticked.forEach((i) => (S.cls[i] = v)); S.ticked.clear(); render() } }
})
app.addEventListener('click', (e) => {
  if (e.target.dataset.tick !== undefined) { const i = +e.target.dataset.tick; S.ticked.has(i) ? S.ticked.delete(i) : S.ticked.add(i); return render() }
  const td = e.target.closest('td'), tr = e.target.closest('tr[data-row]')
  if (!tr || e.target.matches('input,select')) return
  const p = cur()
  p.r = +tr.dataset.row; if (td && td.dataset.c) p.c = +td.dataset.c
  render()
})
app.addEventListener('dblclick', () => { const row = SH.rows[cur().r]; if (SH.enter && row) SH.enter(row) })
app.addEventListener('input', (e) => { const k = e.target.dataset.rf; if (k) { S.rf[k] = e.target.value; const pos = e.target.selectionStart; render(); const n = app.querySelector(`[data-rf=${k}]`); n.focus(); if (n.setSelectionRange) n.setSelectionRange(pos, pos) } })
app.addEventListener('keydown', (e) => {
  if (e.target.dataset.note && e.key === 'Enter') { const v = e.target.value.trim(); if (!v) { e.target.placeholder = 'Write the note first'; return } decisions[e.target.dataset.note] = { kind: 'not_an_issue', note: v, by: staff }; S.noteFor = null; render(); app.focus() }
  if (e.target.dataset.cls !== undefined && e.key === 'Enter') { const v = e.target.value.trim(); if (v) S.cls[+e.target.dataset.cls] = v; else delete S.cls[+e.target.dataset.cls]; S.editing = null; render(); app.focus() }
  if (e.target.matches('input') && e.key === 'Escape') { S.noteFor = null; S.editing = null; render(); app.focus() }
})
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input,select')) return
  const p = cur(), k = e.key, cols = SH.head.length
  if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); p.r = Math.max(0, Math.min(SH.rows.length - 1, p.r + (k === 'ArrowDown' ? 1 : -1))); return render() }
  if (k === 'ArrowRight' || k === 'ArrowLeft') { e.preventDefault(); p.c = Math.max(0, Math.min(cols - 1, p.c + (k === 'ArrowRight' ? 1 : -1))); return render() }
  if (k === 'Enter' && SH.enter) { e.preventDefault(); return SH.enter(SH.rows[p.r]) }
  if (k === ' ' && SH.space) { e.preventDefault(); return SH.space(SH.rows[p.r]) }
  if (SH.decide && ['1', '2', '3'].includes(k)) return SH.decide(SH.rows[p.r], { 1: 'fix', 2: 'not_an_issue', 3: 'ask_client' }[k])
  if (k === 'Escape' && S.sheet.startsWith('c')) return go('board')
  if (!SH.decide) { if (k === '1') go('board'); if (k === '2') go('worklist'); if (k === '3') go('rules') }
})
fromHash()
</script>
</body>
</html>
